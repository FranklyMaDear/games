<!DOCTYPE html>
<html lang="el">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Frank Lingo</title>
<style>
  :root {
    --bg: #0b1e45;
    --panel: #12264d;
    --tile: #1a3566;
    --tile-border: #4a6aaa;
    --green: #22c55e;
    --orange: #f59e0b;
    --absent: #0f2748;
    --text: #ffffff;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    height: 100%;
    background: linear-gradient(180deg, #0a1840 0%, #0c2260 100%);
    color: var(--text);
    font-family: system-ui, -apple-system, 'Segoe UI', sans-serif;
    overflow: hidden;
  }
  body {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 8px;
    height: 100vh;
    height: 100dvh;
  }
  .screen { display: none; width: 100%; max-width: 500px; height: 100%; flex-direction: column; align-items: center; position: relative; }
  .screen.active { display: flex; }
  #home {
    width: 100%;
    max-width: none;
    height: 100%;
    background: linear-gradient(160deg, #0a1228 0%, #12204a 40%, #0c1a38 100%);
    overflow: hidden;
    justify-content: center;
    align-items: center;
  }
  @keyframes rainbowCycle {
    0% { background-position: 0% 50%; }
    50% { background-position: 100% 50%; }
    100% { background-position: 0% 50%; }
  }
  .title-container {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    z-index: 20;
    text-align: center;
  }
  .circular-logo {
    width: 240px;
    height: 240px;
    border-radius: 50%;
    background: rgba(255, 255, 255, 0.18);
    backdrop-filter: blur(12px);
    border: 4px solid rgba(255, 255, 255, 0.5);
    box-shadow: 0 0 50px rgba(255, 255, 255, 0.4), inset 0 0 40px rgba(255, 255, 255, 0.2);
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
    animation: logoSpin 4s ease-in-out forwards;
  }
  .circular-logo img {
    width: 85%;
    height: 85%;
    object-fit: contain;
    border-radius: 50%;
  }
  .circular-logo.stop { animation: none; }
  @keyframes logoSpin {
    0% { transform: rotate(0deg); }
    100% { transform: rotate(360deg); }
  }
  h1.main-title {
    font-size: 2.1rem;
    font-weight: 900;
    color: white;
    margin: 0;
    line-height: 1.15;
    text-shadow: 0 2px 12px rgba(0,0,0,0.4);
    letter-spacing: 0.5px;
  }
  .assemble-container {
    position: absolute;
    top: 28%;
    left: 50%;
    transform: translateX(-50%);
    text-align: center;
    z-index: 15;
    width: 90%;
    pointer-events: none;
  }
  .assemble-line {
    font-size: 1.4rem;
    font-weight: 700;
    color: white;
    margin: 8px 0;
    letter-spacing: 1px;
    text-shadow: 0 2px 10px rgba(0,0,0,0.5);
    min-height: 1.6em;
  }
  .assemble-line.main {
    font-size: 2.2rem;
    font-weight: 900;
    letter-spacing: 2px;
  }
  @keyframes logoSpin {
    0% { transform: rotate(0deg); }
    25% { transform: rotate(90deg); }
    50% { transform: rotate(180deg); }
    75% { transform: rotate(270deg); }
    100% { transform: rotate(360deg); }
  }
  @keyframes floatMove {
    0% { transform: translate(0, 0) rotate(0deg); }
    25% { transform: translate(var(--tx1), var(--ty1)) rotate(90deg); }
    50% { transform: translate(var(--tx2), var(--ty2)) rotate(180deg); }
    75% { transform: translate(var(--tx3), var(--ty3)) rotate(270deg); }
    100% { transform: translate(0, 0) rotate(360deg); }
  }
  .play-btn {
    position: absolute;
    bottom: 60px;
    z-index: 30;
    background: linear-gradient(135deg, #ffffff, #fffde7);
    color: #222;
    border: none;
    padding: 16px 46px;
    border-radius: 50px;
    font-size: 1.35rem;
    font-weight: 800;
    cursor: pointer;
    box-shadow: 0 8px 28px rgba(0,0,0,0.3), 0 0 20px rgba(255,255,255,0.5);
    transition: all 0.25s ease;
    letter-spacing: 0.5px;
  }
  .play-btn:hover {
    transform: translateY(-5px) scale(1.06);
    box-shadow: 0 14px 40px rgba(0,0,0,0.35), 0 0 30px rgba(255,255,255,0.7);
  }
  .big-btn {
    background: #3b82f6;
    color: white;
    border: none;
    padding: 16px 40px;
    border-radius: 12px;
    font-size: 1.3rem;
    font-weight: bold;
    cursor: pointer;
    margin: 12px;
    min-width: 220px;
  }
  .big-btn:hover { background: #2563eb; }
  .mode-btn { background: #22c55e; }
  .mode-btn:hover { background: #16a34a; }
  header.game-header {
    width: 100%;
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 6px;
    flex-shrink: 0;
  }
  .info-box {
    background: #1e3a6e;
    padding: 4px 12px;
    border-radius: 16px;
    font-weight: bold;
    font-size: 0.95rem;
  }
  .timer-box.warning { background: #ef4444; }
  .level-info { font-size: 0.85rem; color: #93c5fd; margin-bottom: 4px; text-align: center; }
  .scores { display: flex; gap: 20px; font-weight: bold; margin-bottom: 6px; }
  .game-area { width: 100%; flex: 1; display: flex; flex-direction: column; overflow: hidden; }
  #grid-container { flex: 1; display: flex; flex-direction: column; justify-content: center; align-items: center; }
  #grid { display: flex; flex-direction: column; gap: 6px; }
  .row { display: flex; justify-content: center; gap: 6px; position: relative; }
  .tile {
    width: 46px; height: 46px;
    background: var(--tile); border: 2px solid var(--tile-border);
    border-radius: 8px; display: flex; align-items: center; justify-content: center;
    font-size: 1.4rem; font-weight: 700;
  }
  .tile.green { background: var(--green); border-color: #16a34a; }
  .tile.orange { background: var(--orange); border-color: #d97706; }
  .tile.absent { background: var(--absent); border-color: #1e3a5f; color: #64748b; }
  .boosters { display: flex; justify-content: center; gap: 8px; margin: 6px 0; }
  .booster { width: 54px; height: 54px; border-radius: 10px; display: flex; flex-direction: column; align-items: center; justify-content: center; cursor: pointer; font-size: 1.1rem; }
  .booster.green-b { background: #22c55e; }
  .booster.orange-b { background: #f59e0b; }
  .booster.pink-b { background: #ec4899; }
  .booster.blue-b { background: #3b82f6; }
  .booster .count { font-size: 0.6rem; background: rgba(0,0,0,0.35); padding: 1px 5px; border-radius: 6px; }
  #input-row { display: flex; gap: 6px; width: 100%; margin-bottom: 6px; }
  #input-display {
    flex: 1; height: 42px; background: #0f2348; border: 2px solid #3b5aaa;
    border-radius: 8px; display: flex; align-items: center; padding: 0 12px;
    font-size: 1.15rem; font-weight: bold; letter-spacing: 2px;
  }
  .submit-btn { background: #22c55e; color: white; border: none; padding: 0 16px; border-radius: 8px; font-weight: bold; cursor: pointer; }
  .message { text-align: center; min-height: 22px; font-size: 0.9rem; color: #fbbf24; margin-bottom: 4px; }
  #keyboard { flex-shrink: 0; width: 100%; padding: 0 4px; }
  .kb-row { display: flex; justify-content: center; gap: 4px; margin-bottom: 5px; width: 100%; }
  .key { 
    flex: 1; 
    max-width: 48px; 
    height: 46px; 
    background: #e2e8f0; 
    color: #0f172a; 
    border: none; 
    border-radius: 6px; 
    font-size: 1rem; 
    font-weight: 700; 
    cursor: pointer; 
    min-width: 28px;
  }
  .key.wide { flex: 1.4; max-width: 70px; font-size: 0.8rem; }
  .key.absent { background: #475569; color: #94a3b8; pointer-events: none; }
  .controls { display: flex; justify-content: center; gap: 8px; margin-top: 6px; }
  button.action { background: #3b82f6; color: white; border: none; padding: 8px 14px; border-radius: 8px; font-size: 0.9rem; font-weight: bold; cursor: pointer; }
  button.mic { background: #ec4899; }
  button.mic.listening { background: #ef4444; }
  .result-screen { text-align: center; }
  .result-screen h2 { font-size: 2rem; margin: 20px 0; color: #fbbf24; }
</style>
</head>
<body>

<!-- Αρχική Οθόνη -->
<div id="home" class="screen active">
  <div class="title-container">
    <div class="circular-logo" id="logo">
      <img src="photo.png" alt="Frank Lingo Logo" onerror="this.style.display='none'; this.parentElement.innerHTML='<h1 class=\\'main-title\\'>Frank<br>Lingo</h1>';">
    </div>
  </div>
  <div class="assemble-container">
    <div class="assemble-line" id="line1"></div>
    <div class="assemble-line main" id="line2"></div>
    <div class="assemble-line" id="line3"></div>
  </div>
  <button class="play-btn" onclick="showMode()">Παίξε Τώρα</button>
</div>

<!-- Επιλογή Mode -->
<div id="mode" class="screen" style="background: linear-gradient(135deg, #ff0000, #ff7f00, #ffff00, #00ff00, #0000ff, #4b0082, #9400d3); background-size: 400% 400%; animation: rainbowCycle 10s linear infinite; justify-content: center; align-items: center;">
  <h1 class="main-title" style="font-size:2.2rem; color:white; text-shadow:0 2px 12px rgba(0,0,0,0.4); margin-bottom:30px;">Επιλογή Mode</h1>
  <button class="play-btn" style="position:static; margin:12px 0; min-width:240px;" onclick="startGame(1)">1 Παίκτης</button>
  <button class="play-btn" style="position:static; margin:12px 0; min-width:240px; background:linear-gradient(135deg,#fffde7,#ffffff);" onclick="startGame(2)">2 Παίκτες</button>
  <button class="play-btn" style="position:static; margin:20px 0 0; background:linear-gradient(135deg,#e2e8f0,#cbd5e1); color:#334155;" onclick="showHome()">Πίσω</button>
</div>

<!-- Παιχνίδι -->
<div id="game" class="screen">
  <header class="game-header">
    <div class="info-box" id="turnInfo">Παίκτης 1</div>
    <div class="info-box timer-box" id="timer">15</div>
    <div class="info-box" id="scoreInfo">Σκορ: 0</div>
  </header>
  <div class="level-info" id="levelInfo">Γύρος 1 • 5 γράμματα</div>
  <div class="scores" id="scoresBox" style="display:none;">
    <span>Π1: <span id="score1">0</span></span>
    <span>Π2: <span id="score2">0</span></span>
  </div>
  <div class="game-area">
    <div id="grid-container"><div id="grid"></div></div>
    <div class="boosters">
      <div class="booster green-b" onclick="useBooster('green')">?<div class="count" id="b1">x3</div></div>
      <div class="booster orange-b" onclick="useBooster('orange')">?<div class="count" id="b2">x3</div></div>
      <div class="booster pink-b" onclick="useBooster('pink')">⚡<div class="count" id="b3">x3</div></div>
      <div class="booster blue-b" onclick="useBooster('blue')">❄️<div class="count" id="b4">x3</div></div>
    </div>
    <div id="input-row">
      <div id="input-display"></div>
      <button class="submit-btn" onclick="submitGuess()">OK</button>
    </div>
    <div class="message" id="message">Το πρώτο γράμμα είναι ήδη γνωστό</div>
    <div id="keyboard"></div>
    <div class="controls">
      <button class="action mic" id="micBtn" onclick="toggleMic()">🎤 Μικρόφωνο</button>
      <button class="action" onclick="showHome()">Μενού</button>
    </div>
  </div>
</div>

<!-- Αποτέλεσμα -->
<div id="result" class="screen result-screen">
  <h2 id="resultTitle">Τέλος Παιχνιδιού</h2>
  <div id="resultScores"></div>
  <button class="big-btn" onclick="showHome()">Αρχική</button>
</div>

<script>
const WORDS5 = ["ΑΓΑΠΗ","ΑΓΟΡΑ","ΑΕΡΑΣ","ΑΛΑΤΙ","ΑΛΟΓΟ","ΑΜΑΞΙ","ΑΝΘΟΣ","ΑΡΩΜΑ","ΑΣΤΡΟ","ΑΥΡΙΟ","ΒΑΡΚΑ","ΒΟΥΝΟ","ΒΡΟΧΗ","ΓΑΝΤΙ","ΓΛΥΚΟ","ΔΑΣΟΣ","ΔΕΡΜΑ","ΗΛΙΟΣ","ΚΑΦΕΣ","ΚΗΠΟΣ","ΛΥΚΟΣ","ΜΑΣΚΑ","ΝΥΧΤΑ","ΠΑΓΟΣ","ΠΑΙΔΙ","ΠΑΡΚΟ","ΠΕΝΤΕ","ΠΙΑΝΟ","ΠΙΤΣΑ","ΠΟΡΤΑ","ΣΠΙΤΙ","ΤΕΛΟΣ","ΦΙΛΟΣ","ΦΟΒΟΣ","ΦΩΤΙΑ","ΧΑΡΤΙ","ΧΙΟΝΙ","ΧΟΡΟΣ","ΧΥΜΟΣ","ΧΩΡΙΟ"];
const WORDS6 = ["ΒΙΒΛΙΟ","ΓΛΩΣΣΑ","ΑΔΕΡΦΗ","ΑΝΕΜΟΣ","ΑΣΤΕΡΙ","ΑΡΧΕΙΟ","ΒΑΛΤΟΣ","ΓΕΦΥΡΑ","ΓΗΠΕΔΟ","ΓΙΑΓΙΑ","ΔΑΝΕΙΟ","ΔΕΙΠΝΟ","ΕΚΚΛΗΣ","ΕΡΓΑΣΙ","ΖΩΓΡΑΦ","ΗΛΙΟΛΟ","ΘΕΑΤΡΟ","ΚΑΡΔΙΑ","ΛΟΥΛΟΥ","ΜΟΥΣΕΙ","ΝΟΜΙΚΟ","ΟΙΚΟΓΕ","ΠΑΙΔΙΚ","ΡΑΔΙΟΦ","ΣΧΟΛΕΙ","ΤΗΛΕΦΩ","ΥΠΝΟΣΑ","ΦΑΡΜΑΚ","ΧΑΡΤΑΡ","ΨΑΡΕΜΑ"];
const WORDS7 = ["ΑΓΓΕΛΙΑ","ΑΓΓΕΛΟΣ","ΑΓΓΟΥΡΙ","ΑΓΕΛΑΔΑ","ΑΓΟΡΑΖΩ","ΑΓΡΟΤΗΣ","ΑΔΕΛΦΟΣ","ΑΕΡΟΖΟΛ","ΑΘΛΗΤΗΣ","ΑΙΘΟΥΣΑ","ΑΚΟΥΣΤΕ","ΑΚΡΙΒΟΣ","ΑΛΗΘΕΙΑ","ΑΛΤΗΡΑΣ","ΑΜΦΙΒΙΟ","ΑΝΑΖΗΤΩ","ΑΝΑΡΧΙΑ","ΑΝΟΔΙΚΗ","ΑΠΟΔΟΧΗ","ΑΠΟΘΗΚΗ","ΑΠΟΦΑΣΗ","ΑΠΩΛΕΙΑ","ΑΡΔΕΥΣΗ","ΑΡΚΟΥΔΑ","ΑΡΜΟΝΙΑ","ΑΡΤΗΡΙΑ","ΑΡΧΗΓΟΣ","ΑΣΑΝΣΕΡ","ΑΣΘΕΝΗΣ","ΑΣΤΑΚΟΣ","ΑΣΤΡΑΠΗ","ΑΣΧΗΜΟΣ","ΑΤΖΕΝΤΑ","ΑΤΥΧΗΜΑ","ΑΥΧΕΝΑΣ","ΑΦΘΟΝΙΑ","ΒΑΜΒΑΚΙ","ΒΙΑΣΥΝΗ","ΒΙΟΛΕΤΙ","ΒΛΕΦΑΡΟ","ΒΟΟΕΙΔΗ","ΒΟΥΤΥΡΟ","ΒΡΑΒΕΙΟ","ΒΡΟΓΧΟΣ","ΒΡΩΜΙΚΟ","ΓΑΛΑΝΟΣ","ΓΑΜΠΡΟΣ","ΓΑΡΙΔΕΣ","ΓΙΑΣΕΜΙ","ΓΙΑΤΡΟΣ","ΓΙΝΟΜΑΙ","ΓΚΑΛΕΡΙ","ΓΚΡΙΖΟΣ","ΓΛΥΠΤΗΣ","ΓΝΩΡΙΖΩ","ΓΟΝΙΔΙΟ","ΓΟΡΙΛΑΣ","ΓΡΑΒΑΤΑ","ΓΡΑΣΙΔΙ"];

function norm(w){ return w.normalize('NFD').replace(/[\u0300-\u036f]/g,'').toUpperCase(); }
const LISTS = {5: WORDS5.map(norm), 6: WORDS6.map(norm), 7: WORDS7.map(norm)};
const GREEK = "ΑΒΓΔΕΖΗΘΙΚΛΜΝΞΟΠΡΣΤΥΦΧΨΩ".split("");

let mode = 1; // 1 or 2
let wordLen = 5;
let round = 1;
let secret = "";
let currentRow = 0;
let currentGuess = "";
let gameOver = false;
let score = 0;
let scoreP1 = 0, scoreP2 = 0;
let currentPlayer = 1;
let isSteal = false;
let boosters = {green:3, orange:3, pink:3, blue:3};
let timeLeft = 15;
let timerInterval = null;
let frozen = false;
let recognition = null, isListening = false;
let wordsSolved = 0;

const home = document.getElementById("home");
const modeScreen = document.getElementById("mode");
const gameScreen = document.getElementById("game");
const resultScreen = document.getElementById("result");
const grid = document.getElementById("grid");
const inputDisplay = document.getElementById("input-display");
const messageEl = document.getElementById("message");
const timerEl = document.getElementById("timer");
const turnInfo = document.getElementById("turnInfo");
const scoreInfo = document.getElementById("scoreInfo");
const scoresBox = document.getElementById("scoresBox");
const levelInfo = document.getElementById("levelInfo");
const micBtn = document.getElementById("micBtn");

// Ήχοι με Web Audio API
const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
function playTone(freq, duration, type="sine", gain=0.1) {
  const osc = audioCtx.createOscillator();
  const g = audioCtx.createGain();
  osc.type = type;
  osc.frequency.value = freq;
  g.gain.value = gain;
  osc.connect(g); g.connect(audioCtx.destination);
  osc.start();
  osc.stop(audioCtx.currentTime + duration);
}
function sfxClick() { playTone(800, 0.05, "square", 0.04); }
function sfxSuccess() { playTone(523, 0.15); setTimeout(()=>playTone(659, 0.15), 100); setTimeout(()=>playTone(784, 0.3), 200); }
function sfxCorrect() { playTone(660, 0.08, "square", 0.08); }
function sfxWrong() { playTone(180, 0.2, "sawtooth", 0.06); }
function sfxLoss() { playTone(150, 0.4, "triangle", 0.1); }

function showScreen(id) {
  document.querySelectorAll(".screen").forEach(s => s.classList.remove("active"));
  document.getElementById(id).classList.add("active");
}
function showHome() { showScreen("home"); clearInterval(timerInterval); }
function showMode() { showScreen("mode"); }

function startGame(m) {
  mode = m;
  wordLen = 5;
  round = 1;
  score = 0; scoreP1 = 0; scoreP2 = 0;
  currentPlayer = 1;
  wordsSolved = 0;
  isSteal = false;
  if (mode === 2) {
    scoresBox.style.display = "flex";
  } else {
    scoresBox.style.display = "none";
  }
  showScreen("game");
  nextWord();
}

function nextWord() {
  if (wordsSolved >= 15) { endMatch(); return; }
  if (wordsSolved === 5) { wordLen = 6; round = 2; }
  if (wordsSolved === 10) { wordLen = 7; round = 3; }
  levelInfo.textContent = `Γύρος ${round} • ${wordLen} γράμματα`;
  const list = LISTS[wordLen];
  secret = list[Math.floor(Math.random() * list.length)];
  currentRow = 0;
  currentGuess = "";
  gameOver = false;
  isSteal = false;
  boosters = {green:3, orange:3, pink:3, blue:3};
  updateBoosters();
  initGrid();
  buildKeyboard();
  inputDisplay.textContent = "";
  messageEl.textContent = `Πρώτο γράμμα: ${secret[0]}`;
  document.getElementById("t00").textContent = secret[0];
  document.getElementById("t00").classList.add("green");
  updateUI();
  startTimer();
}

function updateUI() {
  if (mode === 2) {
    turnInfo.textContent = isSteal ? `Κλοπή - Παίκτης ${currentPlayer}` : `Παίκτης ${currentPlayer}`;
    document.getElementById("score1").textContent = scoreP1;
    document.getElementById("score2").textContent = scoreP2;
  } else {
    turnInfo.textContent = "1 Παίκτης";
    scoreInfo.textContent = "Σκορ: " + score;
  }
}

function initGrid() {
  grid.innerHTML = "";
  for (let r = 0; r < 5; r++) {
    const row = document.createElement("div");
    row.className = "row";
    for (let c = 0; c < wordLen; c++) {
      const tile = document.createElement("div");
      tile.className = "tile";
      tile.id = `t${r}${c}`;
      row.appendChild(tile);
    }
    grid.appendChild(row);
  }
}

function buildKeyboard() {
  document.getElementById("keyboard").innerHTML = "";
  const rows = [["Α","Β","Γ","Δ","Ε","Ζ","Η","Θ","Ι"],["Κ","Λ","Μ","Ν","Ξ","Ο","Π","Ρ","Σ"],["Τ","Υ","Φ","Χ","Ψ","Ω","⌫","OK"]];
  rows.forEach(letters => {
    const row = document.createElement("div");
    row.className = "kb-row";
    letters.forEach(l => {
      const key = document.createElement("button");
      key.className = "key" + (l.length > 1 ? " wide" : "");
      key.textContent = l;
      key.onclick = () => handleKey(l);
      row.appendChild(key);
    });
    document.getElementById("keyboard").appendChild(row);
  });
}

function startTimer() {
  clearInterval(timerInterval);
  timeLeft = 60;
  frozen = false;
  timerEl.textContent = timeLeft;
  timerEl.classList.remove("warning");
  timerInterval = setInterval(() => {
    if (frozen || gameOver) return;
    timeLeft--;
    timerEl.textContent = timeLeft;
    if (timeLeft <= 10) timerEl.classList.add("warning");
    if (timeLeft <= 0) {
      clearInterval(timerInterval);
      sfxLoss();
      handleTimeout();
    }
  }, 1000);
}

function handleTimeout() {
  messageEl.textContent = "Τέλος χρόνου!";
  if (mode === 2) {
    applyPenalty("timeout");
    switchTurn();
  } else {
    // 1 Παίκτης: λήξη χρόνου = τέλος παιχνιδιού
    endWord(false);
  }
}

function applyPenalty(type) {
  if (mode !== 2) return;
  let pen = 0;
  if (type === "timeout") pen = wordLen === 5 ? 10 : wordLen === 6 ? 15 : 20;
  if (type === "invalid") pen = wordLen === 5 ? 5 : wordLen === 6 ? 10 : 15;
  if (currentPlayer === 1) scoreP1 = Math.max(0, scoreP1 - pen);
  else scoreP2 = Math.max(0, scoreP2 - pen);
  updateUI();
  messageEl.textContent += ` (-${pen} πόντοι)`;
}

function handleKey(key) {
  if (gameOver) return;
  sfxClick();
  if (key === "⌫") {
    if (currentGuess.length > 0) currentGuess = currentGuess.slice(0, -1);
  } else if (key === "OK" || key === "Enter") {
    submitGuess();
    return;
  } else if (currentGuess.length < wordLen && GREEK.includes(key)) {
    if (currentGuess.length === 0 && key !== secret[0]) {
      messageEl.textContent = `Ξεκινάει από ${secret[0]}!`;
      return;
    }
    currentGuess += key;
  }
  inputDisplay.textContent = currentGuess;
  updatePreview();
}

function updatePreview() {
  for (let i = 0; i < wordLen; i++) {
    const tile = document.getElementById(`t${currentRow}${i}`);
    if (i === 0 && currentRow === 0) continue;
    tile.textContent = currentGuess[i] || "";
  }
}

function isValidWord(w) {
  return LISTS[wordLen].includes(w);
}

function submitGuess() {
  if (currentGuess.length !== wordLen) {
    messageEl.textContent = `Χρειάζονται ${wordLen} γράμματα!`;
    if (mode === 2) { applyPenalty("invalid"); switchTurn(); }
    return;
  }
  if (!currentGuess.startsWith(secret[0])) {
    messageEl.textContent = `Πρέπει να ξεκινάει από ${secret[0]}!`;
    if (mode === 2) { applyPenalty("invalid"); switchTurn(); }
    return;
  }
  if (!isValidWord(currentGuess) && currentGuess !== secret) {
    messageEl.textContent = "Η λέξη δεν υπάρχει στο λεξικό!";
    if (mode === 2) { applyPenalty("invalid"); switchTurn(); }
    return;
  }

  const result = evaluateGuess(currentGuess);
  let hasGreen = false, hasWrong = false;
  for (let i = 0; i < wordLen; i++) {
    const tile = document.getElementById(`t${currentRow}${i}`);
    tile.textContent = currentGuess[i];
    tile.classList.add(result[i]);
    if (result[i] === "green") { sfxCorrect(); hasGreen = true; }
    if (result[i] === "absent") hasWrong = true;
  }
  if (hasWrong && !hasGreen) sfxWrong();

  if (currentGuess === secret) {
    sfxSuccess();
    endWord(true);
    return;
  }

  currentRow++;
  currentGuess = "";
  inputDisplay.textContent = "";
  if (currentRow >= 5) {
    sfxLoss();
    endWord(false);
  } else {
    // Μεταφορά πράσινων γραμμάτων στην επόμενη γραμμή
    for (let i = 0; i < wordLen; i++) {
      const prevTile = document.getElementById(`t${currentRow - 1}${i}`);
      if (prevTile && prevTile.classList.contains("green")) {
        const nextTile = document.getElementById(`t${currentRow}${i}`);
        if (nextTile) {
          nextTile.textContent = prevTile.textContent;
          nextTile.classList.add("green");
          if (i > 0) currentGuess += prevTile.textContent;
        }
      }
    }
    messageEl.textContent = `Προσπάθεια ${currentRow + 1}/5`;
    startTimer();
  }
}

function endWord(won) {
  gameOver = true;
  clearInterval(timerInterval);
  if (won) {
    const points = wordLen * 20;
    if (mode === 1) score += points;
    else {
      if (currentPlayer === 1) scoreP1 += points;
      else scoreP2 += points;
    }
    wordsSolved++;
    messageEl.textContent = `🎉 Lingo! +${points}`;
    setTimeout(nextWord, 1500);
  } else {
    messageEl.textContent = `Η λέξη ήταν: ${secret}`;
    if (mode === 1) {
      // 1 Παίκτης: αποτυχία = τέλος παιχνιδιού
      setTimeout(endMatch, 1800);
    } else if (mode === 2 && !isSteal) {
      isSteal = true;
      currentPlayer = currentPlayer === 1 ? 2 : 1;
      currentRow = 0;
      currentGuess = "";
      messageEl.textContent += " - Ευκαιρία κλοπής!";
      setTimeout(() => { startTimer(); updateUI(); }, 1000);
    } else {
      wordsSolved++;
      setTimeout(nextWord, 1800);
    }
  }
  updateUI();
}

function switchTurn() {
  if (isSteal) {
    // Αποτυχία κλοπής: μηδενικό πέναλτι, επιστροφή
    isSteal = false;
    currentPlayer = currentPlayer === 1 ? 2 : 1;
    messageEl.textContent = "Αποτυχία κλοπής. Επιστροφή.";
    wordsSolved++;
    setTimeout(nextWord, 1500);
  } else {
    currentPlayer = currentPlayer === 1 ? 2 : 1;
    currentRow = 0;
    currentGuess = "";
    inputDisplay.textContent = "";
    startTimer();
    updateUI();
  }
}

function endMatch() {
  clearInterval(timerInterval);
  showScreen("result");
  if (mode === 1) {
    document.getElementById("resultTitle").textContent = "Τέλος!";
    document.getElementById("resultScores").innerHTML = `Σκορ: ${score}`;
  } else {
    document.getElementById("resultTitle").textContent = scoreP1 > scoreP2 ? "Νικητής: Παίκτης 1!" : scoreP2 > scoreP1 ? "Νικητής: Παίκτης 2!" : "Ισοπαλία!";
    document.getElementById("resultScores").innerHTML = `Π1: ${scoreP1} &nbsp; Π2: ${scoreP2}`;
  }
}

function evaluateGuess(guess) {
  const result = Array(wordLen).fill("absent");
  const s = secret.split("");
  const g = guess.split("");
  for (let i = 0; i < wordLen; i++) {
    if (g[i] === s[i]) { result[i] = "green"; s[i] = null; g[i] = null; }
  }
  for (let i = 0; i < wordLen; i++) {
    if (g[i] && s.includes(g[i])) {
      result[i] = "orange";
      s[s.indexOf(g[i])] = null;
    }
  }
  return result;
}

function updateBoosters() {
  document.getElementById("b1").textContent = "x" + boosters.green;
  document.getElementById("b2").textContent = "x" + boosters.orange;
  document.getElementById("b3").textContent = "x" + boosters.pink;
  document.getElementById("b4").textContent = "x" + boosters.blue;
}

function useBooster(type) {
  if (gameOver || boosters[type] <= 0) return;
  boosters[type]--;
  updateBoosters();
  if (type === "green") {
    for (let i = 1; i < wordLen; i++) {
      const tile = document.getElementById(`t${currentRow}${i}`);
      if (!tile.textContent) {
        tile.textContent = secret[i];
        tile.classList.add("green");
        sfxCorrect();
        messageEl.textContent = "Σωστό γράμμα σε σωστή θέση!";
        return;
      }
    }
  } else if (type === "orange") {
    for (let i = 1; i < wordLen; i++) {
      if (secret[i] !== secret[0]) {
        const wp = (i + 1) % wordLen || 1;
        const tile = document.getElementById(`t${currentRow}${wp}`);
        if (tile && !tile.classList.contains("green")) {
          tile.textContent = secret[i];
          tile.classList.add("orange");
          messageEl.textContent = "Σωστό γράμμα σε λάθος θέση!";
          return;
        }
      }
    }
  } else if (type === "pink") {
    const inWord = new Set(secret.split(""));
    let removed = 0;
    document.querySelectorAll(".key").forEach(k => {
      if (k.textContent.length === 1 && !inWord.has(k.textContent) && !k.classList.contains("absent") && removed < 6) {
        k.classList.add("absent");
        removed++;
      }
    });
    messageEl.textContent = "Αφαιρέθηκαν λάθος γράμματα!";
  } else if (type === "blue") {
    frozen = true;
    messageEl.textContent = "Ο χρόνος πάγωσε για 20 δευτερόλεπτα!";
    setTimeout(() => { frozen = false; messageEl.textContent = "Ο χρόνος συνεχίζει!"; }, 20000);
  }
}

// Μικρόφωνο
function initSpeech() {
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  if (!SR) { micBtn.disabled = true; return; }
  recognition = new SR();
  recognition.lang = "el-GR";
  recognition.continuous = false;
  recognition.interimResults = false;
  recognition.onresult = (e) => {
    let spoken = e.results[0][0].transcript.toUpperCase().replace(/\s/g, "").normalize('NFD').replace(/[\u0300-\u036f]/g, "");
    if (spoken.length >= wordLen) {
      currentGuess = spoken.substring(0, wordLen);
      if (!currentGuess.startsWith(secret[0])) currentGuess = secret[0] + currentGuess.slice(1);
      inputDisplay.textContent = currentGuess;
      updatePreview();
      messageEl.textContent = `Άκουσες: ${currentGuess}`;
      setTimeout(submitGuess, 400);
    }
  };
  recognition.onend = () => { isListening = false; micBtn.classList.remove("listening"); micBtn.textContent = "🎤 Μικρόφωνο"; };
}
function toggleMic() {
  if (!recognition) return;
  if (isListening) recognition.stop();
  else {
    isListening = true;
    micBtn.classList.add("listening");
    micBtn.textContent = "● Ακούω...";
    recognition.start();
  }
}

document.addEventListener("keydown", (e) => {
  if (!gameScreen.classList.contains("active")) return;
  if (e.key === "Backspace") handleKey("⌫");
  else if (e.key === "Enter") handleKey("OK");
  else {
    const u = e.key.toUpperCase();
    const map = {"A":"Α","B":"Β","G":"Γ","D":"Δ","E":"Ε","Z":"Ζ","H":"Η","U":"Θ","I":"Ι","K":"Κ","L":"Λ","M":"Μ","N":"Ν","J":"Ξ","O":"Ο","P":"Π","R":"Ρ","S":"Σ","T":"Τ","Y":"Υ","F":"Φ","X":"Χ","C":"Ψ","V":"Ω"};
    if (map[u]) handleKey(map[u]);
    else if (GREEK.includes(u)) handleKey(u);
  }
});

document.querySelectorAll("button").forEach(btn => {
  btn.addEventListener("click", () => sfxClick());
});
initSpeech();

function assembleText(elementId, finalText, delay = 0) {
  const el = document.getElementById(elementId);
  if (!el) return;
  const letters = finalText.split("");
  let displayed = Array(letters.length).fill("");
  const positions = letters.map((_, i) => i);

  // Scramble order
  for (let i = positions.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [positions[i], positions[j]] = [positions[j], positions[i]];
  }

  positions.forEach((pos, idx) => {
    setTimeout(() => {
      displayed[pos] = letters[pos];
      el.textContent = displayed.join("");
    }, delay + idx * 80);
  });
}

function startAssembly() {
  assembleText("line1", "Το παιχνίδι των λέξεων", 300);
  assembleText("line2", "FranklyLingo", 900);
  assembleText("line3", "Βρες τη λέξη", 1500);
}

// Remove old floating letters call
// createFloatingLetters();

setTimeout(() => {
  const logo = document.getElementById("logo");
  if (logo) logo.classList.add("stop");
}, 4000);

startAssembly();
</script>
