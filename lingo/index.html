<!DOCTYPE html>
<html lang="el">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Lingo</title>
<style>
  :root {
    --bg: #0b1e45;
    --panel: #12264d;
    --tile: #1a3566;
    --tile-border: #4a6aaa;
    --green: #22c55e;
    --orange: #f59e0b;
    --absent: #0f2748;
    --text: #ffffff;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    height: 100%;
    background: linear-gradient(180deg, #0a1840 0%, #0c2260 100%);
    color: var(--text);
    font-family: system-ui, -apple-system, 'Segoe UI', sans-serif;
    overflow: hidden;
  }
  body {
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 8px;
    height: 100vh;
    height: 100dvh;
  }
  header {
    width: 100%;
    max-width: 500px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 6px;
    flex-shrink: 0;
  }
  h1 {
    font-size: 1.8rem;
    font-weight: 800;
    background: linear-gradient(90deg, #fbbf24, #f59e0b);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
  }
  .info-box {
    background: #1e3a6e;
    padding: 4px 12px;
    border-radius: 16px;
    font-weight: bold;
    font-size: 0.95rem;
  }
  .timer-box.warning { background: #ef4444; }
  .level-info {
    font-size: 0.85rem;
    color: #93c5fd;
    margin-bottom: 4px;
    text-align: center;
  }
  .game-area {
    width: 100%;
    max-width: 500px;
    flex: 1;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }
  #grid-container {
    flex: 1;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    margin: 4px 0;
  }
  #grid {
    display: flex;
    flex-direction: column;
    gap: 6px;
  }
  .row {
    display: flex;
    justify-content: center;
    gap: 6px;
    position: relative;
  }
  .tile {
    width: 48px;
    height: 48px;
    background: var(--tile);
    border: 2px solid var(--tile-border);
    border-radius: 8px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 1.5rem;
    font-weight: 700;
    transition: all 0.15s;
  }
  .tile.green { background: var(--green); border-color: #16a34a; }
  .tile.orange { background: var(--orange); border-color: #d97706; }
  .tile.absent { background: var(--absent); border-color: #1e3a5f; color: #64748b; }
  .mult {
    position: absolute;
    right: -42px;
    top: 50%;
    transform: translateY(-50%);
    font-size: 0.75rem;
    color: #93c5fd;
    font-weight: bold;
  }
  .boosters {
    display: flex;
    justify-content: center;
    gap: 8px;
    margin: 6px 0;
    flex-shrink: 0;
  }
  .booster {
    width: 56px;
    height: 56px;
    border-radius: 10px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    font-size: 1.2rem;
    flex-shrink: 0;
  }
  .booster.green-b { background: #22c55e; }
  .booster.orange-b { background: #f59e0b; }
  .booster.pink-b { background: #ec4899; }
  .booster.blue-b { background: #3b82f6; }
  .booster .count {
    font-size: 0.6rem;
    background: rgba(0,0,0,0.35);
    padding: 1px 5px;
    border-radius: 6px;
    margin-top: 1px;
  }
  #input-display {
    width: 100%;
    height: 42px;
    background: #0f2348;
    border: 2px solid #3b5aaa;
    border-radius: 8px;
    display: flex;
    align-items: center;
    padding: 0 12px;
    font-size: 1.15rem;
    font-weight: bold;
    letter-spacing: 2px;
    margin-bottom: 6px;
    flex-shrink: 0;
  }
  .message {
    text-align: center;
    min-height: 22px;
    font-size: 0.9rem;
    color: #fbbf24;
    margin-bottom: 4px;
  }
  #keyboard {
    flex-shrink: 0;
    margin-top: auto;
    padding-bottom: 6px;
  }
  .kb-row {
    display: flex;
    justify-content: center;
    gap: 3px;
    margin-bottom: 4px;
  }
  .key {
    width: 32px;
    height: 42px;
    background: #e2e8f0;
    color: #0f172a;
    border: none;
    border-radius: 5px;
    font-size: 0.95rem;
    font-weight: 700;
    cursor: pointer;
  }
  .key.wide { width: 50px; font-size: 0.75rem; }
  .key.absent { background: #475569; color: #94a3b8; pointer-events: none; }
  .controls {
    display: flex;
    justify-content: center;
    gap: 8px;
    margin-top: 6px;
    flex-shrink: 0;
  }
  button.action {
    background: #3b82f6;
    color: white;
    border: none;
    padding: 8px 14px;
    border-radius: 8px;
    font-size: 0.9rem;
    font-weight: bold;
    cursor: pointer;
  }
  button.mic { background: #ec4899; }
  button.mic.listening { background: #ef4444; }
  @media (max-width: 400px) {
    .tile { width: 42px; height: 42px; font-size: 1.3rem; }
    .key { width: 28px; height: 38px; font-size: 0.85rem; }
  }
</style>
</head>
<body>
<header>
  <h1>LINGO</h1>
  <div class="info-box timer-box" id="timer">60</div>
  <div class="info-box">Σκορ: <span id="score">0</span></div>
</header>
<div class="level-info" id="levelInfo">Επίπεδο 1 • 4 γράμματα</div>

<div class="game-area">
  <div id="grid-container">
    <div id="grid"></div>
  </div>

  <div class="boosters">
    <div class="booster green-b" onclick="useBooster('green')">?<div class="count" id="b1">x3</div></div>
    <div class="booster orange-b" onclick="useBooster('orange')">?<div class="count" id="b2">x3</div></div>
    <div class="booster pink-b" onclick="useBooster('pink')">⚡<div class="count" id="b3">x3</div></div>
    <div class="booster blue-b" onclick="useBooster('blue')">❄️<div class="count" id="b4">x3</div></div>
  </div>

  <div id="input-display"></div>
  <div class="message" id="message">Το πρώτο γράμμα είναι ήδη γνωστό</div>

  <div id="keyboard"></div>

  <div class="controls">
    <button class="action mic" id="micBtn" onclick="toggleMic()">🎤 Μικρόφωνο</button>
    <button class="action" onclick="newGame()">Νέο</button>
  </div>
</div>

<script>
const WORDS4 = ["ΑΙΜΑ","ΑΚΤΗ","ΑΛΜΑ","ΑΠΛΟ","ΑΡΓΟ","ΒΑΘΥ","ΓΑΤΑ","ΔΕΝΤ","ΕΡΓΟ","ΖΩΗΝ","ΗΛΙΟ","ΙΔΕΑ","ΚΑΛΟ","ΛΑΔΙ","ΜΑΜΑ","ΝΕΡΟ","ΞΥΛΟ","ΟΙΚΟ","ΠΑΙΔ","ΡΟΔΟ","ΣΠΙΤ","ΤΡΑΠ","ΦΩΣΑ","ΧΕΡΙ","ΨΑΡΙ"];
const WORDS5 = ["ΑΓΑΠΗ","ΑΓΟΡΑ","ΑΕΡΑΣ","ΑΛΑΤΙ","ΑΛΟΓΟ","ΑΜΑΞΙ","ΑΝΘΟΣ","ΑΡΩΜΑ","ΑΣΤΡΟ","ΑΥΡΙΟ","ΒΑΡΚΑ","ΒΟΥΝΟ","ΒΡΟΧΗ","ΓΑΝΤΙ","ΓΛΥΚΟ","ΔΑΣΟΣ","ΔΕΡΜΑ","ΗΛΙΟΣ","ΚΑΦΕΣ","ΚΗΠΟΣ"];
const WORDS6 = ["ΒΙΒΛΙΟ","ΓΛΩΣΣΑ","ΑΔΕΡΦΗ","ΑΝΕΜΟΣ","ΑΣΤΕΡΙ","ΑΡΧΕΙΟ","ΒΑΛΤΟΣ","ΓΕΦΥΡΑ","ΓΗΠΕΔΟ","ΓΙΑΓΙΑ","ΔΑΝΕΙΟ","ΔΕΙΠΝΟ","ΕΚΚΛΗΣ","ΕΡΓΑΣΙ","ΖΩΓΡΑΦ","ΗΛΙΟΛΟ","ΘΕΑΤΡΟ","ΚΑΡΔΙΑ","ΛΟΥΛΟΥ","ΜΟΥΣΕΙ"];

function normalize(w) { return w.normalize('NFD').replace(/[\u0300-\u036f]/g, '').toUpperCase(); }
const allWords = {
  4: WORDS4.map(normalize),
  5: WORDS5.map(normalize),
  6: WORDS6.map(normalize)
};

const GREEK = "ΑΒΓΔΕΖΗΘΙΚΛΜΝΞΟΠΡΣΤΥΦΧΨΩ".split("");
let wordLen = 4;
let level = 1;
let correctCount = 0;
let secret = "";
let currentRow = 0;
let currentGuess = "";
let gameOver = false;
let score = 0;
let boosters = { green: 3, orange: 3, pink: 3, blue: 3 };
let timeLeft = 60;
let timerInterval = null;
let frozen = false;
let recognition = null;
let isListening = false;

const grid = document.getElementById("grid");
const inputDisplay = document.getElementById("input-display");
const messageEl = document.getElementById("message");
const scoreEl = document.getElementById("score");
const keyboardEl = document.getElementById("keyboard");
const timerEl = document.getElementById("timer");
const micBtn = document.getElementById("micBtn");
const levelInfo = document.getElementById("levelInfo");

function getMultiplier(row) {
  if (row === 0) return "x3";
  if (row === 1) return "x3";
  if (row === 2) return "x2";
  if (row === 3) return "x2";
  return "x1";
}

function initGrid() {
  grid.innerHTML = "";
  for (let r = 0; r < 5; r++) {
    const row = document.createElement("div");
    row.className = "row";
    for (let c = 0; c < wordLen; c++) {
      const tile = document.createElement("div");
      tile.className = "tile";
      tile.id = `t${r}${c}`;
      row.appendChild(tile);
    }
    const mult = document.createElement("div");
    mult.className = "mult";
    mult.textContent = getMultiplier(r);
    row.appendChild(mult);
    grid.appendChild(row);
  }
}

function buildKeyboard() {
  keyboardEl.innerHTML = "";
  const rows = [
    ["Α","Β","Γ","Δ","Ε","Ζ","Η","Θ","Ι"],
    ["Κ","Λ","Μ","Ν","Ξ","Ο","Π","Ρ","Σ"],
    ["Τ","Υ","Φ","Χ","Ψ","Ω","⌫","OK"]
  ];
  rows.forEach(letters => {
    const row = document.createElement("div");
    row.className = "kb-row";
    letters.forEach(l => {
      const key = document.createElement("button");
      key.className = "key" + (l.length > 1 ? " wide" : "");
      key.textContent = l;
      key.onclick = () => handleKey(l);
      row.appendChild(key);
    });
    keyboardEl.appendChild(row);
  });
}

function startTimer() {
  clearInterval(timerInterval);
  timeLeft = 60;
  frozen = false;
  timerEl.textContent = timeLeft;
  timerEl.classList.remove("warning");
  timerInterval = setInterval(() => {
    if (frozen || gameOver) return;
    timeLeft--;
    timerEl.textContent = timeLeft;
    if (timeLeft <= 10) timerEl.classList.add("warning");
    if (timeLeft <= 0) {
      clearInterval(timerInterval);
      messageEl.textContent = "Τέλος χρόνου!";
      currentRow++;
      currentGuess = "";
      inputDisplay.textContent = "";
      if (currentRow >= 5) endGame(false);
      else startTimer();
    }
  }, 1000);
}

function newGame() {
  clearInterval(timerInterval);
  // Επίπεδο: μετά από 5 σωστά → 5 γράμματα, μετά άλλα 5 → 6
  if (correctCount >= 10 && wordLen < 6) { wordLen = 6; level = 3; }
  else if (correctCount >= 5 && wordLen < 5) { wordLen = 5; level = 2; }
  levelInfo.textContent = `Επίπεδο ${level} • ${wordLen} γράμματα`;

  const list = allWords[wordLen];
  secret = list[Math.floor(Math.random() * list.length)];
  currentRow = 0;
  currentGuess = "";
  gameOver = false;
  boosters = { green: 3, orange: 3, pink: 3, blue: 3 };
  updateBoosterCounts();
  initGrid();
  buildKeyboard();
  inputDisplay.textContent = "";
  messageEl.textContent = `Πρώτο γράμμα: ${secret[0]}`;
  document.getElementById("t00").textContent = secret[0];
  document.getElementById("t00").classList.add("green");
  scoreEl.textContent = score;
  startTimer();
  stopMic();
}

function updateBoosterCounts() {
  document.getElementById("b1").textContent = "x" + boosters.green;
  document.getElementById("b2").textContent = "x" + boosters.orange;
  document.getElementById("b3").textContent = "x" + boosters.pink;
  document.getElementById("b4").textContent = "x" + boosters.blue;
}

function handleKey(key) {
  if (gameOver) return;
  if (key === "⌫") {
    if (currentGuess.length > 0) currentGuess = currentGuess.slice(0, -1);
  } else if (key === "OK" || key === "Enter") {
    submitGuess();
    return;
  } else if (currentGuess.length < wordLen && GREEK.includes(key)) {
    if (currentGuess.length === 0 && key !== secret[0]) {
      messageEl.textContent = `Ξεκινάει από ${secret[0]}!`;
      return;
    }
    currentGuess += key;
  }
  inputDisplay.textContent = currentGuess;
  updatePreview();
}

function updatePreview() {
  for (let i = 0; i < wordLen; i++) {
    const tile = document.getElementById(`t${currentRow}${i}`);
    if (i === 0 && currentRow === 0) continue;
    tile.textContent = currentGuess[i] || "";
  }
}

function submitGuess() {
  if (currentGuess.length !== wordLen) {
    messageEl.textContent = `Χρειάζονται ${wordLen} γράμματα!`;
    return;
  }
  if (!currentGuess.startsWith(secret[0])) {
    messageEl.textContent = `Πρέπει να ξεκινάει από ${secret[0]}!`;
    return;
  }

  const result = evaluateGuess(currentGuess);
  for (let i = 0; i < wordLen; i++) {
    const tile = document.getElementById(`t${currentRow}${i}`);
    tile.textContent = currentGuess[i];
    tile.classList.add(result[i]);
  }

  if (currentGuess === secret) {
    endGame(true);
    return;
  }

  currentRow++;
  currentGuess = "";
  inputDisplay.textContent = "";
  if (currentRow >= 5) endGame(false);
  else {
    messageEl.textContent = `Προσπάθεια ${currentRow + 1}/5`;
    startTimer();
  }
}

function endGame(won) {
  gameOver = true;
  clearInterval(timerInterval);
  stopMic();
  if (won) {
    const mult = parseInt(getMultiplier(currentRow).slice(1));
    const points = 50 * mult;
    score += points;
    correctCount++;
    scoreEl.textContent = score;
    messageEl.textContent = `🎉 Lingo! +${points} πόντοι`;
  } else {
    messageEl.textContent = `Η λέξη ήταν: ${secret}`;
  }
}

function evaluateGuess(guess) {
  const result = Array(wordLen).fill("absent");
  const s = secret.split("");
  const g = guess.split("");
  for (let i = 0; i < wordLen; i++) {
    if (g[i] === s[i]) { result[i] = "green"; s[i] = null; g[i] = null; }
  }
  for (let i = 0; i < wordLen; i++) {
    if (g[i] && s.includes(g[i])) {
      result[i] = "orange";
      s[s.indexOf(g[i])] = null;
    }
  }
  return result;
}

function useBooster(type) {
  if (gameOver || boosters[type] <= 0) return;
  boosters[type]--;
  updateBoosterCounts();

  if (type === "green") {
    // Σωστό γράμμα σε σωστή θέση
    for (let i = 1; i < wordLen; i++) {
      const tile = document.getElementById(`t${currentRow}${i}`);
      if (!tile.textContent) {
        tile.textContent = secret[i];
        tile.classList.add("green");
        messageEl.textContent = "Σωστό γράμμα σε σωστή θέση!";
        return;
      }
    }
  } else if (type === "orange") {
    // Σωστό γράμμα σε λάθος θέση
    for (let i = 1; i < wordLen; i++) {
      if (secret[i] !== secret[0]) {
        const wrongPos = (i + 1) % wordLen || 1;
        const tile = document.getElementById(`t${currentRow}${wrongPos}`);
        if (tile && !tile.classList.contains("green")) {
          tile.textContent = secret[i];
          tile.classList.add("orange");
          messageEl.textContent = "Σωστό γράμμα σε λάθος θέση!";
          return;
        }
      }
    }
  } else if (type === "pink") {
    // Αφαιρεί γράμματα που ΔΕΝ είναι στη λέξη (βοηθάει τον παίκτη)
    const inWord = new Set(secret.split(""));
    let removed = 0;
    document.querySelectorAll(".key").forEach(k => {
      const letter = k.textContent;
      if (letter.length === 1 && !inWord.has(letter) && !k.classList.contains("absent")) {
        k.classList.add("absent");
        removed++;
        if (removed >= 6) return; // Αφαιρεί έως 6 λάθος γράμματα
      }
    });
    messageEl.textContent = "Αφαιρέθηκαν γράμματα που δεν είναι στη λέξη!";
  } else if (type === "blue") {
    frozen = true;
    messageEl.textContent = "Ο χρόνος πάγωσε για 20 δευτερόλεπτα!";
    setTimeout(() => { frozen = false; messageEl.textContent = "Ο χρόνος συνεχίζει!"; }, 20000);
  }
}

// Μικρόφωνο
function initSpeech() {
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  if (!SR) { micBtn.disabled = true; micBtn.textContent = "Μικρ. όχι"; return; }
  recognition = new SR();
  recognition.lang = "el-GR";
  recognition.continuous = false;
  recognition.interimResults = false;
  recognition.onresult = (e) => {
    let spoken = e.results[0][0].transcript.toUpperCase().replace(/\s/g, "").normalize('NFD').replace(/[\u0300-\u036f]/g, "");
    if (spoken.length >= wordLen) {
      currentGuess = spoken.substring(0, wordLen);
      if (!currentGuess.startsWith(secret[0])) currentGuess = secret[0] + currentGuess.slice(1);
      inputDisplay.textContent = currentGuess;
      updatePreview();
      messageEl.textContent = `Άκουσες: ${currentGuess}`;
      setTimeout(submitGuess, 500);
    } else messageEl.textContent = "Δεν άκουσα καθαρά.";
  };
  recognition.onend = () => { isListening = false; micBtn.classList.remove("listening"); micBtn.textContent = "🎤 Μικρόφωνο"; };
  recognition.onerror = () => { isListening = false; micBtn.classList.remove("listening"); micBtn.textContent = "🎤 Μικρόφωνο"; };
}

function toggleMic() {
  if (!recognition) return;
  if (isListening) recognition.stop();
  else {
    isListening = true;
    micBtn.classList.add("listening");
    micBtn.textContent = "● Ακούω...";
    messageEl.textContent = "Μίλα τη λέξη...";
    recognition.start();
  }
}
function stopMic() { if (recognition && isListening) recognition.stop(); }

document.addEventListener("keydown", (e) => {
  if (e.key === "Backspace") handleKey("⌫");
  else if (e.key === "Enter") handleKey("OK");
  else {
    const u = e.key.toUpperCase();
    const map = {"A":"Α","B":"Β","G":"Γ","D":"Δ","E":"Ε","Z":"Ζ","H":"Η","U":"Θ","I":"Ι","K":"Κ","L":"Λ","M":"Μ","N":"Ν","J":"Ξ","O":"Ο","P":"Π","R":"Ρ","S":"Σ","T":"Τ","Y":"Υ","F":"Φ","X":"Χ","C":"Ψ","V":"Ω"};
    if (map[u]) handleKey(map[u]);
    else if (GREEK.includes(u)) handleKey(u);
  }
});

initSpeech();
newGame();
</script>
</body>
</html>
