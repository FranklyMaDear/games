<!DOCTYPE html>
<html lang="el">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lingo - Ελληνικό Παιχνίδι Λέξεων</title>
<style>
  :root {
    --bg: #0a1a3a;
    --panel: #12264d;
    --tile: #1a3566;
    --tile-border: #3a5a9a;
    --green: #22c55e;
    --orange: #f59e0b;
    --absent: #1e3a6e;
    --text: #ffffff;
    --accent: #60a5fa;
    --danger: #ef4444;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
    background: linear-gradient(160deg, #071230 0%, #0c1f4a 50%, #0a1838 100%);
    color: var(--text);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 12px;
  }
  header {
    width: 100%;
    max-width: 520px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 12px;
  }
  h1 {
    font-size: 2.2rem;
    font-weight: 800;
    letter-spacing: 2px;
    background: linear-gradient(90deg, #fbbf24, #f59e0b);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
  }
  .score-box, .timer-box {
    background: #1e3a6e;
    padding: 6px 14px;
    border-radius: 20px;
    font-weight: bold;
    font-size: 1rem;
    border: 1px solid #3b5aaa;
  }
  .timer-box.warning { background: var(--danger); animation: pulse 0.5s infinite; }
  @keyframes pulse { 50% { opacity: 0.7; } }
  .game-area {
    width: 100%;
    max-width: 520px;
    background: var(--panel);
    border-radius: 16px;
    padding: 16px;
    box-shadow: 0 10px 40px rgba(0,0,0,0.4);
  }
  #grid {
    display: flex;
    flex-direction: column;
    gap: 8px;
    margin-bottom: 12px;
  }
  .row {
    display: flex;
    justify-content: center;
    gap: 8px;
  }
  .tile {
    width: 54px;
    height: 54px;
    background: var(--tile);
    border: 2px solid var(--tile-border);
    border-radius: 10px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 1.7rem;
    font-weight: 700;
    text-transform: uppercase;
    transition: all 0.2s ease;
  }
  .tile.green { background: var(--green); border-color: #16a34a; }
  .tile.orange { background: var(--orange); border-color: #d97706; }
  .tile.absent { background: #0f2748; border-color: #1e3a5f; color: #64748b; }
  .boosters {
    display: flex;
    justify-content: center;
    gap: 10px;
    margin: 12px 0;
  }
  .booster {
    width: 60px;
    height: 60px;
    border-radius: 12px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    font-size: 1.3rem;
    transition: transform 0.1s;
  }
  .booster:active { transform: scale(0.95); }
  .booster.green-b { background: #22c55e; }
  .booster.orange-b { background: #f59e0b; }
  .booster.pink-b { background: #ec4899; }
  .booster.blue-b { background: #3b82f6; }
  .booster .count {
    font-size: 0.65rem;
    background: rgba(0,0,0,0.3);
    padding: 1px 5px;
    border-radius: 8px;
    margin-top: 1px;
  }
  #input-display {
    width: 100%;
    height: 46px;
    background: #0f2348;
    border: 2px solid #3b5aaa;
    border-radius: 10px;
    display: flex;
    align-items: center;
    padding: 0 14px;
    font-size: 1.25rem;
    font-weight: bold;
    letter-spacing: 3px;
    margin-bottom: 10px;
  }
  #keyboard {
    display: flex;
    flex-direction: column;
    gap: 5px;
    margin-top: 6px;
  }
  .kb-row {
    display: flex;
    justify-content: center;
    gap: 4px;
  }
  .key {
    width: 34px;
    height: 44px;
    background: #e2e8f0;
    color: #0f172a;
    border: none;
    border-radius: 6px;
    font-size: 1rem;
    font-weight: 700;
    cursor: pointer;
  }
  .key.wide { width: 56px; font-size: 0.8rem; }
  .key.absent { background: #475569; color: #94a3b8; }
  .message {
    text-align: center;
    min-height: 26px;
    margin: 6px 0;
    font-size: 1rem;
    color: #fbbf24;
  }
  .controls {
    display: flex;
    justify-content: center;
    gap: 10px;
    margin-top: 10px;
    flex-wrap: wrap;
  }
  button.action {
    background: #3b82f6;
    color: white;
    border: none;
    padding: 9px 16px;
    border-radius: 8px;
    font-size: 0.95rem;
    font-weight: bold;
    cursor: pointer;
  }
  button.action:hover { background: #2563eb; }
  button.mic {
    background: #ec4899;
  }
  button.mic.listening {
    background: #ef4444;
    animation: pulse 1s infinite;
  }
  footer {
    margin-top: 16px;
    font-size: 0.75rem;
    color: #64748b;
    text-align: center;
  }
</style>
</head>
<body>
<header>
  <h1>LINGO</h1>
  <div>
    <div class="timer-box" id="timer">30</div>
  </div>
  <div class="score-box">Σκορ: <span id="score">0</span></div>
</header>

<div class="game-area">
  <div id="grid"></div>

  <div class="boosters">
    <div class="booster green-b" onclick="useBooster('correct')" title="Αποκάλυψε σωστό γράμμα σε σωστή θέση">
      ?
      <div class="count" id="b1">x3</div>
    </div>
    <div class="booster orange-b" onclick="useBooster('present')" title="Αποκάλυψε γράμμα που υπάρχει αλλά σε λάθος θέση">
      ?
      <div class="count" id="b2">x2</div>
    </div>
    <div class="booster pink-b" onclick="useBooster('remove')" title="Αφαίρεσε λάθος γράμματα από το πληκτρολόγιο">
      ⚡
      <div class="count" id="b3">x2</div>
    </div>
    <div class="booster blue-b" onclick="useBooster('freeze')" title="Πάγωσε τον χρόνο για 10 δευτερόλεπτα">
      ❄️
      <div class="count" id="b4">x2</div>
    </div>
  </div>

  <div id="input-display"></div>
  <div class="message" id="message">Μάντεψε τη λέξη! Το πρώτο γράμμα είναι ήδη γνωστό.</div>

  <div id="keyboard"></div>

  <div class="controls">
    <button class="action mic" id="micBtn" onclick="toggleMic()">🎤 Μικρόφωνο</button>
    <button class="action" onclick="newGame()">Νέο Παιχνίδι</button>
  </div>
</div>

<footer>
  Ελληνική έκδοση του Lingo • 5 προσπάθειες • 30 δευτερόλεπτα ανά προσπάθεια
</footer>

<script>
const WORDS = [
  "ΑΓΑΠΗ", "ΑΓΟΡΑ", "ΑΕΡΑΣ", "ΑΛΑΤΙ", "ΑΛΟΓΟ",
  "ΑΜΑΞΙ", "ΑΝΘΟΣ", "ΑΡΩΜΑ", "ΑΣΤΡΟ", "ΑΥΡΙΟ",
  "ΒΑΡΚΑ", "ΒΟΥΝΟ", "ΒΡΟΧΗ", "ΓΑΝΤΙ", "ΓΛΥΚΟ",
  "ΔΑΣΟΣ", "ΔΕΡΜΑ", "ΗΛΙΟΣ", "ΚΑΦΕΣ", "ΚΗΠΟΣ"
];

const uniqueWords = WORDS.map(w => w.normalize('NFD').replace(/[\u0300-\u036f]/g, '').toUpperCase());

const GREEK_LETTERS = "ΑΒΓΔΕΖΗΘΙΚΛΜΝΞΟΠΡΣΤΥΦΧΨΩ".split("");

let secret = "";
let currentRow = 0;
let currentGuess = "";
let gameOver = false;
let score = 0;
let boosters = { correct: 3, present: 2, remove: 2, freeze: 2 };
let timeLeft = 30;
let timerInterval = null;
let frozen = false;
let recognition = null;
let isListening = false;

const grid = document.getElementById("grid");
const inputDisplay = document.getElementById("input-display");
const messageEl = document.getElementById("message");
const scoreEl = document.getElementById("score");
const keyboardEl = document.getElementById("keyboard");
const timerEl = document.getElementById("timer");
const micBtn = document.getElementById("micBtn");

function initGrid() {
  grid.innerHTML = "";
  for (let r = 0; r < 5; r++) {
    const row = document.createElement("div");
    row.className = "row";
    for (let c = 0; c < 5; c++) {
      const tile = document.createElement("div");
      tile.className = "tile";
      tile.id = `t${r}${c}`;
      row.appendChild(tile);
    }
    grid.appendChild(row);
  }
}

function buildKeyboard() {
  keyboardEl.innerHTML = "";
  const rows = [
    ["Α","Β","Γ","Δ","Ε","Ζ","Η","Θ","Ι"],
    ["Κ","Λ","Μ","Ν","Ξ","Ο","Π","Ρ","Σ"],
    ["Τ","Υ","Φ","Χ","Ψ","Ω","⌫","OK"]
  ];
  rows.forEach((letters) => {
    const row = document.createElement("div");
    row.className = "kb-row";
    letters.forEach(l => {
      const key = document.createElement("button");
      key.className = "key" + (l.length > 1 ? " wide" : "");
      key.textContent = l;
      key.onclick = () => handleKey(l);
      row.appendChild(key);
    });
    keyboardEl.appendChild(row);
  });
}

function startTimer() {
  clearInterval(timerInterval);
  timeLeft = 30;
  frozen = false;
  timerEl.textContent = timeLeft;
  timerEl.classList.remove("warning");
  timerInterval = setInterval(() => {
    if (frozen || gameOver) return;
    timeLeft--;
    timerEl.textContent = timeLeft;
    if (timeLeft <= 5) timerEl.classList.add("warning");
    if (timeLeft <= 0) {
      clearInterval(timerInterval);
      messageEl.textContent = "Τέλος χρόνου! Χάνεις την προσπάθεια.";
      currentRow++;
      currentGuess = "";
      inputDisplay.textContent = "";
      if (currentRow >= 5) {
        endGame(false);
      } else {
        startTimer();
      }
    }
  }, 1000);
}

function newGame() {
  clearInterval(timerInterval);
  secret = uniqueWords[Math.floor(Math.random() * uniqueWords.length)];
  currentRow = 0;
  currentGuess = "";
  gameOver = false;
  boosters = { correct: 3, present: 2, remove: 2, freeze: 2 };
  updateBoosterCounts();
  initGrid();
  buildKeyboard();
  inputDisplay.textContent = "";
  messageEl.textContent = `Το πρώτο γράμμα είναι: ${secret[0]}`;
  document.getElementById("t00").textContent = secret[0];
  document.getElementById("t00").classList.add("green");
  scoreEl.textContent = score;
  startTimer();
  stopMic();
}

function updateBoosterCounts() {
  document.getElementById("b1").textContent = "x" + boosters.correct;
  document.getElementById("b2").textContent = "x" + boosters.present;
  document.getElementById("b3").textContent = "x" + boosters.remove;
  document.getElementById("b4").textContent = "x" + boosters.freeze;
}

function handleKey(key) {
  if (gameOver) return;
  if (key === "⌫") {
    if (currentGuess.length > 0) currentGuess = currentGuess.slice(0, -1);
  } else if (key === "OK" || key === "Enter") {
    submitGuess();
    return;
  } else if (currentGuess.length < 5 && GREEK_LETTERS.includes(key)) {
    if (currentGuess.length === 0 && key !== secret[0]) {
      messageEl.textContent = `Η λέξη πρέπει να ξεκινάει από ${secret[0]}!`;
      return;
    }
    currentGuess += key;
  }
  inputDisplay.textContent = currentGuess;
  updateCurrentRowPreview();
}

function updateCurrentRowPreview() {
  for (let i = 0; i < 5; i++) {
    const tile = document.getElementById(`t${currentRow}${i}`);
    if (i === 0 && currentRow === 0) continue;
    tile.textContent = currentGuess[i] || "";
  }
}

function submitGuess() {
  if (currentGuess.length !== 5) {
    messageEl.textContent = "Η λέξη πρέπει να έχει 5 γράμματα!";
    return;
  }
  if (!currentGuess.startsWith(secret[0])) {
    messageEl.textContent = `Πρέπει να ξεκινάει από ${secret[0]}!`;
    return;
  }

  const result = evaluateGuess(currentGuess);
  for (let i = 0; i < 5; i++) {
    const tile = document.getElementById(`t${currentRow}${i}`);
    tile.textContent = currentGuess[i];
    tile.classList.add(result[i]);
  }

  if (currentGuess === secret) {
    endGame(true);
    return;
  }

  currentRow++;
  currentGuess = "";
  inputDisplay.textContent = "";
  if (currentRow >= 5) {
    endGame(false);
  } else {
    messageEl.textContent = `Προσπάθεια ${currentRow + 1}/5`;
    startTimer();
  }
}

function endGame(won) {
  gameOver = true;
  clearInterval(timerInterval);
  stopMic();
  if (won) {
    const points = [100, 80, 60, 40, 20][currentRow] || 10;
    score += points;
    scoreEl.textContent = score;
    messageEl.textContent = `🎉 Lingo! Κέρδισες ${points} πόντους!`;
  } else {
    messageEl.textContent = `Τέλος! Η λέξη ήταν: ${secret}`;
  }
}

function evaluateGuess(guess) {
  const result = Array(5).fill("absent");
  const secretArr = secret.split("");
  const guessArr = guess.split("");

  for (let i = 0; i < 5; i++) {
    if (guessArr[i] === secretArr[i]) {
      result[i] = "green";
      secretArr[i] = null;
      guessArr[i] = null;
    }
  }
  for (let i = 0; i < 5; i++) {
    if (guessArr[i] && secretArr.includes(guessArr[i])) {
      result[i] = "orange";
      secretArr[secretArr.indexOf(guessArr[i])] = null;
    }
  }
  return result;
}

function useBooster(type) {
  if (gameOver || boosters[type] <= 0) return;
  boosters[type]--;
  updateBoosterCounts();

  if (type === "correct") {
    for (let i = 1; i < 5; i++) {
      const tile = document.getElementById(`t${currentRow}${i}`);
      if (!tile.textContent) {
        tile.textContent = secret[i];
        tile.classList.add("green");
        messageEl.textContent = "Αποκαλύφθηκε σωστό γράμμα!";
        return;
      }
    }
  } else if (type === "present") {
    messageEl.textContent = "Υπάρχει γράμμα που δεν είναι στη σωστή θέση!";
  } else if (type === "remove") {
    const wrong = GREEK_LETTERS.filter(l => !secret.includes(l)).slice(0, 6);
    document.querySelectorAll(".key").forEach(k => {
      if (wrong.includes(k.textContent)) k.classList.add("absent");
    });
    messageEl.textContent = "Αφαιρέθηκαν λάθος γράμματα!";
  } else if (type === "freeze") {
    frozen = true;
    messageEl.textContent = "Ο χρόνος πάγωσε για 10 δευτερόλεπτα!";
    setTimeout(() => { frozen = false; messageEl.textContent = "Ο χρόνος ξανάρχισε!"; }, 10000);
  }
}

// Μικρόφωνο
function initSpeech() {
  const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
  if (!SpeechRecognition) {
    micBtn.disabled = true;
    micBtn.textContent = "Μικρόφωνο δεν υποστηρίζεται";
    return;
  }
  recognition = new SpeechRecognition();
  recognition.lang = "el-GR";
  recognition.continuous = false;
  recognition.interimResults = false;

  recognition.onresult = (event) => {
    let spoken = event.results[0][0].transcript.toUpperCase().replace(/\s/g, "");
    // Καθαρισμός και αντιστοίχιση
    spoken = spoken.normalize('NFD').replace(/[\u0300-\u036f]/g, '');
    if (spoken.length >= 5) {
      spoken = spoken.substring(0, 5);
      currentGuess = spoken;
      inputDisplay.textContent = currentGuess;
      updateCurrentRowPreview();
      messageEl.textContent = `Άκουσες: ${spoken}`;
      // Αυτόματη υποβολή μετά από μικρή καθυστέρηση
      setTimeout(() => submitGuess(), 600);
    } else {
      messageEl.textContent = "Δεν άκουσα καθαρά 5 γράμματα. Δοκίμασε ξανά.";
    }
  };

  recognition.onend = () => {
    isListening = false;
    micBtn.classList.remove("listening");
    micBtn.textContent = "🎤 Μικρόφωνο";
  };

  recognition.onerror = () => {
    isListening = false;
    micBtn.classList.remove("listening");
    micBtn.textContent = "🎤 Μικρόφωνο";
    messageEl.textContent = "Σφάλμα μικροφώνου. Δοκίμασε ξανά.";
  };
}

function toggleMic() {
  if (!recognition) return;
  if (isListening) {
    recognition.stop();
  } else {
    isListening = true;
    micBtn.classList.add("listening");
    micBtn.textContent = "● Ακούω...";
    messageEl.textContent = "Μίλα τώρα τη λέξη...";
    recognition.start();
  }
}

function stopMic() {
  if (recognition && isListening) recognition.stop();
}

// Πληκτρολόγιο υπολογιστή
document.addEventListener("keydown", (e) => {
  if (e.key === "Backspace") handleKey("⌫");
  else if (e.key === "Enter") handleKey("OK");
  else {
    const upper = e.key.toUpperCase();
    const map = {
      "A":"Α","B":"Β","G":"Γ","D":"Δ","E":"Ε","Z":"Ζ","H":"Η","U":"Θ","I":"Ι",
      "K":"Κ","L":"Λ","M":"Μ","N":"Ν","J":"Ξ","O":"Ο","P":"Π","R":"Ρ","S":"Σ",
      "T":"Τ","Y":"Υ","F":"Φ","X":"Χ","C":"Ψ","V":"Ω"
    };
    if (map[upper]) handleKey(map[upper]);
    else if (GREEK_LETTERS.includes(upper)) handleKey(upper);
  }
});

// Εκκίνηση
initSpeech();
newGame();
</script>
</body>
</html>
