<!DOCTYPE html>
<html lang="el">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lingo - Ελληνικό Παιχνίδι Λέξεων</title>
<style>
  :root {
    --bg: #0a1a3a;
    --panel: #12264d;
    --tile: #1a3566;
    --tile-border: #3a5a9a;
    --green: #22c55e;
    --orange: #f59e0b;
    --absent: #1e3a6e;
    --text: #ffffff;
    --accent: #60a5fa;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
    background: linear-gradient(160deg, #071230 0%, #0c1f4a 50%, #0a1838 100%);
    color: var(--text);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 12px;
  }
  header {
    width: 100%;
    max-width: 520px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 16px;
  }
  h1 {
    font-size: 2.2rem;
    font-weight: 800;
    letter-spacing: 2px;
    background: linear-gradient(90deg, #fbbf24, #f59e0b);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    text-shadow: 0 2px 10px rgba(251,191,36,0.3);
  }
  .score-box {
    background: #1e3a6e;
    padding: 6px 14px;
    border-radius: 20px;
    font-weight: bold;
    font-size: 1.1rem;
    border: 1px solid #3b5aaa;
  }
  .game-area {
    width: 100%;
    max-width: 520px;
    background: var(--panel);
    border-radius: 16px;
    padding: 20px 16px;
    box-shadow: 0 10px 40px rgba(0,0,0,0.4);
  }
  #grid {
    display: flex;
    flex-direction: column;
    gap: 8px;
    margin-bottom: 18px;
  }
  .row {
    display: flex;
    justify-content: center;
    gap: 8px;
  }
  .tile {
    width: 58px;
    height: 58px;
    background: var(--tile);
    border: 2px solid var(--tile-border);
    border-radius: 10px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 1.8rem;
    font-weight: 700;
    text-transform: uppercase;
    transition: all 0.2s ease;
  }
  .tile.green { background: var(--green); border-color: #16a34a; }
  .tile.orange { background: var(--orange); border-color: #d97706; }
  .tile.absent { background: #0f2748; border-color: #1e3a5f; color: #64748b; }
  .tile.current { border-color: var(--accent); box-shadow: 0 0 0 2px rgba(96,165,250,0.4); }
  .multipliers {
    display: flex;
    flex-direction: column;
    gap: 8px;
    position: absolute;
    right: -50px;
    top: 0;
    font-size: 0.85rem;
    color: #93c5fd;
    font-weight: bold;
  }
  .board-wrapper { position: relative; }
  .boosters {
    display: flex;
    justify-content: center;
    gap: 12px;
    margin: 16px 0;
  }
  .booster {
    width: 64px;
    height: 64px;
    border-radius: 12px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    font-size: 1.4rem;
    border: 2px solid transparent;
    transition: transform 0.1s;
  }
  .booster:active { transform: scale(0.95); }
  .booster.green-b { background: #22c55e; }
  .booster.orange-b { background: #f59e0b; }
  .booster.pink-b { background: #ec4899; }
  .booster.blue-b { background: #3b82f6; }
  .booster .count {
    font-size: 0.7rem;
    background: rgba(0,0,0,0.3);
    padding: 1px 6px;
    border-radius: 8px;
    margin-top: 2px;
  }
  #input-display {
    width: 100%;
    height: 48px;
    background: #0f2348;
    border: 2px solid #3b5aaa;
    border-radius: 10px;
    display: flex;
    align-items: center;
    padding: 0 14px;
    font-size: 1.3rem;
    font-weight: bold;
    letter-spacing: 4px;
    margin-bottom: 12px;
  }
  #keyboard {
    display: flex;
    flex-direction: column;
    gap: 6px;
    margin-top: 8px;
  }
  .kb-row {
    display: flex;
    justify-content: center;
    gap: 5px;
  }
  .key {
    width: 36px;
    height: 46px;
    background: #e2e8f0;
    color: #0f172a;
    border: none;
    border-radius: 6px;
    font-size: 1.05rem;
    font-weight: 700;
    cursor: pointer;
    position: relative;
  }
  .key.wide { width: 60px; font-size: 0.85rem; }
  .key.absent { background: #475569; color: #94a3b8; }
  .key .val {
    position: absolute;
    top: 2px;
    left: 3px;
    font-size: 0.55rem;
    color: #64748b;
  }
  .message {
    text-align: center;
    min-height: 28px;
    margin: 8px 0;
    font-size: 1.05rem;
    color: #fbbf24;
  }
  .controls {
    display: flex;
    justify-content: center;
    gap: 12px;
    margin-top: 10px;
  }
  button.action {
    background: #3b82f6;
    color: white;
    border: none;
    padding: 10px 20px;
    border-radius: 8px;
    font-size: 1rem;
    font-weight: bold;
    cursor: pointer;
  }
  button.action:hover { background: #2563eb; }
  footer {
    margin-top: 20px;
    font-size: 0.8rem;
    color: #64748b;
    text-align: center;
  }
</style>
</head>
<body>
<header>
  <h1>LINGO</h1>
  <div class="score-box">Σκορ: <span id="score">0</span></div>
</header>

<div class="game-area">
  <div class="board-wrapper">
    <div id="grid"></div>
  </div>

  <div class="boosters">
    <div class="booster green-b" onclick="useBooster('correct')" title="Αποκάλυψε σωστό γράμμα σε σωστή θέση">
      ?
      <div class="count" id="b1">x3</div>
    </div>
    <div class="booster orange-b" onclick="useBooster('present')" title="Αποκάλυψε γράμμα που υπάρχει αλλά σε λάθος θέση">
      ?
      <div class="count" id="b2">x2</div>
    </div>
    <div class="booster pink-b" onclick="useBooster('remove')" title="Αφαίρεσε λάθος γράμματα από το πληκτρολόγιο">
      ⚡
      <div class="count" id="b3">x2</div>
    </div>
    <div class="booster blue-b" onclick="useBooster('hint')" title="Δώσε βοήθεια (αποκάλυψε ένα γράμμα)">
      💡
      <div class="count" id="b4">x2</div>
    </div>
  </div>

  <div id="input-display"></div>
  <div class="message" id="message">Μάντεψε τη λέξη! Το πρώτο γράμμα είναι ήδη γνωστό.</div>

  <div id="keyboard"></div>

  <div class="controls">
    <button class="action" onclick="newGame()">Νέο Παιχνίδι</button>
  </div>
</div>

<footer>
  Ελληνική έκδοση του Lingo • Μάντεψε λέξεις 5 γραμμάτων
</footer>

<script>
const WORDS = [
  "ΑΓΑΠΗ","ΑΓΟΡΑ","ΑΓΟΡΙ","ΑΓΧΟΣ","ΑΓΩΓΗ","ΑΕΡΑΣ","ΑΕΤΟΣ","ΑΛΑΤΙ","ΑΛΟΓΟ","ΑΜΑΞΙ",
  "ΑΝΘΟΣ","ΑΡΩΜΑ","ΑΣΤΡΟ","ΑΤΟΜΟ","ΑΥΡΙΟ","ΒΑΡΚΑ","ΒΟΥΝΟ","ΒΡΟΧΗ","ΓΑΝΤΙ","ΓΕΡΟΣ",
  "ΓΕΥΣΗ","ΓΛΥΚΟ","ΓΝΩΜΗ","ΓΝΩΣΗ","ΓΡΑΦΩ","ΔΑΚΡΥ","ΔΑΣΟΣ","ΔΕΡΜΑ","ΔΟΝΤΙ","ΕΚΑΤΟ",
  "ΗΛΙΟΣ","ΗΜΕΡΑ","ΗΡΩΑΣ","ΚΑΛΟΣ","ΚΑΡΤΑ","ΚΑΡΦΙ","ΚΑΦΕΣ","ΚΗΠΟΣ","ΚΡΑΣΙ","ΚΡΕΑΣ",
  "ΚΡΕΜΑ","ΛΥΚΟΣ","ΜΑΣΚΑ","ΜΗΔΕΝ","ΜΗΝΑΣ","ΜΥΘΟΣ","ΝΥΧΤΑ","ΠΑΓΟΣ","ΠΑΙΔΙ","ΠΑΡΚΟ",
  "ΠΕΝΤΕ","ΠΙΑΝΟ","ΠΙΤΣΑ","ΠΛΑΚΑ","ΠΛΟΙΟ","ΠΟΡΤΑ","ΠΟΥΛΙ","ΣΚΑΛΑ","ΣΚΥΛΙ","ΣΠΙΤΙ",
  "ΣΤΟΜΑ","ΤΕΛΟΣ","ΤΕΡΑΣ","ΤΕΧΝΗ","ΤΡΕΝΟ","ΦΙΛΟΣ","ΦΟΒΟΣ","ΦΩΤΙΑ","ΧΑΡΤΙ","ΧΙΟΝΙ",
  "ΧΟΡΟΣ","ΧΥΜΟΣ","ΧΩΡΙΟ","ΨΑΡΑΣ","ΩΡΑΙΑ","ΒΙΒΛΙΟ","ΜΟΥΣΗ","ΧΑΡΤΑ","ΚΑΡΔΙ","ΦΙΛΙΑ",
  "ΑΛΟΓΟ","ΒΑΘΟΣ","ΓΑΜΟΣ","ΔΡΟΜΟ","ΕΛΠΙΔ","ΖΩΗΡΟ","ΘΑΛΑΣ","ΙΚΑΝΟ","ΚΑΛΑΘ","ΛΟΥΛΟ"
];

// Καθαρισμός και μοναδικά
const uniqueWords = [...new Set(WORDS.map(w => w.normalize('NFD').replace(/[\u0300-\u036f]/g, '').toUpperCase()))];

const GREEK_LETTERS = "ΑΒΓΔΕΖΗΘΙΚΛΜΝΞΟΠΡΣΤΥΦΧΨΩ".split("");

let secret = "";
let currentRow = 0;
let currentGuess = "";
let gameOver = false;
let score = 0;
let boosters = { correct: 3, present: 2, remove: 2, hint: 2 };

const grid = document.getElementById("grid");
const inputDisplay = document.getElementById("input-display");
const messageEl = document.getElementById("message");
const scoreEl = document.getElementById("score");
const keyboardEl = document.getElementById("keyboard");

function initGrid() {
  grid.innerHTML = "";
  for (let r = 0; r < 5; r++) {
    const row = document.createElement("div");
    row.className = "row";
    for (let c = 0; c < 5; c++) {
      const tile = document.createElement("div");
      tile.className = "tile";
      tile.id = `t${r}${c}`;
      row.appendChild(tile);
    }
    grid.appendChild(row);
  }
}

function buildKeyboard() {
  keyboardEl.innerHTML = "";
  const rows = [
    ["Α","Β","Γ","Δ","Ε","Ζ","Η","Θ","Ι"],
    ["Κ","Λ","Μ","Ν","Ξ","Ο","Π","Ρ","Σ"],
    ["Τ","Υ","Φ","Χ","Ψ","Ω","⌫","OK"]
  ];
  rows.forEach((letters, i) => {
    const row = document.createElement("div");
    row.className = "kb-row";
    letters.forEach(l => {
      const key = document.createElement("button");
      key.className = "key" + (l.length > 1 ? " wide" : "");
      key.textContent = l;
      key.onclick = () => handleKey(l);
      row.appendChild(key);
    });
    keyboardEl.appendChild(row);
  });
}

function newGame() {
  secret = uniqueWords[Math.floor(Math.random() * uniqueWords.length)];
  currentRow = 0;
  currentGuess = "";
  gameOver = false;
  boosters = { correct: 3, present: 2, remove: 2, hint: 2 };
  updateBoosterCounts();
  initGrid();
  buildKeyboard();
  inputDisplay.textContent = "";
  messageEl.textContent = `Το πρώτο γράμμα είναι: ${secret[0]}`;
  // Δείχνουμε το πρώτο γράμμα στην πρώτη σειρά
  document.getElementById("t00").textContent = secret[0];
  document.getElementById("t00").classList.add("green");
  scoreEl.textContent = score;
}

function updateBoosterCounts() {
  document.getElementById("b1").textContent = "x" + boosters.correct;
  document.getElementById("b2").textContent = "x" + boosters.present;
  document.getElementById("b3").textContent = "x" + boosters.remove;
  document.getElementById("b4").textContent = "x" + boosters.hint;
}

function handleKey(key) {
  if (gameOver) return;
  if (key === "⌫") {
    if (currentGuess.length > 0) currentGuess = currentGuess.slice(0, -1);
  } else if (key === "OK" || key === "Enter") {
    submitGuess();
    return;
  } else if (currentGuess.length < 5 && GREEK_LETTERS.includes(key)) {
    if (currentGuess.length === 0 && key !== secret[0]) {
      messageEl.textContent = `Η λέξη πρέπει να ξεκινάει από ${secret[0]}!`;
      return;
    }
    currentGuess += key;
  }
  inputDisplay.textContent = currentGuess;
  updateCurrentRowPreview();
}

function updateCurrentRowPreview() {
  for (let i = 0; i < 5; i++) {
    const tile = document.getElementById(`t${currentRow}${i}`);
    if (i === 0 && currentRow === 0) continue; // πρώτο γράμμα ήδη πράσινο
    tile.textContent = currentGuess[i] || "";
  }
}

function submitGuess() {
  if (currentGuess.length !== 5) {
    messageEl.textContent = "Η λέξη πρέπει να έχει 5 γράμματα!";
    return;
  }
  if (!currentGuess.startsWith(secret[0])) {
    messageEl.textContent = `Πρέπει να ξεκινάει από ${secret[0]}!`;
    return;
  }
  // Απλός έλεγχος αν είναι στη λίστα (προαιρετικό)
  const normalized = currentGuess.normalize('NFD').replace(/[\u0300-\u036f]/g, '').toUpperCase();
  if (!uniqueWords.includes(normalized) && normalized !== secret) {
    messageEl.textContent = "Η λέξη δεν βρέθηκε στο λεξικό!";
    return;
  }

  const result = evaluateGuess(currentGuess);
  for (let i = 0; i < 5; i++) {
    const tile = document.getElementById(`t${currentRow}${i}`);
    tile.textContent = currentGuess[i];
    tile.classList.remove("current");
    tile.classList.add(result[i]);
  }

  if (currentGuess === secret) {
    gameOver = true;
    const points = [100, 80, 60, 40, 20][currentRow] || 10;
    score += points;
    scoreEl.textContent = score;
    messageEl.textContent = `🎉 Lingo! Κέρδισες ${points} πόντους!`;
    return;
  }

  currentRow++;
  currentGuess = "";
  inputDisplay.textContent = "";
  if (currentRow >= 5) {
    gameOver = true;
    messageEl.textContent = `Τέλος! Η λέξη ήταν: ${secret}`;
  } else {
    messageEl.textContent = `Προσπάθεια ${currentRow + 1}/5`;
  }
}

function evaluateGuess(guess) {
  const result = Array(5).fill("absent");
  const secretArr = secret.split("");
  const guessArr = guess.split("");

  // Πρώτα σωστές θέσεις
  for (let i = 0; i < 5; i++) {
    if (guessArr[i] === secretArr[i]) {
      result[i] = "green";
      secretArr[i] = null;
      guessArr[i] = null;
    }
  }
  // Μετά παρόντα
  for (let i = 0; i < 5; i++) {
    if (guessArr[i] && secretArr.includes(guessArr[i])) {
      result[i] = "orange";
      secretArr[secretArr.indexOf(guessArr[i])] = null;
    }
  }
  return result;
}

function useBooster(type) {
  if (gameOver || boosters[type] <= 0) return;
  boosters[type]--;
  updateBoosterCounts();

  if (type === "correct" || type === "hint") {
    // Αποκάλυψε ένα άγνωστο σωστό γράμμα
    for (let i = 1; i < 5; i++) {
      const tile = document.getElementById(`t${currentRow}${i}`);
      if (!tile.textContent || tile.textContent === "") {
        tile.textContent = secret[i];
        tile.classList.add("green");
        messageEl.textContent = "Αποκαλύφθηκε ένα σωστό γράμμα!";
        return;
      }
    }
  } else if (type === "present") {
    messageEl.textContent = "Βοηθητικό: Δοκίμασε γράμματα που υπάρχουν στη λέξη!";
  } else if (type === "remove") {
    // Απενεργοποίησε μερικά λάθος πλήκτρα
    const wrong = GREEK_LETTERS.filter(l => !secret.includes(l)).slice(0, 6);
    document.querySelectorAll(".key").forEach(k => {
      if (wrong.includes(k.textContent)) k.classList.add("absent");
    });
    messageEl.textContent = "Αφαιρέθηκαν μερικά λάθος γράμματα!";
  }
}

// Πληκτρολόγιο υπολογιστή
document.addEventListener("keydown", (e) => {
  if (e.key === "Backspace") handleKey("⌫");
  else if (e.key === "Enter") handleKey("OK");
  else {
    const upper = e.key.toUpperCase();
    // Απλή υποστήριξη ελληνικών μέσω mapping αν χρειαστεί, αλλά για τώρα αγγλικά->ελληνικά απλό
    const map = {
      "A":"Α","B":"Β","G":"Γ","D":"Δ","E":"Ε","Z":"Ζ","H":"Η","U":"Θ","I":"Ι",
      "K":"Κ","L":"Λ","M":"Μ","N":"Ν","J":"Ξ","O":"Ο","P":"Π","R":"Ρ","S":"Σ",
      "T":"Τ","Y":"Υ","F":"Φ","X":"Χ","C":"Ψ","V":"Ω"
    };
    if (map[upper]) handleKey(map[upper]);
    else if (GREEK_LETTERS.includes(upper)) handleKey(upper);
  }
});

// Εκκίνηση
newGame();
</script>
</body>
</html>
