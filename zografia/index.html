<!DOCTYPE html>
<html lang="el">
<head>
  <meta charset="UTF-8">

  <style>

    html,body{height:100%;height:100dvh;overflow:hidden;touch-action:none;overscroll-behavior:none}
    body{font-family:'Segoe UI',system-ui,sans-serif;background:var(--bg);color:var(--text);user-select:none}
    .screen{display:none;height:100%;height:100dvh;flex-direction:column;overflow:hidden}
    .screen.active{display:flex}
    #start-screen{background:linear-gradient(135deg,#667eea,#764ba2);justify-content:center;align-items:center;text-align:center;color:#fff;padding:20px}
    .start-content h1{font-size:clamp(2.1rem,7vw,3.2rem);margin-bottom:.4rem;text-shadow:0 4px 12px rgba(0,0,0,.25)}
    .subtitle{font-size:1.15rem;opacity:.9;margin-bottom:1.6rem}
    .info-box{margin-top:1.6rem;background:rgba(255,255,255,.15);padding:10px 20px;border-radius:50px;font-size:.9rem}
    .big-btn{background:#fff;color:#5a4fcf;border:none;padding:15px 36px;font-size:1.2rem;font-weight:700;border-radius:50px;cursor:pointer;box-shadow:0 6px 20px rgba(0,0,0,.2)}
    .big-btn:active{transform:scale(.96)}
    .big-btn.primary{background:var(--primary);color:#fff;width:100%;max-width:300px}
    .big-btn.secondary{background:#ecf0f1;color:var(--text);margin-top:10px;width:100%;max-width:300px}
    .big-btn.danger{background:#e74c3c;color:#fff;margin-top:10px;width:100%;max-width:300px}
    .icon-btn{background:rgba(255,255,255,.92);border:none;width:42px;height:42px;border-radius:50%;font-size:1.25rem;cursor:pointer;display:flex;align-items:center;justify-content:center;box-shadow:0 2px 8px rgba(0,0,0,.1);flex-shrink:0}
    #game-screen{justify-content:space-evenly}
    .game-header{display:flex;justify-content:space-between;align-items:center;padding:8px 14px;background:#fff;box-shadow:0 2px 10px rgba(0,0,0,.06);flex-shrink:0;min-height:54px}

    #prompt-text{font-size:clamp(1rem,3.6vw,1.3rem);font-weight:600;text-align:center}
    #prompt-text strong{color:var(--primary);font-size:1.2em}
    #prompt-emoji{font-size:1.6rem;margin-left:4px}
    .canvas-container{flex:1 1 auto;display:flex;justify-content:center;align-items:center;padding:6px 10px;min-height:0;width:100%}
    #draw-canvas{background:#fff;border-radius:var(--radius);box-shadow:var(--shadow);touch-action:none;border:3px solid #dfe6e9;width:100%;height:100%;display:block}
    .toolbar{background:#fff;padding:8px 14px;display:flex;justify-content:space-between;align-items:center;gap:10px;box-shadow:0 -2px 10px rgba(0,0,0,.05);flex-shrink:0;min-height:60px}

    .overlay{position:fixed;inset:0;background:rgba(0,0,0,.55);display:none;justify-content:center;align-items:center;z-index:100;padding:18px}

/* ===== LOCAL STORAGE ===== */

function saveProgress(data){try{localStorage.setItem(SAVE_KEY,JSON.stringify(data))}catch(e){}}

/* ===== CANVAS ===== */
class DrawingCanvas{
  constructor(id){
    this.canvas=document.getElementById(id);this.ctx=this.canvas.getContext('2d');
    this.drawing=false;this.color='#000';this.size=8;this.eraser=false;this.dpr=1;
    this.resize();this.bind();window.addEventListener('resize',()=>this.resize());
  }
  resize(){
    const p=this.canvas.parentElement,w=Math.max(p.clientWidth-14,80),h=Math.max(p.clientHeight-14,80);
    const t=document.createElement('canvas');t.width=this.canvas.width;t.height=this.canvas.height;
    if(this.canvas.width>0)t.getContext('2d').drawImage(this.canvas,0,0);
    this.dpr=window.devicePixelRatio||1;
    this.canvas.width=Math.floor(w*this.dpr);this.canvas.height=Math.floor(h*this.dpr);
    this.canvas.style.width=w+'px';this.canvas.style.height=h+'px';
    this.ctx.setTransform(this.dpr,0,0,this.dpr,0,0);
    this.ctx.fillStyle='#fff';this.ctx.fillRect(0,0,w,h);
    if(t.width>0)this.ctx.drawImage(t,0,0,w,h);
    this.ctx.lineCap='round';this.ctx.lineJoin='round';
  }
  bind(){
    const st=e=>{this.drawing=true;const p=this.pos(e);this.ctx.beginPath();this.ctx.moveTo(p.x,p.y);this.ctx.globalCompositeOperation=this.eraser?'destination-out':'source-over'};
    const mv=e=>{if(!this.drawing)return;const p=this.pos(e);this.ctx.lineWidth=this.size;this.ctx.strokeStyle=this.eraser?'rgba(0,0,0,1)':this.color;this.ctx.lineTo(p.x,p.y);this.ctx.stroke();this.ctx.beginPath();this.ctx.moveTo(p.x,p.y)};
    const sp=()=>{this.drawing=false;this.ctx.beginPath();this.ctx.globalCompositeOperation='source-over'};
    this.canvas.onmousedown=e=>st(e);this.canvas.onmousemove=e=>mv(e);this.canvas.onmouseup=sp;this.canvas.onmouseout=sp;
    this.canvas.ontouchstart=e=>{e.preventDefault();st(e.touches[0])};this.canvas.ontouchmove=e=>{e.preventDefault();mv(e.touches[0])};this.canvas.ontouchend=e=>{e.preventDefault();sp()};
  }
  pos(e){const r=this.canvas.getBoundingClientRect();return{x:e.clientX-r.left,y:e.clientY-r.top}}
  clear(){const w=this.canvas.clientWidth,h=this.canvas.clientHeight;this.ctx.globalCompositeOperation='source-over';this.ctx.fillStyle='#fff';this.ctx.fillRect(0,0,w,h)}
  setColor(c){this.color=c;this.eraser=false;this.ctx.globalCompositeOperation='source-over'}
  setEraser(v){this.eraser=v;this.ctx.globalCompositeOperation=v?'destination-out':'source-over'}
  setSize(s){this.size=s}
  getCanvas(){return this.canvas}
}

/* ===== RECOGNIZER ===== */
class Recognizer{
  getInk(canvas){
    const w=canvas.clientWidth,h=canvas.clientHeight;
    const t=document.createElement('canvas');t.width=w;t.height=h;
    const c=t.getContext('2d');c.fillStyle='#fff';c.fillRect(0,0,w,h);c.drawImage(canvas,0,0,w,h);
    const d=c.getImageData(0,0,w,h).data;
    let minX=w,minY=h,maxX=0,maxY=0,ink=0;
    const bin=new Uint8Array(w*h);
    for(let y=0;y<h;y++)for(let x=0;x<w;x++){
      const i=(y*w+x)*4;if((d[i]+d[i+1]+d[i+2])/3<200){bin[y*w+x]=1;ink++;if(x<minX)minX=x;if(x>maxX)maxX=x;if(y<minY)minY=y;if(y>maxY)maxY=y}
    }
    if(ink<25)return null;
    return{bin,w,h,minX,minY,maxX,maxY,bw:maxX-minX+1,bh:maxY-minY+1,ink,aspect:(maxX-minX+1)/(maxY-minY+1)};
  }
  circ(data){
    const{bin,w,minX,minY,maxX,maxY,bw,bh,ink}=data;
    const cx=minX+bw/2,cy=minY+bh/2,r=Math.sqrt(ink/Math.PI);
    let border=0;
    for(let y=minY;y<=maxY;y++)for(let x=minX;x<=maxX;x++)if(bin[y*w+x]){
      const dist=Math.hypot(x-cx,y-cy);if(Math.abs(dist-r)<r*.28)border++;
    }
    return Math.min(1,border/(2*Math.PI*r+1)*.9);
  }
  fill(data){return data.ink/(data.bw*data.bh+1)}
  corners(data){
    const{bin,w,minX,minY,maxX,maxY,bw,bh}=data;
    let c=0,st=Math.max(2,Math.floor(Math.min(bw,bh)/11));
    for(let y=minY;y<=maxY;y+=st)for(let x=minX;x<=maxX;x+=st){
      if(!bin[y*w+x])continue;let n=0;
      for(let dy=-st;dy<=st;dy+=st)for(let dx=-st;dx<=st;dx+=st)if((dx||dy)&&bin[(y+dy)*w+(x+dx)])n++;
      if(n<=2)c++;
    }
    return c;
  }
  predict(canvas,id,isStrict){
    const data=this.getInk(canvas);
    if(!data)return{success:false,confidence:.12,reason:'Άδειος καμβάς'};
    const a=data.aspect,f=this.fill(data),ci=this.circ(data),co=this.corners(data);
    let score=0;

    if(isStrict){
      switch(id){
        case'circle':score=ci*.72+(a>.72&&a<1.38?.28:0);if(f<.14)score*=.55;break;
        case'square':score=(a>.78&&a<1.28?.48:0)+(f>.22&&f<.82?.32:0)+(co>3?.2:0);break;
        case'triangle':score=(a>.55&&a<1.9?.28:0)+(co>=3&&co<=14?.42:0)+(f>.14&&f<.68?.3:0);break;
        case'star':score=(co>7?.48:co>4?.28:.1)+(f>.1&&f<.52?.28:0)+(ci<.6?.24:0);break;
        case'heart':score=(a>.68&&a<1.42?.32:0)+(f>.22&&f<.72?.34:0)+(ci>.3&&ci<.78?.34:0);break;
        case'line':score=(a>3.2||a<.31?.72:0)+(f>.07&&f<.42?.28:0);break;
        case'1':score=(a<.58?.58:0)+(f>.07&&f<.52?.28:0)+(co<9?.14:0);break;
        case'2':case'3':case'5':score=(a>.42&&a<1.35?.36:0)+(f>.16&&f<.62?.34:0)+(co>2?.3:.12);break;
        case'4':score=(a>.48&&a<1.45?.32:0)+(co>=3?.4:.12)+(f>.13&&f<.58?.28:0);break;
        case'6':case'9':score=ci*.42+(a>.48&&a<1.42?.3:0)+(f>.18&&f<.68?.28:0);break;
        case'7':score=(a>.55&&a<1.9?.38:0)+(f>.09&&f<.48?.34:0)+(co<11?.28:.1);break;
        case'8':score=ci*.38+(a>.48&&a<1.42?.3:0)+(f>.22&&f<.72?.32:0);break;
        case'A':case'H':case'K':case'M':score=(a>.52&&a<1.55?.32:0)+(co>=3?.4:.12)+(f>.13&&f<.62?.28:0);break;
        case'B':case'E':case'D':score=(a>.42&&a<1.35?.36:0)+(f>.18&&f<.68?.34:0)+(co>=2?.3:.1);break;
        case'G':case'Z':score=(a>.48&&a<1.7?.36:0)+(f>.14&&f<.58?.34:0)+(co>=2?.3:.1);break;
        default:score=(data.ink>60?.35:.12)+(a>.35&&a<3?.3:.1)+(f>.08?.25:.1);
      }
      const ok=score>=.57;
      return{success:ok,confidence:Math.min(.96,Math.max(.1,score)),reason:`Σκορ ${(score*100)|0}%`};
    }else{
      // Ανεκτικό για αντικείμενα / ζώα / αθλήματα
      score=(data.ink>55?.42:.15)+(a>.25&&a<4?.3:.1)+(f>.06?.28:.1);
      const ok=score>=.42;
      return{success:ok,confidence:Math.min(.9,Math.max(.15,score)),reason:'Γενικός έλεγχος'};
    }
  }
}

/* ===== GAME ===== */
class Game{
  constructor(){
    this.score=0;this.catIdx=0;this.lvlIdx=0;
    this.canvas=null;this.rec=new Recognizer();this.busy=false;
    this.dom();this.events();this.init();
  }
  dom(){
    this.$start=document.getElementById('start-screen');
    this.$game=document.getElementById('game-screen');
    this.$overlay=document.getElementById('result-overlay');
    this.$menu=document.getElementById('menu-panel');
    this.$score=document.getElementById('score');
    this.$cat=document.getElementById('category-badge');
    this.$lvl=document.getElementById('level-number');
    this.$prompt=document.getElementById('prompt-text');
    this.$pEmoji=document.getElementById('prompt-emoji');
    this.$resEmoji=document.getElementById('result-emoji');
    this.$title=document.getElementById('result-title');
    this.$msg=document.getElementById('result-message');
    this.$conf=document.getElementById('result-confidence');
    this.$next=document.getElementById('next-btn');
    this.$retry=document.getElementById('retry-btn');
  }
  events(){
    document.getElementById('start-btn').onclick=()=>this.continueOrStart();
    document.getElementById('restart-start-btn').onclick=()=>this.fullRestart();
    document.getElementById('check-btn').onclick=()=>this.check();
    document.getElementById('clear-btn').onclick=()=>this.canvas.clear();
    document.getElementById('eraser-btn').onclick=e=>this.toggleEraser(e);
    document.getElementById('brush-size-btn').onclick=()=>this.cycleSize();
    document.getElementById('speak-btn').onclick=()=>this.speak();
    document.getElementById('menu-btn').onclick=()=>this.$menu.classList.add('active');
    document.getElementById('menu-continue').onclick=()=>this.$menu.classList.remove('active');
    document.getElementById('menu-restart').onclick=()=>{this.$menu.classList.remove('active');this.fullRestart()};
    this.$next.onclick=()=>this.next();
    this.$retry.onclick=()=>{this.$overlay.classList.remove('active');this.canvas.clear()};
    document.querySelectorAll('.color-btn').forEach(b=>{
      b.onclick=e=>{
        document.querySelectorAll('.color-btn').forEach(x=>x.classList.remove('active'));
        e.target.classList.add('active');this.canvas.setColor(e.target.dataset.color);
        document.getElementById('eraser-btn').classList.remove('active');
      };
    });
  }
  init(){this.canvas=new DrawingCanvas('draw-canvas')}
  continueOrStart(){
    const p=loadProgress();
    if(p){this.score=p.score||0;this.catIdx=p.catIdx||0;this.lvlIdx=p.lvlIdx||0}
    else{this.score=0;this.catIdx=0;this.lvlIdx=0}
    this.updateScore();this.load();this.show('game');
    setTimeout(()=>this.canvas.resize(),50);
  }
  fullRestart(){
    clearProgress();
    this.score=0;this.catIdx=0;this.lvlIdx=0;
    this.updateScore();this.load();this.show('game');
    setTimeout(()=>this.canvas.resize(),50);
  }
  show(n){
    this.$start.classList.remove('active');this.$game.classList.remove('active');this.$overlay.classList.remove('active');
    if(n==='start')this.$start.classList.add('active');
    if(n==='game')this.$game.classList.add('active');
  }
  cat(){return LEVELS[CATEGORY_ORDER[this.catIdx]]}
  item(){return this.cat().items[this.lvlIdx]}
  load(){
    const c=this.cat(),it=this.item();
    this.$cat.textContent=`${c.emoji} ${c.name}`;
    this.$lvl.textContent=`Επίπεδο ${this.lvlIdx+1} / ${c.items.length}`;
    this.$prompt.innerHTML=it.prompt;
    this.$pEmoji.textContent=it.emoji||'';
    this.canvas.clear();this.canvas.setColor('#000');
    document.querySelectorAll('.color-btn').forEach(b=>b.classList.remove('active'));
    document.querySelector('.color-btn[data-color="#000000"]').classList.add('active');
    document.getElementById('eraser-btn').classList.remove('active');
    this.persist();
  }
  persist(){saveProgress({score:this.score,catIdx:this.catIdx,lvlIdx:this.lvlIdx})}
  check(){
    if(this.busy)return;this.busy=true;
    const btn=document.getElementById('check-btn');btn.textContent='ΕΛΕΓΧΟΣ...';btn.disabled=true;
    const it=this.item(),isStrict=!!this.cat().strict;
    const res=this.rec.predict(this.canvas.getCanvas(),it.id,isStrict);
    this.showResult(res);
    this.busy=false;btn.textContent='ΕΛΕΓΧΟΣ ✓';btn.disabled=false;
  }
  showResult(res){
    this.$overlay.classList.add('active');
    if(res.success){
      this.$resEmoji.textContent='🎉';this.$title.textContent='Μπράβο!';
      this.$msg.textContent=randMsg('success');
      this.$conf.textContent=`Βεβαιότητα: ${(res.confidence*100)|0}%`;
      this.$conf.style.color='var(--success)';
      this.$next.style.display='inline-block';this.$retry.style.display='none';
      this.score+=Math.round(res.confidence*100);this.updateScore();this.persist();
      this.confetti();this.sound();
    }else{
      this.$resEmoji.textContent='💪';this.$title.textContent='Σχεδόν!';
      this.$msg.textContent=randMsg('tryAgain');
      this.$conf.textContent=`Βεβαιότητα: ${(res.confidence*100)|0}%`;
      this.$conf.style.color='var(--warning)';
      this.$next.style.display='none';this.$retry.style.display='inline-block';
    }
  }
  next(){
    this.$overlay.classList.remove('active');
    this.lvlIdx++;
    if(this.lvlIdx>=this.cat().items.length){
      this.catIdx++;this.lvlIdx=0;
      if(this.catIdx>=CATEGORY_ORDER.length){this.finish();return}
    }
    this.load();
  }
  finish(){
    this.$resEmoji.textContent='🏆';this.$title.textContent='Συγχαρητήρια!';
    this.$msg.textContent=`Ολοκλήρωσες όλα! Πόντοι: ${this.score}`;
    this.$conf.textContent='';this.$next.textContent='ΠΑΙΞΕ ΞΑΝΑ';
    this.$next.style.display='inline-block';this.$retry.style.display='none';
    this.$next.onclick=()=>{this.$next.onclick=null;this.$next.textContent='ΕΠΟΜΕΝΟ →';this.fullRestart()};
  }
  updateScore(){this.$score.textContent=this.score}
  toggleEraser(e){
    const b=e.currentTarget,on=!b.classList.contains('active');
    b.classList.toggle('active',on);this.canvas.setEraser(on);
    if(on)document.querySelectorAll('.color-btn').forEach(x=>x.classList.remove('active'));
  }
  cycleSize(){
    const s=[4,8,14,22],n=s[(s.indexOf(this.canvas.size)+1)%s.length];
    this.canvas.setSize(n);
    const b=document.getElementById('brush-size-btn');
    b.style.transform=`scale(${.9+n/30})`;setTimeout(()=>b.style.transform='',180);
  }
  speak(){
    if(!('speechSynthesis'in window))return;
    const t=this.item().prompt.replace(/<[^>]*>/g,'');
    const u=new SpeechSynthesisUtterance(t);u.lang='el-GR';u.rate=.9;speechSynthesis.speak(u);
  }
  confetti(){
    const c=document.getElementById('confetti-canvas'),ctx=c.getContext('2d');
    c.width=innerWidth;c.height=innerHeight;
    const ps=[],cols=['#e74c3c','#3498db','#2ecc71','#f1c40f','#9b59b6','#e67e22'];
    for(let i=0;i<100;i++)ps.push({x:Math.random()*c.width,y:Math.random()*c.height-c.height,r:Math.random()*6+2,color:cols[Math.random()*6|0],sp:Math.random()*3+2,a:Math.random()*6.3,spin:Math.random()*.2-.1});
    let f=0;(function anim(){ctx.clearRect(0,0,c.width,c.height);ps.forEach(p=>{p.y+=p.sp;p.x+=Math.sin(p.a)*1.4;p.a+=p.spin;ctx.beginPath();ctx.arc(p.x,p.y,p.r,0,6.3);ctx.fillStyle=p.color;ctx.fill()});if(++f<85)requestAnimationFrame(anim);else ctx.clearRect(0,0,c.width,c.height)})();
  }
  sound(){
    const ctx=initAudio();if(!ctx)return;
    try{const o=ctx.createOscillator(),g=ctx.createGain();o.connect(g);g.connect(ctx.destination);o.frequency.value=880;o.type='sine';g.gain.setValueAtTime(.28,ctx.currentTime);g.gain.exponentialRampToValueAtTime(.01,ctx.currentTime+.38);o.start();o.stop(ctx.currentTime+.38)}catch(e){}
  }
}
document.addEventListener('DOMContentLoaded',()=>window.game=new Game());
</script>
