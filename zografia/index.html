<!DOCTYPE html>
<html lang="el">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Ζωγραφιά</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{--primary:#4a90e2;--success:#27ae60;--warning:#f39c12;--bg:#e8f4fd;--text:#2c3e50;--radius:16px;--shadow:0 8px 24px rgba(0,0,0,.12);box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html,body{height:100%;height:100dvh;overflow:hidden;touch-action:none;overscroll-behavior:none}
body{font-family:'Segoe UI',system-ui,sans-serif;background:var(--bg);color:var(--text);user-select:none}
.screen{display:none;height:100%;flex-direction:column;overflow:hidden}
.screen.active{display:flex}
#start-screen,#mode-screen{background:linear-gradient(135deg,#667eea,#764ba2);justify-content:center;align-items:center;text-align:center;color:#fff;padding:20px}
h1{font-size:clamp(2.1rem,7vw,3.2rem);margin-bottom:.5rem;text-shadow:0 4px 12px rgba(0,0,0,.25)}
.subtitle{font-size:1.15rem;opacity:.9;margin-bottom:2rem}
.screen{position:relative}
.floaters{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.floaters+div{position:relative;z-index:1}
.fl{position:absolute;bottom:-70px;opacity:.55;animation:flt linear infinite}
@keyframes flt{0%{transform:translateY(0) rotate(0)}50%{transform:translateY(-60vh) rotate(180deg) translateX(18px)}100%{transform:translateY(-120vh) rotate(360deg)}}
.big-btn{background:#fff;color:#5a4fcf;border:none;padding:16px 42px;font-size:1.25rem;font-weight:700;border-radius:50px;cursor:pointer;box-shadow:0 6px 20px rgba(0,0,0,.2)}
.big-btn:active{transform:scale(.96)}
.big-btn.primary{background:var(--primary);color:#fff;width:100%;max-width:280px}
.big-btn.secondary{background:#ecf0f1;color:var(--text);margin-top:10px;width:100%;max-width:280px}
.mode-list{display:flex;flex-direction:column;gap:12px;width:100%;max-width:340px;margin-bottom:18px}
.mode-btn{background:#fff;color:#4a3fb5;border:none;border-radius:20px;padding:14px 18px;font-size:1.15rem;font-weight:700;text-align:left;cursor:pointer;box-shadow:0 6px 18px rgba(0,0,0,.2)}
.mode-btn small{display:block;font-weight:400;font-size:.8rem;color:#7f8c8d;margin-top:2px}
.mode-btn:active{transform:scale(.97)}
.icon-btn{background:#f1f2f6;border:none;width:42px;height:42px;border-radius:50%;font-size:1.25rem;cursor:pointer;display:flex;align-items:center;justify-content:center;box-shadow:0 2px 8px rgba(0,0,0,.1);flex-shrink:0}
#game-screen{justify-content:space-evenly}
.game-header{display:flex;justify-content:space-between;align-items:center;padding:8px 14px;background:#fff;box-shadow:0 2px 10px rgba(0,0,0,.06);flex-shrink:0;min-height:52px}
.hl{display:flex;align-items:center;gap:8px}
.score-box{background:#fff8e1;padding:5px 12px;border-radius:50px;font-weight:700;font-size:1rem;display:flex;align-items:center;gap:5px;white-space:nowrap}
.level-info{text-align:center}
#category-badge{display:block;font-size:.72rem;color:var(--primary);font-weight:600;text-transform:uppercase}
#level-number{font-weight:700;font-size:.9rem}
.prompt-area{display:flex;align-items:center;justify-content:center;gap:10px;padding:10px 14px;background:linear-gradient(90deg,#e3f2fd,#f3e5f5);flex-shrink:0;min-height:56px}
#prompt-text{font-size:clamp(1rem,3.5vw,1.25rem);font-weight:600;text-align:center}
#prompt-text strong{color:var(--primary);font-size:1.15em}
#target-preview{width:40px;height:40px;flex-shrink:0;display:flex;align-items:center;justify-content:center}
#target-preview svg{width:36px;height:36px}
.canvas-container{flex:1 1 auto;display:flex;justify-content:center;align-items:center;padding:6px 10px;min-height:0;width:100%}
#draw-canvas{background:#fff;border-radius:var(--radius);box-shadow:var(--shadow);touch-action:none;border:3px solid #dfe6e9;display:block}
.toolbar{background:#fff;padding:8px 14px;display:flex;justify-content:space-between;align-items:center;gap:10px;box-shadow:0 -2px 10px rgba(0,0,0,.05);flex-shrink:0;min-height:58px}
.color-palette{display:flex;gap:7px;flex-wrap:wrap}
.color-btn{width:32px;height:32px;border-radius:50%;border:3px solid transparent;cursor:pointer}
.color-btn.active{border-color:#2c3e50;transform:scale(1.12)}
.tools{display:flex;gap:7px}
.tool-btn{width:40px;height:40px;border-radius:12px;border:none;background:#f1f2f6;font-size:1.2rem;cursor:pointer}
.tool-btn.active{background:#dfe6e9}
.action-bar{padding:10px 14px;display:flex;justify-content:center;background:#fff;flex-shrink:0;min-height:66px}
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.55);display:none;justify-content:center;align-items:center;z-index:100;padding:18px}
.overlay.active{display:flex}
.result-card{background:#fff;border-radius:22px;padding:26px 20px;text-align:center;max-width:340px;width:100%;box-shadow:0 18px 50px rgba(0,0,0,.25);animation:popIn .4s cubic-bezier(.18,.89,.32,1.28)}
@keyframes popIn{from{transform:scale(.7) rotate(-4deg);opacity:0}to{transform:scale(1);opacity:1}}
@keyframes wob{0%,100%{transform:rotate(0)}25%{transform:rotate(-12deg) scale(1.2)}75%{transform:rotate(12deg) scale(1.2)}}
.result-emoji{font-size:3.4rem;margin-bottom:4px;display:inline-block;animation:wob .8s ease 2}
.result-card h2{font-size:1.55rem;margin-bottom:4px}
.result-card p{color:#7f8c8d;margin-bottom:10px;font-size:.95rem}
.confidence{font-size:.9rem;color:var(--primary);font-weight:600;margin-bottom:14px}
#confetti-canvas{position:fixed;top:0;left:0;width:100%;height:100%;pointer-events:none;z-index:200}
</style>
</head>
<body>
<div id="start-screen" class="screen active">
  <div class="floaters"></div>
  <div>
    <h1>🎨 Ζωγραφιά</h1>
    <p class="subtitle">Σχεδίασε σωστά και κέρδισε αστεράκια!</p>
    <button id="start-btn" class="big-btn">Play</button>
  </div>
</div>

<div id="mode-screen" class="screen">
  <h1 style="font-size:2rem">Τι θέλεις να παίξεις;</h1>
  <p class="subtitle" style="margin-bottom:1.2rem">Διάλεξε</p>
  <div class="mode-list">
    <button class="mode-btn" data-mode="all">🏆 Play now<small>Αριθμοί, γράμματα, σχέδια • με πόντους</small></button>
    <button class="mode-btn" data-mode="trace">✏️ Ακολούθησε τη γραμμή<small>Πάτα πάνω στη γραμμή • με πόντους</small></button>
    <button class="mode-btn" data-mode="numbers">🔢 Μόνο Αριθμοί<small>Προπόνηση • χωρίς πόντους</small></button>
    <button class="mode-btn" data-mode="letters">🔤 Μόνο Γράμματα<small>Προπόνηση • χωρίς πόντους</small></button>
    <button class="mode-btn" data-mode="shapes">✏️ Μόνο Σχέδια<small>Προπόνηση • χωρίς πόντους</small></button>
  </div>
  <button id="back-btn" class="big-btn" style="padding:10px 28px;font-size:1rem">← Πίσω</button>
</div>

<div id="game-screen" class="screen">
  <header class="game-header">
    <div class="hl">
      <div class="score-box"><span id="score-icon">⭐</span><span id="score">0</span></div>
      <button id="restart-btn" class="icon-btn" title="Restart">↻</button>
    </div>
    <div class="level-info"><span id="category-badge"></span><span id="level-number"></span></div>
    <button id="menu-btn" class="icon-btn">☰</button>
  </header>
  <div class="prompt-area">
    <p id="prompt-text"></p>
    <div id="target-preview"></div>
    <button id="speak-btn" class="icon-btn">🔊</button>
  </div>
  <div class="canvas-container"><canvas id="draw-canvas"></canvas></div>
  <div class="toolbar">
    <div class="color-palette">
      <button class="color-btn active" data-color="#000000" style="background:#000"></button>
      <button class="color-btn" data-color="#e74c3c" style="background:#e74c3c"></button>
      <button class="color-btn" data-color="#3498db" style="background:#3498db"></button>
      <button class="color-btn" data-color="#2ecc71" style="background:#2ecc71"></button>
      <button class="color-btn" data-color="#f39c12" style="background:#f39c12"></button>
      <button class="color-btn" data-color="#9b59b6" style="background:#9b59b6"></button>
    </div>
    <div class="tools">
      <button id="brush-size-btn" class="tool-btn">✏️</button>
      <button id="eraser-btn" class="tool-btn">🩹</button>
      <button id="clear-btn" class="tool-btn">🗑️</button>
    </div>
  </div>
  <div class="action-bar"><button id="check-btn" class="big-btn primary">ΕΛΕΓΧΟΣ ✓</button></div>
</div>

<div id="result-overlay" class="overlay">
  <div class="result-card">
    <div id="result-emoji" class="result-emoji">🎉</div>
    <h2 id="result-title"></h2>
    <p id="result-message"></p>
    <div id="result-confidence" class="confidence"></div>
    <button id="next-btn" class="big-btn">ΕΠΟΜΕΝΟ →</button>
    <button id="retry-btn" class="big-btn secondary">ΔΟΚΙΜΑΣΕ ΞΑΝΑ</button>
  </div>
</div>
<canvas id="confetti-canvas"></canvas>

<script>
/* ===== AUDIO ===== */
let audioCtx=null;
function initAudio(){if(!audioCtx)try{audioCtx=new(window.AudioContext||window.webkitAudioContext)}catch(e){}if(audioCtx&&audioCtx.state==='suspended')audioCtx.resume();return audioCtx}
document.addEventListener('touchstart',()=>initAudio(),{once:true});
document.addEventListener('mousedown',()=>initAudio(),{once:true});
function tone(f,t0,d,type,v){const c=initAudio();if(!c)return;try{const o=c.createOscillator(),g=c.createGain(),t=c.currentTime+t0;o.type=type;o.frequency.value=f;o.connect(g);g.connect(c.destination);g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.001,t+d);o.start(t);o.stop(t+d)}catch(e){}}
const MEL=[[523,659,784,1047],[392,523,659,784,1047],[659,784,988,1319],[523,523,784,784,880,880,784],[784,988,1175,1568],[1047,880,1047,1319,1568]];
function winSound(){
  const m=MEL[Math.random()*MEL.length|0],ty=['sine','triangle','square'][Math.random()*3|0],st=.09+Math.random()*.04;
  m.forEach((f,i)=>tone(f,i*st,.3,ty,ty==='square'?.1:.22));
  const e=m.length*st;[523,659,784].forEach(f=>tone(f*2,e,.6,'sine',.12));
  if(Math.random()<.5)for(let i=0;i<5;i++)tone(1800+Math.random()*1800,e+i*.05,.12,'sine',.07);
}
function failSound(){tone(392,0,.25,'triangle',.18);tone(330,.18,.35,'triangle',.18)}
function say(t){try{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);u.lang='el-GR';u.rate=.95;speechSynthesis.speak(u)}catch(e){}}

/* ===== LEVELS ===== */
const P=(x,pre)=>x.map(([id,p])=>({id,prompt:`Ζωγράφισε ${p}`,preview:pre?id:null}));
const nums=(a,b)=>{const r=[];for(let n=a;n<=b;n++)r.push({id:''+n,text:''+n,prompt:`Ζωγράφισε τον αριθμό <strong>${n}</strong>`});return r};
const LET=[...'ΑΒΓΔΕΖΗΘΙΚΛΜΝΞΟΠΡΣΤΥΦΧΨΩ'].map(l=>({id:l,text:l,prompt:`Ζωγράφισε το γράμμα <strong>${l}</strong>`}));
const DIG=('ΜΕ ΑΝ ΠΙ ΤΑ ΜΑ ΤΟ ΝΑ ΣΕ ΠΟ ΚΑ ΛΟ ΡΕ ΔΟ ΒΑ ΚΕ ΣΟ ΜΟ ΤΙ').split(' ').map(l=>({id:l,text:l,prompt:`Ζωγράφισε τα γράμματα <strong>${l}</strong>`}));
const LEVELS={
  numbers1:{name:"Αριθμοί 0-9",strict:true,items:nums(0,9)},
  numbers2:{name:"Αριθμοί 10-20",strict:true,items:nums(10,20)},
  letters:{name:"Γράμματα",strict:true,items:LET},
  digraphs:{name:"Δύο Γράμματα",strict:true,items:DIG},
  shapes:{name:"Σχέδια",strict:true,items:P([
    ["star","ένα <strong>αστέρι</strong>"],["heart","μια <strong>καρδιά</strong>"],["circle","έναν <strong>κύκλο</strong>"],
    ["square","ένα <strong>τετράγωνο</strong>"],["triangle","ένα <strong>τρίγωνο</strong>"],["rectangle","ένα <strong>ορθογώνιο</strong>"],
    ["diamond","έναν <strong>ρόμβο</strong>"],["moon","ένα <strong>φεγγάρι</strong>"],["sun","έναν <strong>ήλιο</strong>"],
    ["house","ένα <strong>σπίτι</strong>"],["tree","ένα <strong>δέντρο</strong>"],["flower","ένα <strong>λουλούδι</strong>"],
    ["cloud","ένα <strong>σύννεφο</strong>"],["balloon","ένα <strong>μπαλόνι</strong>"],["smiley","ένα <strong>χαμογελαστό προσωπάκι</strong>"]],true)},
  more:{name:"Περισσότερα",strict:false,items:P([
    ["cat","μια <strong>γάτα</strong>"],["dog","έναν <strong>σκύλο</strong>"],["fish","ένα <strong>ψάρι</strong>"],["bird","ένα <strong>πουλί</strong>"],
    ["car","ένα <strong>αυτοκίνητο</strong>"],["boat","μια <strong>βάρκα</strong>"],["butterfly","μια <strong>πεταλούδα</strong>"],
    ["rabbit","ένα <strong>κουνέλι</strong>"],["elephant","έναν <strong>ελέφαντα</strong>"],["bike","ένα <strong>ποδήλατο</strong>"],
    ["plane","ένα <strong>αεροπλάνο</strong>"],["apple","ένα <strong>μήλο</strong>"]],false)}
};
Object.assign(LEVELS,{
 lower:{name:'Μικρά γράμματα',strict:true,items:[...'αβγδεζηθικλμνξοπρστυφχψω'].map(l=>({id:l,text:l,prompt:`Ζωγράφισε το μικρό γράμμα <strong>${l}</strong>`}))},
 shapes2:{name:'Περισσότερα σχήματα',strict:true,items:P([['pentagon','ένα <strong>πεντάγωνο</strong>'],['hexagon','ένα <strong>εξάγωνο</strong>'],['oval','ένα <strong>οβάλ</strong>'],['cross','έναν <strong>σταυρό</strong>'],['arrow','ένα <strong>βέλος</strong>'],['semicircle','ένα <strong>ημικύκλιο</strong>']],true)},
 objects:{name:'Αντικείμενα',strict:true,items:P([['rocket','έναν <strong>πύραυλο</strong>'],['icecream','ένα <strong>παγωτό</strong>'],['mushroom','ένα <strong>μανιτάρι</strong>'],['key','ένα <strong>κλειδί</strong>'],['umbrella','μια <strong>ομπρέλα</strong>'],['light','ένα <strong>φανάρι</strong>']],true)},
 lines:{name:'Γραμμές',strict:true,items:P([['zigzag','ένα <strong>ζιγκ-ζαγκ</strong>'],['wave','ένα <strong>κύμα</strong>'],['spiral','μια <strong>σπείρα</strong>'],['stairs','μια <strong>σκάλα</strong>']],true)},
 count:{name:'Μετρώ και ζωγραφίζω',strict:true,items:[[2,'circle','κύκλους'],[3,'star','αστέρια'],[2,'square','τετράγωνα'],[3,'triangle','τρίγωνα'],[2,'heart','καρδιές'],[4,'circle','κύκλους']].map(([n,s,w])=>({id:'n'+n+s,count:n,shape:s,preview:s,prompt:`Ζωγράφισε <strong>${n} ${w}</strong>`}))},
 complete:{name:'Συμπλήρωσε',strict:true,items:[['heart','την καρδιά'],['house','το σπίτι'],['tree','το δέντρο'],['smiley','το προσωπάκι'],['balloon','το μπαλόνι'],['star','το αστέρι']].map(([id,w])=>({id,ghost:true,preview:id,prompt:`Συμπλήρωσε <strong>${w}</strong>`}))}
});
const TR=[],PI2=6.2832,M=Math;
const R=(f,a,b,n)=>{const o=[];for(let i=0;i<=n;i++)o.push(f(a+(b-a)*i/n));return o};
const tp=(name,...pl)=>TR.push({id:'t'+TR.length,name,trace:pl});
const cir=(cx,cy,rx,ry,rot=0,n=48)=>R(t=>{const x=rx*M.cos(t),y=ry*M.sin(t);return[cx+x*M.cos(rot)-y*M.sin(rot),cy+x*M.sin(rot)+y*M.cos(rot)]},0,PI2,n);
const pg=(n,r,rot=-M.PI/2)=>R(i=>[50+r*M.cos(rot+i*PI2/n),50+r*M.sin(rot+i*PI2/n)],0,n,n);
const st=(n,r1,r2)=>R(i=>{const a=-M.PI/2+i*M.PI/n,r=i%2?r2:r1;return[50+r*M.cos(a),50+r*M.sin(a)]},0,2*n,2*n);
const wv=(a,f,cy=50)=>R(x=>[x,cy+a*M.sin((x-5)/90*PI2*f)],5,95,80);
const zz=(n,a,cy=50)=>R(i=>[6+88*i/(2*n),cy+(i%2?a:-a)],0,2*n,2*n);
const hr=s=>R(t=>[50+s*16*M.sin(t)**3,48-s*(13*M.cos(t)-5*M.cos(2*t)-2*M.cos(3*t)-M.cos(4*t))],0,PI2,80);
tp('Ευθεία',[[8,50],[92,50]]);tp('Κάθετη',[[50,8],[50,92]]);tp('Πλάγια',[[12,85],[88,15]]);
tp('Τόξο',R(t=>[50+40*M.cos(t),70-45*M.sin(t)],0,M.PI,30));tp('Κύκλος',cir(50,50,38,38));
[3,4,5,6,7,8].forEach(n=>tp('Πολύγωνο',pg(n,40,n==4?-M.PI/4:-M.PI/2)));
tp('Οβάλ',cir(50,50,42,26));tp('Όρθιο οβάλ',cir(50,50,26,42));
[10,20,30].forEach(a=>[1,1.5,2,3].forEach(f=>tp('Κύμα',wv(a,f))));
[3,4,5,6,8].forEach(n=>[14,30].forEach(a=>tp('Ζιγκ-ζαγκ',zz(n,a))));
[3,4,5,6,7,8].forEach(n=>{const p=[[8,90]];for(let i=0;i<n;i++)p.push([8+84*(i+1)/n,90-84*i/n],[8+84*(i+1)/n,90-84*(i+1)/n]);tp('Σκάλα',p)});
[1.5,2,2.5,3,3.5].forEach(T=>tp('Σπείρα',R(t=>{const r=3+36*t/(PI2*T);return[50+r*M.cos(t),50+r*M.sin(t)]},0,PI2*T,M.round(40*T))));
[5,6,7,8].forEach(n=>[.45,.6].forEach(q=>tp('Αστέρι',st(n,40,40*q))));
[2,3,4,5].forEach(k=>tp('Ροδάνθη',R(t=>{const r=40*M.cos(k*t);return[50+r*M.cos(t),50+r*M.sin(t)]},0,PI2,100)));
[[1,2],[2,3],[3,2],[3,4],[1,3]].forEach(([a,b])=>tp('Πλεκτή καμπύλη',R(t=>[50+40*M.sin(a*t+1),50+40*M.sin(b*t)],0,PI2,120)));
tp('Καρδιά',hr(2.3));tp('Δύο κύκλοι',cir(50,50,38,38),cir(50,50,22,22));tp('Τρεις κύκλοι',cir(50,50,38,38),cir(50,50,24,24),cir(50,50,10,10));
tp('Ουράνιο τόξο',...[38,28,18].map(r=>R(t=>[50+r*M.cos(t),75-r*M.sin(t)],0,M.PI,40)));
tp('Σταυρός',[[50,10],[50,90]],[[10,50],[90,50]]);tp('Σπίτι',[[15,85],[15,45],[50,12],[85,45],[85,85],[15,85]]);
tp('Βέλος',[[10,50],[85,50]],[[62,25],[88,50],[62,75]]);
[2,3,4,5].forEach(n=>{const p=[[6,70]];for(let i=0;i<n;i++){const s=6+88*i/n,w=88/n;p.push([s,70],[s,30],[s+w/2,30],[s+w/2,70],[s+w,70])}tp('Παλμοί',p)});
[3,4,5].forEach(n=>tp('Θηλιές',R(t=>[50+(t/(PI2*n)-.5)*66+14*M.sin(t),50-14*M.cos(t)],0,PI2*n,60*n)));
[3,4,5,6,7,8].forEach(n=>tp('Φωλιά',pg(n,40),pg(n,22)));
[6,9,12].forEach(a=>tp('Διπλό κύμα',wv(a,2,32),wv(a,2,68)));
[3,5].forEach(n=>tp('Διπλό ζιγκ-ζαγκ',zz(n,12,30),zz(n,12,70)));
[.5,1,-.5].forEach(r=>tp('Πλάγιο οβάλ',cir(50,50,44,20,r)));
tp('Διπλή καρδιά',hr(2.3),hr(1.1));tp('Αστέρι σε κύκλο',st(5,38,15),cir(50,50,38,38));
[5,6,7,9].forEach(k=>tp('Λουλούδι',R(t=>{const r=40*M.cos(k*t);return[50+r*M.cos(t),50+r*M.sin(t)]},0,PI2,140)));
tp('Ήλιος',cir(50,50,20,20),...[0,1,2,3,4,5,6,7].map(i=>{const a=i*.7854;return[[50+28*M.cos(a),50+28*M.sin(a)],[50+42*M.cos(a),50+42*M.sin(a)]]}));

/* ===== CANVAS ===== */
class DrawingCanvas{
  constructor(id){
    this.canvas=document.getElementById(id);this.ctx=this.canvas.getContext('2d');
    this.drawing=false;this.color='#000';this.size=8;this.eraser=false;
    this.resize();this.bind();window.addEventListener('resize',()=>this.resize());
  }
  resize(){
    const p=this.canvas.parentElement,w=Math.max(p.clientWidth-14,80),h=Math.max(p.clientHeight-14,80);
    if(this.canvas.style.width===w+'px'&&this.canvas.style.height===h+'px')return;
    const dpr=window.devicePixelRatio||1;
    this.canvas.width=Math.floor(w*dpr);this.canvas.height=Math.floor(h*dpr);
    this.canvas.style.width=w+'px';this.canvas.style.height=h+'px';
    this.ctx.setTransform(dpr,0,0,dpr,0,0);this.ctx.lineCap='round';this.ctx.lineJoin='round';
    this.clear();
  }
  bind(){
    const st=e=>{this.drawing=true;const p=this.pos(e);this.ctx.beginPath();this.ctx.moveTo(p.x,p.y)};
    const mv=e=>{if(!this.drawing)return;const p=this.pos(e);this.ctx.lineWidth=this.eraser?this.size*2.5:this.size;this.ctx.strokeStyle=this.eraser?'#fff':this.color;this.ctx.lineTo(p.x,p.y);this.ctx.stroke();this.ctx.beginPath();this.ctx.moveTo(p.x,p.y)};
    const sp=()=>{this.drawing=false;this.ctx.beginPath()};
    const c=this.canvas;
    c.onmousedown=st;c.onmousemove=mv;c.onmouseup=sp;c.onmouseout=sp;
    c.ontouchstart=e=>{e.preventDefault();st(e.touches[0])};c.ontouchmove=e=>{e.preventDefault();mv(e.touches[0])};c.ontouchend=e=>{e.preventDefault();sp()};
  }
  pos(e){const r=this.canvas.getBoundingClientRect();return{x:e.clientX-r.left,y:e.clientY-r.top}}
  clear(){
    const c=this.ctx;c.save();c.setTransform(1,0,0,1,0,0);c.globalCompositeOperation='source-over';
    c.fillStyle='#fff';c.fillRect(0,0,this.canvas.width,this.canvas.height);c.restore();c.beginPath();this.drawing=false;
    if(this.ghost&&IMGS[this.ghost]){const W=this.canvas.clientWidth,H=this.canvas.clientHeight,s=Math.min(W,H)*.75;c.save();c.beginPath();c.rect(0,0,W/2,H);c.clip();c.drawImage(IMGS[this.ghost],(W-s)/2,(H-s)/2,s,s);c.restore();c.beginPath()}
    if(this.trace){const W=this.canvas.clientWidth,H=this.canvas.clientHeight,s=Math.min(W,H)*.8,ox=(W-s)/2,oy=(H-s)/2;c.save();c.strokeStyle='#d3dbe3';c.lineWidth=Math.max(10,s*.05);c.lineCap='round';c.lineJoin='round';
      this.trace.forEach(pl=>{c.beginPath();pl.forEach(([x,y],i)=>i?c.lineTo(ox+x*s/100,oy+y*s/100):c.moveTo(ox+x*s/100,oy+y*s/100));c.stroke()});c.restore();c.beginPath()}
  }
  setColor(c){this.color=c;this.eraser=false}
  setEraser(v){this.eraser=v}
  setSize(s){this.size=s}
  getCanvas(){return this.canvas}
}

/* ===== RECOGNIZER (σύγκριση με πρότυπο) ===== */
const S=32;
class Recognizer{
  ink(src,w,h){
    const t=document.createElement('canvas');t.width=w;t.height=h;
    const c=t.getContext('2d');c.fillStyle='#fff';c.fillRect(0,0,w,h);c.drawImage(src,0,0,w,h);
    const d=c.getImageData(0,0,w,h).data;
    let minX=w,minY=h,maxX=0,maxY=0,ink=0;const bin=new Uint8Array(w*h);
    for(let y=0;y<h;y++)for(let x=0;x<w;x++){const i=(y*w+x)*4;if((d[i]+d[i+1]+d[i+2])/3<200){bin[y*w+x]=1;ink++;if(x<minX)minX=x;if(x>maxX)maxX=x;if(y<minY)minY=y;if(y>maxY)maxY=y}}
    if(ink<20)return null;
    return{bin,w,h,minX,minY,maxX,maxY,bw:maxX-minX+1,bh:maxY-minY+1,ink};
  }
  grid(d){
    const sc=(S-4)/Math.max(d.bw,d.bh),ox=(S-d.bw*sc)/2,oy=(S-d.bh*sc)/2,g=new Uint8Array(S*S);
    for(let y=d.minY;y<=d.maxY;y++)for(let x=d.minX;x<=d.maxX;x++)if(d.bin[y*d.w+x]){
      const gx=Math.min(S-1,ox+(x-d.minX)*sc|0),gy=Math.min(S-1,oy+(y-d.minY)*sc|0);g[gy*S+gx]=1}
    return g;
  }
  dil(g,r){
    const o=new Uint8Array(S*S);
    for(let y=0;y<S;y++)for(let x=0;x<S;x++)if(g[y*S+x])for(let dy=-r;dy<=r;dy++)for(let dx=-r;dx<=r;dx++){const a=x+dx,b=y+dy;if(a>=0&&b>=0&&a<S&&b<S)o[b*S+a]=1}
    return o;
  }
  cover(a,b){let n=0,k=0;for(let i=0;i<a.length;i++)if(a[i]){n++;if(b[i])k++}return n?k/n:0}
  tpl(it){
    this.cache=this.cache||{};if(this.cache[it.id])return this.cache[it.id];
    const c=document.createElement('canvas');c.width=240;c.height=160;const x=c.getContext('2d');
    x.fillStyle='#fff';x.fillRect(0,0,240,160);
    if(it.text){x.fillStyle='#000';x.font='bold 120px Arial,Helvetica,sans-serif';x.textAlign='center';x.textBaseline='middle';x.fillText(it.text,120,86)}
    else if(IMGS[it.id])x.drawImage(IMGS[it.id],40,0,160,160);
    else return null;
    const d=this.ink(c,240,160);if(!d)return null;
    return this.cache[it.id]=this.grid(d);
  }
  predict(canvas,it,strict){
    const d=this.ink(canvas,canvas.clientWidth,canvas.clientHeight);
    if(!d)return{success:false,confidence:.1};
    if(!strict){
      const big=d.bw>d.w*.25||d.bh>d.h*.25;
      const s=d.ink>350&&big?.62+Math.random()*.25:.2;
      return{success:s>=.5,confidence:s};
    }
    if(it.trace)return this.follow(d,it);
    if(it.count){const cs=this.comps(d),tt=this.tpl({id:it.shape});
      if(cs.length!==it.count)return{success:false,confidence:.2,note:`Μέτρησα ${cs.length} σχήματα, ζητάω ${it.count}. Κάθε σχήμα να είναι χωριστό!`};
      const r=cs.map(q=>this.cmp(this.grid(q),tt)),m=r.reduce((a,b)=>a+b.f,0)/r.length;
      return{success:r.every(q=>q.ok),confidence:Math.min(.97,Math.max(.1,m))};}
    const t=this.tpl(it);
    if(!t)return{success:d.ink>400,confidence:.5};
    const r=this.cmp(this.grid(d),t);
    return{success:r.ok,confidence:Math.min(.97,Math.max(.1,r.f))};
  }
  follow(d,it){
    const W=d.w,H=d.h,s=Math.min(W,H)*.8,ox=(W-s)/2,oy=(H-s)/2,tol=Math.min(W,H)*.07,pts=[],k=3,gw=Math.ceil(W/k),gh=Math.ceil(H/k),g=new Uint8Array(gw*gh),ink=[];
    it.trace.forEach(pl=>{for(let i=0;i<pl.length-1;i++){const a=pl[i],b=pl[i+1],n=Math.max(1,Math.ceil(Math.hypot(b[0]-a[0],b[1]-a[1])*s/100/6));for(let j=0;j<n;j++)pts.push([ox+(a[0]+(b[0]-a[0])*j/n)*s/100,oy+(a[1]+(b[1]-a[1])*j/n)*s/100])}const e=pl[pl.length-1];pts.push([ox+e[0]*s/100,oy+e[1]*s/100])});
    for(let y=0;y<H;y+=k)for(let x=0;x<W;x+=k)if(d.bin[y*W+x]){g[(y/k|0)*gw+(x/k|0)]=1;ink.push([x,y])}
    const r=Math.ceil(tol/k);let hit=0;
    pts.forEach(([px,py])=>{const cx=px/k|0,cy=py/k|0;let ok=0;for(let dy=-r;dy<=r&&!ok;dy++)for(let dx=-r;dx<=r;dx++){const a=cx+dx,b=cy+dy;if(a>=0&&b>=0&&a<gw&&b<gh&&g[b*gw+a]&&Math.hypot(dx*k,dy*k)<=tol){ok=1;break}}hit+=ok});
    let good=0;ink.forEach(([x,y])=>{for(let i=0;i<pts.length;i++)if(Math.hypot(pts[i][0]-x,pts[i][1]-y)<=tol*1.2){good++;break}});
    const cov=hit/pts.length,pre=ink.length?good/ink.length:0;
    return{success:cov>=.85&&pre>=.8,confidence:Math.min(.97,Math.max(.1,(cov+pre)/2)),note:cov<.85?'Δεν πέρασες όλη τη γραμμή. Συνέχισε πάνω της!':'Προσπάθησε να μείνεις πάνω στη γραμμή!'};
  }
  cmp(c,t){const rec=this.cover(t,this.dil(c,1)),pre=this.cover(c,this.dil(t,2)),f=rec+pre?2*rec*pre/(rec+pre):0;return{f,ok:rec>=.6&&pre>=.6&&f>=.65}}
  comps(d){
    const k=5,cw=Math.ceil(d.w/k),ch=Math.ceil(d.h/k),cell=new Uint8Array(cw*ch),lab=new Int16Array(cw*ch),cnt=[0];let n=0;
    for(let y=d.minY;y<=d.maxY;y++)for(let x=d.minX;x<=d.maxX;x++)if(d.bin[y*d.w+x])cell[(y/k|0)*cw+(x/k|0)]=1;
    for(let i=0;i<cell.length;i++)if(cell[i]&&!lab[i]){n++;cnt[n]=0;const st=[i];lab[i]=n;
      while(st.length){const j=st.pop(),jx=j%cw,jy=j/cw|0;cnt[n]++;
        for(let dy=-2;dy<=2;dy++)for(let dx=-2;dx<=2;dx++){const a=jx+dx,b=jy+dy;if(a<0||b<0||a>=cw||b>=ch)continue;const q=b*cw+a;if(cell[q]&&!lab[q]){lab[q]=n;st.push(q)}}}}
    const out={};
    for(let y=d.minY;y<=d.maxY;y++)for(let x=d.minX;x<=d.maxX;x++)if(d.bin[y*d.w+x]){const l=lab[(y/k|0)*cw+(x/k|0)];if(cnt[l]<5)continue;
      const o=out[l]||(out[l]={bin:new Uint8Array(d.w*d.h),w:d.w,h:d.h,minX:x,minY:y,maxX:x,maxY:y,ink:0});
      o.bin[y*d.w+x]=1;o.ink++;o.minX=Math.min(o.minX,x);o.maxX=Math.max(o.maxX,x);o.minY=Math.min(o.minY,y);o.maxY=Math.max(o.maxY,y)}
    return Object.values(out).map(o=>(o.bw=o.maxX-o.minX+1,o.bh=o.maxY-o.minY+1,o)).filter(o=>o.ink>=40);
  }
}

/* ===== GAME ===== */
class Game{
  constructor(){
    this.score=0;this.catIdx=0;this.lvlIdx=0;this.mode='all';this.cats=MODES.all.cats;this.practice=false;this.finished=false;
    this.rec=new Recognizer();this.fxId=0;
    const g=id=>document.getElementById(id);this.g=g;
    this.$overlay=g('result-overlay');this.$score=g('score');this.$icon=g('score-icon');
    this.$cat=g('category-badge');this.$lvl=g('level-number');this.$prompt=g('prompt-text');this.$preview=g('target-preview');
    this.$emoji=g('result-emoji');this.$title=g('result-title');this.$msg=g('result-message');this.$conf=g('result-confidence');
    this.$next=g('next-btn');this.$retry=g('retry-btn');
    this.canvas=new DrawingCanvas('draw-canvas');this.events();
  }
  events(){
    const g=this.g;
    g('start-btn').onclick=()=>this.show('mode');
    g('back-btn').onclick=()=>this.show('start');
    document.querySelectorAll('.mode-btn').forEach(b=>b.onclick=()=>this.startMode(b.dataset.mode));
    g('check-btn').onclick=()=>this.check();
    g('clear-btn').onclick=()=>this.canvas.clear();
    g('eraser-btn').onclick=e=>this.toggleEraser(e);
    g('brush-size-btn').onclick=()=>this.cycleSize();
    g('speak-btn').onclick=()=>this.speak();
    g('restart-btn').onclick=()=>{if(confirm('Θέλεις να ξεκινήσεις από την αρχή;'))this.restart()};
    g('menu-btn').onclick=()=>{if(confirm('Επιστροφή στο μενού;'))this.show('mode')};
    this.$next.onclick=()=>this.next();
    this.$retry.onclick=()=>{this.$overlay.classList.remove('active');this.canvas.clear()};
    document.querySelectorAll('.color-btn').forEach(b=>b.onclick=e=>{
      document.querySelectorAll('.color-btn').forEach(x=>x.classList.remove('active'));
      e.target.classList.add('active');this.canvas.setColor(e.target.dataset.color);g('eraser-btn').classList.remove('active');
    });
  }
  show(n){
    ['start','mode','game'].forEach(s=>this.g(s+'-screen').classList.toggle('active',s===n));
    this.$overlay.classList.remove('active');
  }
  startMode(m){
    this.mode=m;this.cats=MODES[m].cats;this.practice=!MODES[m].points;this.finished=false;
    this.score=0;this.catIdx=0;this.lvlIdx=0;
    {
      const p=load();
      if(p&&p.catIdx<this.cats.length&&LEVELS[this.cats[p.catIdx]].items[p.lvlIdx]){this.score=p.score||0;this.catIdx=p.catIdx;this.lvlIdx=p.lvlIdx}
    }
    this.show('game');this.g('eraser-btn').style.display=m==='trace'?'none':'';this.updateScore();
    setTimeout(()=>{this.canvas.resize();this.loadLevel()},50);
  }
  restart(){clearSave();this.finished=false;this.score=0;this.catIdx=0;this.lvlIdx=0;this.updateScore();this.loadLevel()}
  cat(){return LEVELS[this.cats[this.catIdx]]}
  item(){return this.cat().items[this.lvlIdx]}
  loadLevel(){
    const c=this.cat(),it=this.item();
    this.$cat.textContent=c.name;
    this.$lvl.textContent=`Επίπεδο ${this.lvlIdx+1} / ${c.items.length}`;
    this.$prompt.innerHTML=it.prompt;
    this.$preview.innerHTML=it.preview&&PREVIEWS[it.preview]?PREVIEWS[it.preview]:'';
    this.canvas.ghost=it.ghost?it.id:null;this.canvas.trace=it.trace||null;this.canvas.clear();this.canvas.setColor('#000');
    document.querySelectorAll('.color-btn').forEach(b=>b.classList.toggle('active',b.dataset.color==='#000000'));
    this.g('eraser-btn').classList.remove('active');
    this.persist();
  }
  persist(){save({score:this.score,catIdx:this.catIdx,lvlIdx:this.lvlIdx})}
  check(){
    const btn=this.g('check-btn');
    const res=this.rec.predict(this.canvas.getCanvas(),this.item(),!!this.cat().strict);
    this.showResult(res);
  }
  showResult(res){
    this.$overlay.classList.add('active');
    const pct=`Ομοιότητα: ${(res.confidence*100)|0}%`;
    this.$conf.textContent=pct;
    if(res.success){
      const m=randMsg('success');
      this.$emoji.textContent=WIN_EMOJI[Math.random()*WIN_EMOJI.length|0];this.$title.textContent='Μπράβο!';this.$msg.textContent=m;
      this.$conf.style.color='var(--success)';this.$next.style.display='inline-block';this.$retry.style.display='none';
      if(!this.practice){this.score+=Math.round(res.confidence*100);this.updateScore()}
      this.persist();this.fx();winSound();if(Math.random()<.6)say(m);
    }else{
      this.$emoji.textContent='💪';this.$title.textContent='Σχεδόν!';this.$msg.textContent=res.note||randMsg('tryAgain');
      this.$conf.style.color='var(--warning)';this.$next.style.display='none';this.$retry.style.display='inline-block';failSound();
    }
  }
  next(){
    this.$overlay.classList.remove('active');
    if(this.finished){this.finished=false;this.$next.textContent='ΕΠΟΜΕΝΟ →';clearSave();this.show('mode');return}
    this.lvlIdx++;
    if(this.lvlIdx>=this.cat().items.length){
      this.catIdx++;this.lvlIdx=0;
      if(this.catIdx>=this.cats.length){this.finish();return}
    }
    this.loadLevel();
  }
  finish(){
    this.finished=true;this.$overlay.classList.add('active');
    this.$emoji.textContent='🏆';this.$title.textContent='Συγχαρητήρια!';
    this.$msg.textContent=this.practice?'Τέλος προπόνησης! Είσαι σούπερ!':`Ολοκλήρωσες όλα! Πόντοι: ${this.score}`;
    this.$conf.textContent='';this.$next.textContent='ΜΕΝΟΥ';this.$next.style.display='inline-block';this.$retry.style.display='none';
    this.fx();this.fx();winSound();setTimeout(winSound,900);
  }
  updateScore(){this.$icon.textContent=this.practice?'🏋️':'⭐';this.$score.textContent=this.practice?'Προπόνηση':this.score}
  toggleEraser(e){
    const b=e.currentTarget,on=!b.classList.contains('active');
    b.classList.toggle('active',on);this.canvas.setEraser(on);
    if(on)document.querySelectorAll('.color-btn').forEach(x=>x.classList.remove('active'));
  }
  cycleSize(){
    const s=[4,8,14,22],n=s[(s.indexOf(this.canvas.size)+1)%s.length];this.canvas.setSize(n);
    const b=this.g('brush-size-btn');b.style.transform=`scale(${.9+n/30})`;setTimeout(()=>b.style.transform='',180);
  }
  speak(){if('speechSynthesis'in window)say(this.item().prompt.replace(/<[^>]*>/g,''))}
  /* εφέ επιβράβευσης: κομφετί + (πυροτεχνήματα | βροχή emoji | αστέρια) */
  fx(){
    cancelAnimationFrame(this.fxId);
    const c=this.g('confetti-canvas'),x=c.getContext('2d'),W=c.width=innerWidth,H=c.height=innerHeight,R=Math.random;
    const cols=['#e74c3c','#3498db','#2ecc71','#f1c40f','#9b59b6','#e67e22','#1abc9c'],ps=[];
    for(let i=0;i<90;i++)ps.push({t:R()<.3?'r':'c',x:R()*W,y:-R()*H,vx:0,vy:2+R()*3,r:3+R()*5,col:cols[R()*7|0],a:R()*6.3,sp:R()*.2-.1});
    const k=R()*3|0;
    if(k===0)for(let b=0;b<5;b++){const bx=W*(.15+R()*.7),by=H*(.15+R()*.4),col=cols[R()*7|0];for(let i=0;i<36;i++){const a=i/36*6.28,s=2+R()*3;ps.push({t:'f',x:bx,y:by,vx:Math.cos(a)*s,vy:Math.sin(a)*s,life:70+R()*20,col,r:3,d:b*12})}}
    else{const em=k===1?['🎈','🎉','🌈','🦄','🎊','🍭']:['⭐','🌟','✨','💫'];
      for(let i=0;i<22;i++)ps.push({t:'e',ch:em[R()*em.length|0],x:R()*W,y:k===1?H+30:-30-R()*H*.5,vx:R()*2-1,vy:k===1?-(2+R()*3):2+R()*3,r:24+R()*22})}
    let f=0;const anim=()=>{
      x.clearRect(0,0,W,H);
      ps.forEach(p=>{
        if(p.t==='f'){if(f<p.d)return;p.x+=p.vx;p.y+=p.vy;p.vy+=.06;p.vx*=.98;p.life--;if(p.life<=0)return;x.globalAlpha=Math.min(1,p.life/30);x.fillStyle=p.col;x.beginPath();x.arc(p.x,p.y,p.r,0,6.3);x.fill();x.globalAlpha=1;return}
        p.y+=p.vy;p.x+=p.t==='e'?p.vx:Math.sin(p.a)*1.3;p.a+=p.sp||0;
        if(p.t==='e'){x.font=p.r+'px serif';x.fillText(p.ch,p.x,p.y)}
        else{x.fillStyle=p.col;if(p.t==='r'){x.save();x.translate(p.x,p.y);x.rotate(p.a);x.fillRect(-p.r,-p.r/2,p.r*2,p.r);x.restore()}else{x.beginPath();x.arc(p.x,p.y,p.r,0,6.3);x.fill()}}
      });
      if(++f<170)this.fxId=requestAnimationFrame(anim);else x.clearRect(0,0,W,H);
    };anim();
  }
}
document.addEventListener('DOMContentLoaded',()=>{
  const fl=document.querySelector('.floaters'),it=['⭐','❤️','🔺','🟦','🔷','☀️','🌙','☁️','🎈','🏠','🌳','🌸','😊','1','2','3','7','Α','Β','Μ','Σ','Ω'];
  for(let i=0;i<22;i++){const s=document.createElement('span');s.className='fl';s.textContent=it[i%it.length];
    s.style.cssText=`left:${Math.random()*92}%;font-size:${26+Math.random()*34}px;animation-duration:${9+Math.random()*9}s;animation-delay:-${Math.random()*14}s;color:#fff;font-weight:700`;fl.appendChild(s)}
  window.game=new Game();
});
</script>
