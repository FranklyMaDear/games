<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Drop 4096 · FranklyGames</title>
    
    <style>
        :root {
            --bg: #5B7DB1;
            --panel-deep: #4A3423;
            --cream: #F7EFDC;
            --accent: #F2A03D;
        }
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }
        html, body {
            height: 100%;
            overflow: hidden;
            background: var(--bg);
            font-family: "Baloo 2", system-ui, sans-serif;
            -webkit-user-select: none;
            user-select: none;
            touch-action: none;
        }
        #game {
            position: fixed;
            inset: 0;
            display: block;
            z-index: 0;
        }

        /* Δείκτης πτώσης */
        #dropIndicator {
            position: fixed;
            width: 14px;
            height: 14px;
            border-radius: 50%;
            z-index: 15;
            pointer-events: none;
            background: rgba(255, 150, 80, 0.7);
            border: 2px solid rgba(255, 150, 80, 0.9);
            transform: translate(-50%, -50%);
            transition: left 0.05s, top 0.05s;
        }

        /* Μινιμαλιστικό UI (ΧΩΡΙΣ eShop) */
        #ui-overlay {
            position: fixed;
            top: 15px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 10;
            pointer-events: none;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 6px;
        }
        #ui-top {
            display: flex;
            align-items: center;
            gap: 15px;
            background: rgba(0,0,0,0.45);
            padding: 6px 18px;
            border-radius: 30px;
            backdrop-filter: blur(4px);
            pointer-events: auto;
            color: white;
            font-weight: 700;
            font-size: 16px;
            border: 1px solid rgba(255,255,255,0.15);
        }
        #ui-top .item { display: flex; align-items: center; gap: 4px; }
        #btnSound { cursor: pointer; font-size: 18px; background: transparent; border: none; color: white; padding: 0; pointer-events: auto; }
        
        #mission-container {
            pointer-events: none;
            width: 180px;
            background: rgba(0,0,0,0.45);
            padding: 4px 10px;
            border-radius: 16px;
            backdrop-filter: blur(4px);
            border: 1px solid rgba(255,255,255,0.15);
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        #mission-label { font-size: 11px; color: white; font-weight: 700; text-shadow: 0 1px 2px rgba(0,0,0,0.5); }
        #mission-bar-bg { width: 100%; height: 5px; background: rgba(255,255,255,0.2); border-radius: 4px; margin-top: 2px; overflow: hidden; }
        #mission-bar-fill { height: 100%; width: 0%; background: linear-gradient(90deg, #F5C542, #F2A03D); transition: width 0.2s ease-out; }

        .overlay {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, .75);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 30;
            backdrop-filter: blur(4px);
        }
        .card {
            background: var(--cream);
            border: 4px solid var(--panel-deep);
            border-radius: 26px;
            padding: 20px 18px;
            width: min(380px, 85vw);
            text-align: center;
            box-shadow: 0 10px 0 rgba(0, 0, 0, .4);
            animation: pop .25s cubic-bezier(.34, 1.56, .64, 1);
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        @keyframes pop { from { transform: scale(.7); opacity: 0; } }
        .card h2 { font-size: 24px; margin: 0; }
        .btn {
            border: none; cursor: pointer; font-family: inherit; font-weight: 800; font-size: 18px; color: #fff;
            background: var(--accent); border-radius: 16px; padding: 12px 24px; box-shadow: 0 4px 0 #b8742a;
            transition: transform .08s;
        }
        .btn:active { transform: translateY(4px); box-shadow: 0 1px 0 #b8742a; }
        .hidden { display: none !important; }

        #girl { position: fixed; bottom: 10px; left: 50%; transform: translateX(-50%); z-index: 5; font-size: 70px; pointer-events: none; filter: drop-shadow(0 5px 10px rgba(0,0,0,0.2)); opacity: 0.7; }
    </style>
</head>
<body>
    <canvas id="game"></canvas>
    <div id="dropIndicator"></div>

    <!-- Νέο UI (χωρίς shop) -->
    <div id="ui-overlay">
        <div id="ui-top">
            <span class="item">🪙 <span id="scoreDisplay">0</span></span>
            <span style="color:rgba(255,255,255,0.3);">|</span>
            <span class="item">LEVEL <span id="levelDisplay">1</span></span>
            <span style="color:rgba(255,255,255,0.3);">|</span>
            <button id="btnSound">🔊</button>
        </div>
        <div id="mission-container">
            <div id="mission-label">MISSION: 64</div>
            <div id="mission-bar-bg"><div id="mission-bar-fill"></div></div>
        </div>
    </div>

    <div id="girl">👧</div>

    <!-- Game Over -->
    <div class="overlay hidden" id="gameOverOverlay">
        <div class="card">
            <div style="font-size:40px;">😵</div>
            <h2>The jar is full!</h2>
            <p>Score: <b id="finalScore">0</b></p>
            <button class="btn" id="btnPlayAgain" style="background:#5c7a3a; box-shadow:0 4px 0 #3a4d25;">🔄 Play Again</button>
        </div>
    </div>

    <!-- Main Menu -->
    <div class="overlay" id="mainMenu">
        <div class="card" style="max-width:420px;">
            <div style="font-size:60px;">🎲</div>
            <h2 style="font-size:32px;">DROP 4096</h2>
            <div style="font-size:15px; line-height:1.5; color:#4A3423;">
                <b>🎯 Goal:</b> Merge balls with the same number!<br>
                <b>🕹️ Controls:</b> Drag left/right to move the ball. Release to drop!
            </div>
            <button class="btn" id="btnClassic" style="background:#4A7DBF; box-shadow:0 4px 0 #2d5a7a;">🎮 Play</button>
        </div>
    </div>

    <!-- Μηχανή Φυσικής (Matter.js) αντί για Three.js -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/matter-js/0.19.0/matter.min.js"></script>
    <script>
        (function() {
            'use strict';

            // --- 1. Απλοποιημένο Save System (χωρίς coins/items) ---
            const DEFAULT_SAVE = { bestScore: 0, level: 0 };
            let save = { ...DEFAULT_SAVE };
            let currentScore = 0;
            let currentLevel = 0;
            let isGameOver = false;
            let isPlaying = false;
            let muted = false;

            function loadSave() {
                try { 
                    const r = localStorage.getItem("drop4096-v2"); 
                    if (r) save = { ...DEFAULT_SAVE, ...JSON.parse(r) }; 
                } catch(e) {}
            }
            function persist() { 
                try { localStorage.setItem("drop4096-v2", JSON.stringify(save)); } catch(e) {} 
            }

            // --- 2. Matter.js Setup ---
            const { Engine, Bodies, Body, Composite, Events, World, Sleeping } = Matter;
            const engine = Engine.create();
            const world = engine.world;
            
            engine.timing.delta = 1000 / 60 / 4; // Substepping για αποφυγή tunneling
            engine.enableSleeping = true; // Απόδοση
            engine.world.gravity.y = 2.0; // Βαρύτητα

            // --- 3. Canvas & Διαστάσεις Γυάλας ---
            const canvas = document.getElementById('game');
            const ctx = canvas.getContext('2d');
            let width, height;
            let jarLeft, jarRight, jarBottom, jarWidth, jarHeight;
            const WALL_THICKNESS = 20; // Πάχος τοιχωμάτων
            let ground, leftWall, rightWall;

            // --- 4. Δεδομένα μπαλών ---
            const BALL_COLORS = {
                2: 0x5B9BD5, 4: 0x2C3E50, 8: 0x27AE60, 16: 0xF1C40F, 
                32: 0xE67E22, 64: 0xE74C3C, 128: 0x8E44AD, 256: 0xFD79A8,
                512: 0x00CEC9, 1024: 0xD35400, 2048: 0x2ECC71
            };
            
            let nextBallValue = 2;
            let currentBallBody = null;
            let isDragging = false;

            function getRadius(value) {
                return 12 + Math.log2(value) * 4.5; 
            }

            function getColorHex(value) {
                return BALL_COLORS[value] || 0x888888;
            }

            // --- 5. Δημιουργία Μπαλών & Φυσική ---
            function createPhysicsBall(x, y, value, isStatic = true) {
                const radius = getRadius(value);
                const density = 0.002 * Math.log2(value + 1); 
                const body = Bodies.circle(x, y, radius, {
                    isStatic: isStatic,
                    restitution: 0.25,
                    friction: 0.6,
                    density: density,
                    label: 'ball',
                    plugin: { value: value, radius: radius }
                });
                Composite.add(world, body);
                return body;
            }

            function spawnNextBall() {
                if (currentBallBody) return;
                const val = nextBallValue;
                const rad = getRadius(val);
                const spawnX = width / 2;
                const spawnY = jarBottom - jarHeight - rad - 20;
                currentBallBody = createPhysicsBall(spawnX, spawnY, val, true);
                
                const pool = [2, 4, 8, 16];
                nextBallValue = pool[Math.floor(Math.random() * pool.length)];
                isDragging = false;
                updateUI();
            }

            // --- 6. Είσοδος (Drag & Drop) ---
            function getPointerX(e) {
                const rect = canvas.getBoundingClientRect();
                return (e.touches ? e.touches[0].clientX : e.clientX) - rect.left;
            }

            function setupInput() {
                canvas.addEventListener('pointerdown', (e) => {
                    if (isGameOver || !isPlaying) return;
                    if (!currentBallBody) spawnNextBall();
                    isDragging = true;
                });

                canvas.addEventListener('pointermove', (e) => {
                    if (isGameOver || !isPlaying) return;
                    if (isDragging && currentBallBody) {
                        const x = getPointerX(e);
                        const radius = getRadius(currentBallBody.plugin.value);
                        const clampX = Math.max(jarLeft + radius, Math.min(jarRight - radius, x));
                        Body.setPosition(currentBallBody, { x: clampX, y: currentBallBody.position.y });
                        // Ενημέρωση δείκτη πτώσης
                        const elem = document.getElementById('dropIndicator');
                        elem.style.left = (clampX / width * window.innerWidth) + 'px';
                        elem.style.top = (jarBottom / height * window.innerHeight) + 'px';
                    }
                });

                canvas.addEventListener('pointerup', (e) => {
                    if (isGameOver || !isPlaying) return;
                    if (isDragging && currentBallBody) {
                        Body.setStatic(currentBallBody, false);
                        currentBallBody = null;
                        isDragging = false;
                        setTimeout(() => { if (!isGameOver && isPlaying) spawnNextBall(); }, 600);
                    }
                });
            }

            // --- 7. Συγχώνευση (Merging) ---
            Events.on(engine, 'collisionStart', (event) => {
                const pairs = event.pairs;
                const toRemove = [];
                const toSpawn = [];

                for (let i = 0; i < pairs.length; i++) {
                    const p = pairs[i];
                    const a = p.bodyA;
                    const b = p.bodyB;
                    if (a.label === 'ball' && b.label === 'ball') {
                        const valA = a.plugin.value;
                        const valB = b.plugin.value;
                        if (valA === valB && !a.isMerging && !b.isMerging) {
                            a.isMerging = true; b.isMerging = true;
                            toRemove.push(a, b);
                            toSpawn.push({ 
                                x: (a.position.x + b.position.x) / 2, 
                                y: (a.position.y + b.position.y) / 2, 
                                value: valA * 2 
                            });
                        }
                    }
                }

                if (toRemove.length > 0) {
                    Composite.remove(world, toRemove);
                    for (let s of toSpawn) {
                        const newBody = createPhysicsBall(s.x, s.y, s.value, false);
                        currentScore += s.value;
                        updateUI();
                        if (newBody.position.y - getRadius(s.value) < jarBottom - jarHeight) triggerGameOver();
                    }
                }
            });

            // --- 8. Custom Render Loop (ζωγραφική) ---
            function render() {
                ctx.clearRect(0, 0, width, height);

                // Γυάλα (εσωτερικό)
                ctx.fillStyle = 'rgba(40, 70, 120, 0.25)';
                ctx.shadowColor = 'rgba(0, 0, 0, 0.2)';
                ctx.shadowBlur = 15;
                roundRect(ctx, jarLeft, jarBottom - jarHeight, jarWidth, jarHeight, 20);
                ctx.fill();
                ctx.shadowBlur = 0;

                // Μπάλες
                const bodies = Composite.allBodies(world);
                for (let body of bodies) {
                    if (body.label === 'ball') drawBall(ctx, body);
                }

                // Γυάλα (περίγραμμα)
                ctx.strokeStyle = 'rgba(255, 255, 255, 0.2)';
                ctx.lineWidth = 4;
                roundRect(ctx, jarLeft, jarBottom - jarHeight, jarWidth, jarHeight, 20, true);

                requestAnimationFrame(render);
            }

            function drawBall(ctx, body) {
                const x = body.position.x;
                const y = body.position.y;
                const val = body.plugin.value;
                const rad = body.plugin.radius;
                const hex = getColorHex(val);

                ctx.save();
                ctx.translate(x, y);
                ctx.shadowColor = 'rgba(0,0,0,0.4)';
                ctx.shadowBlur = 8;
                ctx.shadowOffsetY = 3;

                // Χρώμα
                ctx.fillStyle = '#' + new THREE.Color(hex).getHexString();
                ctx.beginPath();
                ctx.arc(0, 0, rad, 0, Math.PI * 2);
                ctx.fill();
                ctx.shadowBlur = 0;

                // Λάμψη
                ctx.beginPath();
                ctx.arc(-rad/3, -rad/3, rad/4, 0, Math.PI * 2);
                ctx.fillStyle = 'rgba(255,255,255,0.2)';
                ctx.fill();

                // Αριθμός
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                ctx.font = `Bold ${rad * 0.9}px Arial`;
                ctx.strokeStyle = 'rgba(0,0,0,0.8)';
                ctx.lineWidth = 4;
                ctx.strokeText(val.toString(), 0, 0);
                ctx.fillStyle = '#ffffff';
                ctx.fillText(val.toString(), 0, 0);
                ctx.restore();
            }

            function roundRect(ctx, x, y, w, h, r, stroke = false) {
                ctx.beginPath();
                ctx.moveTo(x + r, y); ctx.lineTo(x + w - r, y);
                ctx.quadraticCurveTo(x + w, y, x + w, y + r);
                ctx.lineTo(x + w, y + h - r);
                ctx.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
                ctx.lineTo(x + r, y + h);
                ctx.quadraticCurveTo(x, y + h, x, y + h - r);
                ctx.lineTo(x, y + r);
                ctx.quadraticCurveTo(x, y, x + r, y);
                ctx.closePath();
                if (stroke) ctx.stroke(); else ctx.fill();
            }

            // --- 9. UI & Ήχος ---
            function updateUI() {
                document.getElementById('scoreDisplay').innerText = currentScore;
                document.getElementById('levelDisplay').innerText = currentLevel + 1;
                updateMission();
            }

            function updateMission() {
                let maxVal = 2;
                const bodies = Composite.allBodies(world);
                for (let b of bodies) if (b.label === 'ball' && b.plugin.value > maxVal) maxVal = b.plugin.value;
                const target = 64 * Math.pow(2, currentLevel);
                document.getElementById('mission-label').innerText = 'MISSION: ' + target;
                let pct = (Math.log2(maxVal) / Math.log2(target)) * 100;
                if (pct > 100) pct = 100;
                document.getElementById('mission-bar-fill').style.width = pct + '%';
                if (maxVal >= target) { currentLevel++; updateUI(); }
            }

            function triggerGameOver() {
                isGameOver = true; isPlaying = false;
                if (currentScore > save.bestScore) { save.bestScore = currentScore; persist(); }
                document.getElementById('finalScore').innerText = currentScore;
                document.getElementById('gameOverOverlay').classList.remove('hidden');
            }

            function startGame() {
                const balls = Composite.allBodies(world).filter(b => b.label === 'ball');
                Composite.remove(world, balls);
                currentScore = 0; currentLevel = 0; isGameOver = false; isPlaying = true;
                updateUI();
                document.getElementById('gameOverOverlay').classList.add('hidden');
                document.getElementById('mainMenu').classList.add('hidden');
                if (currentBallBody) { Composite.remove(world, currentBallBody); currentBallBody = null; }
                isDragging = false; spawnNextBall();
            }

            // --- 10. Διαστάσεις & Εκκίνηση ---
            function resizeAndSetup() {
                width = window.innerWidth; height = window.innerHeight;
                canvas.width = width; canvas.height = height;
                jarWidth = width * 0.8; jarHeight = height * 0.75;
                jarLeft = (width - jarWidth) / 2; jarRight = jarLeft + jarWidth;
                jarBottom = height - 50;
                if (leftWall) { Composite.remove(world, [leftWall, rightWall, ground]); }
                ground = Bodies.rectangle(width/2, jarBottom + WALL_THICKNESS/2, jarWidth + WALL_THICKNESS*2, WALL_THICKNESS, { isStatic: true, label: 'wall' });
                leftWall = Bodies.rectangle(jarLeft - WALL_THICKNESS/2, jarBottom - jarHeight/2, WALL_THICKNESS, jarHeight + WALL_THICKNESS, { isStatic: true, label: 'wall' });
                rightWall = Bodies.rectangle(jarRight + WALL_THICKNESS/2, jarBottom - jarHeight/2, WALL_THICKNESS, jarHeight + WALL_THICKNESS, { isStatic: true, label: 'wall' });
                Composite.add(world, [ground, leftWall, rightWall]);
                if (isPlaying && !currentBallBody) spawnNextBall();
            }

            const audioCtx = new(window.AudioContext || window.webkitAudioContext)();
            function playMergeSound() {
                if (muted) return;
                try { const o = audioCtx.createOscillator(); const g = audioCtx.createGain(); o.connect(g); g.connect(audioCtx.destination); o.frequency.setValueAtTime(800, audioCtx.currentTime); o.frequency.exponentialRampToValueAtTime(1200, audioCtx.currentTime + 0.1); g.gain.setValueAtTime(0.15, audioCtx.currentTime); g.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.1); o.start(); o.stop(audioCtx.currentTime + 0.1); } catch(e) {}
            }

            function init() {
                loadSave();
                resizeAndSetup();
                window.addEventListener('resize', resizeAndSetup);
                setupInput();
                function loop() { if (!isGameOver && isPlaying) { for (let i = 0; i < 4; i++) Engine.update(engine, 1000 / 60 / 4); updateUI(); } requestAnimationFrame(loop); }
                requestAnimationFrame(render);
                requestAnimationFrame(loop);
                document.getElementById('mainMenu').classList.remove('hidden');
                document.getElementById('btnSound').onclick = function() { muted = !muted; this.innerText = muted ? '🔇' : '🔊'; };
                document.getElementById('btnClassic').onclick = startGame;
                document.getElementById('btnPlayAgain').onclick = startGame;
            }
            init();
        })();
    </script>
</body>
</html>
