<!DOCTYPE html>
<html lang="el">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Drop 4096 · FranklyGames</title>
    <style>
        * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
        html, body {
            height:100%; overflow:hidden;
            background: #87CEEB;
            font-family: "Baloo 2", system-ui, sans-serif;
            color: #2F1B0D;
            -webkit-user-select:none; user-select:none; touch-action:none;
        }
        #game { position:fixed; inset:0; display:block; z-index:0; }
        
        /* Δείκτης πτώσης */
        #dropIndicator {
            position:fixed; width:28px; height:28px; border-radius:50%;
            z-index:15; pointer-events:none;
            background: rgba(255,150,50,0.5);
            border:3px solid rgba(255,150,50,0.8);
            box-shadow:0 0 20px rgba(255,150,50,0.3);
            transform:translate(-50%, -50%);
            transition: left 0.05s ease, top 0.05s ease;
        }

        /* Πάνω γραμμή */
        #topBar {
            position:fixed; top:0; left:0; right:0;
            padding:10px 14px;
            display:flex; justify-content:space-between; align-items:center;
            background: rgba(0,0,0,0.6);
            backdrop-filter:blur(6px);
            z-index:20;
            border-bottom:2px solid rgba(255,255,255,0.15);
        }
        #topBar .stat {
            color:#fff; font-weight:800; font-size:16px;
            display:flex; align-items:center; gap:6px;
            background: rgba(255,255,255,0.1);
            padding:4px 12px; border-radius:20px;
        }
        #topBar .stat .big { font-size:20px; }
        #topBar button {
            background: #F2A03D; border:none; color:#fff; font-weight:800;
            border-radius:30px; padding:8px 18px; font-size:16px;
            box-shadow:0 4px 0 #b8742a; cursor:pointer;
        }
        #topBar button:active { transform:translateY(3px); box-shadow:0 1px 0 #b8742a; }

        /* Κάρτες και overlays */
        .overlay {
            position:fixed; inset:0;
            background: rgba(11,12,16,0.85);
            display:flex; align-items:center; justify-content:center;
            z-index:30; backdrop-filter:blur(4px);
        }
        .card {
            background: #F7EFDC; border:4px solid #4A3423; border-radius:26px;
            padding:24px 20px; width:min(400px,92vw); max-height:92vh;
            text-align:center; box-shadow:0 10px 0 rgba(0,0,0,0.4);
            animation:pop 0.25s cubic-bezier(0.34,1.56,0.64,1);
            display:flex; flex-direction:column; overflow-y:auto;
        }
        @keyframes pop { from { transform:scale(0.7); opacity:0; } }
        .card h2 { font-size:28px; margin-bottom:12px; font-weight:800; }
        .btn {
            border:none; background:#F2A03D; color:#fff; font-weight:800;
            border-radius:16px; padding:12px 24px; font-size:16px;
            box-shadow:0 4px 0 #b8742a; cursor:pointer; transition:0.08s;
            width:100%; margin-top:8px;
        }
        .btn:active { transform:translateY(3px); box-shadow:0 1px 0 #b8742a; }
        .hidden { display:none !important; }

        @media (max-width:480px) {
            #topBar .stat { font-size:13px; padding:3px 8px; }
            #topBar .stat .big { font-size:16px; }
            #topBar button { font-size:14px; padding:6px 14px; }
        }
    </style>
</head>
<body>
    <canvas id="game"></canvas>
    <div id="dropIndicator"></div>

    <!-- Πάνω γραμμή (χωρίς eShop) -->
    <div id="topBar">
        <div class="stat">📊 <span class="big" id="hudLevel">1</span></div>
        <div class="stat">🏆 <span class="big" id="hudScore">0</span></div>
        <div class="stat">💎 <span class="big" id="hudCoins">100</span></div>
        <button id="btnRestart">🔄</button>
    </div>

    <!-- Overlay αρχικού μενού -->
    <div class="overlay" id="mainMenu">
        <div class="card" style="max-width:420px;">
            <div style="font-size:60px; margin-bottom:8px;">🫙</div>
            <h2 style="font-size:32px; margin:0 0 10px;">DROP 4096</h2>
            <div style="font-size:16px; line-height:1.6; color:#4A3423;">
                <p><b>🎯 Στόχος:</b> Ένωσε μπάλες με τον ίδιο αριθμό!</p>
                <p><b>🕹️</b> Σύρε το δάχτυλο αριστερά/δεξιά – η μπάλα πέφτει φυσικά.</p>
                <p><b>💡</b> Κράτα τις μεγάλες μπάλες στις άκρες.</p>
            </div>
            <button class="btn" id="btnStart">🎮 Ξεκίνα</button>
        </div>
    </div>

    <!-- Overlay ήττας (απλοποιημένο) -->
    <div class="overlay hidden" id="loseModal">
        <div class="card">
            <div style="font-size:40px;">😵</div>
            <h2>Η γυάλα γέμισε!</h2>
            <p id="loseText"></p>
            <button class="btn" id="btnPlayAgain">🔄 Ξαναπαίξε</button>
        </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script>
        (function() {
            'use strict';

            // Βασικές σταθερές – χωρίς grid, ελεύθερη πτώση
            const COLS = 5;      // για διαίρεση της οθόνης σε ζώνες
            const ROWS = 6;
            const CELL_SIZE = 0.9; // μέγεθος μπάλας
            const GRAVITY = -4.5; // επιτάχυνση πτώσης
            const MAX_SPEED = -6.5;

            // Χρώματα μπαλών
            const BALL_COLORS = {
                2: 0x5B9BD5, 4: 0x2C3E50, 8: 0x27AE60, 16: 0xF1C40F,
                32: 0xE67E22, 64: 0xE74C3C, 128: 0x8E44AD, 256: 0xFD79A8,
                512: 0x00CEC9, 1024: 0xD35400, 2048: 0x2ECC71, 4096: 0x1A1A2E
            };

            // Κατάσταση παιχνιδιού
            let coins = 100, level = 0, score = 0, gameOver = false, busy = false;
            let balls = [];           // όλες οι μπάλες στο δοχείο (αντικείμενα με θέση, τιμή)
            let currentBall = null;   // η μπάλα που πέφτει
            let fallVelocity = 0;
            let aimX = 0;            // θέση στόχου (οριζόντια)
            let mouseX = 0;

            // THREE.js
            let scene, camera, renderer, boardGroup, containerMesh, bottomMesh;
            let raycaster = new THREE.Raycaster();
            let pointer = new THREE.Vector2();

            // Ήχος (απλό)
            const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            function tone(f0, f1, dur, wave, vol, delay) {
                try {
                    const o = audioCtx.createOscillator();
                    const g = audioCtx.createGain();
                    o.connect(g); g.connect(audioCtx.destination);
                    o.type = wave || 'sine';
                    const t = audioCtx.currentTime + (delay || 0);
                    o.frequency.setValueAtTime(f0, t);
                    if (f1) o.frequency.exponentialRampToValueAtTime(f1, t + dur);
                    g.gain.setValueAtTime(vol || 0.2, t);
                    g.gain.exponentialRampToValueAtTime(0.01, t + dur);
                    o.start(t); o.stop(t + dur + 0.05);
                } catch(e){}
            }
            function playMerge(){ tone(400, 1200, 0.1, 'sine', 0.2); }
            function playDrop(){ tone(800, 300, 0.15, 'sine', 0.15); }

            // Δημιουργία μπάλας με αριθμό (3D)
            function makeBall(value) {
                const radius = 0.35 + Math.log2(value) * 0.035;
                const canvas = document.createElement('canvas');
                canvas.width = 256; canvas.height = 256;
                const ctx = canvas.getContext('2d');
                // χρώμα
                const hex = BALL_COLORS[value] || 0x8E44AD;
                const col = new THREE.Color(hex);
                ctx.fillStyle = '#' + col.getHexString();
                ctx.beginPath(); ctx.arc(128,128,120,0,2*Math.PI); ctx.fill();
                // λάμψη
                ctx.beginPath(); ctx.arc(80,100,30,0,2*Math.PI);
                ctx.fillStyle = 'rgba(255,255,255,0.25)'; ctx.fill();
                // αριθμός (μεγάλος)
                ctx.font = 'Bold ' + (value >= 2048 ? 50 : (value >= 128 ? 70 : 85)) + 'px Arial';
                ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
                ctx.shadowColor = 'rgba(0,0,0,0.5)'; ctx.shadowBlur = 12;
                ctx.strokeStyle = 'rgba(0,0,0,0.9)'; ctx.lineWidth = 8;
                ctx.strokeText(value.toString(), 128, 125);
                ctx.fillStyle = '#ffffff'; ctx.shadowBlur = 0;
                ctx.fillText(value.toString(), 128, 125);
                const texture = new THREE.CanvasTexture(canvas);
                const mat = new THREE.MeshPhongMaterial({ map: texture, shininess: 40 });
                const geo = new THREE.SphereGeometry(radius, 32, 32);
                const mesh = new THREE.Mesh(geo, mat);
                mesh.userData.value = value;
                mesh.userData.radius = radius;
                return mesh;
            }

            // Δημιουργία σκηνής και δοχείου
            function initThree() {
                const canvas = document.getElementById("game");
                renderer = new THREE.WebGLRenderer({ canvas, antialias:true });
                renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
                scene = new THREE.Scene();
                scene.background = new THREE.Color(0x8FD0F5);

                camera = new THREE.PerspectiveCamera(40, innerWidth/innerHeight, 0.1, 100);
                camera.position.set(0, 1.5, 8);
                camera.lookAt(0, -1, 0);

                scene.add(new THREE.AmbientLight(0xfff4e0, 0.7));
                const sun = new THREE.DirectionalLight(0xfff2cc, 0.9);
                sun.position.set(5, 10, 7);
                scene.add(sun);

                // Μεγάλη γυάλα – κύλινδρος
                const containerRadius = 2.8;
                const containerHeight = 4.2;
                const geo = new THREE.CylinderGeometry(containerRadius, containerRadius*0.9, containerHeight, 48, 1, true);
                const mat = new THREE.MeshPhysicalMaterial({
                    color: 0x88B0E0,
                    transparent: true, opacity: 0.25,
                    roughness: 0.1, metalness: 0.0,
                    side: THREE.DoubleSide,
                    envMapIntensity: 1.0
                });
                containerMesh = new THREE.Mesh(geo, mat);
                containerMesh.position.y = -0.5;
                containerMesh.position.z = 0;
                scene.add(containerMesh);

                // πάτος
                const bottomGeo = new THREE.CircleGeometry(containerRadius*0.85, 48);
                const bottomMat = new THREE.MeshPhysicalMaterial({
                    color: 0x2A3B5C,
                    transparent: true, opacity: 0.7,
                    roughness: 0.5
                });
                bottomMesh = new THREE.Mesh(bottomGeo, bottomMat);
                bottomMesh.rotation.x = -Math.PI/2;
                bottomMesh.position.set(0, -0.5 - containerHeight/2, 0);
                scene.add(bottomMesh);

                // ομάδα μπαλών
                boardGroup = new THREE.Group();
                boardGroup.position.y = -0.5 - containerHeight/2 + 0.1;
                scene.add(boardGroup);

                // μικρά διακοσμητικά
                addEnvironment();

                window.addEventListener('resize', onResize);
                onResize();
                return renderer;
            }

            function addEnvironment() {
                // απλό λιβάδι στο βάθος
                const planeMat = new THREE.MeshBasicMaterial({ color:0x7CB342, transparent:true, opacity:0.2, side: THREE.DoubleSide });
                const plane = new THREE.Mesh(new THREE.PlaneGeometry(20,6), planeMat);
                plane.position.set(0, -2.8, -4);
                scene.add(plane);
            }

            function onResize() {
                const w = window.innerWidth, h = window.innerHeight;
                renderer.setSize(w,h);
                camera.aspect = w/h;
                camera.updateProjectionMatrix();
            }

            // Δημιουργία καινούριας πτώσης
            function spawnNewBall() {
                if (currentBall) return;
                // τιμή: βασισμένη στο μέγιστο στο δοχείο
                let maxVal = 2;
                for (const b of balls) if (b.value > maxVal) maxVal = b.value;
                const pool = [];
                let v = 2;
                while (v <= Math.min(32, Math.max(4, maxVal/2))) { pool.push(v); v*=2; }
                if (pool.length===0) pool.push(2);
                const value = pool[Math.floor(Math.random()*pool.length)];

                const mesh = makeBall(value);
                const x = Math.max(-2.2, Math.min(2.2, aimX));
                mesh.position.set(x, 2.5, 0);
                mesh.userData.radius = 0.35 + Math.log2(value)*0.035;
                boardGroup.add(mesh);
                currentBall = mesh;
                fallVelocity = 0;
                // μικρό animation εισόδου
                mesh.scale.set(0.4,0.4,0.4);
                const target = {x:1, y:1, z:1};
                const start = {x:0.4, y:0.4, z:0.4};
                const dur = 200;
                const t0 = performance.now();
                function scaleAnim() {
                    const t = (performance.now()-t0)/dur;
                    if (t<1) {
                        const e = 1 - Math.pow(1-t,3);
                        mesh.scale.set(
                            start.x + (target.x-start.x)*e,
                            start.y + (target.y-start.y)*e,
                            start.z + (target.z-start.z)*e
                        );
                        requestAnimationFrame(scaleAnim);
                    } else mesh.scale.set(1,1,1);
                }
                scaleAnim();
                updateDropIndicator();
            }

            // Φυσική πτώση (ενημέρωση κάθε frame)
            function updateFalling(dt) {
                if (!currentBall || busy || gameOver) return;
                // οριζόντια κίνηση – ακολουθεί το aimX (ομαλά)
                const dx = aimX - currentBall.position.x;
                currentBall.position.x += dx * Math.min(1, dt * 5);
                // βαρύτητα
                fallVelocity += GRAVITY * dt;
                if (fallVelocity < MAX_SPEED) fallVelocity = MAX_SPEED;
                currentBall.position.y += fallVelocity * dt;

                // έλεγχος σύγκρουσης με άλλες μπάλες ή πάτο
                const rBall = currentBall.userData.radius;
                let hitY = -1000;
                // βρες την ψηλότερη μπάλα που βρίσκεται κάτω από την τρέχουσα και είναι αρκετά κοντά στο x
                for (const b of balls) {
                    const dx2 = Math.abs(b.mesh.position.x - currentBall.position.x);
                    const dy = b.mesh.position.y - currentBall.position.y;
                    if (dy < -0.05) continue; // είναι κάτω
                    if (dx2 < rBall + b.mesh.userData.radius) {
                        // πιθανό εμπόδιο
                        if (b.mesh.position.y > hitY) hitY = b.mesh.position.y;
                    }
                }
                // πάτος
                const floorY = -2.2;
                let targetY = Math.max(floorY, hitY + (rBall + (hitY===floorY ? 0 : 0.05)));
                if (hitY > floorY) targetY = hitY + rBall + (hitY>floorY ? 0.02 : 0);

                if (currentBall.position.y <= targetY) {
                    // ακινητοποίηση
                    currentBall.position.y = targetY;
                    // μικρή προσαρμογή x για να μην επικαλύπτει
                    for (const b of balls) {
                        const dx2 = Math.abs(b.mesh.position.x - currentBall.position.x);
                        if (dx2 < rBall + b.mesh.userData.radius + 0.02) {
                            const push = (dx2 < 0.01) ? 0.2 : 0;
                            currentBall.position.x += push * (currentBall.position.x > b.mesh.position.x ? 1 : -1);
                        }
                    }
                    // τοποθέτηση στο δοχείο
                    const value = currentBall.userData.value;
                    balls.push({ mesh: currentBall, value: value, pos: currentBall.position.clone() });
                    currentBall = null;
                    playDrop();
                    // έλεγχος συγχωνεύσεων
                    checkMerges();
                    // νέα μπάλα
                    setTimeout(spawnNewBall, 300);
                }
                updateDropIndicator();
            }

            // Έλεγχος συγχωνεύσεων (απλό: κοντινές μπάλες με ίδια τιμή)
            function checkMerges() {
                let merged = false;
                let newBalls = [];
                for (let i=0; i<balls.length; i++) {
                    for (let j=i+1; j<balls.length; j++) {
                        const a = balls[i], b = balls[j];
                        if (!a || !b) continue;
                        if (a.value === b.value) {
                            const dx = a.mesh.position.x - b.mesh.position.x;
                            const dy = a.mesh.position.y - b.mesh.position.y;
                            const dist = Math.sqrt(dx*dx + dy*dy);
                            if (dist < a.mesh.userData.radius + b.mesh.userData.radius + 0.1) {
                                // συγχώνευση
                                const newVal = a.value * 2;
                                score += newVal;
                                coins += (newVal >= 128) ? 5 : 1;
                                document.getElementById('hudScore').textContent = score;
                                document.getElementById('hudCoins').textContent = coins;
                                playMerge();
                                boardGroup.remove(a.mesh);
                                boardGroup.remove(b.mesh);
                                // δημιουργία νέας μπάλας στη μέση
                                const midX = (a.mesh.position.x + b.mesh.position.x)/2;
                                const midY = (a.mesh.position.y + b.mesh.position.y)/2;
                                const newMesh = makeBall(newVal);
                                newMesh.position.set(midX, midY, 0);
                                boardGroup.add(newMesh);
                                newBalls.push({ mesh: newMesh, value: newVal, pos: newMesh.position.clone() });
                                balls[i] = null; balls[j] = null;
                                merged = true;
                                break;
                            }
                        }
                    }
                    if (merged) break;
                }
                if (merged) {
                    balls = balls.filter(b => b !== null);
                    balls = balls.concat(newBalls);
                    // επαναληπτικός έλεγχος
                    setTimeout(checkMerges, 200);
                }
                // έλεγχος νίκης (προαιρετικό)
                let maxV = 0;
                for (const b of balls) if (b.value > maxV) maxV = b.value;
                const target = 64 * Math.pow(2, level);
                if (maxV >= target && !gameOver) {
                    level++;
                    document.getElementById('hudLevel').textContent = level+1;
                    // δώστε επιβράβευση
                    coins += 25;
                    document.getElementById('hudCoins').textContent = coins;
                }
            }

            // Δείκτης πτώσης
            function updateDropIndicator() {
                const el = document.getElementById('dropIndicator');
                if (!el || !currentBall) return;
                const pos = currentBall.position.clone();
                pos.y += currentBall.userData.radius + 0.1;
                pos.project(camera);
                const x = (pos.x*0.5+0.5)*window.innerWidth;
                const y = (-pos.y*0.5+0.5)*window.innerHeight;
                el.style.left = x + 'px';
                el.style.top = y + 'px';
            }

            // Κεντρικός βρόχος
            function loop(t) {
                if (gameOver) {
                    requestAnimationFrame(loop);
                    return;
                }
                const dt = Math.min(0.03, (t - (loop.lastT||t))/1000);
                loop.lastT = t;
                updateFalling(dt);
                renderer.render(scene, camera);
                requestAnimationFrame(loop);
            }

            // Έναρξη παιχνιδιού
            function startGame() {
                document.getElementById('mainMenu').classList.add('hidden');
                document.getElementById('loseModal').classList.add('hidden');
                gameOver = false; busy = false; score = 0; level = 0;
                coins = 100;
                document.getElementById('hudScore').textContent = 0;
                document.getElementById('hudCoins').textContent = 100;
                document.getElementById('hudLevel').textContent = 1;
                // Καθαρισμός μπαλών
                for (const b of balls) boardGroup.remove(b.mesh);
                balls = [];
                if (currentBall) { boardGroup.remove(currentBall); currentBall = null; }
                aimX = 0;
                // αρχικές μπάλες (τυχαίες)
                for (let i=0; i<4; i++) {
                    const v = [2,4,8][Math.floor(Math.random()*3)];
                    const m = makeBall(v);
                    const x = (Math.random()-0.5)*3.5;
                    const y = -2 + Math.random()*0.5;
                    m.position.set(x, y, 0);
                    boardGroup.add(m);
                    balls.push({ mesh:m, value:v, pos:m.position.clone() });
                }
                spawnNewBall();
                audioCtx.resume();
            }

            // Χειρισμός εισόδου
            function setupInput() {
                const canvas = document.getElementById('game');
                function handleMove(e) {
                    const cx = e.touches ? e.touches[0].clientX : e.clientX;
                    const rect = canvas.getBoundingClientRect();
                    const x = ((cx - rect.left) / rect.width) * 2 - 1;
                    // αντιστοίχιση σε οριζόντιο εύρος γυάλας
                    aimX = x * 2.2; // ±2.2
                    if (currentBall) {
                        // άμεση κίνηση στο πλάι
                        currentBall.position.x += (aimX - currentBall.position.x) * 0.2;
                    }
                    updateDropIndicator();
                }
                function handleDown(e) {
                    if (gameOver) return;
                    handleMove(e);
                    // αν η μπάλα είναι κολλημένη (σπάνιο), ξαναρίχνουμε
                }
                canvas.addEventListener('pointermove', handleMove);
                canvas.addEventListener('pointerdown', handleDown);
                canvas.addEventListener('touchmove', handleMove, {passive:true});
                canvas.addEventListener('touchstart', handleDown, {passive:true});
            }

            // Overlay ήττας – απλοποιημένο
            function showLose() {
                gameOver = true;
                document.getElementById('loseText').innerHTML = 'Σκορ: <b>'+score+'</b><br>Κέρδισες <b>'+coins+'</b> διαμάντια!';
                document.getElementById('loseModal').classList.remove('hidden');
            }

            // Ανανέωση (μπορεί να καλείται όταν γεμίσει)
            function checkFull() {
                if (balls.length > 25) showLose();
            }

            // Εκκίνηση
            function init() {
                const r = initThree();
                if (!r) return;
                setupInput();
                document.getElementById('btnStart').onclick = startGame;
                document.getElementById('btnPlayAgain').onclick = function() {
                    document.getElementById('loseModal').classList.add('hidden');
                    startGame();
                };
                document.getElementById('btnRestart').onclick = function() {
                    if (!gameOver) {
                        if (confirm('Θέλεις να ξεκινήσεις από την αρχή;')) startGame();
                    } else startGame();
                };
                // Αυτόματη έναρξη μετά το boot
                setTimeout(() => {
                    document.getElementById('mainMenu').classList.remove('hidden');
                }, 500);
                requestAnimationFrame(loop);
            }

            init();
        })();
    </script>
</body>
</html>
