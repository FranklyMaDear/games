<!DOCTYPE html>
<html lang="el">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Embed test — Paint</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: #0a0a0c;
      min-height: 100dvh;
      padding: 16px;
      font-family: system-ui, sans-serif;
      color: #eee;
    }
    h1 { font-size: 1.1rem; margin-bottom: 12px; }
    .wrap {
      width: 100%;
      max-width: 900px;
      margin: 0 auto;
      border-radius: 12px;
      overflow: hidden;
      border: 1px solid #333;
      background: #111;
    }
    iframe {
      display: block;
      width: 100%;
      height: 70vh;
      min-height: 480px;
      border: 0;
    }
  </style>
</head>
<body>
  <h1>Embed test · Paint</h1>
  <div class="wrap">
    <iframe
      src="https://franklymadear.github.io/games/paint/index.html"
      title="Paint · Frankly Games"
      allowfullscreen
      loading="lazy"
      referrerpolicy="no-referrer-when-downgrade">
    </iframe>
  </div>
</body>
</html>
