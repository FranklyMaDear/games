<!DOCTYPE html>
<html lang="el">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Μη μ' ακουμπάς</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Font -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap" rel="stylesheet">
    <!-- PeerJS -->
    <script src="https://unpkg.com/peerjs@1.5.1/dist/peerjs.min.js"></script>

    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #0f172a; /* Tailwind slate-900 */
            color: #f8fafc; /* Tailwind slate-50 */
            touch-action: manipulation;
            overflow: hidden;
            -webkit-user-select: none;
            user-select: none;
        }
        
        /* Διαχείριση οθονών */
        .screen {
            display: none;
            width: 100vw;
            height: 100vh;
            flex-direction: column;
        }
        
        .screen.active {
            display: flex;
        }

        /* Εφέ για την οπλισμένη κατάσταση */
        .pulse-bg {
            animation: pulse-red 2s infinite;
        }

        @keyframes pulse-red {
            0% { background-color: #ef4444; } /* red-500 */
            50% { background-color: #991b1b; } /* red-800 */
            100% { background-color: #ef4444; }
        }

        /* Απόκρυψη scrollbars */
        ::-webkit-scrollbar { display: none; }
        * { -ms-overflow-style: none; scrollbar-width: none; }
    </style>
</head>
<body class="antialiased text-slate-50">

    <!-- Προσαρμοσμένο Modal για Μηνύματα (Αντί για alert) -->
    <div id="alert-modal" class="fixed inset-0 z-50 flex items-center justify-center bg-black/70 hidden backdrop-blur-sm transition-opacity duration-300">
        <div class="bg-slate-800 p-6 rounded-3xl shadow-2xl max-w-sm w-full mx-4 text-center transform scale-95 transition-transform duration-300" id="alert-box">
            <div class="text-5xl mb-4">⚠️</div>
            <p id="alert-message" class="text-lg font-semibold text-white mb-6"></p>
            <button onclick="closeAlert()" class="w-full bg-indigo-500 hover:bg-indigo-600 text-white font-bold py-3 rounded-xl transition-colors text-lg">
                Εντάξει
            </button>
        </div>
    </div>

    <!-- ΟΘΟΝΗ 1: Αρχική / Σύνδεση -->
    <div id="screen-setup" class="screen active items-center justify-center p-6 bg-slate-900">
        <div class="max-w-md w-full space-y-8 bg-slate-800 p-8 rounded-[2rem] shadow-2xl border border-slate-700">
            <div class="text-center">
                <h1 class="text-4xl font-black text-transparent bg-clip-text bg-gradient-to-r from-red-400 to-orange-500 tracking-tight leading-tight">
                    ΜΗ Μ' ΑΚΟΥΜΠΑΣ
                </h1>
                <p class="text-slate-400 mt-2 text-sm">Παιχνίδι απόλυτης ακινησίας!</p>
            </div>
            
            <div class="space-y-6">
                <div>
                    <label class="block text-sm font-bold text-slate-300 mb-2 uppercase tracking-wide">Το όνομά σου</label>
                    <input type="text" id="input-name" class="w-full bg-slate-900 border-2 border-slate-600 rounded-xl px-4 py-4 text-white text-lg focus:outline-none focus:border-indigo-500 transition-colors" placeholder="π.χ. Μαρία" maxlength="15">
                </div>
                
                <div class="pt-2">
                    <button id="btn-create-room" class="w-full bg-gradient-to-r from-indigo-500 to-purple-600 text-white font-bold py-4 rounded-xl shadow-lg transform active:scale-95 transition-all text-lg mb-4">
                        Δημιουργία Δωματίου
                    </button>
                    
                    <div class="relative flex py-2 items-center">
                        <div class="flex-grow border-t border-slate-600"></div>
                        <span class="flex-shrink-0 mx-4 text-slate-500 text-sm font-bold uppercase">Ή Σύνδεση</span>
                        <div class="flex-grow border-t border-slate-600"></div>
                    </div>

                    <div class="mt-4 flex gap-2">
                        <input type="text" id="input-pin" class="w-1/2 bg-slate-900 border-2 border-slate-600 rounded-xl px-4 py-4 text-white font-mono text-center text-xl tracking-widest focus:outline-none focus:border-emerald-500 uppercase transition-colors" placeholder="PIN" maxlength="4">
                        <button id="btn-join-room" class="w-1/2 bg-emerald-500 text-white font-bold py-4 rounded-xl shadow-lg transform active:scale-95 transition-all text-lg">
                            Είσοδος
                        </button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- ΟΘΟΝΗ 2: Αίθουσα Αναμονής (Lobby) -->
    <div id="screen-lobby" class="screen bg-slate-900 p-6 flex flex-col">
        <div class="max-w-md w-full mx-auto flex-1 flex flex-col pt-8 pb-4 h-full">
            <div class="text-center mb-6">
                <p class="text-slate-400 text-sm font-bold uppercase tracking-widest">Κωδικος Δωματιου</p>
                <h2 id="display-pin" class="text-5xl font-mono font-black text-white tracking-widest mt-2 bg-slate-800 inline-block px-6 py-2 rounded-2xl border border-slate-700 mb-3">----</h2>
                <button id="btn-copy-link" class="w-full max-w-[250px] mx-auto bg-slate-700 hover:bg-slate-600 border border-slate-600 text-white font-semibold py-2 px-4 rounded-xl shadow-md active:scale-95 transition-all text-sm flex items-center justify-center gap-2">
                    🔗 Αντιγραφή Link Πρόσκλησης
                </button>
            </div>

            <div class="bg-slate-800 rounded-3xl p-6 border border-slate-700 flex-1 overflow-y-auto shadow-inner mb-6">
                <h3 class="text-lg font-bold text-slate-200 mb-4 flex items-center justify-between">
                    <span>Παίκτες</span>
                    <span id="player-count" class="bg-slate-700 px-3 py-1 rounded-full text-sm font-mono">0</span>
                </h3>
                <ul id="players-list" class="space-y-3">
                    <!-- Λίστα παικτών -->
                </ul>
            </div>

            <div class="space-y-4 mt-auto">
                <button id="btn-request-sensors" class="w-full bg-slate-700 text-white font-bold py-4 rounded-xl shadow-lg active:scale-95 transition-transform text-lg border border-slate-600 flex justify-center items-center gap-2">
                    <span>📱 Ενεργοποίηση Αισθητήρων</span>
                </button>
                <!-- Μόνο ο Host βλέπει αυτό το κουμπί αρχικά, αλλά το ελέγχουμε μέσω JS -->
                <button id="btn-start-game" class="w-full bg-gradient-to-r from-emerald-500 to-teal-500 text-white font-black py-5 rounded-xl shadow-lg active:scale-95 transition-transform text-xl hidden">
                    🚀 Ξεκίνα το Παιχνίδι!
                </button>
                <p id="guest-waiting-text" class="text-center text-slate-400 font-medium hidden">
                    Αναμονή για τον δημιουργό...
                </p>
            </div>
        </div>
    </div>

    <!-- ΟΘΟΝΗ 3: Αντίστροφη Μέτρηση -->
    <div id="screen-countdown" class="screen bg-amber-500 text-amber-950 flex justify-center items-center">
        <div class="text-center px-4">
            <h1 class="text-4xl md:text-5xl font-black mb-8 leading-tight">Αφήστε τα κινητά κάτω!</h1>
            <div id="countdown-number" class="text-9xl font-black tracking-tighter tabular-nums drop-shadow-lg">5</div>
            <p class="mt-8 text-xl font-bold opacity-80">Μην το ακουμπήσετε!</p>
        </div>
    </div>

    <!-- ΟΘΟΝΗ 4: Οπλισμένο -->
    <div id="screen-armed" class="screen pulse-bg text-white flex justify-center items-center select-none touch-none">
        <div class="text-center px-4">
            <div class="text-7xl mb-6">💣</div>
            <h1 class="text-5xl font-black tracking-tighter mb-4">ΟΠΛΙΣΜΕΝΟ</h1>
            <p class="text-2xl font-bold opacity-90 uppercase tracking-widest">ΜΗΝ ΑΚΟΥΜΠΑΣ</p>
        </div>
    </div>

    <!-- ΟΘΟΝΗ 5: Αποτέλεσμα -->
    <div id="screen-result" class="screen items-center justify-center p-6 bg-slate-900 transition-colors duration-500">
        <div class="max-w-md w-full bg-slate-800 p-8 rounded-[2rem] shadow-2xl border border-slate-700 text-center relative overflow-hidden">
            <!-- Διακόσμηση -->
            <div id="result-deco" class="absolute top-0 left-0 w-full h-3 bg-gradient-to-r from-red-500 to-orange-500"></div>
            
            <div id="result-icon" class="text-7xl mb-6 mt-4">💥</div>
            <h2 id="result-title" class="text-3xl font-black text-white mb-2 leading-tight">Κάποιος κουνήθηκε!</h2>
            
            <div class="bg-slate-900/50 rounded-2xl p-6 my-8 border border-slate-700/50 shadow-inner">
                <p class="text-slate-400 text-xs font-bold uppercase tracking-widest mb-2">Ο ΧΑΜΕΝΟΣ</p>
                <p id="result-loser" class="text-4xl font-black text-red-400 mb-8 break-words">Όνομα</p>
                
                <p class="text-slate-400 text-xs font-bold uppercase tracking-widest mb-2">Η ΑΠΟΣΤΟΛΗ ΤΟΥ/ΤΗΣ</p>
                <p id="result-penalty" class="text-xl font-bold text-amber-400 leading-tight">Καμία</p>
            </div>
            
            <button id="btn-play-again" class="w-full bg-indigo-500 text-white font-bold py-4 rounded-xl active:scale-95 transition-transform text-lg hidden">
                Παίξτε Ξανά
            </button>
            <p id="guest-result-text" class="text-center text-slate-400 font-medium hidden mt-4">
                Αναμονή για νέο γύρο...
            </p>
        </div>
    </div>

    <script>
        // --- Ρυθμίσεις & Δεδομένα ---
        const ROOM_PREFIX = 'dont-touch-room-';
        const PENALTIES = [
            "Κερνάς τους επόμενους καφέδες της παρέας!",
            "Παραγγέλνεις και πληρώνεις τις επόμενες πίτσες/σουβλάκια!",
            "Αναλαμβάνεις το πλύσιμο των πιάτων (ή το μάζεμα του τραπεζιού)!",
            "Πέτα τα σκουπίδια και συγύρισε το σαλόνι!",
            "Κάνε το αγαπημένο σου χορευτικό για 1 λεπτό!",
            "Τραγούδα το ρεφρέν από ένα γνωστό τραγούδι με κλειστή μύτη!",
            "Μίλα με αστεία ξενική προφορά για τα επόμενα 5 λεπτά!",
            "Βγάλε μια αστεία selfie με την παρέα και κάντη story!",
            "Κάνε παντομίμα μια ταινία. Αν δεν τη βρούμε σε 1 λεπτό, κάνεις 10 καθίσματα!",
            "Φέρε σε όλους από ένα ποτήρι νερό, σαν σερβιτόρος!"
        ];

        // --- Κατάσταση Εφαρμογής (State) ---
        let peer = null;
        let isHost = false;
        let myName = "";
        let roomPin = "";
        let isArmed = false;
        let hasLostThisRound = false;

        // Για τον Host
        let guestConnections = []; 
        let players = []; // { id, name }

        // Για τον Guest
        let hostConnection = null;

        // --- Βοηθητικές Συναρτήσεις ---
        function showScreen(screenId) {
            document.querySelectorAll('.screen').forEach(el => el.classList.remove('active'));
            document.getElementById(screenId).classList.add('active');
        }

        function generatePIN() {
            return Math.floor(1000 + Math.random() * 9000).toString(); // 4-digit PIN
        }

        // --- Προσαρμοσμένο Alert ---
        window.showAlert = function(msg) {
            document.getElementById('alert-message').innerText = msg;
            const modal = document.getElementById('alert-modal');
            modal.classList.remove('hidden');
            setTimeout(() => {
                document.getElementById('alert-box').classList.remove('scale-95');
                document.getElementById('alert-box').classList.add('scale-100');
            }, 10);
        }

        window.closeAlert = function() {
            document.getElementById('alert-box').classList.remove('scale-100');
            document.getElementById('alert-box').classList.add('scale-95');
            setTimeout(() => {
                document.getElementById('alert-modal').classList.add('hidden');
            }, 300);
        }

        // --- 1. Αρχικοποίηση Host ---
        document.getElementById('btn-create-room').addEventListener('click', () => {
            const nameInput = document.getElementById('input-name').value.trim();
            if (!nameInput) return showAlert("Παρακαλώ βάλε το όνομά σου!");

            myName = nameInput;
            isHost = true;
            roomPin = generatePIN();
            const peerId = ROOM_PREFIX + roomPin;

            const btn = document.getElementById('btn-create-room');
            btn.innerText = "Δημιουργία...";
            btn.disabled = true;

            // Δημιουργία Peer με συγκεκριμένο ID
            peer = new Peer(peerId);

            peer.on('open', (id) => {
                // Προσθήκη του εαυτού μας στη λίστα
                players = [{ id: 'host', name: myName }];
                updateLobbyUI();
                setupHostUI();
                showScreen('screen-lobby');
            });

            peer.on('connection', (conn) => {
                // Όταν συνδέεται ένας Guest
                guestConnections.push(conn);

                conn.on('data', (data) => {
                    if (data.type === 'JOIN') {
                        players.push({ id: conn.peer, name: data.name });
                        broadcastPlayers();
                        updateLobbyUI();
                    }
                    if (data.type === 'LOST') {
                        handleSomeoneLost(data.name);
                    }
                });

                conn.on('close', () => {
                    players = players.filter(p => p.id !== conn.peer);
                    guestConnections = guestConnections.filter(c => c.peer !== conn.peer);
                    broadcastPlayers();
                    updateLobbyUI();
                });
            });

            peer.on('error', (err) => {
                console.error(err);
                btn.innerText = "Δημιουργία Δωματίου";
                btn.disabled = false;
                if(err.type === 'unavailable-id') {
                    showAlert("Αυτό το PIN χρησιμοποιείται. Ξαναπροσπάθησε.");
                } else {
                    showAlert("Σφάλμα σύνδεσης. Ελέγξτε το ίντερνετ.");
                }
            });
        });

        // --- 2. Αρχικοποίηση Guest ---
        document.getElementById('btn-join-room').addEventListener('click', () => {
            const nameInput = document.getElementById('input-name').value.trim();
            roomPin = document.getElementById('input-pin').value.trim().toUpperCase();

            if (!nameInput) return showAlert("Παρακαλώ βάλε το όνομά σου!");
            if (!roomPin || roomPin.length !== 4) return showAlert("Βάλε ένα έγκυρο 4-ψήφιο PIN!");

            myName = nameInput;
            isHost = false;

            const btn = document.getElementById('btn-join-room');
            btn.innerText = "...";
            btn.disabled = true;

            // Δημιουργία τυχαίου Peer
            peer = new Peer();

            peer.on('open', (id) => {
                const hostId = ROOM_PREFIX + roomPin;
                hostConnection = peer.connect(hostId);

                hostConnection.on('open', () => {
                    // Στέλνουμε το όνομά μας
                    hostConnection.send({ type: 'JOIN', name: myName });
                    setupGuestUI();
                    showScreen('screen-lobby');
                });

                hostConnection.on('data', (data) => {
                    if (data.type === 'PLAYERS') {
                        players = data.players;
                        updateLobbyUI();
                    }
                    if (data.type === 'STATE') {
                        handleStateChange(data.state, data.payload);
                    }
                });

                hostConnection.on('close', () => {
                    showAlert("Ο Host αποσυνδέθηκε. Επιστροφή στην αρχική.");
                    setTimeout(() => location.reload(), 2000);
                });
            });

            peer.on('error', (err) => {
                console.error(err);
                btn.innerText = "Είσοδος";
                btn.disabled = false;
                showAlert("Δεν βρέθηκε δωμάτιο με αυτό το PIN.");
            });
        });

        // --- Λειτουργίες Host (Broadcasting) ---
        function broadcastPlayers() {
            if (!isHost) return;
            guestConnections.forEach(conn => {
                conn.send({ type: 'PLAYERS', players: players });
            });
        }

        function broadcastState(stateStr, payload = null) {
            if (!isHost) return;
            guestConnections.forEach(conn => {
                conn.send({ type: 'STATE', state: stateStr, payload: payload });
            });
            // Ο Host εφαρμόζει την αλλαγή και στον εαυτό του
            handleStateChange(stateStr, payload);
        }

        // --- Διαχείριση Καταστάσεων (State Handler) ---
        function handleStateChange(newState, payload) {
            isArmed = false; // Προεπιλογή: ασφαλές

            if (newState === 'countdown') {
                startCountdownPhase();
            } 
            else if (newState === 'armed') {
                armDevice();
            } 
            else if (newState === 'result') {
                showResultPhase(payload.loser, payload.penalty);
            }
            else if (newState === 'lobby') {
                resetToLobby();
            }
        }

        // --- Ενημέρωση UI ---
        function updateLobbyUI() {
            document.getElementById('display-pin').innerText = roomPin;
            document.getElementById('player-count').innerText = players.length;
            
            const list = document.getElementById('players-list');
            list.innerHTML = '';
            
            players.forEach(p => {
                const li = document.createElement('li');
                li.className = 'flex items-center justify-between bg-slate-900 p-4 rounded-xl border border-slate-700/50';
                
                let badge = '';
                if (p.id === 'host' || (isHost && p.name === myName)) badge = '<span class="text-xs bg-indigo-500/20 text-indigo-300 px-2 py-1 rounded">HOST</span>';
                
                li.innerHTML = `
                    <span class="font-bold text-white text-lg">${p.name}</span>
                    ${badge}
                `;
                list.appendChild(li);
            });
        }

        function setupHostUI() {
            document.getElementById('btn-start-game').classList.remove('hidden');
            document.getElementById('guest-waiting-text').classList.add('hidden');
            document.getElementById('btn-play-again').classList.remove('hidden');
            document.getElementById('guest-result-text').classList.add('hidden');
        }

        function setupGuestUI() {
            document.getElementById('btn-start-game').classList.add('hidden');
            document.getElementById('guest-waiting-text').classList.remove('hidden');
            document.getElementById('btn-play-again').classList.add('hidden');
            document.getElementById('guest-result-text').classList.remove('hidden');
        }

        // --- Ροή Παιχνιδιού ---
        
        // Host πατάει "Έναρξη"
        document.getElementById('btn-start-game').addEventListener('click', () => {
            if (players.length < 1) return showAlert("Χρειάζεται τουλάχιστον 1 παίκτης!"); // Επιτρέπει και σόλο για δοκιμή
            broadcastState('countdown');
        });

        function startCountdownPhase() {
            showScreen('screen-countdown');
            hasLostThisRound = false;
            
            let count = 5;
            const countEl = document.getElementById('countdown-number');
            countEl.innerText = count;

            const interval = setInterval(() => {
                count--;
                if (count > 0) {
                    countEl.innerText = count;
                } else {
                    clearInterval(interval);
                    if (isHost) {
                        // Μόνο ο Host αποφασίζει πότε τελειώνει η αντίστροφη μέτρηση
                        broadcastState('armed');
                    }
                }
            }, 1000);
        }

        function armDevice() {
            showScreen('screen-armed');
            // Δίνουμε 500ms χάρη για να αφήσουν το κινητό ήρεμα αφού μηδενίσει
            setTimeout(() => {
                isArmed = true;
            }, 500);
        }

        function triggerLoss() {
            if (!isArmed || hasLostThisRound) return;
            hasLostThisRound = true;
            isArmed = false;

            // Ανάδραση δόνησης (όπου υποστηρίζεται)
            if (window.navigator && window.navigator.vibrate) {
                window.navigator.vibrate([200, 100, 200]);
            }

            if (isHost) {
                handleSomeoneLost(myName);
            } else {
                if(hostConnection) hostConnection.send({ type: 'LOST', name: myName });
            }
        }

        // Εκτελείται ΜΟΝΟ στον Host όταν κάποιος χάσει
        let roundOver = false;
        function handleSomeoneLost(loserName) {
            if (!isHost || roundOver) return; // Ο πρώτος που στέλνει χάνει
            roundOver = true;
            
            const randomPenalty = PENALTIES[Math.floor(Math.random() * PENALTIES.length)];
            
            broadcastState('result', {
                loser: loserName,
                penalty: randomPenalty
            });
        }

        function showResultPhase(loserName, penalty) {
            showScreen('screen-result');
            isArmed = false; // Ασφάλεια
            
            const screen = document.getElementById('screen-result');
            const deco = document.getElementById('result-deco');
            const title = document.getElementById('result-title');
            const icon = document.getElementById('result-icon');
            const loserText = document.getElementById('result-loser');
            
            loserText.innerText = loserName;
            document.getElementById('result-penalty').innerText = penalty;
            
            // Καθαρισμός προηγούμενων χρωμάτων (ώστε να επαναφέρεται σωστά σε νέο γύρο)
            screen.classList.remove('bg-slate-900', 'bg-red-900', 'bg-emerald-900');
            title.classList.remove('text-white', 'text-red-400', 'text-emerald-400');
            loserText.classList.remove('text-red-400', 'text-emerald-400');
            
            if (loserName === myName) {
                // ΕΓΩ ΕΧΑΣΑ (Κόκκινο θέμα)
                screen.classList.add('bg-red-900');
                deco.className = 'absolute top-0 left-0 w-full h-3 bg-gradient-to-r from-red-600 to-orange-500';
                title.innerText = 'ΕΧΑΣΕΣ!';
                title.classList.add('text-white');
                icon.innerText = '😭';
                loserText.classList.add('text-red-400');
            } else {
                // ΚΕΡΔΙΣΑ (Πράσινο θέμα)
                screen.classList.add('bg-emerald-900');
                deco.className = 'absolute top-0 left-0 w-full h-3 bg-gradient-to-r from-emerald-500 to-teal-400';
                title.innerText = 'ΚΕΡΔΙΣΕΣ!';
                title.classList.add('text-emerald-400');
                icon.innerText = '🎉';
                loserText.classList.add('text-emerald-400');
            }
        }

        // Host πατάει "Παίξτε ξανά"
        document.getElementById('btn-play-again').addEventListener('click', () => {
            roundOver = false;
            broadcastState('lobby');
        });

        function resetToLobby() {
            hasLostThisRound = false;
            isArmed = false;
            showScreen('screen-lobby');
        }

        // --- Αισθητήρες (Sensors & Touch) ---
        
        // Ζήτηση άδειας για iOS 13+
        document.getElementById('btn-request-sensors').addEventListener('click', async () => {
            if (typeof DeviceMotionEvent !== 'undefined' && typeof DeviceMotionEvent.requestPermission === 'function') {
                try {
                    const permission = await DeviceMotionEvent.requestPermission();
                    if (permission === 'granted') {
                        document.getElementById('btn-request-sensors').classList.add('hidden');
                    } else {
                        showAlert("Η άδεια απορρίφθηκε. Το παιχνίδι δεν θα λειτουργεί σωστά.");
                    }
                } catch (e) {
                    console.error(e);
                    showAlert("Σφάλμα κατά τη ζήτηση άδειας.");
                }
            } else {
                // Android & Παλαιότερα iOS δεν χρειάζονται ρητή άδεια με κουμπί
                document.getElementById('btn-request-sensors').classList.add('hidden');
            }
        });

        // Ανίχνευση Κίνησης (Επιταχυνσιόμετρο)
        window.addEventListener('devicemotion', (e) => {
            if (!isArmed) return;

            let ax = e.acceleration?.x || 0;
            let ay = e.acceleration?.y || 0;
            let az = e.acceleration?.z || 0;

            // Fallback αν το acceleration είναι null (ορισμένες συσκευές δίνουν μόνο IncludingGravity)
            if (e.acceleration === null && e.accelerationIncludingGravity) {
                ax = e.accelerationIncludingGravity.x || 0;
                ay = e.accelerationIncludingGravity.y || 0;
                // Αφαιρούμε περίπου τη βαρύτητα. 
                // Χρησιμοποιούμε τη συνολική διαφορά μεγέθους για ανίχνευση "κουνήματος"
                az = (e.accelerationIncludingGravity.z || 0) - 9.81; 
            }

            // Υπολογισμός συνολικού μεγέθους επιτάχυνσης (Magnitude)
            const magnitude = Math.sqrt(ax * ax + ay * ay + az * az);

            // Κατώφλι (Threshold). 1.5 m/s^2 είναι αρκετά ευαίσθητο.
            if (magnitude > 1.5) {
                triggerLoss();
            }
        }, true);

        // Ανίχνευση Αγγίγματος (Οθόνη)
        document.addEventListener('touchstart', (e) => {
            if (!isArmed) return;
            triggerLoss();
        }, { passive: false });
        
        // Για δοκιμή σε υπολογιστή
        document.addEventListener('mousedown', (e) => {
            if (!isArmed) return;
            triggerLoss();
        });

        // --- ΝΕΟ: Αντιγραφή Link ---
        document.getElementById('btn-copy-link').addEventListener('click', () => {
            const baseUrl = window.location.href.split('?')[0];
            const inviteUrl = `${baseUrl}?room=${roomPin}`;
            
            // Χρήση execCommand για μέγιστη συμβατότητα (και σε iFrames)
            const tempInput = document.createElement("input");
            tempInput.value = inviteUrl;
            document.body.appendChild(tempInput);
            tempInput.select();
            try {
                document.execCommand("copy");
                const btn = document.getElementById('btn-copy-link');
                const originalText = btn.innerHTML;
                btn.innerHTML = '✅ Αντιγράφηκε!';
                setTimeout(() => { btn.innerHTML = originalText; }, 2000);
            } catch (err) {
                showAlert("Αποτυχία αντιγραφής του link.");
            }
            document.body.removeChild(tempInput);
        });

        // --- ΝΕΟ: Έλεγχος URL για Πρόσκληση (Όταν φορτώνει η σελίδα) ---
        window.addEventListener('DOMContentLoaded', () => {
            const urlParams = new URLSearchParams(window.location.search);
            const roomParam = urlParams.get('room');
            
            if (roomParam) {
                // Συμπλήρωση του PIN αυτόματα
                document.getElementById('input-pin').value = roomParam;
                // Εστίαση στο πεδίο του ονόματος για ταχύτητα
                document.getElementById('input-name').focus();
            }
        });

    </script>
</body>
</html>
