<!DOCTYPE html>
<html lang="el">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Μη μ' ακουμπάς</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #0f172a;
            color: #f8fafc;
            touch-action: manipulation; /* Prevent double-tap zoom */
            overflow: hidden;
        }
        
        .screen {
            display: none;
            width: 100vw;
            height: 100vh;
            flex-direction: column;
        }
        
        .screen.active {
            display: flex;
        }

        .pulse-bg {
            animation: pulse-red 2s infinite;
        }

        @keyframes pulse-red {
            0% { background-color: #dc2626; }
            50% { background-color: #991b1b; }
            100% { background-color: #dc2626; }
        }

        /* Hide scrollbars */
        ::-webkit-scrollbar { display: none; }
        * { -ms-overflow-style: none; scrollbar-width: none; }
    </style>
</head>
<body class="antialiased">

    <!-- Error/Alert Modal -->
    <div id="alert-modal" class="fixed inset-0 z-50 flex items-center justify-center bg-black/60 hidden backdrop-blur-sm transition-opacity duration-300">
        <div class="bg-slate-800 p-6 rounded-2xl shadow-2xl max-w-sm w-full mx-4 text-center transform scale-95 transition-transform duration-300" id="alert-box">
            <div class="text-4xl mb-4">⚠️</div>
            <p id="alert-message" class="text-lg font-semibold text-white mb-6"></p>
            <button onclick="closeAlert()" class="w-full bg-indigo-500 hover:bg-indigo-600 text-white font-bold py-3 rounded-xl transition-colors">
                Εντάξει
            </button>
        </div>
    </div>

    <!-- Screen 1: Join/Create Room -->
    <div id="join-screen" class="screen active items-center justify-center p-6 bg-slate-900">
        <div class="max-w-md w-full space-y-8 bg-slate-800 p-8 rounded-3xl shadow-xl border border-slate-700">
            <div class="text-center">
                <h1 class="text-4xl font-black text-transparent bg-clip-text bg-gradient-to-r from-red-400 to-orange-500 tracking-tight">
                    ΜΗ Μ' ΑΚΟΥΜΠΑΣ
                </h1>
                <p class="text-slate-400 mt-2 text-sm">Το παιχνίδι που απαιτεί απόλυτη ακινησία!</p>
            </div>
            
            <div class="space-y-5">
                <div>
                    <label class="block text-sm font-medium text-slate-300 mb-1">Το όνομά σου</label>
                    <input type="text" id="playerName" class="w-full bg-slate-900 border border-slate-600 rounded-xl px-4 py-3 text-white focus:outline-none focus:ring-2 focus:ring-indigo-500 transition-all" placeholder="π.χ. Γιώργος" maxlength="15">
                </div>
                <div>
                    <label class="block text-sm font-medium text-slate-300 mb-1">Κωδικός Δωματίου</label>
                    <input type="text" id="roomCode" class="w-full bg-slate-900 border border-slate-600 rounded-xl px-4 py-3 text-white font-mono uppercase focus:outline-none focus:ring-2 focus:ring-indigo-500 transition-all" placeholder="π.χ. ROOM123" maxlength="8">
                </div>
                <button id="btn-join" class="w-full bg-gradient-to-r from-indigo-500 to-purple-600 hover:from-indigo-600 hover:to-purple-700 text-white font-bold py-4 rounded-xl shadow-lg transform hover:scale-[1.02] transition-all flex justify-center items-center gap-2">
                    <span>Είσοδος στο Δωμάτιο</span>
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 10V3L4 14h7v7l9-11h-7z"></path></svg>
                </button>
            </div>
        </div>
    </div>

    <!-- Screen 2: Lobby -->
    <div id="lobby-screen" class="screen bg-slate-900 p-6 flex flex-col">
        <div class="max-w-md w-full mx-auto flex-1 flex flex-col pt-8 pb-4 h-full">
            <div class="text-center mb-8">
                <p class="text-slate-400 text-sm font-semibold uppercase tracking-wider">Δωματιο</p>
                <h2 id="display-room-code" class="text-4xl font-mono font-bold text-white tracking-widest mt-1">---</h2>
            </div>

            <div class="bg-slate-800 rounded-3xl p-6 border border-slate-700 flex-1 overflow-y-auto shadow-inner mb-6">
                <h3 class="text-lg font-bold text-slate-200 mb-4 flex items-center justify-between">
                    <span>Παίκτες</span>
                    <span id="player-count" class="bg-slate-700 px-3 py-1 rounded-full text-sm">0</span>
                </h3>
                <ul id="players-list" class="space-y-3">
                    <!-- Players will be injected here -->
                </ul>
            </div>

            <div class="space-y-3 mt-auto">
                <button id="btn-ready" class="w-full bg-emerald-500 hover:bg-emerald-600 text-white font-bold py-4 rounded-xl shadow-lg transition-colors text-lg">
                    Είμαι Έτοιμος! (Απαιτεί πρόσβαση)
                </button>
                <button id="btn-start" class="w-full bg-indigo-500 hover:bg-indigo-600 text-white font-bold py-4 rounded-xl shadow-lg transition-colors text-lg hidden">
                    Έναρξη Παιχνιδιού
                </button>
            </div>
        </div>
    </div>

    <!-- Screen 3: Game / Countdown -->
    <div id="game-screen" class="screen transition-colors duration-500">
        <div class="flex flex-col items-center justify-center h-full w-full p-6 text-center select-none" id="game-content">
            <h1 id="game-title" class="text-4xl md:text-5xl font-black mb-6">Αφήστε το κινητό κάτω!</h1>
            <div id="game-countdown" class="text-9xl font-black tracking-tighter">5</div>
            <p id="game-subtitle" class="mt-8 text-xl font-medium opacity-80">Προσοχή: Μην το ακουμπήσετε και μην το κουνήσετε!</p>
        </div>
    </div>

    <!-- Screen 4: Result -->
    <div id="result-screen" class="screen items-center justify-center p-6 bg-slate-900">
        <div class="max-w-md w-full bg-slate-800 p-8 rounded-3xl shadow-2xl border border-slate-700 text-center relative overflow-hidden">
            <div class="absolute top-0 left-0 w-full h-2 bg-gradient-to-r from-red-500 to-orange-500"></div>
            
            <div class="text-6xl mb-6">💥</div>
            <h2 class="text-3xl font-black text-white mb-2">Κάποιος κουνήθηκε!</h2>
            
            <div class="bg-slate-900 rounded-2xl p-6 my-8 border border-slate-700">
                <p class="text-slate-400 text-sm uppercase tracking-wider mb-2">Ο Χαμενος</p>
                <p id="result-loser" class="text-3xl font-bold text-red-400 mb-6">Όνομα</p>
                
                <p class="text-slate-400 text-sm uppercase tracking-wider mb-2">Η Αποστολη του/της</p>
                <p id="result-penalty" class="text-2xl font-bold text-emerald-400 leading-tight">Κέρασε καφέ</p>
            </div>
            
            <button id="btn-replay" class="w-full bg-slate-700 hover:bg-slate-600 text-white font-bold py-4 rounded-xl transition-colors text-lg">
                Παίξτε Ξανά
            </button>
        </div>
    </div>

    <!-- Firebase Scripts -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, signInAnonymously, signInWithCustomToken } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, doc, setDoc, getDoc, updateDoc, onSnapshot } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        // Global Env Variables provided by platform
        const appId = typeof __app_id !== 'undefined' ? __app_id : 'default-dont-touch-app';
        const firebaseConfigStr = typeof __firebase_config !== 'undefined' ? __firebase_config : '{}';
        
        let app, auth, db;
        try {
            const firebaseConfig = JSON.parse(firebaseConfigStr);
            if(Object.keys(firebaseConfig).length > 0) {
                app = initializeApp(firebaseConfig);
                auth = getAuth(app);
                db = getFirestore(app);
            }
        } catch(e) {
            console.error("Firebase Config error:", e);
        }

        // App State
        let uid = null;
        let myName = '';
        let roomCode = '';
        let roomRef = null;
        let unsubscribeRoom = null;
        let currentScreen = 'join-screen';
        
        // Game Logic State
        let isArmed = false;
        let hasLost = false;
        let countdownInterval = null;
        let armedTimeout = null;

        const PENALTIES = [
            'Κέρασε έναν καφέ',
            'Κέρασε ένα γεύμα',
            'Κέρασε ένα ποτό',
            'Πλύνε τα πιάτα',
            'Καθάρισε τον χώρο',
            'Κάνε μια αγγαρεία',
            'Κάνε 10 push-ups',
            'Τραγούδα ένα ρεφρέν',
            'Κέρασε γλυκό αύριο'
        ];

        // --- Custom Alert System ---
        window.showAlert = function(msg) {
            document.getElementById('alert-message').innerText = msg;
            const modal = document.getElementById('alert-modal');
            modal.classList.remove('hidden');
            setTimeout(() => {
                document.getElementById('alert-box').classList.remove('scale-95');
                document.getElementById('alert-box').classList.add('scale-100');
            }, 10);
        }
        window.closeAlert = function() {
            document.getElementById('alert-box').classList.remove('scale-100');
            document.getElementById('alert-box').classList.add('scale-95');
            setTimeout(() => {
                document.getElementById('alert-modal').classList.add('hidden');
            }, 300);
        }

        function switchScreen(screenId) {
            document.querySelectorAll('.screen').forEach(el => el.classList.remove('active'));
            document.getElementById(screenId).classList.add('active');
            currentScreen = screenId;
        }

        // --- Auth & Setup ---
        async function ensureAuth() {
            if (!auth) {
                showAlert("Σφάλμα σύνδεσης συστήματος.");
                throw new Error("No Auth");
            }
            if (!auth.currentUser) {
                if (typeof __initial_auth_token !== 'undefined' && __initial_auth_token) {
                    await signInWithCustomToken(auth, __initial_auth_token);
                } else {
                    await signInAnonymously(auth);
                }
            }
            uid = auth.currentUser.uid;
        }

        // --- View Handlers ---
        document.getElementById('btn-join').addEventListener('click', async () => {
            const nameInput = document.getElementById('playerName').value.trim();
            const roomInput = document.getElementById('roomCode').value.trim().toUpperCase();

            if (!nameInput || !roomInput) {
                showAlert("Παρακαλώ συμπληρώστε Όνομα και Κωδικό Δωματίου.");
                return;
            }

            const btn = document.getElementById('btn-join');
            btn.disabled = true;
            btn.innerHTML = '<span class="animate-pulse">Σύνδεση...</span>';

            try {
                await ensureAuth();
                myName = nameInput;
                roomCode = roomInput;
                
                // RULES COMPLIANT PATH: /artifacts/{appId}/public/data/rooms/{roomCode}
                roomRef = doc(db, 'artifacts', appId, 'public', 'data', 'rooms', roomCode);
                
                const roomSnap = await getDoc(roomRef);
                
                if (!roomSnap.exists()) {
                    // Create Room
                    await setDoc(roomRef, {
                        state: 'lobby',
                        players: {
                            [uid]: { name: myName, ready: false }
                        },
                        loserUid: null,
                        loserName: null,
                        penalty: null,
                        updatedAt: Date.now()
                    });
                } else {
                    // Join Room
                    const data = roomSnap.data();
                    if (data.state !== 'lobby' && data.state !== 'result') {
                        showAlert("Το παιχνίδι σε αυτό το δωμάτιο είναι ήδη σε εξέλιξη!");
                        btn.disabled = false;
                        btn.innerHTML = '<span>Είσοδος στο Δωμάτιο</span>';
                        return;
                    }
                    await updateDoc(roomRef, {
                        [`players.${uid}`]: { name: myName, ready: false },
                        updatedAt: Date.now()
                    });
                }

                document.getElementById('display-room-code').innerText = roomCode;
                startListeningToRoom();
                switchScreen('lobby-screen');

            } catch (err) {
                console.error(err);
                showAlert("Υπήρξε πρόβλημα κατά τη σύνδεση.");
            } finally {
                btn.disabled = false;
                btn.innerHTML = '<span>Είσοδος στο Δωμάτιο</span>';
            }
        });

        document.getElementById('btn-ready').addEventListener('click', async () => {
            // Request permissions for iOS 13+ inside a user gesture
            if (typeof DeviceMotionEvent !== 'undefined' && typeof DeviceMotionEvent.requestPermission === 'function') {
                try {
                    const permission = await DeviceMotionEvent.requestPermission();
                    if (permission !== 'granted') {
                        showAlert("Απαιτείται άδεια για τους αισθητήρες της συσκευής για να παίξετε!");
                        return;
                    }
                } catch (e) {
                    console.error("Permission error", e);
                    showAlert("Δεν μπορέσαμε να πάρουμε άδεια για τους αισθητήρες.");
                    return;
                }
            }
            
            try {
                await updateDoc(roomRef, {
                    [`players.${uid}.ready`]: true
                });
                document.getElementById('btn-ready').classList.add('hidden');
            } catch (e) {
                console.error(e);
                showAlert("Σφάλμα συγχρονισμού.");
            }
        });

        document.getElementById('btn-start').addEventListener('click', async () => {
            try {
                await updateDoc(roomRef, {
                    state: 'countdown',
                    loserUid: null,
                    loserName: null,
                    penalty: null,
                    updatedAt: Date.now()
                });
            } catch (e) {
                console.error(e);
            }
        });

        document.getElementById('btn-replay').addEventListener('click', async () => {
            try {
                // Reset my ready state and set room back to lobby
                await updateDoc(roomRef, {
                    [`players.${uid}.ready`]: false,
                    state: 'lobby',
                    loserUid: null,
                    loserName: null,
                    penalty: null,
                    updatedAt: Date.now()
                });
            } catch (e) {
                console.error(e);
            }
        });


        // --- Firebase Listener ---
        function startListeningToRoom() {
            if (unsubscribeRoom) unsubscribeRoom();

            unsubscribeRoom = onSnapshot(roomRef, (docSnap) => {
                if (!docSnap.exists()) return;
                const data = docSnap.data();

                if (data.state === 'lobby') {
                    renderLobby(data.players);
                    if (currentScreen !== 'lobby-screen') switchScreen('lobby-screen');
                    resetGameLocalState();
                } 
                else if (data.state === 'countdown') {
                    if (currentScreen !== 'game-screen') {
                        startCountdownPhase();
                    }
                }
                else if (data.state === 'result') {
                    showResultPhase(data.loserName, data.penalty);
                }
            }, (error) => {
                console.error("Snapshot error:", error);
                showAlert("Χάθηκε η σύνδεση με το δωμάτιο.");
            });
        }

        function renderLobby(playersMap) {
            const listEl = document.getElementById('players-list');
            const countEl = document.getElementById('player-count');
            listEl.innerHTML = '';
            
            const players = Object.values(playersMap || {});
            countEl.innerText = players.length;

            let allReady = true;
            let iAmReady = false;

            for (const [key, p] of Object.entries(playersMap || {})) {
                if (!p.ready) allReady = false;
                if (key === uid && p.ready) iAmReady = true;

                const li = document.createElement('li');
                li.className = 'flex items-center justify-between bg-slate-900/50 p-3 rounded-xl';
                li.innerHTML = `
                    <span class="font-medium text-white">${p.name} ${key === uid ? '(Εσύ)' : ''}</span>
                    <span class="text-sm font-bold ${p.ready ? 'text-emerald-400' : 'text-slate-500'}">
                        ${p.ready ? 'ΕΤΟΙΜΟΣ' : 'ΑΝΑΜΟΝΗ'}
                    </span>
                `;
                listEl.appendChild(li);
            }

            // UI Adjustments
            document.getElementById('btn-ready').classList.toggle('hidden', iAmReady);
            
            // Show start button if everyone is ready and there are at least 2 players (or 1 for testing)
            const canStart = allReady && players.length > 0; 
            document.getElementById('btn-start').classList.toggle('hidden', !canStart);
        }

        // --- Game Phases ---
        function resetGameLocalState() {
            isArmed = false;
            hasLost = false;
            if (countdownInterval) clearInterval(countdownInterval);
            if (armedTimeout) clearTimeout(armedTimeout);
            
            const gameScreen = document.getElementById('game-screen');
            gameScreen.className = 'screen transition-colors duration-500 bg-yellow-400 text-yellow-900';
            
            document.getElementById('btn-ready').classList.remove('hidden');
        }

        function startCountdownPhase() {
            switchScreen('game-screen');
            isArmed = false;
            hasLost = false;

            const gameScreen = document.getElementById('game-screen');
            const titleEl = document.getElementById('game-title');
            const countEl = document.getElementById('game-countdown');
            const subEl = document.getElementById('game-subtitle');

            gameScreen.className = 'screen active transition-colors duration-500 bg-amber-400 text-amber-900';
            titleEl.innerText = 'Αφήστε το κινητό κάτω!';
            subEl.innerText = 'Προσοχή: Μην το ακουμπήσετε και μην το κουνήσετε!';
            subEl.classList.remove('hidden');
            
            let count = 5;
            countEl.innerText = count;

            countdownInterval = setInterval(() => {
                count--;
                if (count > 0) {
                    countEl.innerText = count;
                } else {
                    clearInterval(countdownInterval);
                    armDevice();
                }
            }, 1000);
        }

        function armDevice() {
            const gameScreen = document.getElementById('game-screen');
            const titleEl = document.getElementById('game-title');
            const countEl = document.getElementById('game-countdown');
            const subEl = document.getElementById('game-subtitle');

            gameScreen.className = 'screen active pulse-bg text-white';
            titleEl.innerText = "ΜΗ Μ' ΑΚΟΥΜΠΑΣ!";
            countEl.innerText = "ΟΠΛΙΣΜΕΝΟ";
            countEl.classList.remove('text-9xl');
            countEl.classList.add('text-6xl', 'mt-4');
            subEl.classList.add('hidden');

            // 1 second grace period to ensure the phone is settled down
            armedTimeout = setTimeout(() => {
                isArmed = true;
            }, 1000);
        }

        function showResultPhase(loserName, penalty) {
            switchScreen('result-screen');
            isArmed = false;
            document.getElementById('result-loser').innerText = loserName || 'Άγνωστος';
            document.getElementById('result-penalty').innerText = penalty || 'Καμία';
        }

        // --- Sensor Listeners ---
        async function triggerLoss() {
            if (!isArmed || hasLost) return;
            hasLost = true; // prevent multiple triggers locally
            isArmed = false;

            const randomPenalty = PENALTIES[Math.floor(Math.random() * PENALTIES.length)];
            
            try {
                // Update Firebase. Note: if multiple people trigger instantly, 
                // last write wins, but that's acceptable for this casual game.
                await updateDoc(roomRef, {
                    state: 'result',
                    loserUid: uid,
                    loserName: myName,
                    penalty: randomPenalty,
                    updatedAt: Date.now()
                });
                
                // Visual feedback locally immediately
                if (window.navigator && window.navigator.vibrate) {
                    window.navigator.vibrate(200);
                }
            } catch (e) {
                console.error("Loss update failed:", e);
                hasLost = false; // allow retry if failed network
            }
        }

        // Listen for motion
        window.addEventListener('devicemotion', (e) => {
            if (!isArmed) return;

            let ax = e.acceleration?.x || 0;
            let ay = e.acceleration?.y || 0;
            let az = e.acceleration?.z || 0;

            // Fallback for devices that don't report purely 'acceleration'
            if (e.acceleration === null && e.accelerationIncludingGravity) {
                ax = e.accelerationIncludingGravity.x || 0;
                ay = e.accelerationIncludingGravity.y || 0;
                // Roughly remove gravity assuming phone is flat, but absolute magnitude is safer
                az = (e.accelerationIncludingGravity.z || 0) - 9.81;
            }

            // Calculate magnitude of movement
            const magnitude = Math.sqrt(ax * ax + ay * ay + az * az);

            // Threshold: 1.2 m/s^2 is sensitive enough for picking up or bumping table
            if (magnitude > 1.2) {
                triggerLoss();
            }
        }, true);

        // Listen for touch
        document.addEventListener('touchstart', (e) => {
            if (!isArmed) return;
            triggerLoss();
        }, { passive: false }); // capture early
        
        document.addEventListener('mousedown', (e) => {
             // Useful for testing on desktop
             if (!isArmed) return;
             triggerLoss();
        });

    </script>
</body>
</html>
