<title>Paints By FranklyGames</title>

<style>
:root{--bg:#eef0f8;--panel:#fff;--ink:#1e1b3a;--muted:#6b6789;--line:#e2e0ef;--soft:#f0eef8;--accent:#5b4fcf;--ok:#22c55e;--bad:#ef4444;--shadow:0 6px 24px rgba(30,27,58,.1)}
@media(prefers-color-scheme:dark){:root{--bg:#12101f;--panel:#1c1830;--ink:#f0eeff;--muted:#9b97b5;--line:#2e2a48;--soft:#252140;--accent:#8b7fff;--shadow:0 6px 24px rgba(0,0,0,.35);color-scheme:dark}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;overscroll-behavior:none}
body{touch-action:manipulation;background:var(--bg);color:var(--ink);font-family:"Nunito",system-ui,sans-serif;font-weight:700}
.app{max-width:560px;height:100vh;height:100dvh;margin:0 auto;padding:6px 10px;display:flex;flex-direction:column;gap:6px;overflow:hidden;box-sizing:border-box}
.frame{flex:0 0 auto}
header{display:flex;align-items:center;justify-content:center;gap:8px;flex-wrap:nowrap}
.brand{display:flex;align-items:center;gap:8px}
.logo{width:38px;height:38px;border-radius:11px;background:linear-gradient(135deg,#5b4fcf,#e85d9a);display:grid;place-items:center;font-size:1.15rem;box-shadow:var(--shadow)}
h1{margin:0;font-size:1.05rem;font-weight:900}
.stats{display:flex;gap:6px;align-items:center;flex-wrap:wrap;justify-content:flex-end}
.chip{background:var(--panel);border:1.5px solid var(--line);border-radius:999px;padding:5px 10px;font-weight:800;font-size:.8rem;white-space:nowrap;box-shadow:0 2px 8px rgba(30,27,58,.06)}
button{font:inherit;font-weight:800;font-size:.85rem;color:var(--ink);background:var(--panel);border:1.5px solid var(--line);border-radius:14px;padding:10px 14px;cursor:pointer;touch-action:manipulation;box-shadow:0 2px 8px rgba(30,27,58,.07);transition:transform .12s ease,box-shadow .15s ease,background .15s ease,border-color .15s ease}
button:hover{box-shadow:0 4px 14px rgba(30,27,58,.12);transform:translateY(-1px)}
button:active{transform:scale(.96);box-shadow:0 1px 4px rgba(30,27,58,.08)}
button.pri{background:linear-gradient(135deg,#6b5ef0,#5b4fcf);color:#fff;border-color:transparent;box-shadow:0 4px 16px rgba(91,79,207,.35)}
button.pri:hover{box-shadow:0 6px 20px rgba(91,79,207,.45);background:linear-gradient(135deg,#7b6ef8,#6b5ef0)}
.icon-btn{padding:7px 10px;font-size:1.05rem;border-radius:12px}
.frame{background:linear-gradient(160deg,#d9b98f,#b48a5c);border-radius:18px;padding:8px;box-shadow:var(--shadow),inset 0 1px 0 rgba(255,255,255,.3);border:2px solid #9c7449}
.board{position:relative;transform:translateZ(0);width:min(100%,calc(100dvh - 250px));min-width:250px;margin:0 auto;aspect-ratio:1/1;background:#fffcf5;border-radius:10px;overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none;box-shadow:inset 0 0 0 1px #d8c7a4,0 2px 12px rgba(0,0,0,.08)}
.board canvas,.board svg{position:absolute;inset:0;width:100%;height:100%;touch-action:none}
.board canvas{cursor:none}
.board svg{pointer-events:none}
#ring{position:absolute;border:2px solid #fff;box-shadow:0 0 0 1.5px #1e1b3a;border-radius:50%;transform:translate(-50%,-50%);pointer-events:none;display:none;z-index:4}
.shake{animation:flashBad .45s}
@keyframes flashBad{0%,100%{box-shadow:inset 0 0 0 1px #d8c7a4}50%{box-shadow:inset 0 0 0 7px #ef4444}}
#msg{min-height:0;text-align:center;font-size:.85rem;font-weight:800;color:var(--muted);transition:color .2s}
#msg{display:none}
.prog{display:none}
#hint.bad{color:var(--bad)}
.prog{display:flex;align-items:center;gap:8px;font-size:.78rem;color:var(--muted)}
.bar{flex:1;height:10px;border-radius:6px;background:var(--soft);overflow:hidden}
.bar i{display:block;height:100%;width:0;border-radius:6px;background:linear-gradient(90deg,#60a5fa,var(--ok));transition:width .3s ease}
.legend{display:none;flex-wrap:wrap;gap:6px;justify-content:center}
.legend span{display:inline-flex;align-items:center;gap:5px;font-size:.74rem;font-weight:800;background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:3px 8px}
.legend i{width:14px;height:14px;border-radius:4px;border:1px solid rgba(0,0,0,.2);display:inline-block}
.tray{display:flex;justify-content:center;flex-wrap:wrap;gap:4px;padding:8px 4px 4px;margin-top:4px;background:linear-gradient(#e7dccb,#d5c4a6);border-radius:14px;box-shadow:inset 0 2px 4px rgba(0,0,0,.15)}
.pen{position:relative;width:24px;height:84px;flex:none;border:0;background:none;padding:0;box-shadow:none;cursor:pointer;transition:transform .15s}
.pen:hover{background:none;transform:translateY(-3px)}
.pen span{position:absolute;display:block}
.pen .gr{left:50%;top:0;width:6px;height:8px;margin-left:-3px;background:#333;clip-path:polygon(50% 0,100% 100%,0 100%)}
.pen .wood{left:0;right:0;top:0;height:24px;background:linear-gradient(90deg,#c9a06a,#f3dcb0 45%,#d9b07a);clip-path:polygon(50% 0,100% 100%,0 100%)}
.pen .body{left:0;right:0;top:24px;bottom:14px;display:flex;align-items:center;justify-content:center;font-size:.8rem;font-weight:900;color:var(--tx,#fff);text-shadow:0 1px 1px rgba(0,0,0,.25);background:linear-gradient(90deg,rgba(0,0,0,.3) 0,rgba(255,255,255,.4) 22%,rgba(255,255,255,0) 42%,rgba(0,0,0,.12) 80%,rgba(0,0,0,.35) 100%),var(--c)}
.pen .band{left:0;right:0;bottom:6px;height:8px;background:linear-gradient(#f2f2f6,#8f8fa0);box-shadow:0 0 0 1px rgba(0,0,0,.15)}
.pen .ers{left:0;right:0;bottom:0;height:6px;background:#f2a7c3;border-radius:0 0 4px 4px}
.pen[aria-pressed="true"]{transform:translateY(-12px)}
.pen[aria-pressed="true"]::after{content:"";position:absolute;left:50%;bottom:-9px;width:8px;height:8px;margin-left:-4px;border-radius:50%;background:var(--accent)}
.panel{background:var(--panel);border:1.5px solid var(--line);border-radius:18px;padding:10px 12px;display:grid;gap:8px;box-shadow:var(--shadow)}
.panel h2{margin:0 0 6px;font-size:.7rem;font-weight:800;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
.pick{display:flex;gap:10px;flex-wrap:wrap;align-items:flex-start}
.sv{position:relative;width:120px;height:78px;border-radius:10px;overflow:hidden;touch-action:none;border:1.5px solid var(--line);flex-shrink:0}
.sv canvas{width:100%;height:100%;display:block}
.sv i{position:absolute;width:14px;height:14px;margin:-7px 0 0 -7px;border:2px solid #fff;border-radius:50%;box-shadow:0 0 0 1.5px #000;pointer-events:none}
.ctl{display:grid;gap:8px;flex:1;min-width:110px}
#hue{width:100%;height:12px;-webkit-appearance:none;appearance:none;border-radius:6px;background:linear-gradient(90deg,#f00,#ff0,#0f0,#0ff,#00f,#f0f,#f00)}
#hue::-webkit-slider-thumb{-webkit-appearance:none;width:20px;height:20px;background:#fff;border:2px solid var(--ink);border-radius:50%}
.cur{display:flex;gap:6px;align-items:center}
#prev{width:34px;height:34px;border-radius:8px;flex:none;border:1.5px solid rgba(0,0,0,.15)}
#hex{width:100%;font:inherit;font-weight:800;padding:7px 8px;border:1.5px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink);text-transform:uppercase;font-size:.8rem}
.row{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.row h2{margin:0 4px 0 0}
.brush button{width:42px;height:38px;padding:0;display:grid;place-items:center;border-radius:12px}
.brush button span{display:block;background:var(--muted);border-radius:50%;transition:background .15s}
.brush button[aria-pressed="true"]{background:linear-gradient(135deg,#6b5ef0,#5b4fcf);border-color:transparent;box-shadow:0 3px 12px rgba(91,79,207,.3)}
.brush button[aria-pressed="true"] span{background:#fff}
.acts{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.effect button{padding:8px 10px;font-size:.8rem}
.modes{display:flex;gap:8px}
#mathBar{display:flex;align-items:center;justify-content:center;gap:10px;background:var(--panel);border:1.5px solid var(--line);border-radius:16px;padding:8px 12px;font-weight:800;font-size:.82rem;text-align:center;width:100%;box-shadow:0 2px 10px rgba(30,27,58,.06)}
#mathBar[hidden]{visibility:hidden}
#qmic{font-size:1.25rem;padding:8px 14px;border-radius:999px;flex:none;min-width:48px}
#qmic[aria-pressed="true"]{background:linear-gradient(135deg,#f87171,#ef4444);color:#fff;border-color:transparent;box-shadow:0 3px 12px rgba(239,68,68,.35);animation:pulseMic 1.2s ease infinite}
@keyframes pulseMic{0%,100%{box-shadow:0 3px 12px rgba(239,68,68,.35)}50%{box-shadow:0 3px 18px rgba(239,68,68,.55)}}
.modes button{flex:1;padding:12px 10px;font-size:.92rem;border-radius:14px}
.modes button[aria-pressed="true"]{background:linear-gradient(135deg,#6b5ef0,#5b4fcf);color:#fff;border-color:transparent;box-shadow:0 4px 14px rgba(91,79,207,.3)}
.effect button[aria-pressed="true"]{background:linear-gradient(135deg,#6b5ef0,#5b4fcf);color:#fff;border-color:transparent}
.acts button{min-width:0;padding:11px 4px;font-size:.78rem;line-height:1.25;border-radius:12px}
.stack-btn{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;padding:8px 4px;line-height:1.1}
.stack-btn .ico{font-size:1.15rem;line-height:1}
.stack-btn .lbl{font-size:.72rem;font-weight:800}
#win{position:fixed;inset:0;background:rgba(20,16,40,.5);backdrop-filter:blur(5px);display:grid;place-items:center;padding:16px;z-index:60}
#win[hidden]{display:none}
#paintWin{position:fixed;inset:0;z-index:40;background:var(--bg);display:flex;align-items:center;justify-content:center;padding:8px;overflow:hidden}
#paintWin[hidden]{display:none}
#pwBody{width:100%;max-width:1200px;height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;min-height:0}
#pwBody{--bw:min(calc(100vw - 24px),calc(100dvh - 270px))}
#pwBody .frame{width:calc(var(--bw) + 14px);padding:6px}
#pwBody .board{width:var(--bw);min-width:250px;margin:0 auto}
#pwBody{gap:8px}
#pwBody .modes{width:100%}
#pwBody .acts{width:100%}
@media (orientation:landscape) and (min-width:640px){
 #pwBody{display:grid;grid-template-columns:auto 280px;align-items:center;justify-content:center;column-gap:16px}
 #pwBody>.frame{grid-column:1;grid-row:1 / span 8}
 #pwBody>*:not(.frame){grid-column:2;width:100%}
 #pwBody{--bw:min(calc(100dvh - 100px),68vw)}
 #pwBody .board{width:var(--bw);min-width:0}
}
.card{background:var(--panel);border-radius:20px;padding:18px 18px 16px;text-align:center;max-width:380px;width:100%;max-height:94vh;overflow:auto;box-shadow:0 20px 50px rgba(0,0,0,.3);animation:pop .5s cubic-bezier(.3,1.5,.5,1)}
@keyframes pop{from{transform:scale(.5);opacity:0}to{transform:scale(1);opacity:1}}
.stars{font-size:1.8rem;letter-spacing:4px}
.card h2{margin:2px 0 4px;font-size:1.3rem;font-weight:900}
.card p{margin:4px 0 10px;color:var(--muted);font-size:.9rem}
.card b{color:var(--accent)}
.card .up{display:inline-block;background:var(--soft);border-radius:999px;padding:3px 12px;margin-bottom:6px;font-weight:800;font-size:.75rem}
#art{width:100%;display:block;border-radius:12px;border:1.5px solid var(--line);background:#fffcf5}
.cacts{display:flex;gap:10px}
.cacts button{flex:1;padding:12px 10px;border-radius:14px}
#quest{position:absolute;left:50%;top:12px;transform:translateX(-50%);z-index:6;width:min(94%,360px);background:linear-gradient(180deg,#ffffff,#f8f6ff);color:#1e1b3a;border:2px solid #5b4fcf;border-radius:20px;padding:16px 18px;display:grid;gap:12px;text-align:center;box-shadow:0 8px 28px rgba(91,79,207,.2),0 2px 8px rgba(0,0,0,.08)}
#quest[hidden]{display:none}
.qtxt{font-size:clamp(1.05rem,4.8vw,1.4rem);font-weight:900;white-space:nowrap;color:#1e1b3a;letter-spacing:.02em}
.qrow{display:flex;gap:8px;justify-content:center;align-items:center;flex-wrap:wrap}
#qin{width:80px;font:inherit;font-size:1.4rem;font-weight:900;text-align:center;padding:8px;border:2.5px solid #c4bff0;border-radius:14px;color:#1e1b3a;background:#fff;box-shadow:inset 0 1px 3px rgba(0,0,0,.06);transition:border-color .15s,box-shadow .15s}
#qin:focus{outline:none;border-color:#5b4fcf;box-shadow:0 0 0 3px rgba(91,79,207,.2)}
#quest button{font-size:.95rem;padding:10px 14px;border-radius:12px;min-width:48px}
#quest #qok{padding:10px 18px}
.cf{position:fixed;top:-20px;width:9px;height:14px;z-index:40;pointer-events:none;animation:cfall linear forwards}
@keyframes cfall{to{transform:translateY(110vh) rotate(720deg)}}
@media(max-width:360px){.pen{width:21px}.acts button{font-size:.68rem;padding:10px 2px}}
@media(max-width:400px){.acts{grid-template-columns:repeat(3,1fr)}.acts #bNext{grid-column:span 3}}
</style>
</head>
<body>
<main class="app">
<header>
<div class="chip" id="lvl">Επ. 1</div>
<div class="chip">⭐ <span id="pts">0</span></div>
<button id="bRestart" class="icon-btn" title="Επανεκκίνηση πράξεων από την αρχή" aria-label="Επανεκκίνηση">⭐</button>
<button id="snd" class="icon-btn" aria-pressed="true" aria-label="Ήχος">🔊</button>
</header>

<section>
<div class="frame">
<div class="board" id="boardEl">
<canvas id="paint" width="600" height="600"></canvas>
<svg id="lines" viewBox="0 0 300 300" aria-hidden="true"></svg>
<svg id="nums" viewBox="0 0 300 300" aria-hidden="true"></svg>
<div id="ring"></div>
<div id="quest" hidden><div class="qtxt" id="qtxt"></div><div class="qrow"><button id="qsay" aria-label="Άκου την πράξη">🔊</button><input id="qin" type="number" inputmode="numeric" min="0" max="30" aria-label="Απάντηση"><button id="qok" class="pri">Έλεγχος</button></div></div>
</div>
<div class="tray" id="tray"></div>
</div>
<div id="mathBar" hidden><span id="hint">Πάτησε το μικρόφωνο και δώσε την απάντηση φωναχτά.</span><button id="qmic" aria-label="Πάτησε το μικρόφωνο">🎤</button></div>
<div class="modes"><button id="mPaint" aria-pressed="true">🎨 Ζωγραφική</button><button id="mMath" aria-pressed="false">🔢 Μαθηματικά</button></div>
<div id="msg"></div>
<div class="legend" id="legend"></div>
<div class="prog"><span id="cnt">0/0</span><div class="bar"><i id="fill"></i></div></div>
</section>

<section class="panel" id="colorPanel">
<div>
<h2>Το χρώμα του μολυβιού</h2>
<div class="pick">
<div class="sv" id="sv"><canvas id="svc" width="150" height="100"></canvas><i id="dot"></i></div>
<div class="ctl">
<input type="range" id="hue" min="0" max="360" value="0" aria-label="Απόχρωση">
<div class="cur"><div id="prev"></div><input id="hex" maxlength="7" value="#E74C3C" aria-label="Κωδικός χρώματος"></div>
<button id="bReset" style="width:100%;padding:7px;font-size:.75rem">Επαναφορά χρωμάτων</button>
</div>
</div>
</div>
</section>

<section class="panel">
<div class="acts">
<button id="bColor" title="Χρώμα">🎨 Χρώμα</button>
<button id="bUndo" title="Αναίρεση">↩ Αναίρεση</button>
<button id="bClear" title="Delete">🗑 Delete</button>
<button id="bSave" title="Save" class="stack-btn"><span class="ico">💾</span><span class="lbl">Save</span></button>
<button id="bNext" class="pri" title="Next">Next →</button>
</div>
<div class="row brush" id="brush">
<h2>Πάχος</h2>
<button data-w="16" aria-label="Λεπτό"><span style="width:7px;height:7px"></span></button>
<button data-w="30" aria-label="Μεσαίο" aria-pressed="true"><span style="width:13px;height:13px"></span></button>
<button data-w="50" aria-label="Χοντρό"><span style="width:20px;height:20px"></span></button>
<button data-w="75" aria-label="Πολύ χοντρό"><span style="width:28px;height:28px"></span></button>
</div>
</section>
</main>

<div id="paintWin" hidden><div id="pwBody"></div></div>
<div id="win" hidden>
<div class="card" role="dialog">
<div class="stars" id="stars"></div>
<h2>Μπράβο! Τελείωσες!</h2>
<div class="up" id="up" hidden></div>
<img id="art" alt="Η ζωγραφιά σου">
<p>Κέρδισες <b id="won">0</b> πόντους!</p>
<div class="cacts">
<button id="bSave2" class="stack-btn"><span class="ico">💾</span><span class="lbl">Save</span></button>
<button id="bGo" class="pri">Next →</button>
</div>
</div>
</div>

<script>
var S=600,PER=0,BONUS=30,TH=0.96;

/* ---------- Χρώματα (κλειδί: [hex, όνομα]) ---------- */
var K={
sky:["#9BD3F5","Γαλάζιο"], bgc:["#E8F4FA","Ανοιχτό γαλάζιο"],
orange:["#F29E4C","Πορτοκαλί"], red:["#C0392B","Κόκκινο"], sun:["#FFD43B","Κίτρινο"],
eye:["#2E86AB","Μπλε"], grn2:["#4CAF50","Πράσινο"], green:["#6BBF59","Ανοιχτό πράσινο"]
};
var DEFAULT_PENS=["#E74C3C","#E67E22","#F1C40F","#27AE60","#3498DB","#9B59B6","#E91E8C","#1ABC9C","#FFFFFF","#2C3E50","#8D5524","#A8E6CF"];

/* ---------- Γεωμετρία ---------- */
function P(){return "M"+[].slice.call(arguments).join("L")+"Z"}
function ELL(cx,cy,rx,ry,rot){var pts=[],r=rot*Math.PI/180,c=Math.cos(r),s=Math.sin(r);for(var i=0;i<36;i++){var t=i*Math.PI/18,x=rx*Math.cos(t),y=ry*Math.sin(t);pts.push((cx+x*c-y*s).toFixed(1)+" "+(cy+x*s+y*c).toFixed(1))}return P.apply(null,pts)}
function RECT(x,y,w,h){return P(x+" "+y,(x+w)+" "+y,(x+w)+" "+(y+h),x+" "+(y+h))}
function POLY(cx,cy,r,n,off){var pts=[];for(var i=0;i<n;i++){var a=(off+i*360/n)*Math.PI/180;pts.push((cx+r*Math.cos(a)).toFixed(1)+" "+(cy+r*Math.sin(a)).toFixed(1))}return P.apply(null,pts)}
function STAR(cx,cy,ro,ri,n){var pts=[];for(var i=0;i<n*2;i++){var r=i%2?ri:ro,a=Math.PI*i/n-Math.PI/2;pts.push((cx+r*Math.cos(a)).toFixed(1)+" "+(cy+r*Math.sin(a)).toFixed(1))}return P.apply(null,pts)}
var HEART="M150 260C150 230 40 200 40 120C40 60 100 40 150 100C200 40 260 60 260 120C260 200 150 230 150 260Z";

/* Τμήμα (ορθογώνιο) με χρώμα και σημείο για αριθμό */
function SEG(x,y,w,h,k,c){return {d:RECT(x,y,w,h),k:k,c:c||[x+w/2,y+h/2]}}
function REG(d,k,c){return {d:d,k:k||null,c:c||null}}

/* ---------- Ψηφία 7 τμημάτων (για τις πράξεις) ---------- */
var UNIT={
 A:[10,0,80,34],
 F:[0,10,34,74],
 B:[66,10,34,74],
 G:[10,74,80,34],
 E:[0,94,34,74],
 C:[66,94,34,74],
 D:[10,154,80,34]
};
var DIGS={
 0:"ABCDEF",1:"BC",2:"ABGED",3:"ABGCD",4:"FGBC",
 5:"AFGCD",6:"AFGECD",7:"ABC",8:"ABCDEFG",9:"AFBGCD"
};
var DIGLABEL={
 0:[17,47],1:[83,47],2:[50,91],3:[50,91],4:[83,47],
 5:[50,91],6:[50,91],7:[83,47],8:[50,91],9:[50,91]
};
function DIGIT(n,ox,oy,s,k){
 var segs=DIGS[n];
 if(!segs) return [];
 var parts=[];
 segs.split("").forEach(function(L){

function ARCP(cx,cy,rx,ry,a0,a1,n){var out=[];for(var i=0;i<=n;i++){var t=(a0+(a1-a0)*i/n)*Math.PI/180;out.push([cx+rx*Math.cos(t),cy+ry*Math.sin(t)])}return out}
function ORIENT(pts){var a=0;for(var i=0;i<pts.length;i++){var p=pts[i],q=pts[(i+1)%pts.length];a+=p[0]*q[1]-q[0]*p[1]}if(a<0)pts=pts.slice().reverse();return "M"+pts.map(function(p){return p[0].toFixed(1)+" "+p[1].toFixed(1)}).join("L")+"Z"}
/* Παχιά γραμμή = ένωση τετραπλεύρων και κύκλων ίδιας φοράς, ώστε να είναι μία περιοχή */
function STROKEREG(pts,w,closed){
 var polys=[],n=pts.length,segs=closed?n:n-1,r=w/2;
 for(var i=0;i<segs;i++){
  var p=pts[i],q=pts[(i+1)%n],dx=q[0]-p[0],dy=q[1]-p[1],L=Math.hypot(dx,dy);
  if(L<1e-6)continue;
  var nx=-dy/L*r,ny=dx/L*r;
  polys.push([[p[0]+nx,p[1]+ny],[q[0]+nx,q[1]+ny],[q[0]-nx,q[1]-ny],[p[0]-nx,p[1]-ny]]);
 }
 for(var j=0;j<n;j++){var c=pts[j],cc=[];for(var k=0;k<12;k++){var t=k*Math.PI/6;cc.push([c[0]+r*Math.cos(t),c[1]+r*Math.sin(t)])}polys.push(cc)}
 return polys.map(ORIENT).join(" ");
}
function PATHD(pts,closed){return "M"+pts.map(function(p){return p[0].toFixed(1)+" "+p[1].toFixed(1)}).join("L")+(closed?"Z":"")}
function NUM(n,lvl,strokes,decor){

 decor.forEach(function(r){regs.push(r)});

}

function CIRC(x,y,r){var p=[];for(var k=0;k<16;k++){var t=k*Math.PI/8;p.push([x+r*Math.cos(t),y+r*Math.sin(t)])}return p}
function HEARTPTS(cx,cy,s){var k=s/34,pts=[];for(var i=0;i<48;i++){var t=i*2*Math.PI/48,x=16*Math.pow(Math.sin(t),3),y=13*Math.cos(t)-5*Math.cos(2*t)-2*Math.cos(3*t)-Math.cos(4*t);pts.push([cx+x*k,cy-y*k])}return pts}

function rng(seed){var st=seed>>>0;return function(){st=(st*1664525+1013904223)>>>0;return st/4294967296}}
function makeDecor(t,cx,cy,k){
 if(t==="sq")return {t:"sq",cx:cx,cy:cy,h:k*0.8};
 if(t==="tri")return {t:"tri",cx:cx,cy:cy,s:k*1.1};
 if(t==="rect")return {t:"rect",cx:cx,cy:cy,w:k*1.4,h:k*0.9};

}
/* Βρίσκει θέσεις για σχήματα που δεν αγγίζουν τους αριθμούς (ή άλλα σχήματα) */
function placeDecor(strokes,seed,count){
 var obs=[];
 strokes.forEach(function(st){
  var segs=st.closed?st.pts.length:st.pts.length-1;
  for(var i=0;i<segs;i++){
   var p=st.pts[i],q=st.pts[(i+1)%st.pts.length],L=Math.hypot(q[0]-p[0],q[1]-p[1]),steps=Math.max(1,Math.ceil(L/6));
   for(var j=0;j<=steps;j++)obs.push({x:p[0]+(q[0]-p[0])*j/steps,y:p[1]+(q[1]-p[1])*j/steps,r:st.w/2});
  }
 });
 var types=["ell","sq","tri","rect","heart"],rnd=rng(seed),placed=[],out=[];
 for(var tries=0;tries<8000&&out.length<count;tries++){
  var k=16+rnd()*9,Rb=1.2*k,cx=20+rnd()*260,cy=20+rnd()*260,ok=true;
  if(cx-Rb<8||cx+Rb>292||cy-Rb<8||cy+Rb>292)continue;
  for(var a=0;a<obs.length;a++){if(Math.hypot(cx-obs[a].x,cy-obs[a].y)<Rb+obs[a].r+10){ok=false;break}}
  if(!ok)continue;
  for(var b=0;b<placed.length;b++){if(Math.hypot(cx-placed[b].cx,cy-placed[b].cy)<Rb+placed[b].R+12){ok=false;break}}
  if(!ok)continue;
  placed.push({cx:cx,cy:cy,R:Rb});
  out.push(makeDecor(types[out.length%types.length],cx,cy,k));
 }
 return out;
}
function POLYOF(q,c,sc){
 if(q.t==="tri"){var s=q.s*sc;return [[c[0],c[1]-0.6*s],[c[0]+0.52*s,c[1]+0.3*s],[c[0]-0.52*s,c[1]+0.3*s]]}
 var w=(q.t==="sq"?q.h:q.w/2)*sc,h=(q.t==="sq"?q.h:q.h/2)*sc;
 return [[c[0]-w,c[1]-h],[c[0]+w,c[1]-h],[c[0]+w,c[1]+h],[c[0]-w,c[1]+h]];
}
function scaleDecor(list,f){return list.map(function(q){var o={};for(var k in q)o[k]=q[k];["ro","ri","rx","ry","s","r"].forEach(function(key){if(o[key]!=null)o[key]*=f});return o})}
/* Μετασχηματίζει τις γραμμές και τη διακόσμηση ενός αριθμού (μετάθεση + κλίμακα) */
function MAPREGS(strokes,decor,tf,sc){
 var regs=[];
 if(strokes.length){
  var ds=[],sks=[];
  strokes.forEach(function(st){
   var pts=st.pts.map(function(p){return tf(p[0],p[1])}),w=st.w*sc;
   ds.push(STROKEREG(pts,w,st.closed));

  });

 }

  var c=tf(q.cx,q.cy);
  if(q.t==="star")regs.push(REG(STAR(c[0],c[1],q.ro*sc,q.ri*sc,q.n)));
  else if(q.t==="tri"||q.t==="sq"||q.t==="rect")regs.push({d:ORIENT(POLYOF(q,c,sc)),k:null,c:null});
  else if(q.t==="heart")regs.push({d:ORIENT(HEARTPTS(c[0],c[1],q.s*sc)),k:null,c:null});
  else if(q.t==="flower")regs.push({d:FLOWERD(c[0],c[1],q.r*sc),k:null,c:null});
  else regs.push(REG(ELL(c[0],c[1],q.rx*sc,q.ry*sc,0)));
 });
 return regs;
}

 for(var i=0;i<len;i++)d[i]=(Math.random()*2-1)*Math.pow(1-i/len,3);
 var src=a.createBufferSource(),g=a.createGain();
 src.buffer=buf;g.gain.value=0.5;src.connect(g);g.connect(a.destination);src.start(t);
}
function whistle(){
 var a=ac();if(!a||!sound)return;
 var o=a.createOscillator(),g=a.createGain(),t=a.currentTime;
 o.type="sine";o.frequency.setValueAtTime(500,t);o.frequency.exponentialRampToValueAtTime(1700,t+0.45);
 g.gain.setValueAtTime(0.12,t);g.gain.exponentialRampToValueAtTime(0.001,t+0.5);
 o.connect(g);g.connect(a.destination);o.start(t);o.stop(t+0.55);
}
function sndWhistle(){whistle();boom(0.45);boom(0.85);boom(1.25);tone(784,0.5,.2,"triangle",.14);tone(1047,0.62,.25,"triangle",.14)}
function sndXylo(){[523,659,784,1047,1319].forEach(function(f,i){tone(f,i*.09,.35,"triangle",.16)});tone(2093,.5,.5,"sine",.06)}
function sndFanfare(){[[523,0],[659,.18],[784,.36],[1047,.6]].forEach(function(n){tone(n[0],n[1],.22,"square",.05)});tone(1047,.85,.6,"square",.06);boom(.85)}
function sndMagic(){
 var a=ac();
 if(a&&sound){var o=a.createOscillator(),g=a.createGain(),t=a.currentTime;o.type="sine";o.frequency.setValueAtTime(300,t);o.frequency.exponentialRampToValueAtTime(2400,t+0.9);g.gain.setValueAtTime(0.12,t);g.gain.exponentialRampToValueAtTime(0.001,t+1);o.connect(g);g.connect(a.destination);o.start(t);o.stop(t+1.05)}
 for(var i=0;i<8;i++)tone(1500+Math.random()*2000,.2+i*.09+Math.random()*.05,.12,"sine",.07);
 boom(1.0);
}
var SNDS=[sndWhistle,sndXylo,sndFanfare,sndMagic],lastSnd=-1;
function celebrate(){
 var v=Math.floor(Math.random()*SNDS.length);
 while(v===lastSnd)v=Math.floor(Math.random()*SNDS.length);
 lastSnd=v;SNDS[v]();
 var cvx=document.createElement("canvas");
 cvx.style.cssText="position:fixed;left:0;top:0;width:100%;height:100%;pointer-events:none;z-index:50";
 document.body.appendChild(cvx);
 cvx.width=innerWidth;cvx.height=innerHeight;
 var c=cvx.getContext("2d"),parts=[],t0=performance.now(),cols=["#f43f5e","#facc15","#22c55e","#3b82f6","#a855f7","#f97316","#ffffff"];
 var shots=[[0.3,0.32,500],[0.72,0.26,900],[0.5,0.5,1300]],fired=[];
 function burst(x,y){
  var col=cols[Math.floor(Math.random()*cols.length)];
  for(var i=0;i<46;i++){var ang=Math.random()*6.283,v=2+Math.random()*4.5;parts.push({x:x,y:y,vx:Math.cos(ang)*v,vy:Math.sin(ang)*v,life:1,col:Math.random()<0.2?cols[Math.floor(Math.random()*cols.length)]:col})}
 }
 function frame(now){
  var el=now-t0;
  shots.forEach(function(sh,k){if(!fired[k]&&el>=sh[2]){fired[k]=true;burst(sh[0]*cvx.width,sh[1]*cvx.height)}});
  c.clearRect(0,0,cvx.width,cvx.height);
  parts.forEach(function(p){p.vy+=0.08;p.x+=p.vx;p.y+=p.vy;p.vx*=0.98;p.life-=0.017;
   c.globalAlpha=Math.max(0,p.life);c.fillStyle=p.col;c.beginPath();c.arc(p.x,p.y,2.6,0,6.283);c.fill()});
  c.globalAlpha=1;
  parts=parts.filter(function(p){return p.life>0});
  if(el<2600||parts.length)requestAnimationFrame(frame);else cvx.remove();
 }
 requestAnimationFrame(frame);
}

function closeWin(){
 for(var i=homes.length-1;i>=0;i--){var h=homes[i];h.ph.parentNode.insertBefore(h.n,h.ph);h.ph.parentNode.removeChild(h.ph)}
 homes=[];pwEl.hidden=true;winOpen=false;
}
function syncWindow(){

 if(want&&!winOpen)openWin();
 else if(!want&&winOpen)closeWin();
}
