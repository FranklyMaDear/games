<!DOCTYPE html>
<html lang="el">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#6c5ce7">
<title>Ζωγραφίζω και χρωματίζω</title>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;800;900&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #f0eef8;
  --panel: #ffffff;
  --ink: #2a2450;
  --muted: #7a7599;
  --line: #e4e0f2;
  --soft: #ebe7f8;
  --accent: #6c5ce7;
  --accent2: #fd79a8;
  --ok: #00b894;
  --shadow: 0 8px 28px rgba(42,36,80,.12);
  --cork: #d4b896;
  --cork-d: #b8956a;
  --radius: 20px;
  --safe-b: env(safe-area-inset-bottom, 0px);
  --safe-t: env(safe-area-inset-top, 0px);
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #16132a; --panel: #221e3d; --ink: #f2efff; --muted: #a9a4c9;
    --line: #35315a; --soft: #2d2950; --accent: #a29bfe; --accent2: #fd79a8;
    --shadow: 0 8px 28px rgba(0,0,0,.4); --cork: #8a6e4e; --cork-d: #6b5338;
    color-scheme: dark;
  }
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body {
  margin: 0; padding: 0;
  height: 100%;
  overflow-x: hidden;
  overscroll-behavior: none;
}
body {
  background: var(--bg);
  color: var(--ink);
  font-family: "Nunito", system-ui, sans-serif;
  font-weight: 600;
  padding: var(--safe-t) env(safe-area-inset-right) var(--safe-b) env(safe-area-inset-left);
  min-height: 100dvh;
  min-height: -webkit-fill-available;
}
.app {
  max-width: 720px;
  margin: 0 auto;
  padding: 10px 12px 20px;
  display: flex;
  flex-direction: column;
  gap: 12px;
  min-height: calc(100dvh - var(--safe-t) - var(--safe-b));
}

/* Header compact */
header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
  flex-shrink: 0;
}
.brand { display: flex; align-items: center; gap: 8px; min-width: 0; }
.logo {
  width: 40px; height: 40px; border-radius: 12px; flex-shrink: 0;
  background: linear-gradient(135deg, var(--accent), var(--accent2));
  display: grid; place-items: center; font-size: 1.25rem;
  box-shadow: var(--shadow);
}
h1 {
  margin: 0; font-size: 1.05rem; font-weight: 900;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.stats { display: flex; align-items: center; gap: 6px; flex-shrink: 0; }
.chip {
  background: var(--panel); border: 1.5px solid var(--line);
  border-radius: 999px; padding: 5px 11px; font-weight: 800; font-size: 0.82rem;
  display: flex; gap: 4px; align-items: center;
}
.chip small { color: var(--muted); font-weight: 600; font-size: 0.72rem; }
button {
  font: inherit; font-weight: 800; font-size: 0.88rem; color: var(--ink);
  background: var(--panel); border: 1.5px solid var(--line); border-radius: 14px;
  padding: 10px 14px; cursor: pointer;
  box-shadow: 0 2px 8px rgba(0,0,0,.05);
  transition: transform .1s, background .15s;
  touch-action: manipulation;
}
button:active { transform: scale(.96); }
button:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
button.pri {
  background: linear-gradient(135deg, var(--accent), #8b7cf7);
  color: #fff; border-color: transparent;
}
.icon-btn { padding: 8px 11px; font-size: 1.1rem; }

/* Stage: board stays stable */
.stage {
  display: flex;
  flex-direction: column;
  gap: 8px;
  flex: 1;
  min-height: 0;
}
.cork {
  background: linear-gradient(145deg, #e8d4b0, var(--cork) 50%, var(--cork-d));
  border-radius: 16px;
  padding: 12px 12px 8px;
  box-shadow: var(--shadow), inset 0 1px 0 rgba(255,255,255,.3);
  border: 3px solid var(--cork-d);
  flex-shrink: 0;
}
.board {
  position: relative;
  width: 100%;
  aspect-ratio: 1;
  max-height: min(62vh, 520px);
  margin: 0 auto;
  background: #fffef9;
  border-radius: 10px;
  overflow: hidden;
  touch-action: none;
  border: 2px solid #d9c9a8;
  box-shadow: inset 0 0 16px rgba(0,0,0,.06);
  /* prevent iOS scroll bounce while drawing */
  -webkit-user-select: none;
  user-select: none;
}
.board canvas, .board svg {
  position: absolute; inset: 0; width: 100%; height: 100%;
  touch-action: none;
}
.board canvas { cursor: none; }
.board svg { pointer-events: none; }
#ring {
  position: absolute; border: 2.5px solid #fff;
  box-shadow: 0 0 0 1.5px #2a2450; border-radius: 50%;
  transform: translate(-50%,-50%); pointer-events: none; display: none; z-index: 3;
}

/* Pencils under board */
.tray { margin-top: 6px; text-align: center; }
.pencils {
  display: flex; justify-content: center; gap: 4px; flex-wrap: nowrap;
  padding: 2px 0;
  overflow-x: auto;
  -webkit-overflow-scrolling: touch;
  scrollbar-width: none;
}
.pencils::-webkit-scrollbar { display: none; }
.pencils button {
  width: 24px; height: 50px; padding: 0; border: none;
  border-radius: 5px 5px 2px 2px; position: relative; overflow: hidden;
  flex-shrink: 0; box-shadow: 1px 2px 4px rgba(0,0,0,.2);
  transition: transform .12s;
}
.pencils button::before {
  content: ""; position: absolute; top: 0; left: 0; right: 0; height: 14%;
  background: linear-gradient(180deg, #f8f4ec, #e6dcc8);
  border-bottom: 1px solid rgba(0,0,0,.1);
}
.pencils button::after {
  content: ""; position: absolute; bottom: 0; left: 50%; transform: translateX(-50%);
  border-left: 5px solid transparent; border-right: 5px solid transparent;
  border-top: 8px solid #c8bba5;
}
.pencils button:active { transform: translateY(-4px) scale(1.08); }
.pencils button[aria-pressed="true"] {
  box-shadow: 0 0 0 2.5px #fff, 0 0 0 5px var(--accent);
  transform: scale(1.12) translateY(-2px);
}
.tray-label {
  font-size: 0.7rem; font-weight: 800; color: rgba(50,35,15,.8);
  margin-top: 3px;
}

.prog {
  display: flex; align-items: center; gap: 8px;
  font-size: 0.8rem; color: var(--muted); font-weight: 700;
  flex-shrink: 0;
}
.bar {
  flex: 1; height: 12px; border-radius: 8px; background: var(--soft); overflow: hidden;
}
.bar i {
  display: block; height: 100%; width: 0; border-radius: 8px;
  background: linear-gradient(90deg, #74b9ff, var(--ok));
  transition: width .35s cubic-bezier(.2,.8,.2,1);
}

/* Tools panel */
.panel {
  background: var(--panel); border: 1.5px solid var(--line);
  border-radius: var(--radius); padding: 12px;
  display: grid; gap: 12px; box-shadow: var(--shadow);
  flex-shrink: 0;
}
.panel h2 {
  margin: 0 0 6px; font-size: 0.72rem; font-weight: 800;
  color: var(--muted); text-transform: uppercase; letter-spacing: 0.04em;
}
.hint { font-size: 0.72rem; color: var(--muted); margin: 0 0 6px; line-height: 1.35; }

.markers {
  display: grid; grid-template-columns: repeat(5, 1fr); gap: 6px;
}
.markers button {
  display: flex; flex-direction: column; align-items: center; gap: 3px;
  padding: 8px 4px; border-radius: 12px; font-size: 0.65rem; font-weight: 800;
}
.markers button .ico {
  width: 32px; height: 32px; border-radius: 50%;
  display: grid; place-items: center; font-size: 0.95rem;
  border: 2px solid rgba(0,0,0,.08);
}
.markers button[aria-pressed="true"] {
  background: var(--soft); border-color: var(--accent);
  box-shadow: 0 0 0 2px var(--accent);
}

.pick { display: flex; gap: 10px; flex-wrap: wrap; align-items: flex-start; }
.sv {
  position: relative; width: 150px; height: 100px; border-radius: 10px;
  overflow: hidden; touch-action: none; cursor: crosshair; border: 1.5px solid var(--line);
  flex-shrink: 0;
}
.sv canvas { width: 100%; height: 100%; display: block; }
.sv i {
  position: absolute; width: 14px; height: 14px; margin: -7px 0 0 -7px;
  border: 2px solid #fff; border-radius: 50%;
  box-shadow: 0 0 0 1.5px #000, 0 2px 4px rgba(0,0,0,.35); pointer-events: none;
}
.ctl { display: grid; gap: 8px; flex: 1; min-width: 110px; }
#hue {
  width: 100%; height: 12px; -webkit-appearance: none; appearance: none;
  border-radius: 8px; background: linear-gradient(90deg,#f00,#ff0,#0f0,#0ff,#00f,#f0f,#f00);
}
#hue::-webkit-slider-thumb {
  -webkit-appearance: none; width: 22px; height: 22px; background: #fff;
  border: 2.5px solid var(--ink); border-radius: 50%;
}
#hue::-moz-range-thumb {
  width: 18px; height: 18px; background: #fff; border: 2.5px solid var(--ink); border-radius: 50%;
}
.cur { display: flex; gap: 6px; align-items: center; }
#prev {
  width: 36px; height: 36px; border-radius: 10px; flex: none;
  border: 1.5px solid rgba(0,0,0,.15);
}
#hex {
  width: 100%; font: inherit; font-weight: 800; padding: 8px 9px;
  border: 1.5px solid var(--line); border-radius: 10px;
  background: var(--bg); color: var(--ink); text-transform: uppercase;
  font-size: 0.85rem;
}

.size-row { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
.size-row h2 { margin: 0 2px 0 0; }
.size-row button {
  width: 44px; height: 40px; padding: 0; display: grid; place-items: center;
}
.size-row button span {
  display: block; background: var(--muted); border-radius: 50%;
}
.size-row button[aria-pressed="true"] {
  background: var(--accent); border-color: transparent;
}
.size-row button[aria-pressed="true"] span { background: #fff; }

.acts { display: flex; gap: 6px; flex-wrap: wrap; }
.acts button { flex: 1; min-width: 0; padding: 11px 10px; font-size: 0.82rem; }
.acts .pri { flex: 1.2; }

/* Win modal */
#win {
  position: fixed; inset: 0; background: rgba(20,18,43,.55);
  backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px);
  display: grid; place-items: center; padding: 20px; z-index: 30;
}
#win[hidden] { display: none; }
.card {
  background: var(--panel); border-radius: 24px; padding: 24px 26px;
  text-align: center; max-width: 340px; width: 100%;
  box-shadow: 0 24px 60px rgba(0,0,0,.35);
  animation: pop .4s cubic-bezier(.3,1.4,.5,1);
}
.card .stars { font-size: 2.4rem; letter-spacing: 3px; }
.card h2 { margin: 6px 0 4px; font-size: 1.55rem; font-weight: 900; }
.card p { margin: 4px 0 14px; color: var(--muted); line-height: 1.45; font-size: 0.95rem; }
.card b { color: var(--accent); }
.card .up {
  display: inline-block; background: var(--soft); border-radius: 999px;
  padding: 4px 12px; margin-bottom: 8px; font-weight: 800; font-size: 0.8rem;
}
.card button { font-size: 0.95rem; padding: 12px 24px; width: 100%; }
@keyframes pop {
  from { transform: scale(.55); opacity: 0; }
  to { transform: scale(1); opacity: 1; }
}
@media (prefers-reduced-motion: reduce) {
  .card { animation: none; }
  .bar i, button { transition: none; }
}
@media (min-width: 700px) {
  .app { max-width: 900px; }
  .board { max-height: min(70vh, 560px); }
  .markers { grid-template-columns: repeat(5, 1fr); }
}
@media (max-width: 380px) {
  .pencils button { width: 20px; height: 44px; }
  .markers { grid-template-columns: repeat(3, 1fr); }
  h1 { font-size: 0.95rem; }
}
</style>
</head>
<body>
<main class="app">
<header>
  <div class="brand">
    <div class="logo">🎨</div>
    <h1>Ζωγραφίζω</h1>
  </div>
  <div class="stats">
    <div class="chip" id="lvl">Επ. 1</div>
    <div class="chip">⭐ <span id="pts">0</span></div>
    <button id="snd" class="icon-btn" aria-pressed="true" aria-label="Ήχος">🔊</button>
  </div>
</header>

<section class="stage">
  <div class="cork">
    <div class="board" id="boardEl">
      <canvas id="paint" width="600" height="600"></canvas>
      <div id="ring"></div>
      <svg id="lines" viewBox="0 0 300 300" aria-hidden="true"></svg>
    </div>
    <div class="tray">
      <div class="pencils" id="sw"></div>
      <div class="tray-label">Μολύβια</div>
    </div>
  </div>
  <div class="prog">
    <span id="cnt">0/0</span>
    <div class="bar" role="progressbar" aria-label="Πρόοδος"><i id="fill"></i></div>
  </div>
</section>

<section class="panel">
  <div>
    <h2>Μαρκαδόρος</h2>
    <div class="markers" id="markerTypes">
      <button data-type="solid" aria-pressed="true">
        <span class="ico" style="background:#e63946">●</span>
        Απλό
      </button>
      <button data-type="dual">
        <span class="ico" style="background:linear-gradient(135deg,#e63946 50%,#457b9d 50%)">◐</span>
        Διπλό
      </button>
      <button data-type="jelly">
        <span class="ico" style="background:radial-gradient(circle at 35% 30%,#fff8,#e63946 60%)">◉</span>
        Ζελέ
      </button>
      <button data-type="neon">
        <span class="ico" style="background:#39ff14;box-shadow:0 0 8px #39ff14">✦</span>
        Νέον
      </button>
      <button data-type="glitter">
        <span class="ico" style="background:linear-gradient(135deg,#ffd700,#ff69b4,#00e5ff)">✨</span>
        Glitter
      </button>
    </div>
  </div>

  <div>
    <h2>Χρώμα μολυβιού</h2>
    <p class="hint">Διάλεξε μολύβι → άλλαξε χρώμα → Εφάρμοσε</p>
    <div class="pick">
      <div class="sv" id="sv">
        <canvas id="svc" width="200" height="140"></canvas>
        <i id="dot"></i>
      </div>
      <div class="ctl">
        <input type="range" id="hue" min="0" max="360" value="0" aria-label="Απόχρωση">
        <div class="cur">
          <div id="prev"></div>
          <input id="hex" maxlength="7" value="#E63946" aria-label="Κωδικός">
        </div>
        <button id="bApply" class="pri" style="width:100%;padding:9px">Εφάρμοσε</button>
      </div>
    </div>
  </div>

  <div class="size-row" id="size">
    <h2>Μέγεθος</h2>
    <button data-w="14" aria-label="Λεπτός"><span style="width:7px;height:7px"></span></button>
    <button data-w="28" aria-label="Μεσαίος" aria-pressed="true"><span style="width:14px;height:14px"></span></button>
    <button data-w="48" aria-label="Χοντρός"><span style="width:22px;height:22px"></span></button>
    <button data-w="72" aria-label="Πολύ χοντρός"><span style="width:30px;height:30px"></span></button>
  </div>

  <div class="acts">
    <button id="bUndo">↩</button>
    <button id="bClear">Καθάρισμα</button>
    <button id="bSave">💾 Αποθήκευση</button>
    <button id="bNext" class="pri">Άλλο →</button>
  </div>
</section>
</main>

<div id="win" hidden>
  <div class="card" role="dialog" aria-live="polite">
    <div class="stars">⭐⭐⭐</div>
    <h2>Μπράβο!</h2>
    <div class="up" id="up" hidden></div>
    <p>Κέρδισες <b id="won">50</b> πόντους!</p>
    <button id="bGo" class="pri">Επόμενο σχέδιο</button>
  </div>
</div>

function allowed(){ return completed < 6 ? [0] : completed < 14 ? [0,1] : [0,1,2]; }
function level(){ return completed < 6 ? 0 : completed < 14 ? 1 : 2; }
function nextIndex(){
  var al = allowed();
  var pool = D.map(function(_,i){ return i; }).filter(function(i){ return al.indexOf(tier[i]) > -1; });
  var fresh = pool.filter(function(i){ return seen.indexOf(i) < 0 && i !== last; });
  if (!fresh.length) { seen = []; fresh = pool.filter(function(i){ return i !== last; }); }
  last = fresh[Math.floor(Math.random() * fresh.length)];
  seen.push(last);
  return last;
}

function load(){
  var di = nextIndex(), d = D[di];

    return '<path d="' + p + '" fill="none" stroke="#2b2750" stroke-width="2.6" stroke-linejoin="round"/>';
  }).join("");
  var m = new DOMMatrix().scale(S / 300, S / 300);
  paths = d.map(function(p){ var q = new Path2D(); q.addPath(new Path2D(p), m); return q; });
  owner = new Uint8Array(S * S);
  total = new Array(d.length).fill(0);
  for (var i = 0; i < paths.length; i++) {
    tctx.clearRect(0, 0, S, S);
    tctx.fillStyle = "#000";
    tctx.fill(paths[i]);
    var a = tctx.getImageData(0, 0, S, S).data;
    for (var p = 0; p < S * S; p++) if (a[p * 4 + 3] > 127) owner[p] = i + 1;
  }
  for (var p = 0; p < S * S; p++) if (owner[p]) total[owner[p] - 1]++;
  done = new Array(d.length).fill(false);

}

var AC;
function ac(){
  if (!AC) { try { AC = new (window.AudioContext || window.webkitAudioContext)(); } catch(e){} }
  if (AC && AC.state === "suspended") AC.resume();

}
function tone(f, t, d, type, v){
  if (!sound) return;
  var a = ac(); if (!a) return;
  var o = a.createOscillator(), g = a.createGain(), s = a.currentTime + t;
  o.type = type || "sine"; o.frequency.value = f;
  g.gain.setValueAtTime(v || 0.15, s);
  g.gain.exponentialRampToValueAtTime(0.001, s + d);
  o.connect(g); g.connect(a.destination);
  o.start(s); o.stop(s + d + 0.02);
}
var SCALE = [261.63, 293.66, 329.63, 392, 440, 523.25, 587.33, 659.25];
function pickSound(hex){
  var v = hex2hsv(hex);
  var f = v[1] < 0.12 ? 196 : SCALE[Math.floor(v[0] / 360 * 8) % 8];

}
function dingSound(){ tone(880, 0, 0.15, "sine", 0.15); tone(1320, 0.09, 0.22, "sine", 0.12); }

  [523.25, 659.25, 783.99, 1046.5, 783.99, 1046.5, 1318.5].forEach(function(f, i){
    tone(f, i * 0.12, 0.3, "triangle", 0.18);
  });
}

function hsv2hex(h, s, v){
  var f = function(n){ var k = (n + h / 60) % 6; return v - v * s * Math.max(0, Math.min(k, 4 - k, 1)); };
  return "#" + [f(5), f(3), f(1)].map(function(x){ return Math.round(x * 255).toString(16).padStart(2, "0"); }).join("").toUpperCase();
}
function hex2hsv(x){
  var r = parseInt(x.slice(1, 3), 16) / 255, g = parseInt(x.slice(3, 5), 16) / 255, b = parseInt(x.slice(5, 7), 16) / 255;
  var mx = Math.max(r, g, b), mn = Math.min(r, g, b), d = mx - mn, h = 0;
  if (d) {
    h = mx === r ? ((g - b) / d) % 6 : mx === g ? (b - r) / d + 2 : (r - g) / d + 4;
    h *= 60; if (h < 0) h += 360;
  }
  return [h, mx ? d / mx : 0, mx];
}

var svc = document.getElementById("svc"), svx = svc.getContext("2d");

function drawSV(){
  svx.fillStyle = hsv2hex(H, 1, 1);
  svx.fillRect(0, 0, 200, 140);
  var g = svx.createLinearGradient(0, 0, 200, 0);
  g.addColorStop(0, "#fff"); g.addColorStop(1, "rgba(255,255,255,0)");
  svx.fillStyle = g; svx.fillRect(0, 0, 200, 140);
  g = svx.createLinearGradient(0, 0, 0, 140);
  g.addColorStop(0, "rgba(0,0,0,0)"); g.addColorStop(1, "#000");
  svx.fillStyle = g; svx.fillRect(0, 0, 200, 140);
}
function setColor(c, fromSwatch, snd){
  color = c.toUpperCase();
  if (fromSwatch) {
    var v = hex2hsv(color);
    H = v[0]; SA = v[1]; V = v[2];
  }
  hue.value = H;
  drawSV();
  dot.style.left = (SA * 100) + "%";
  dot.style.top = ((1 - V) * 100) + "%";
  prev.style.background = color;
  hex.value = color;
  if (snd) pickSound(color);
}
function svMove(e){
  var r = sv.getBoundingClientRect();
  var cx = e.clientX !== undefined ? e.clientX : (e.touches && e.touches[0] ? e.touches[0].clientX : 0);
  var cy = e.clientY !== undefined ? e.clientY : (e.touches && e.touches[0] ? e.touches[0].clientY : 0);
  SA = Math.max(0, Math.min(1, (cx - r.left) / r.width));
  V = 1 - Math.max(0, Math.min(1, (cy - r.top) / r.height));
  setColor(hsv2hex(H, SA, V), false, false);
}
var svDown = false;
sv.addEventListener("pointerdown", function(e){ svDown = true; sv.setPointerCapture(e.pointerId); svMove(e); e.preventDefault(); });

/* Ζωγραφική – σταθερό canvas, χωρίς scroll */
function pos(e){
  var r = cv.getBoundingClientRect();
  var cx = e.clientX, cy = e.clientY;
  if (e.touches && e.touches[0]) { cx = e.touches[0].clientX; cy = e.touches[0].clientY; }
  return { x: (cx - r.left) * S / r.width, y: (cy - r.top) * S / r.height };
}

function compose(){
  ctx.clearRect(0, 0, S, S);
  ctx.drawImage(snap, 0, 0);
  tctx.globalCompositeOperation = "source-over";
  tctx.clearRect(0, 0, S, S);
  tctx.drawImage(sc, 0, 0);
  tctx.globalCompositeOperation = "destination-in";
  tctx.drawImage(mc, 0, 0);
  tctx.globalCompositeOperation = "source-over";
  ctx.drawImage(tc, 0, 0);
}

function getPaintColor(){
  if (markerType === "neon") {
    var v = hex2hsv(color);
    return hsv2hex(v[0], Math.min(1, v[1] * 1.1), Math.min(1, v[2] * 1.15));
  }
  return color;
}

function sparkle(x, y, r){
  var n = 4 + Math.floor(Math.random() * 5);
  for (var i = 0; i < n; i++) {
    var a = Math.random() * Math.PI * 2;
    var d = Math.random() * r * 0.9;
    var sx = x + Math.cos(a) * d;
    var sy = y + Math.sin(a) * d;
    var sr = 1 + Math.random() * 2.5;
    sctx.fillStyle = Math.random() > 0.4 ? "#fff" : hsv2hex((hex2hsv(color)[0] + 40) % 360, 0.3, 1);
    sctx.beginPath();
    sctx.arc(sx, sy, sr, 0, 7);
    sctx.fill();
  }
}

function seg(a, b){
  var col = getPaintColor();
  sctx.lineCap = sctx.lineJoin = "round";
  sctx.lineWidth = width;

  if (markerType === "dual") {
    sctx.strokeStyle = sctx.fillStyle = col;
    sctx.beginPath(); sctx.arc(b.x, b.y, width / 2, 0, 7); sctx.fill();
    sctx.beginPath(); sctx.moveTo(a.x, a.y); sctx.lineTo(b.x, b.y); sctx.stroke();
    var v = hex2hsv(col);
    var c2 = hsv2hex((v[0] + 40) % 360, v[1], v[2] * 0.85);
    sctx.strokeStyle = sctx.fillStyle = c2;
    sctx.globalAlpha = 0.55;
    var ox = (b.y - a.y) * 0.15, oy = (a.x - b.x) * 0.15;
    sctx.beginPath(); sctx.arc(b.x + ox, b.y + oy, width / 3, 0, 7); sctx.fill();
    sctx.beginPath(); sctx.moveTo(a.x + ox, a.y + oy); sctx.lineTo(b.x + ox, b.y + oy); sctx.stroke();
    sctx.globalAlpha = 1;
  } else if (markerType === "jelly") {
    sctx.strokeStyle = sctx.fillStyle = col;
    sctx.beginPath(); sctx.arc(b.x, b.y, width / 2, 0, 7); sctx.fill();
    sctx.beginPath(); sctx.moveTo(a.x, a.y); sctx.lineTo(b.x, b.y); sctx.stroke();
    sctx.fillStyle = "rgba(255,255,255,0.45)";
    sctx.beginPath(); sctx.arc(b.x - width * 0.18, b.y - width * 0.18, width * 0.22, 0, 7); sctx.fill();
  } else if (markerType === "neon") {
    sctx.shadowColor = col;
    sctx.shadowBlur = width * 0.7;
    sctx.strokeStyle = sctx.fillStyle = col;
    sctx.beginPath(); sctx.arc(b.x, b.y, width / 2, 0, 7); sctx.fill();
    sctx.beginPath(); sctx.moveTo(a.x, a.y); sctx.lineTo(b.x, b.y); sctx.stroke();
    sctx.shadowBlur = 0;
  } else if (markerType === "glitter") {
    sctx.strokeStyle = sctx.fillStyle = col;
    sctx.beginPath(); sctx.arc(b.x, b.y, width / 2, 0, 7); sctx.fill();
    sctx.beginPath(); sctx.moveTo(a.x, a.y); sctx.lineTo(b.x, b.y); sctx.stroke();
    sparkle(b.x, b.y, width / 2);
  } else {
    sctx.strokeStyle = sctx.fillStyle = col;
    sctx.beginPath(); sctx.arc(b.x, b.y, width / 2, 0, 7); sctx.fill();
    sctx.beginPath(); sctx.moveTo(a.x, a.y); sctx.lineTo(b.x, b.y); sctx.stroke();
  }
}

cv.addEventListener("pointerdown", function(e){
  if (finished) return;
  e.preventDefault();
  var p = pos(e);
  var o = owner[Math.floor(p.y) * S + Math.floor(p.x)];
  if (!o) return;
  ac();
  drawing = true; reg = o; lp = p;
  try { cv.setPointerCapture(e.pointerId); } catch(err){}
  undo.push(ctx.getImageData(0, 0, S, S));
  if (undo.length > 12) undo.shift();
  nctx.clearRect(0, 0, S, S);
  nctx.drawImage(cv, 0, 0);
  sctx.clearRect(0, 0, S, S);
  var id = mctx.createImageData(S, S), d = id.data;
  for (var i = 0; i < S * S; i++) if (owner[i] === o) d[i * 4 + 3] = 255;
  mctx.putImageData(id, 0, 0);
  seg(p, p);
  compose();
});

function check(reward){
  var a = ctx.getImageData(0, 0, S, S).data;
  var cnt = new Array(done.length).fill(0), newly = false;
  for (var p = 0; p < S * S; p++) {
    var o = owner[p];
    if (o && a[p * 4 + 3] > 127) cnt[o - 1]++;
  }
  for (var i = 0; i < done.length; i++) {
    done[i] = total[i] === 0 || cnt[i] / total[i] >= TH;
    if (reward && done[i] && !awarded[i]) {
      awarded[i] = true;
      addPoints(PER);
      newly = true;
    }
  }
  progress();
  if (done.every(Boolean) && !finished && reward) finish();
  else if (newly) dingSound();
}
function finish(){
  var before = level();
  completed++;
  try { localStorage.setItem("done", completed); } catch(e){}
  var up = document.getElementById("up");
  up.hidden = level() === before;
  if (!up.hidden) {
    up.textContent = level() === 1
      ? "Νέο επίπεδο! Πιο ποικίλα σχέδια"
      : "Νέο επίπεδο! Όλα ξεκλείδωσαν";
  }
  lvlText();
  finished = true;
  addPoints(BONUS);
  winSound();
  document.getElementById("won").textContent = BONUS + done.length * PER;
  document.getElementById("win").hidden = false;
}

document.getElementById("snd").onclick = function(){
  sound = !sound;
  this.setAttribute("aria-pressed", sound);
  this.textContent = sound ? "🔊" : "🔇";
};
[].forEach.call(document.getElementById("size").querySelectorAll("button"), function(b){
  b.onclick = function(){
    width = +b.dataset.w;
    [].forEach.call(b.parentNode.querySelectorAll("button"), function(x){
      x.setAttribute("aria-pressed", x === b);
    });
  };
});

/* iOS: resume audio on first tap */
document.body.addEventListener("touchstart", function once(){
  ac();
  document.body.removeEventListener("touchstart", once);
}, { once: true });

setColor(color, true, false);
