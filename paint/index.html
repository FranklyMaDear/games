<!DOCTYPE html>
<html lang="el">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Ζωγραφίζω και χρωματίζω</title>
<link href="https://fonts.googleapis.com/css2?family=Comfortaa:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#f3f1fb;--panel:#ffffff;--ink:#25204a;--muted:#6f6b92;--line:#e2dff2;--soft:#ece9fa;--accent:#5b4bdb;--accent-ink:#ffffff;--ok:#1fb86a;--shadow:0 10px 30px rgba(37,32,74,.12);--cork:#c9a87c;--cork-dark:#a67c52;--cork-light:#e8d4b0;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#14122b;--panel:#201d41;--ink:#f1eeff;--muted:#a7a3d0;--line:#33305c;--soft:#2b2853;--accent:#8a7dff;--accent-ink:#14122b;--shadow:0 10px 30px rgba(0,0,0,.4);--cork:#8b6b4a;--cork-dark:#6b4f35;--cork-light:#a88b6a;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#14122b;--panel:#201d41;--ink:#f1eeff;--muted:#a7a3d0;--line:#33305c;--soft:#2b2853;--accent:#8a7dff;--accent-ink:#14122b;--shadow:0 10px 30px rgba(0,0,0,.4);--cork:#8b6b4a;--cork-dark:#6b4f35;--cork-light:#a88b6a;color-scheme:dark}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Comfortaa","Trebuchet MS",system-ui,sans-serif;font-weight:500}
.app{max-width:1040px;margin:0 auto;padding:14px 16px 32px;display:grid;gap:18px;grid-template-columns:minmax(0,1fr);align-items:start}
header{grid-column:1/-1;display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px}
.logo{width:42px;height:42px;border-radius:14px;background:var(--accent);display:grid;place-items:center;box-shadow:var(--shadow)}
h1{margin:0;font-size:1.3rem;font-weight:700;letter-spacing:-.01em}
.stats{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.chip{background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:6px 14px;font-weight:700;font-size:.9rem;display:flex;gap:6px;align-items:center;box-shadow:0 2px 6px rgba(37,32,74,.06)}
.chip small{color:var(--muted);font-weight:500;font-size:.8rem}
button{font:inherit;font-weight:700;font-size:.9rem;color:var(--ink);background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:9px 16px;cursor:pointer;box-shadow:0 2px 6px rgba(37,32,74,.06);transition:transform .1s,background .15s}
button:hover{background:var(--soft)}
button:active{transform:scale(.97)}
button:focus-visible,input:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
button.pri{background:var(--accent);color:var(--accent-ink);border-color:transparent}
button.pri:hover{filter:brightness(1.08)}
.icon{padding:8px 11px}

/* Corkboard frame */
.board-wrap{max-width:640px;margin:0 auto;padding:18px;background:
  radial-gradient(ellipse at 20% 30%, rgba(255,255,255,.15) 0%, transparent 50%),
  radial-gradient(ellipse at 80% 70%, rgba(0,0,0,.08) 0%, transparent 40%),
  linear-gradient(135deg, var(--cork-light) 0%, var(--cork) 40%, var(--cork-dark) 100%);
border-radius:20px;box-shadow:var(--shadow), inset 0 1px 0 rgba(255,255,255,.25), inset 0 -2px 4px rgba(0,0,0,.15);
border:3px solid var(--cork-dark)}
.board{position:relative;width:100%;aspect-ratio:1;background:#fffef8;border-radius:8px;overflow:hidden;touch-action:none;box-shadow:inset 0 0 12px rgba(0,0,0,.08);border:2px solid #d4c4a8}
.board canvas,.board svg{position:absolute;inset:0;width:100%;height:100%}
.board canvas{cursor:none}
.board svg{pointer-events:none}
#ring{position:absolute;border:2px solid #fff;box-shadow:0 0 0 1.5px #25204a;border-radius:50%;transform:translate(-50%,-50%);pointer-events:none;display:none;z-index:2}
.prog{max-width:640px;margin:14px auto 0;display:flex;align-items:center;gap:10px;font-size:.85rem;color:var(--muted)}
.bar{flex:1;height:12px;border-radius:8px;background:var(--soft);overflow:hidden}
.bar i{display:block;height:100%;width:0;border-radius:8px;background:linear-gradient(90deg,#2eb0f5,var(--ok));transition:width .35s}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:26px;padding:18px;display:grid;gap:18px;box-shadow:var(--shadow)}
.panel h2{margin:0 0 10px;font-size:.85rem;font-weight:700;color:var(--muted)}

/* Pencil-style swatches */
.sw{display:grid;grid-template-columns:repeat(auto-fill,minmax(42px,1fr));gap:8px}
.sw button{aspect-ratio:1/2.2;padding:0;border-radius:6px 6px 3px 3px;border:none;position:relative;box-shadow:2px 3px 5px rgba(0,0,0,.18);overflow:hidden;transition:transform .12s,box-shadow .12s}
.sw button::before{content:"";position:absolute;top:0;left:0;right:0;height:18%;background:linear-gradient(180deg,#f5f0e6,#e8dfd0);border-bottom:1px solid rgba(0,0,0,.12)}
.sw button::after{content:"";position:absolute;bottom:0;left:50%;transform:translateX(-50%);width:0;height:0;border-left:8px solid transparent;border-right:8px solid transparent;border-top:12px solid #c4b8a0}
.sw button:hover{transform:translateY(-3px) scale(1.05);box-shadow:3px 5px 8px rgba(0,0,0,.22)}
.sw button[aria-pressed="true"]{box-shadow:0 0 0 3px var(--panel),0 0 0 5px var(--accent);transform:scale(1.08)}

.pick{display:flex;gap:14px;flex-wrap:wrap;align-items:flex-start}
.sv{position:relative;width:210px;height:140px;border-radius:14px;overflow:hidden;touch-action:none;cursor:crosshair;border:1px solid var(--line)}
.sv canvas{width:100%;height:100%;display:block}
.sv i{position:absolute;width:18px;height:18px;margin:-9px 0 0 -9px;border:3px solid #fff;border-radius:50%;box-shadow:0 0 0 1.5px #000,0 2px 6px rgba(0,0,0,.4);pointer-events:none}
.ctl{display:grid;gap:12px;min-width:150px;flex:1}
#hue{width:100%;height:16px;-webkit-appearance:none;appearance:none;border-radius:10px;background:linear-gradient(90deg,#f00,#ff0,#0f0,#0ff,#00f,#f0f,#f00)}
#hue::-webkit-slider-thumb{-webkit-appearance:none;width:22px;height:22px;background:#fff;border:3px solid var(--ink);border-radius:50%}
#hue::-moz-range-thumb{width:16px;height:16px;background:#fff;border:3px solid var(--ink);border-radius:50%}
.cur{display:flex;gap:10px;align-items:center}
#prev{width:46px;height:46px;border-radius:14px;flex:none;border:1px solid rgba(0,0,0,.18);box-shadow:inset 0 -3px 0 rgba(0,0,0,.08)}
#hex{width:100%;font:inherit;font-weight:700;padding:10px 12px;border:1px solid var(--line);border-radius:12px;background:var(--bg);color:var(--ink);text-transform:uppercase}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.size{gap:8px}
.size h2{margin:0 6px 0 0}
.size button{width:52px;height:46px;padding:0;display:grid;place-items:center}
.size button span{display:block;background:var(--muted);border-radius:50%}
.size button[aria-pressed="true"]{background:var(--accent);border-color:transparent}
.size button[aria-pressed="true"] span{background:var(--accent-ink)}
.acts{display:flex;gap:8px;flex-wrap:wrap}
.acts .pri{margin-left:auto}
.hint{font-size:.78rem;color:var(--muted);margin:0;line-height:1.4}
#win{position:fixed;inset:0;background:rgba(20,18,43,.6);backdrop-filter:blur(4px);display:grid;place-items:center;padding:20px;z-index:5}
#win[hidden]{display:none}
.card{background:var(--panel);border-radius:30px;padding:28px 32px;text-align:center;max-width:380px;box-shadow:0 20px 60px rgba(0,0,0,.35);animation:pop .5s cubic-bezier(.3,1.5,.5,1)}
.card .st{font-size:3rem;letter-spacing:6px}
.card h2{margin:6px 0 4px;font-size:1.8rem;font-weight:700;color:var(--ink)}
.card p{margin:4px 0 18px;color:var(--muted);line-height:1.5}
.card b{color:var(--accent)}
.card .up{display:inline-block;background:var(--soft);border-radius:999px;padding:4px 14px;margin-bottom:12px;font-weight:700;font-size:.85rem}
.card button{font-size:1rem;padding:12px 26px}
@keyframes pop{from{transform:scale(.5);opacity:0}to{transform:scale(1);opacity:1}}
@media (prefers-reduced-motion:reduce){.card{animation:none}.bar i,button{transition:none}}
@media (min-width:880px){.app{grid-template-columns:minmax(0,1.15fr) minmax(360px,1fr)}}
</style>
</head>
<body>
<main class="app">
<header>
<div class="brand"><div class="logo"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 20l4-1 11-11a2.5 2.5 0 00-3.5-3.5L4.5 15.5z"/><path d="M14 6.5l3.5 3.5"/></svg></div><h1>Ζωγραφίζω και χρωματίζω</h1></div>
<div class="stats"><div class="chip" id="lvl">Επίπεδο 1</div><div class="chip">⭐ <span id="pts">0</span> <small>πόντοι</small></div><button id="snd" class="icon" aria-pressed="true" aria-label="Ήχος">🔊</button></div>
</header>

<section>
<div class="board-wrap">
<div class="board">
<canvas id="paint" width="600" height="600"></canvas>
<div id="ring"></div>
<svg id="lines" viewBox="0 0 300 300" aria-hidden="true"></svg>
</div>
</div>
<div class="prog"><span id="cnt">0/0</span><div class="bar" role="progressbar" aria-label="Πρόοδος"><i id="fill"></i></div></div>
</section>

<section class="panel">
<div>
<h2>Μολύβια</h2>
<p class="hint">Διάλεξε μολύβι. Για να αλλάξεις το χρώμα του, επίλεξέ το και μετά βάλε νέο χρώμα από κάτω.</p>
<div class="sw" id="sw"></div>
</div>
<div>
<h2>Δικό σου χρώμα / Διαμόρφωση μολυβιού</h2>
<div class="pick">
<div class="sv" id="sv"><canvas id="svc" width="200" height="140"></canvas><i id="dot"></i></div>
<div class="ctl">
<input type="range" id="hue" min="0" max="360" value="0" aria-label="Απόχρωση">
<div class="cur"><div id="prev"></div><input id="hex" maxlength="7" value="#E63946" aria-label="Κωδικός χρώματος"></div>
<button id="bApply" class="pri" style="width:100%">Εφάρμοσε στο μολύβι</button>
</div>
</div>
</div>
<div class="row size" id="size">
<h2>Μαρκαδόρος</h2>
<button data-w="14" aria-label="Λεπτός"><span style="width:8px;height:8px"></span></button>
<button data-w="30" aria-label="Μεσαίος" aria-pressed="true"><span style="width:16px;height:16px"></span></button>
<button data-w="52" aria-label="Χοντρός"><span style="width:26px;height:26px"></span></button>
</div>
<div class="acts">
<button id="bUndo">Ακύρωση</button>
<button id="bClear">Καθάρισμα</button>
<button id="bNext" class="pri">Άλλο σχέδιο</button>
</div>
</section>
</main>

<div id="win" hidden>
<div class="card" role="dialog" aria-live="polite">
<div class="st">⭐⭐⭐</div>
<h2>Μπράβο!</h2>
<div class="up" id="up" hidden></div>
<p>Τελείωσες το σχέδιο και κέρδισες <b id="won">50</b> πόντους!</p>
<button id="bGo" class="pri">Επόμενο σχέδιο</button>
</div>
</div>

<script>
var S=600,TH=0.86,BONUS=50,PER=10;
var R=function(x,y,w,h){return "M"+x+" "+y+"h"+w+"v"+h+"h"+(-w)+"Z"};
var E=function(x,y,a,b){return "M"+(x-a)+" "+y+"a"+a+" "+b+" 0 1 0 "+(2*a)+" 0a"+a+" "+b+" 0 1 0 "+(-2*a)+" 0Z"};
var C=function(x,y,r){return E(x,y,r,r)};
var P=function(){return "M"+[].slice.call(arguments).join("L")+"Z"};
var RE=function(x,y,a,b,d){var t=d*Math.PI/180,dx=a*Math.cos(t),dy=a*Math.sin(t),f=function(n){return n.toFixed(1)};
 return "M"+f(x-dx)+" "+f(y-dy)+"A"+a+" "+b+" "+d+" 1 0 "+f(x+dx)+" "+f(y+dy)+"A"+a+" "+b+" "+d+" 1 0 "+f(x-dx)+" "+f(y-dy)+"Z"};

/* ─── Καλύτερα, πιο ρεαλιστικά σχέδια ─── */
var D=[
/* 0: Πρόσωπο (πορτρέτο) – μαλλιά, πρόσωπο, μάτια, χείλη, μπλούζα */
[
  R(0,0,300,300), /* φόντο */
  "M30 300 L30 175 Q45 95 150 70 Q255 95 270 175 L270 300 Z", /* μαλλιά πίσω */
  "M55 300 L55 195 Q70 120 150 100 Q230 120 245 195 L245 300 Z", /* μαλλιά μπροστά */
  "M95 125 Q150 95 205 125 Q225 175 205 230 Q150 255 95 230 Q75 175 95 125 Z", /* πρόσωπο */
  E(122,155,16,12), /* αριστερό μάτι */
  E(178,155,16,12), /* δεξί μάτι */
  C(122,155,6), /* αριστερή κόρη */
  C(178,155,6), /* δεξιά κόρη */
  "M145 175 Q150 190 155 175", /* μύτη */
  "M125 205 Q150 225 175 205 Q150 218 125 205 Z", /* χείλη */
  "M55 260 Q150 280 245 260 L245 300 L55 300 Z" /* μπλούζα */
],

/* 1: Τοπίο – ουρανός, ήλιος, βουνά, σπίτι, λουλούδια, γρασίδι */
[
  R(0,0,300,180), /* ουρανός */
  C(240,50,32), /* ήλιος */
  "M0 180 L55 95 L110 160 L155 80 L210 150 L260 70 L300 140 L300 180 Z", /* βουνά */
  R(0,180,300,120), /* γρασίδι */
  R(95,145,90,55), /* τοίχος σπιτιού */
  "M85 145 L140 100 L195 145 Z", /* στέγη */
  R(125,165,30,35), /* πόρτα */
  R(105,155,18,16), /* παράθυρο αριστερά */
  R(157,155,18,16), /* παράθυρο δεξιά */
  C(45,210,14), /* λουλούδι 1 κέντρο */
  "M45 196 Q38 188 45 182 Q52 188 45 196 M45 196 Q32 200 30 210 Q38 208 45 196 M45 196 Q58 200 60 210 Q52 208 45 196 M45 196 Q48 212 45 220 Q42 212 45 196", /* πέταλα 1 */
  C(250,215,12), /* λουλούδι 2 κέντρο */
  "M250 203 Q244 196 250 191 Q256 196 250 203 M250 203 Q238 206 236 215 Q244 213 250 203 M250 203 Q262 206 264 215 Q256 213 250 203 M250 203 Q253 218 250 225 Q247 218 250 203", /* πέταλα 2 */
  C(80,250,10), /* λουλούδι 3 */
  "M80 240 Q74 234 80 230 Q86 234 80 240 M80 240 Q70 244 68 252 Q74 250 80 240 M80 240 Q90 244 92 252 Q86 250 80 240"
],

/* 2: Γάτα */
[
  R(0,0,300,300),
  R(0,220,300,80), /* πάτωμα */
  "M90 210 Q90 130 150 115 Q210 130 210 210 Z", /* σώμα */
  "M110 130 Q100 70 130 90 Q150 60 170 90 Q200 70 190 130 Z", /* κεφάλι + αυτιά */
  C(130,110,8), C(170,110,8), /* μάτια */
  C(130,110,3), C(170,110,3), /* κόρες */
  "M145 125 Q150 135 155 125", /* μύτη */
  "M130 145 Q150 155 170 145", /* στόμα */
  "M90 180 Q50 160 45 190 Q70 200 90 185", /* ουρά */
  "M100 210 L85 250 L115 250 Z", /* πόδι 1 */
  "M185 210 L170 250 L200 250 Z" /* πόδι 2 */
],

/* 3: Αυτοκίνητο */
[
  R(0,0,300,300),
  R(0,200,300,100), /* δρόμος */
  "M40 185 L55 140 L120 140 L140 110 L220 110 L245 140 L260 185 Z", /* αμάξωμα */
  R(50,185,200,40), /* κάτω μέρος */
  C(90,225,28), /* ρόδα αριστερά */
  C(210,225,28), /* ρόδα δεξιά */
  C(90,225,12), C(210,225,12), /* ζάντες */
  R(145,120,55,40), /* παράθυρο */
  "M120 140 L140 115 L140 140 Z", /* παρμπρίζ μπροστά */
  C(250,55,22) /* ήλιος */
],

/* 4: Δέντρο με μήλα */
[
  R(0,0,300,220), /* ουρανός */
  R(0,220,300,80), /* γρασίδι */
  R(135,160,30,80), /* κορμός */
  C(150,120,55), /* φύλλωμα */
  C(110,140,35), C(190,140,35), C(150,85,40), /* ακόμα φύλλα */
  C(125,110,10), C(170,100,10), C(145,145,9), C(175,135,8) /* μήλα */
],

/* 5: Πεταλούδα */
[
  R(0,0,300,300),
  "M150 80 Q80 40 50 100 Q70 160 150 140 Z", /* φτερό πάνω αριστερά */
  "M150 140 Q70 160 60 220 Q100 250 150 180 Z", /* φτερό κάτω αριστερά */
  "M150 80 Q220 40 250 100 Q230 160 150 140 Z", /* φτερό πάνω δεξιά */
  "M150 140 Q230 160 240 220 Q200 250 150 180 Z", /* φτερό κάτω δεξιά */
  R(145,70,10,130), /* σώμα */
  C(150,65,12), /* κεφάλι */
  "M140 55 Q120 30 110 50", "M160 55 Q180 30 190 50" /* κεραίες */
],

/* 6: Σπίτι με κήπο */
[
  R(0,0,300,160), /* ουρανός */
  C(55,50,28), /* ήλιος */
  R(0,160,300,140), /* γρασίδι */
  R(80,120,140,100), /* τοίχος */
  "M65 120 L150 55 L235 120 Z", /* στέγη */
  R(130,155,40,65), /* πόρτα */
  R(95,140,28,24), R(177,140,28,24), /* παράθυρα */
  C(40,200,16), /* θάμνος αριστερά */
  C(260,195,18), /* θάμνος δεξιά */
  "M200 220 L200 180 L215 160 L230 180 L230 220 Z" /* δέντρο μικρό */
],

/* 7: Ψάρι */
[
  R(0,0,300,300),
  "M60 150 Q120 80 200 100 Q250 120 260 150 Q250 180 200 200 Q120 220 60 150 Z", /* σώμα */
  "M60 150 L20 110 L30 150 L20 190 Z", /* ουρά */
  C(210,140,12), /* μάτι */
  C(210,140,5),
  "M160 130 Q175 150 160 170", /* πτερύγιο πάνω */
  "M140 175 Q155 195 170 175" /* πτερύγιο κάτω */
]
];

var cv=document.getElementById("paint"),ctx=cv.getContext("2d",{willReadFrequently:true});
function mk(){var c=document.createElement("canvas");c.width=c.height=S;return c}
var snap=mk(),sc=mk(),tc=mk(),mc=mk();
var sctx=sc.getContext("2d"),tctx=tc.getContext("2d"),mctx=mc.getContext("2d"),nctx=snap.getContext("2d");
var paths=[],owner,total,done,awarded,undo=[],finished=false;
var color="#E63946",width=30,points=0,queue=[],last=-1,drawing=false,reg=-1,lp=null,sound=true;
var activePencil=0;

try{points=parseInt(localStorage.getItem("pts")||"0",10)||0}catch(e){}
document.getElementById("pts").textContent=points;

function shuffle(a){for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1)),t=a[i];a[i]=a[j];a[j]=t}return a}
var completed=0,seen=[];
try{completed=parseInt(localStorage.getItem("done")||"0",10)||0}catch(e){}
var tier=D.map(function(d){return d.length<=6?0:d.length<=10?1:2});
function allowed(){return completed<3?[0]:completed<6?[0,1]:[0,1,2]}
function level(){return completed<3?0:completed<6?1:2}
function nextIndex(){
 var al=allowed(),pool=D.map(function(_,i){return i}).filter(function(i){return al.indexOf(tier[i])>-1});
 var fresh=pool.filter(function(i){return seen.indexOf(i)<0&&i!==last});
 if(!fresh.length){seen=[];fresh=pool.filter(function(i){return i!==last})}
 last=fresh[Math.floor(Math.random()*fresh.length)];seen.push(last);return last;
}
function lvlText(){document.getElementById("lvl").textContent="Επίπεδο "+(level()+1)+" από 3"}
function load(){
 var di=nextIndex(),d=D[di];TH=tier[di]===0?0.78:0.86;lvlText();
 document.getElementById("lines").innerHTML=d.map(function(p){return '<path d="'+p+'" fill="none" stroke="#2b2750" stroke-width="2.8" stroke-linejoin="round"/>'}).join("");
 var m=new DOMMatrix().scale(S/300,S/300);
 paths=d.map(function(p){var q=new Path2D();q.addPath(new Path2D(p),m);return q});
 owner=new Uint8Array(S*S);total=new Array(d.length).fill(0);
 for(var i=0;i<paths.length;i++){
  tctx.clearRect(0,0,S,S);tctx.fillStyle="#000";tctx.fill(paths[i]);
  var a=tctx.getImageData(0,0,S,S).data;
  for(var p=0;p<S*S;p++)if(a[p*4+3]>127)owner[p]=i+1;
 }
 for(var p=0;p<S*S;p++)if(owner[p])total[owner[p]-1]++;
 done=new Array(d.length).fill(false);awarded=new Array(d.length).fill(false);
 ctx.clearRect(0,0,S,S);undo=[];finished=false;progress();
}
function progress(){
 var n=done.filter(Boolean).length;document.getElementById("cnt").textContent=n+"/"+done.length;
 document.getElementById("fill").style.width=(100*n/done.length)+"%";
}
function addPoints(n){points+=n;document.getElementById("pts").textContent=points;try{localStorage.setItem("pts",points)}catch(e){}}

/* ήχοι */
var AC;
function ac(){if(!AC){try{AC=new(window.AudioContext||window.webkitAudioContext)()}catch(e){}}if(AC&&AC.state==="suspended")AC.resume();return AC}
function tone(f,t,d,type,v){if(!sound)return;var a=ac();if(!a)return;var o=a.createOscillator(),g=a.createGain(),s=a.currentTime+t;
 o.type=type||"sine";o.frequency.value=f;g.gain.setValueAtTime(v||.15,s);g.gain.exponentialRampToValueAtTime(.001,s+d);o.connect(g);g.connect(a.destination);o.start(s);o.stop(s+d+.02)}
var SCALE=[261.63,293.66,329.63,392,440,523.25,587.33,659.25];
function pickSound(hex){var v=hex2hsv(hex),f=v[1]<.12?196:SCALE[Math.floor(v[0]/360*8)%8];tone(f,0,.14,"triangle",.18);tone(f*1.5,.07,.18,"triangle",.14)}
function dingSound(){tone(880,0,.15,"sine",.15);tone(1320,.09,.22,"sine",.12)}
function winSound(){[523.25,659.25,783.99,1046.5,783.99,1046.5,1318.5].forEach(function(f,i){tone(f,i*.12,.3,"triangle",.18)})}

/* χρώματα */
function hsv2hex(h,s,v){var f=function(n){var k=(n+h/60)%6;return v-v*s*Math.max(0,Math.min(k,4-k,1))};return "#"+[f(5),f(3),f(1)].map(function(x){return Math.round(x*255).toString(16).padStart(2,"0")}).join("").toUpperCase()}
function hex2hsv(x){var r=parseInt(x.slice(1,3),16)/255,g=parseInt(x.slice(3,5),16)/255,b=parseInt(x.slice(5,7),16)/255,mx=Math.max(r,g,b),mn=Math.min(r,g,b),d=mx-mn,h=0;
 if(d){h=mx===r?((g-b)/d)%6:mx===g?(b-r)/d+2:(r-g)/d+4;h*=60;if(h<0)h+=360}return[h,mx?d/mx:0,mx]}
var H=355,SA=.75,V=.9;

/* Μολύβια – προσαρμόσιμα */
var pencils=["#E63946","#F4A261","#E9C46A","#2A9D8F","#457B9D","#9B5CF6","#FF5CAA","#1D3557","#FFFFFF","#111111"];
try{var saved=localStorage.getItem("pencils");if(saved)pencils=JSON.parse(saved)}catch(e){}

var swEl=document.getElementById("sw");
function renderPencils(){
  swEl.innerHTML="";
  pencils.forEach(function(c,i){
    var b=document.createElement("button");
    b.style.background=c;
    b.dataset.i=i;
    b.setAttribute("aria-label","Μολύβι "+(i+1));
    b.setAttribute("aria-pressed",i===activePencil?"true":"false");
    b.onclick=function(){
      activePencil=i;
      setColor(pencils[i],true,true);
      [].forEach.call(swEl.children,function(x){x.setAttribute("aria-pressed",x.dataset.i==activePencil)});
    };
    swEl.appendChild(b);
  });
}
renderPencils();

var svc=document.getElementById("svc"),svx=svc.getContext("2d"),dot=document.getElementById("dot"),hue=document.getElementById("hue"),hex=document.getElementById("hex"),prev=document.getElementById("prev"),sv=document.getElementById("sv");
function drawSV(){
 svx.fillStyle=hsv2hex(H,1,1);svx.fillRect(0,0,200,140);
 var g=svx.createLinearGradient(0,0,200,0);g.addColorStop(0,"#fff");g.addColorStop(1,"rgba(255,255,255,0)");svx.fillStyle=g;svx.fillRect(0,0,200,140);
 g=svx.createLinearGradient(0,0,0,140);g.addColorStop(0,"rgba(0,0,0,0)");g.addColorStop(1,"#000");svx.fillStyle=g;svx.fillRect(0,0,200,140);
}
function setColor(c,fromSwatch,snd){
 color=c.toUpperCase();
 if(fromSwatch){var v=hex2hsv(color);H=v[0];SA=v[1];V=v[2]}
 hue.value=H;drawSV();
 dot.style.left=(SA*100)+"%";dot.style.top=((1-V)*100)+"%";
 prev.style.background=color;hex.value=color;
 if(snd)pickSound(color);
}
function svMove(e){var r=sv.getBoundingClientRect();SA=Math.max(0,Math.min(1,(e.clientX-r.left)/r.width));V=1-Math.max(0,Math.min(1,(e.clientY-r.top)/r.height));setColor(hsv2hex(H,SA,V),false,false)}
var svDown=false;
sv.addEventListener("pointerdown",function(e){svDown=true;sv.setPointerCapture(e.pointerId);svMove(e)});
sv.addEventListener("pointermove",function(e){if(svDown)svMove(e)});
sv.addEventListener("pointerup",function(){svDown=false;pickSound(color)});
hue.addEventListener("input",function(){H=+hue.value;setColor(hsv2hex(H,SA,V),false,false)});
hue.addEventListener("change",function(){pickSound(color)});
hex.addEventListener("change",function(){var t=hex.value.trim();if(t[0]!=="#")t="#"+t;if(/^#[0-9a-fA-F]{6}$/.test(t))setColor(t,true,true);else hex.value=color});

document.getElementById("bApply").onclick=function(){
  pencils[activePencil]=color;
  try{localStorage.setItem("pencils",JSON.stringify(pencils))}catch(e){}
  renderPencils();
  pickSound(color);
};

/* ζωγραφική */
function pos(e){var r=cv.getBoundingClientRect();return{x:(e.clientX-r.left)*S/r.width,y:(e.clientY-r.top)*S/r.height}}
function compose(){
 ctx.clearRect(0,0,S,S);ctx.drawImage(snap,0,0);
 tctx.globalCompositeOperation="source-over";tctx.clearRect(0,0,S,S);tctx.drawImage(sc,0,0);
 tctx.globalCompositeOperation="destination-in";tctx.drawImage(mc,0,0);tctx.globalCompositeOperation="source-over";
 ctx.drawImage(tc,0,0);
}
function seg(a,b){
 sctx.strokeStyle=sctx.fillStyle=color;sctx.lineWidth=width;sctx.lineCap=sctx.lineJoin="round";
 sctx.beginPath();sctx.arc(b.x,b.y,width/2,0,7);sctx.fill();
 sctx.beginPath();sctx.moveTo(a.x,a.y);sctx.lineTo(b.x,b.y);sctx.stroke();
}
cv.addEventListener("pointerdown",function(e){
 if(finished)return;
 var p=pos(e),o=owner[Math.floor(p.y)*S+Math.floor(p.x)];if(!o)return;
 ac();drawing=true;reg=o;lp=p;cv.setPointerCapture(e.pointerId);
 undo.push(ctx.getImageData(0,0,S,S));if(undo.length>12)undo.shift();
 nctx.clearRect(0,0,S,S);nctx.drawImage(cv,0,0);sctx.clearRect(0,0,S,S);
 var id=mctx.createImageData(S,S),d=id.data;for(var i=0;i<S*S;i++)if(owner[i]===o)d[i*4+3]=255;mctx.putImageData(id,0,0);
 seg(p,p);compose();
});
cv.addEventListener("pointermove",function(e){if(!drawing)return;var p=pos(e);seg(lp,p);lp=p;compose()});
function end(){if(!drawing)return;drawing=false;check(true)}
var ring=document.getElementById("ring");
cv.addEventListener("pointermove",function(e){if(e.pointerType!=="mouse")return;var r=cv.getBoundingClientRect(),d=width*r.width/S;ring.style.display="block";ring.style.width=ring.style.height=d+"px";ring.style.left=(e.clientX-r.left)+"px";ring.style.top=(e.clientY-r.top)+"px"});
cv.addEventListener("pointerleave",function(){ring.style.display="none"});
cv.addEventListener("pointerup",end);cv.addEventListener("pointercancel",end);
function check(reward){
 var a=ctx.getImageData(0,0,S,S).data,cnt=new Array(done.length).fill(0),newly=false;
 for(var p=0;p<S*S;p++){var o=owner[p];if(o&&a[p*4+3]>127)cnt[o-1]++}
 for(var i=0;i<done.length;i++){
  done[i]=total[i]===0||cnt[i]/total[i]>=TH;
  if(reward&&done[i]&&!awarded[i]){awarded[i]=true;addPoints(PER);newly=true}
 }
 progress();
 if(done.every(Boolean)&&!finished&&reward){finish()}else if(newly)dingSound();
}
function finish(){
 var before=level();completed++;try{localStorage.setItem("done",completed)}catch(e){}
 var up=document.getElementById("up");up.hidden=level()===before;
 if(!up.hidden)up.textContent=level()===1?"Νέο επίπεδο! Τα σχέδια γίνονται πιο ποικίλα":"Νέο επίπεδο! Όλα τα σχέδια ξεκλείδωσαν";
 lvlText();finished=true;addPoints(BONUS);winSound();
 document.getElementById("won").textContent=BONUS+done.length*PER;
 document.getElementById("win").hidden=false;
}
document.getElementById("bGo").onclick=function(){document.getElementById("win").hidden=true;load()};
document.getElementById("bNext").onclick=load;
document.getElementById("bClear").onclick=function(){ctx.clearRect(0,0,S,S);undo=[];done.fill(false);progress()};
document.getElementById("bUndo").onclick=function(){var u=undo.pop();if(u){ctx.putImageData(u,0,0);check(false)}};
document.getElementById("snd").onclick=function(){sound=!sound;this.setAttribute("aria-pressed",sound);this.textContent=sound?"🔊":"🔇"};
[].forEach.call(document.getElementById("size").querySelectorAll("button"),function(b){
 b.onclick=function(){width=+b.dataset.w;[].forEach.call(b.parentNode.querySelectorAll("button"),function(x){x.setAttribute("aria-pressed",x===b)})};
});

setColor(color,true,false);load();
</script>
</body>
</html>
