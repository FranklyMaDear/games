<!DOCTYPE html>
<html lang="el">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#5b4fcf">
<title>Ζωγραφίζω</title>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;800;900&display=swap" rel="stylesheet">
<style>
:root{--bg:#eef0f8;--panel:#fff;--ink:#1e1b3a;--muted:#6b6789;--line:#e2e0ef;--soft:#f0eef8;--accent:#5b4fcf;--ok:#22c55e;--shadow:0 6px 24px rgba(30,27,58,.1);--safe-b:env(safe-area-inset-bottom,0px);--safe-t:env(safe-area-inset-top,0px)}
@media(prefers-color-scheme:dark){:root{--bg:#12101f;--panel:#1c1830;--ink:#f0eeff;--muted:#9b97b5;--line:#2e2a48;--soft:#252140;--accent:#8b7fff;--shadow:0 6px 24px rgba(0,0,0,.35);color-scheme:dark}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;height:100%;overflow-x:hidden;overscroll-behavior:none}
body{background:var(--bg);color:var(--ink);font-family:"Nunito",system-ui,sans-serif;font-weight:600;padding:var(--safe-t) env(safe-area-inset-right) var(--safe-b) env(safe-area-inset-left);min-height:100dvh}
.app{max-width:480px;margin:0 auto;padding:10px 12px 18px;display:flex;flex-direction:column;gap:10px}
header{display:flex;align-items:center;justify-content:space-between;gap:8px}
.brand{display:flex;align-items:center;gap:8px}
.logo{width:38px;height:38px;border-radius:11px;background:linear-gradient(135deg,#5b4fcf,#e85d9a);display:grid;place-items:center;font-size:1.15rem;box-shadow:var(--shadow)}
h1{margin:0;font-size:1.05rem;font-weight:900}
.stats{display:flex;gap:6px;align-items:center}
.chip{background:var(--panel);border:1.5px solid var(--line);border-radius:999px;padding:5px 10px;font-weight:800;font-size:.8rem;display:flex;gap:4px;align-items:center}
button{font:inherit;font-weight:800;font-size:.85rem;color:var(--ink);background:var(--panel);border:1.5px solid var(--line);border-radius:12px;padding:9px 12px;cursor:pointer;touch-action:manipulation;box-shadow:0 1px 4px rgba(0,0,0,.04)}
button:active{transform:scale(.96)}
button.pri{background:var(--accent);color:#fff;border-color:transparent}
.icon-btn{padding:7px 10px;font-size:1.05rem}
.stage{display:flex;flex-direction:column;gap:8px}
.frame{background:linear-gradient(160deg,#d4b896,#b8956a);border-radius:14px;padding:10px 10px 8px;box-shadow:var(--shadow),inset 0 1px 0 rgba(255,255,255,.25);border:2px solid #a67c4a}
.board{position:relative;width:100%;aspect-ratio:1;max-height:min(58vh,440px);margin:0 auto;background:#fffcf5;border-radius:8px;overflow:hidden;touch-action:none;border:1.5px solid #c9b896;-webkit-user-select:none;user-select:none}
.board canvas,.board svg{position:absolute;inset:0;width:100%;height:100%;touch-action:none}
.board canvas{cursor:none}
.board svg{pointer-events:none}
#nums{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:2}
#ring{position:absolute;border:2px solid #fff;box-shadow:0 0 0 1.5px #1e1b3a;border-radius:50%;transform:translate(-50%,-50%);pointer-events:none;display:none;z-index:4}
.tray{margin-top:8px}
.pencils{display:flex;justify-content:center;gap:5px;padding:6px 4px;background:rgba(0,0,0,.06);border-radius:12px}
.pencils button{width:26px;height:42px;padding:0;border:none;border-radius:6px;position:relative;flex-shrink:0;box-shadow:0 2px 4px rgba(0,0,0,.15),inset 0 -3px 0 rgba(0,0,0,.12)}
.pencils button:active{transform:translateY(-3px)}
.pencils button[aria-pressed="true"]{outline:3px solid #fff;outline-offset:1px;box-shadow:0 0 0 5px var(--accent),0 2px 6px rgba(0,0,0,.2);transform:scale(1.08)}
.prog{display:flex;align-items:center;gap:8px;font-size:.78rem;color:var(--muted);font-weight:700}
.bar{flex:1;height:10px;border-radius:6px;background:var(--soft);overflow:hidden}
.bar i{display:block;height:100%;width:0;border-radius:6px;background:linear-gradient(90deg,#60a5fa,var(--ok));transition:width .3s ease}
.legend{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;padding:4px 0}
.legend span{display:inline-flex;align-items:center;gap:4px;font-size:.72rem;font-weight:800;color:var(--muted);background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:3px 8px}
.legend i{width:14px;height:14px;border-radius:4px;border:1px solid rgba(0,0,0,.15);display:inline-block}
.panel{background:var(--panel);border:1.5px solid var(--line);border-radius:16px;padding:12px;display:grid;gap:12px;box-shadow:var(--shadow)}
.panel h2{margin:0 0 6px;font-size:.7rem;font-weight:800;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
.markers{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.markers button{display:flex;flex-direction:column;align-items:center;gap:4px;padding:8px 4px;border-radius:12px;font-size:.68rem;font-weight:800;border:1.5px solid var(--line);background:var(--panel)}
.markers button .swatch{width:28px;height:28px;border-radius:50%;border:2px solid rgba(0,0,0,.08)}
.markers button[aria-pressed="true"]{border-color:var(--accent);background:var(--soft);box-shadow:0 0 0 2px var(--accent)}
.pick{display:flex;gap:10px;flex-wrap:wrap;align-items:flex-start}
.sv{position:relative;width:140px;height:96px;border-radius:10px;overflow:hidden;touch-action:none;border:1.5px solid var(--line);flex-shrink:0}
.sv canvas{width:100%;height:100%;display:block}
.sv i{position:absolute;width:14px;height:14px;margin:-7px 0 0 -7px;border:2px solid #fff;border-radius:50%;box-shadow:0 0 0 1.5px #000;pointer-events:none}
.ctl{display:grid;gap:7px;flex:1;min-width:100px}
#hue{width:100%;height:12px;-webkit-appearance:none;appearance:none;border-radius:6px;background:linear-gradient(90deg,#f00,#ff0,#0f0,#0ff,#00f,#f0f,#f00)}
#hue::-webkit-slider-thumb{-webkit-appearance:none;width:20px;height:20px;background:#fff;border:2px solid var(--ink);border-radius:50%}
.cur{display:flex;gap:6px;align-items:center}
#prev{width:32px;height:32px;border-radius:8px;flex:none;border:1.5px solid rgba(0,0,0,.12)}
#hex{width:100%;font:inherit;font-weight:800;padding:7px 8px;border:1.5px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink);text-transform:uppercase;font-size:.8rem}
.size-row{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.size-row h2{margin:0 2px 0 0}
.size-row button{width:40px;height:36px;padding:0;display:grid;place-items:center}
.size-row button span{display:block;background:var(--muted);border-radius:50%}
.size-row button[aria-pressed="true"]{background:var(--accent);border-color:transparent}
.size-row button[aria-pressed="true"] span{background:#fff}
.acts{display:flex;gap:6px;flex-wrap:wrap}
.acts button{flex:1;min-width:0;padding:10px 8px;font-size:.8rem}
.acts .pri{flex:1.15}
#win{position:fixed;inset:0;background:rgba(20,16,40,.5);backdrop-filter:blur(5px);display:grid;place-items:center;padding:20px;z-index:30}
#win[hidden]{display:none}
.card{background:var(--panel);border-radius:20px;padding:22px 24px;text-align:center;max-width:320px;width:100%;box-shadow:0 20px 50px rgba(0,0,0,.3)}
.card .stars{font-size:2.2rem}
.card h2{margin:4px 0;font-size:1.4rem;font-weight:900}
.card p{margin:4px 0 12px;color:var(--muted);font-size:.9rem}
.card b{color:var(--accent)}
.card .up{display:inline-block;background:var(--soft);border-radius:999px;padding:3px 12px;margin-bottom:6px;font-weight:800;font-size:.75rem}
.card button{width:100%;padding:11px}
@media(max-width:360px){.pencils button{width:22px;height:38px}.markers{grid-template-columns:repeat(2,1fr)}}
</style>
</head>
<body>
<main class="app">
<header>
<div class="brand"><div class="logo">🎨</div><h1>Ζωγραφίζω</h1></div>
<div class="stats">
<div class="chip" id="lvl">Επ. 1</div>
<div class="chip">⭐ <span id="pts">0</span></div>
<button id="snd" class="icon-btn" aria-pressed="true" aria-label="Ήχος">🔊</button>
</div>
</header>
<section class="stage">
<div class="frame">
<div class="board" id="boardEl">
<canvas id="paint" width="600" height="600"></canvas>
<svg id="lines" viewBox="0 0 300 300" aria-hidden="true"></svg>
<svg id="nums" viewBox="0 0 300 300" aria-hidden="true"></svg>
<div id="ring"></div>
</div>
<div class="tray"><div class="pencils" id="sw"></div></div>
</div>
<div class="legend" id="legend"></div>
<div class="prog"><span id="cnt">0/0</span><div class="bar"><i id="fill"></i></div></div>
</section>
<section class="panel">
<div>
<h2>Μαρκαδόρος</h2>
<div class="markers" id="markerTypes">
<button data-type="solid" aria-pressed="true"><span class="swatch" style="background:#e74c3c"></span>Απλό</button>
<button data-type="soft"><span class="swatch" style="background:radial-gradient(circle,#f5b7b1,#e74c3c)"></span>Απαλό</button>
<button data-type="bright"><span class="swatch" style="background:#f1c40f;box-shadow:0 0 6px #f1c40f88"></span>Φωτεινό</button>
<button data-type="sparkle"><span class="swatch" style="background:linear-gradient(135deg,#f39c12,#e74c3c,#9b59b6)"></span>Λάμψη</button>
</div>
</div>
<div>
<h2>Χρώμα</h2>
<div class="pick">
<div class="sv" id="sv"><canvas id="svc" width="200" height="140"></canvas><i id="dot"></i></div>
<div class="ctl">
<input type="range" id="hue" min="0" max="360" value="0" aria-label="Απόχρωση">
<div class="cur"><div id="prev"></div><input id="hex" maxlength="7" value="#E74C3C" aria-label="Κωδικός"></div>
<button id="bApply" class="pri" style="width:100%;padding:8px;font-size:.8rem">Εφάρμοσε</button>
</div>
</div>
</div>
<div class="size-row" id="size">
<h2>Μέγεθος</h2>
<button data-w="16"><span style="width:7px;height:7px"></span></button>
<button data-w="30" aria-pressed="true"><span style="width:13px;height:13px"></span></button>
<button data-w="50"><span style="width:20px;height:20px"></span></button>
<button data-w="75"><span style="width:28px;height:28px"></span></button>
</div>
<div class="acts">
<button id="bUndo">↩</button>
<button id="bClear">Καθάρισμα</button>
<button id="bSave">💾</button>
<button id="bNext" class="pri">Άλλο →</button>
</div>
</section>
</main>
<div id="win" hidden>
<div class="card" role="dialog">
<div class="stars">⭐⭐⭐</div>
<h2>Μπράβο!</h2>
<div class="up" id="up" hidden></div>
<p>Κέρδισες <b id="won">50</b> πόντους!</p>
<button id="bGo" class="pri">Επόμενο</button>
</div>
</div>
