<!DOCTYPE html>
<html lang="el">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, user-scalable=no">
<title>Snake Drop Games by Aziram</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --line:#23263066;
    --ink:#eef0f6;
    --ink-dim:#8b8fa3;
    --gold:#ffd23f;
    --good:#4ade80;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  
  html,body{
    margin:0; padding:0; overflow:hidden; 
    background:#1f2842; height:100%; width:100%;
    font-family:'Baloo 2',system-ui,sans-serif; color:var(--ink); 
    touch-action:none; overscroll-behavior:none;
  }
  
  #wrap{position:fixed;inset:0;}
  canvas{display:block;width:100%;height:100%;}

  .hud{position:fixed;inset:0;pointer-events:none;z-index:5;}
  .hud > *{pointer-events:auto;}

  .topbar{position:absolute;top:0;left:0;right:0;display:flex;justify-content:space-between;align-items:flex-start;padding:14px 14px 0;}
  
  .stat{display:flex;align-items:center;gap:6px;background:linear-gradient(180deg,#1c1f2a,#14161f);border:1px solid var(--line);border-radius:999px;padding:6px 14px 6px 8px;font-weight:700;font-size:15px;box-shadow:0 4px 10px #0006;}
  .stat .dot{width:20px;height:20px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:12px;}
  .stat.score .dot{background:radial-gradient(circle at 30% 30%,#ffe27a,var(--gold));}
  .stat.timer{font-family:'JetBrains Mono',monospace;font-size:16px;letter-spacing:1px;}
  
  .leaderboard{position:absolute; top:14px; left:50%; transform:translateX(-50%); background:transparent; border:none; border-radius:14px; padding:8px 10px; min-width:200px; max-height:140px; overflow-y:auto; pointer-events:none;}
  .leaderboard::-webkit-scrollbar { display:none; }
  
  .leaderboard .lb-title{font-size:11px;letter-spacing:.14em;color:var(--ink-dim);text-transform:uppercase;margin:0 2px 6px;font-weight:800; text-align:center; text-shadow:0 2px 4px #000;}
  .lb-row{display:flex;align-items:center;gap:8px;padding:4px 6px;font-size:13px;font-weight:700;border-radius:8px; background:rgba(0,0,0,0.3); margin-bottom:4px; backdrop-filter:blur(2px);}
  .lb-row .rank{width:16px;text-align:center;color:var(--ink-dim);font-size:12px;}
  .lb-row .name{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap; text-shadow:0 1px 2px #000;}
  .lb-row .val{font-family:'JetBrains Mono',monospace;color:#fff; text-shadow:0 1px 2px #000;}
  .lb-row.me{background:rgba(255, 210, 63, 0.25); border:1px solid rgba(255, 210, 63, 0.4);}
  .lb-row.me .name,.lb-row.me .val{color:var(--gold);}
  
  .powerbar{position:absolute; right:16px; top:45%; transform:translateY(-50%); display:flex; flex-direction:column; gap:14px;}
  .pw{width:54px;height:54px;border-radius:16px;border:1px solid var(--line);background:linear-gradient(180deg,#3b3f4acc,#2b2f38cc);display:flex;align-items:center;justify-content:center;font-size:24px;position:relative;box-shadow:0 6px 14px #0007; backdrop-filter:blur(4px); cursor:pointer;}
  .pw:active{transform:scale(0.95);}
  .pw.cooldown{opacity: 0.5; pointer-events: none; filter: grayscale(100%);}
  .pw.active-buff{outline:3px solid var(--good); background:linear-gradient(180deg,#2b4a3acc,#1b3a28cc);}
  .pw .cd{position:absolute;bottom:-8px;left:50%;transform:translateX(-50%);background:var(--gold);color:#181818;font-family:'JetBrains Mono',monospace;font-size:10px;font-weight:700;padding:1px 6px;border-radius:8px;display:none;}
  .pw.cooldown .cd{display:block; background:#ff4d6d; color:#fff;}
  .pw.active-buff .cd{display:block; background:var(--good); color:#000;}

  .center-msg{position:absolute;top:30%;left:50%;transform:translate(-50%,-50%);text-align:center;background:linear-gradient(180deg,#1a1c26f2,#101219f2);border:1px solid var(--line);border-radius:20px;padding:28px 34px;min-width:300px;box-shadow:0 20px 50px #000a;}
  .center-msg h1{margin:0 0 6px;font-size:26px;font-weight:800;}
  .center-msg h1 span{color:var(--gold);}
  .center-msg p{margin:0;color:var(--ink-dim);font-size:14px;line-height:1.5;}
  
  .btn{border:none;border-radius:999px;padding:12px 26px;font-family:'Baloo 2',sans-serif;font-weight:800;font-size:16px;cursor:pointer;background:linear-gradient(180deg,#ffe27a,var(--gold));color:#1a1200;box-shadow:0 6px 0 #b58a12, 0 10px 18px #0007;margin-top:18px;}
  .btn:active{transform:translateY(3px); box-shadow:0 2px 0 #b58a12;}
  
  .btn-alt{background:linear-gradient(180deg,#8b8fa3,#555866); color:#fff; box-shadow:0 6px 0 #333;}
  .btn-alt:active{box-shadow:0 2px 0 #333;}

  .hidden{display:none !important;}

  .toast{position:absolute;top:120px;left:50%;transform:translateX(-50%);font-weight:800;font-size:15px;padding:6px 16px;border-radius:999px;opacity:0;background:#12141ce6;border:1px solid var(--line);transition:opacity .25s, transform .25s; z-index:20;}
  .toast.show{opacity:1;transform:translateX(-50%) translateY(6px);}

  /* Διάφανο Στρογγυλό Χειριστήριο */
  .control-zone {
    position: absolute;
    bottom: 5%;
    left: 50%;
    transform: translateX(-50%);
    width: 160px;
    height: 160px;
    display: flex;
    justify-content: center;
    align-items: center;
    touch-action: none;
    z-index: 10;
    pointer-events: auto; 
  }
  .circular-joystick {
    width: 140px;
    height: 140px;
    border-radius: 50%;
    background: rgba(255, 255, 255, 0.08);
    backdrop-filter: blur(8px);
    -webkit-backdrop-filter: blur(8px);
    border: 1px solid rgba(255, 255, 255, 0.2);
    box-shadow: 0 0 30px rgba(0, 0, 0, 0.2), inset 0 0 25px rgba(255, 255, 255, 0.08);
    display: flex;
    justify-content: center;
    align-items: center;
    position: relative;
    transition: opacity 0.3s ease;
  }
  .joy-inner {
    width: 55px;
    height: 55px;
    border-radius: 50%;
    background: rgba(255, 255, 255, 0.25);
    border: 1px solid rgba(255, 255, 255, 0.5);
    box-shadow: 0 4px 15px rgba(0,0,0,0.15);
    transition: transform 0.05s linear;
    pointer-events: none;
  }
</style>
</head>
<body>
<div id="wrap">
  <canvas id="game"></canvas>
  <div class="hud">
    <div class="topbar">
      <div style="display:flex;flex-direction:column;gap:8px;">
        <div class="stat score"><div class="dot">◆</div><span id="scoreVal">0</span></div>
        <div class="stat timer" id="timerUI"><span id="timerVal">03:00</span></div>
      </div>
      <!-- Κενό για να εξισορροπεί το flex-between -->
      <div style="width: 100px;"></div>
    </div>
    
    <div class="leaderboard" id="leaderboardPanel">
      <div class="lb-title">Κατάταξη</div>
      <div id="lbRows"></div>
    </div>

    <div class="powerbar">
      <div class="pw" id="pwBoost" title="Ταχύτητα">⚡<span class="cd" id="cdBoost"></span></div>
      <div class="pw" id="pwMagnet" title="Μαγνήτης">🧲<span class="cd" id="cdMagnet"></span></div>
      <div class="pw" id="pwShield" title="Ασπίδα">🛡️<span class="cd" id="cdShield"></span></div>
    </div>

    <div class="toast" id="toast"></div>

    <div class="center-msg" id="startMsg">
      <h1>Snake Drop <span>Games by Aziram</span></h1>
      <p>Χρησιμοποίησε το διάφανο στρογγυλό χειριστήριο.</p>
      <div style="display:flex; gap:10px; justify-content:center; margin-top:20px;">
        <button class="btn" id="btn3Min" style="margin-top:0;">3 Λεπτά</button>
        <button class="btn btn-alt" id="btnEndless" style="margin-top:0;">Απεριόριστο</button>
      </div>
    </div>

    <div class="center-msg hidden" id="endMsg">
      <h1 id="endTitle">Game Over</h1>
      <p id="endBody">Το σκορ σου: 0</p>
      <button class="btn" id="restartBtn">Ξανά</button>
    </div>

    <div class="control-zone" id="controlZone">
      <div class="circular-joystick" id="joyCenter">
        <div class="joy-inner" id="joyKnob"></div>
      </div>
    </div>

  </div>
</div>

<script>
(function(){
"use strict";

document.addEventListener('touchmove', function(e) {
  if (e.target.tagName !== 'BUTTON') { e.preventDefault(); }
}, { passive: false });

const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
let W, H, DPR;

const CAMERA_ZOOM = 1.05;

function resize(){
  DPR = Math.min(window.devicePixelRatio || 1, 2);
  W = window.innerWidth; H = window.innerHeight;
  canvas.width = W*DPR; canvas.height = H*DPR;
  canvas.style.width = W+'px'; canvas.style.height = H+'px';
  ctx.setTransform(DPR,0,0,DPR,0,0);
}
window.addEventListener('resize', resize);
resize();

const ARENA = 3500; 
const SPACING = 24;          
const BASE_R = 14;           
const NAMES = ["Twentyfourhourpharma","averagestudent","rejectedbachelorcontes","Chris_P_Bacon","thegodfatherpart4","B.Juice","TheAfterLife","kojima_fan92","noodle.exe","xXHunterXx"];
const VALUES = [2,4,8,16,32,64,128,256,512,1024,2048,5096];

function rnd(a,b){ return a + Math.random()*(b-a); }
function dist2(ax,ay,bx,by){ const dx=ax-bx, dy=ay-by; return dx*dx+dy*dy; }
function clamp(v,a,b){ return Math.max(a,Math.min(b,v)); }

// Υπολογισμός Κλίμακας (Μεγέθους) βάσει Αριθμού
function getScaleForValue(val) {
    // 2=0.75, 4=0.83, 8=0.91 ... αυξάνεται σταδιακά
    return 0.75 + Math.min(10, Math.max(0, Math.log2(val) - 1)) * 0.08;
}

let floorItems = [];  
let cubes = [];      
let obstacles = []; 
let particles = [];
let floaters = [];  
let player, bots = [];
let running = false;
let isEndless = false;
let timeLeft = 180;
let elapsedSinceLB = 0;
let camera = {x:0,y:0};
let screenShake = 0; 
let floorTime = 0;

class Snake{
  constructor(x,y,isPlayer,name){
    this.isPlayer = isPlayer;
    this.name = name;
    this.angle = rnd(0, Math.PI*2);
    this.targetAngle = this.angle;
    this.baseSpeed = 2.5;
    this.boostSpeed = 4.8;
    this.boostT = 0; 
    this.path = [{x,y}];
    this.segments = [{value: VALUES[Math.floor(rnd(0,2))], t:0}]; 
    this.alive = true;
    this.shieldT = 0;
    this.magnetT = 0;
    this.reactT = 0;
    this.boostCd = 0;
    this.magnetCd = 0;
    this.shieldCd = 0;
  }
  get head(){ return this.path[this.path.length-1]; }
  get headValue(){ return this.segments[0].value; }
  get score(){ return this.segments.reduce((s,seg)=>s+seg.value,0); }

  steerToward(px,py){
    const h = this.head;
    this.targetAngle = Math.atan2(py-h.y, px-h.x);
  }

  update(dt){
    let da = this.targetAngle - this.angle;
    while(da > Math.PI) da -= Math.PI*2;
    while(da < -Math.PI) da += Math.PI*2;
    
    const turnRate = 0.12 + (this.boostT > 0 ? 0.025 : 0);
    this.angle += clamp(da, -turnRate, turnRate);
    if (Math.abs(da) < 0.4) this.angle += da * 0.08;

    const spd = (this.boostT > 0) ? this.boostSpeed : this.baseSpeed;
    
    const h = this.head;
    let nx = h.x + Math.cos(this.angle)*spd;
    let ny = h.y + Math.sin(this.angle)*spd;
    
    // Σύγκρουση με εμπόδια τοίχων
    for(let o of obstacles) {
      const dx = nx - o.x;
      const dy = ny - o.y;
      const hw = o.w/2 + BASE_R;
      const hh = o.h/2 + BASE_R;
      
      if(Math.abs(dx) < hw && Math.abs(dy) < hh) {
        const overlapX = hw - Math.abs(dx);
        const overlapY = hh - Math.abs(dy);
        if(overlapX < overlapY) nx += (dx > 0 ? overlapX : -overlapX);
        else ny += (dy > 0 ? overlapY : -overlapY);
      }
    }

    // Σύγκρουση με μεγαλύτερους κύβους φαγητού (δεν τους τρώμε, συγκρουόμαστε)
    const myVal = this.headValue;
    for(let c of cubes) {
      if (c.value > myVal) {
        const dx = nx - c.x;
        const dy = ny - c.y;
        const dist = Math.hypot(dx, dy);
        
        const cubeScale = getScaleForValue(c.value);
        const minDist = BASE_R + (16 * cubeScale); // Δυναμική ακτίνα σύγκρουσης

        if (dist < minDist && dist > 0.1) {
          const overlap = minDist - dist;
          nx += (dx / dist) * overlap;
          ny += (dy / dist) * overlap;
        }
      }
    }

    nx = clamp(nx, 20, ARENA-20);
    ny = clamp(ny, 20, ARENA-20);

    this.path.push({x:nx,y:ny});
    const maxLen = this.segments.length * SPACING + 80;
    while(this.path.length > 2 && this.pathLength() > maxLen){
      this.path.shift();
    }

    if(this.boostT>0) this.boostT -= dt;
    if(this.shieldT>0) this.shieldT -= dt;
    if(this.magnetT>0) this.magnetT -= dt;
    if(this.reactT>0) this.reactT -= dt;
    if(this.boostCd>0) this.boostCd -= dt;
    if(this.magnetCd>0) this.magnetCd -= dt;
    if(this.shieldCd>0) this.shieldCd -= dt;
  }

  pathLength(){
    let d=0;
    for(let i=1;i<this.path.length;i++){
      d += Math.hypot(this.path[i].x-this.path[i-1].x, this.path[i].y-this.path[i-1].y);
    }
    return d;
  }

  pointAtDistance(distBack){
    const p = this.path;
    let remaining = distBack;
    for(let i=p.length-1;i>0;i--){
      const a = p[i], b = p[i-1];
      const segLen = Math.hypot(a.x-b.x, a.y-b.y);
      if(segLen >= remaining){
        const t = segLen===0?0:remaining/segLen;
        return {x: a.x + (b.x-a.x)*t, y: a.y + (b.y-a.y)*t};
      }
      remaining -= segLen;
    }
    return {x:p[0].x, y:p[0].y};
  }

  segmentPositions(){
    const out = [];
    let d = 0;
    for(let i=0;i<this.segments.length;i++){
      out.push(this.pointAtDistance(d));
      // Αφήνουμε λίγο παραπάνω χώρο (δυναμικό) όσο μεγαλώνει το μέγεθος
      const sScale = getScaleForValue(this.segments[i].value);
      d += (SPACING * sScale);
    }
    return out;
  }

  grow(value){
    this.segments.push({value});
    this.optimizeSegments();
  }

  optimizeSegments(){
    let count = 0;
    this.segments.sort((a,b) => b.value - a.value);
    let merged = true;
    while(merged){
      merged = false;
      for(let i=0; i<this.segments.length-1; i++){
        if(this.segments[i].value === this.segments[i+1].value){
          let newVal = this.segments[i].value * 2;
          if (this.segments[i].value >= 5096) newVal = 5096;
          this.segments[i].value = newVal;
          this.segments.splice(i+1, 1); 
          merged = true; 
          count++;
          break; 
        }
      }
    }
    return count;
  }
}

function isInsideObstacle(x, y, padding = 40) {
  for(let o of obstacles) {
    if (Math.abs(x - o.x) < (o.w/2 + padding) && Math.abs(y - o.y) < (o.h/2 + padding)) return true;
  }
  return false;
}

function spawnCube(){
  const rarity = Math.random();
  let v = 2;
  if(rarity > 0.94) v = 8; else if(rarity > 0.75) v = 4;
  
  let isValid = false;
  let cx, cy, attempts = 0;
  
  while(!isValid && attempts < 50) {
    cx = rnd(30,ARENA-30); 
    cy = rnd(30,ARENA-30);
    isValid = true;
    if (isInsideObstacle(cx, cy, 30)) { isValid = false; }
    
    // Αποφυγή επικάλυψης κύβων κατά το spawn
    if (isValid) {
      for(let c of cubes) {
        if (dist2(cx, cy, c.x, c.y) < 45*45) { isValid = false; break; }
      }
    }
    attempts++;
  }
  cubes.push({x: cx, y: cy, value: v});
}

function spawnObstacles(){
  obstacles = [];
  const count = 12; 
  for(let i=0; i<count; i++) {
    let ox = rnd(300, ARENA-300);
    let oy = rnd(300, ARENA-300);
    if(dist2(ox, oy, ARENA/2, ARENA/2) < 400*400) continue; 
    obstacles.push({ x: ox, y: oy, w: rnd(150, 350), h: rnd(150, 350) });
  }
}

function spawnText(x, y, text, color){
  floaters.push({x, y, text, color, life: 1.2});
}

function makeBot(){
  let bx, by;
  do { bx = rnd(200,ARENA-200); by = rnd(200,ARENA-200); } while(isInsideObstacle(bx, by, 40));
  const s = new Snake(bx, by, false, NAMES[Math.floor(rnd(0,NAMES.length))] + (Math.random()>0.8? (Math.floor(rnd(1,9))):''));
  for(let i=0;i<Math.floor(rnd(1,4));i++) s.grow(VALUES[Math.floor(rnd(0,3))]);
  s.retargetT = 0;
  return s;
}

function initWorld(mode){
  isEndless = (mode === 'endless');
  timeLeft = isEndless ? Infinity : 180;
  if(isEndless) { document.getElementById('timerUI').classList.add('hidden'); }
  else { document.getElementById('timerUI').classList.remove('hidden'); }

  floorItems = [];
  spawnObstacles(); 
  cubes = []; particles = []; floaters = []; bots = [];
  for(let i=0;i<180;i++) spawnCube();
  
  player = new Snake(ARENA/2, ARENA/2, true, "You");
  for(let i=0;i<8;i++) bots.push(makeBot());
}

// Μικρά αντικείμενα δαπέδου (Ταχύτητα, Ασπίδα, Μαγνήτης)
function spawnFloorItem() {
  let x, y;
  do { x = rnd(100, ARENA-100); y = rnd(100, ARENA-100); } while(isInsideObstacle(x, y, 40));
  
  const types = ['speed', 'shield', 'magnet'];
  const type = types[Math.floor(Math.random() * types.length)];
  
  floorItems.push({ x, y, type, life: 15.0, angle: 0 });
}

// Χειριστήριο
const joyZone = document.getElementById('controlZone');
const joyCenter = document.getElementById('joyCenter');
const joyKnob = document.getElementById('joyKnob');
let joy = { active: false, pointerId: null };

function updateJoystick(e) {
  const rect = joyZone.getBoundingClientRect();
  const cx = rect.left + rect.width / 2;
  const cy = rect.top + rect.height / 2;
  
  let dx = e.clientX - cx;
  let dy = e.clientY - cy;
  
  const d = Math.hypot(dx, dy);
  const ang = Math.atan2(dy, dx);
  
  const maxR = 45;
  const r = Math.min(d, maxR);
  
  const kx = Math.cos(ang) * r;
  const ky = Math.sin(ang) * r;
  
  joyKnob.style.transform = `translate(calc(-50% + ${kx}px), calc(-50% + ${ky}px))`;
  
  if (d > 5 && player && player.alive) { 
    player.targetAngle = ang; 
  }
}

joyZone.addEventListener('pointerdown', e => {
  // Εξαφάνιση χειριστηρίου όταν το ακουμπάει ο παίκτης
  joyCenter.style.opacity = '0';
  
  joy.active = true;
  joy.pointerId = e.pointerId;
  joyZone.setPointerCapture(e.pointerId);
  updateJoystick(e);
  e.stopPropagation();
});

joyZone.addEventListener('pointermove', e => {
  if(joy.active && e.pointerId === joy.pointerId){ updateJoystick(e); }
  e.stopPropagation();
});

function joyReset() {
  joy.active = false;
  joy.pointerId = null;
  joyKnob.style.transform = 'translate(-50%, -50%)';
}

joyZone.addEventListener('pointerup', e => { if(joy.active && e.pointerId === joy.pointerId){ joyReset(); }});
joyZone.addEventListener('pointercancel', () => joyReset());

// Κουμπιά βοήθειας UI
function triggerPowerup(type, btnId, msg, color) {
  if(!player || !player.alive) return;
  if(player[type + 'Cd'] > 0) return;
  player[type + 'T'] = 5.0; 
  player[type + 'Cd'] = 20.0;
  toast(msg, color);
  screenShake = 0.15;
  const el = document.getElementById(btnId);
  updateCooldownVisual(el, player, type);
}

document.getElementById('pwBoost').addEventListener('pointerdown', (e) => { e.stopPropagation(); triggerPowerup('boost', 'pwBoost', 'Ταχύτητα!', '#ffd23f'); });
document.getElementById('pwMagnet').addEventListener('pointerdown', (e) => { e.stopPropagation(); triggerPowerup('magnet', 'pwMagnet', 'Μαγνήτης!', '#4ecdc4'); });
document.getElementById('pwShield').addEventListener('pointerdown', (e) => { e.stopPropagation(); triggerPowerup('shield', 'pwShield', 'Ασπίδα!', '#7b61ff'); });

function updateCooldownVisual(el, p, type) {
  const cdEl = el.querySelector('.cd');
  clearInterval(el._iv);
  el._iv = setInterval(()=>{
    const active = p[type + 'T'];
    const cd = p[type + 'Cd'];
    if(active > 0) { el.classList.add('active-buff'); el.classList.remove('cooldown'); cdEl.textContent = active.toFixed(1) + 's'; } 
    else if(cd > 0) { el.classList.remove('active-buff'); el.classList.add('cooldown'); cdEl.textContent = cd.toFixed(1) + 's'; } 
    else { el.classList.remove('active-buff', 'cooldown'); clearInterval(el._iv); }
  }, 100);
}

function toast(msg, color){
  const t = document.getElementById('toast');
  t.textContent = msg; t.style.color = color || 'var(--ink)'; t.classList.add('show');
  clearTimeout(toast._h);
  toast._h = setTimeout(()=>t.classList.remove('show'), 900);
}

function burst(x,y,color,n){ n = n||10; for(let i=0;i<n;i++){ const a=Math.random()*Math.PI*2, sp=rnd(0.6,3.0); particles.push({x,y,vx:Math.cos(a)*sp, vy:Math.sin(a)*sp, life:1, color}); } }

function eatCubes(snake){
  const headPos = snake.segmentPositions()[0];
  const magnetActive = snake.magnetT > 0;
  const pickR = magnetActive ? 140 : 28;
  
  for(let i=cubes.length-1;i>=0;i--){
    const c = cubes[i];
    
    // Εάν ο κύβος είναι μεγαλύτερος, ΔΕΝ τον τρώμε. Τον κάνουμε εμπόδιο (στην update)
    if(c.value > snake.headValue) continue;

    const d2 = dist2(headPos.x, headPos.y, c.x, c.y);
    if(d2 < pickR*pickR){
      if(magnetActive && d2 > (28*28)){ c.x += (headPos.x-c.x)*0.18; c.y += (headPos.y-c.y)*0.18; continue; }
      cubes.splice(i,1); snake.grow(c.value); 
      if(snake.isPlayer){ burst(c.x,c.y, '#ffffff', 8); } spawnCube();
    }
  }
}

function eatFloorItems(snake){
  const headPos = snake.segmentPositions()[0];
  for(let i=floorItems.length-1; i>=0; i--){
    const item = floorItems[i];
    if(dist2(headPos.x, headPos.y, item.x, item.y) < 35*35){
      if(item.type === 'speed'){ snake.boostT = 5.0; spawnText(item.x, item.y, '⚡ SPEED', '#ffcc00'); }
      else if(item.type === 'shield'){ snake.shieldT = 5.0; spawnText(item.x, item.y, '🛡️ SHIELD', '#00d4ff'); }
      else if(item.type === 'magnet'){ snake.magnetT = 5.0; spawnText(item.x, item.y, '🧲 MAGNET', '#4ecdc4'); }
      
      if(snake.isPlayer) {
        // Ενημέρωση UI αν είναι ο παίκτης
        const elId = item.type === 'speed' ? 'pwBoost' : item.type === 'shield' ? 'pwShield' : 'pwMagnet';
        const el = document.getElementById(elId);
        updateCooldownVisual(el, snake, item.type === 'speed' ? 'boost' : item.type);
      }
      floorItems.splice(i, 1);
    }
  }
}

function killSnake(snake){
  snake.alive = false;
  const positions = snake.segmentPositions();
  positions.forEach((p,i)=>{
    if(snake.segments[i]) {
      let dropX = p.x + rnd(-20,20), dropY = p.y + rnd(-20,20);
      if(!isInsideObstacle(dropX, dropY)) cubes.push({x: dropX, y: dropY, value: snake.segments[i].value});
    }
  });
  if(snake.isPlayer){ endGame(false); } 
  else {
    const idx = bots.indexOf(snake);
    if(idx>=0) bots.splice(idx,1);
    if(bots.length < 7) bots.push(makeBot());
  }
}

function resolveCombat(){
  let all = [player, ...bots].filter(s=>s && s.alive);
  if(!running) all = bots.filter(s=>s.alive);
  for(const a of all){
    if(a.reactT>0) continue;
    const aPos = a.segmentPositions(); const aHead = aPos[0];
    for(const b of all){
      if(a===b || b.reactT>0) continue;
      const bPos = b.segmentPositions();
      for(let i=0;i<bPos.length;i++){
        const segPos = bPos[i];
        
        // Υπολογισμός Hit Radius δυναμικά για να ταιριάζει με το μέγεθος των κύβων
        const bScale = getScaleForValue(b.segments[i].value);
        const hitR = BASE_R + (14 * bScale); 

        if(dist2(aHead.x,aHead.y,segPos.x,segPos.y) < (hitR+BASE_R*0.6)*(hitR+BASE_R*0.6)){
          if(b.shieldT>0){ continue; }
          const aVal = a.headValue, bVal = b.segments[i].value;
          if(aVal > bVal){
            const severed = b.segments.splice(i);
            severed.forEach((seg, idx) => {
               const p = bPos[i + idx] || bPos[bPos.length-1];
               if(!isInsideObstacle(p.x, p.y)){ cubes.push({x: p.x + rnd(-10,10), y: p.y + rnd(-10,10), value: seg.value}); }
               burst(p.x, p.y, '#ffffff', 5);
            });
            a.reactT = 0.15; b.reactT = 0.15;
            if(a.isPlayer){ spawnText(aHead.x, aHead.y, "TAIL CUT!", "#ff4d6d"); screenShake = 0.3; }
            if(b.segments.length === 0) killSnake(b);
          } else if(aVal < bVal){
            if(a.shieldT>0){ continue; }
            if(i===0){ killSnake(a); } else { killSnake(a); }
            a.reactT = 0.15; b.reactT = 0.15;
          }
          break;
        }
      }
      if(!a.alive) break;
    }
    if(!a.alive) continue;
  }
}

function botAI(bot, dt){
  bot.retargetT -= dt;
  if(bot.retargetT<=0){
    bot.retargetT = rnd(0.6,1.4);
    const hp = bot.head;
    let best=null, bestD=520*520;
    
    // Τα bots αγνοούν τους κύβους που δεν μπορούν να φάνε
    for(const c of cubes){ 
      if(c.value > bot.headValue) continue;
      const d2=dist2(hp.x,hp.y,c.x,c.y); 
      if(d2<bestD){ bestD=d2; best=c; } 
    }
    for(const it of floorItems){ const d2=dist2(hp.x,hp.y,it.x,it.y); if(d2<bestD){ bestD=d2; best=it; } }
    
    if(best && Math.random()>0.15){ bot.targetAngle = Math.atan2(best.y-hp.y, best.x-hp.x); } 
    else { bot.targetAngle = bot.angle + rnd(-1.4,1.4); }
  }
}

function renderLeaderboard(){
  if(!player) return;
  const all = [player, ...bots].filter(s=>s.alive);
  all.sort((a,b)=>b.score-a.score);
  const rows = document.getElementById('lbRows'); rows.innerHTML = '';
  all.forEach((s,i)=>{
    const div = document.createElement('div');
    div.className = 'lb-row' + (s.isPlayer?' me':'');
    div.innerHTML = `<span class="rank">${i+1}</span><span class="name">${s.isPlayer?'You':s.name}</span><span class="val">${s.score}</span>`;
    rows.appendChild(div);
  });
}

function roundRect(g,x,y,w,h,r){ g.beginPath(); g.moveTo(x+r,y); g.arcTo(x+w,y,x+w,y+h,r); g.arcTo(x+w,y+h,x,y+h,r); g.arcTo(x,y+h,x,y,r); g.arcTo(x,y,x+w,y,r); g.closePath(); }

function drawFloor(){
  const sx = -camera.x; const sy = -camera.y;
  ctx.save();
  const grad = ctx.createLinearGradient(sx, sy, sx+ARENA, sy+ARENA);
  grad.addColorStop(0, '#2b3652'); grad.addColorStop(1, '#1e263d');
  ctx.fillStyle = grad; ctx.fillRect(sx, sy, ARENA, ARENA);
  ctx.fillStyle = '#ffffff1a'; const step = 55;
  for(let x=0; x<=ARENA; x+=step){ for(let y=0; y<=ARENA; y+=step){ ctx.beginPath(); ctx.arc(sx+x, sy+y, 2.5, 0, Math.PI*2); ctx.fill(); } }
  ctx.restore();
}

function drawObstacles() {
  obstacles.forEach(o => {
    const sx = o.x - camera.x; const sy = o.y - camera.y;
    if(sx < -o.w || sx > W/CAMERA_ZOOM + o.w || sy < -o.h || sy > H/CAMERA_ZOOM + o.h) return;
    ctx.save(); ctx.translate(sx, sy); const r = 20; 
    ctx.save(); ctx.translate(0, 15); ctx.fillStyle = '#00000066'; ctx.shadowColor='#00000055'; ctx.shadowBlur=20; roundRect(ctx, -o.w/2, -o.h/2, o.w, o.h, r); ctx.fill(); ctx.restore();
    ctx.fillStyle = '#555866'; roundRect(ctx, -o.w/2, -o.h/2, o.w, o.h, r); ctx.fill();
    ctx.strokeStyle = '#6a6e7c'; ctx.lineWidth = 2; roundRect(ctx, -o.w/2, -o.h/2, o.w, o.h, r); ctx.stroke();
    ctx.restore();
  });
}

// ----------------------------------------------------
// Σύστημα Σχεδιασμού Κύβων
// ----------------------------------------------------
const textureCache = {};

function getCubeTexture(value) {
    if(textureCache[value]) return textureCache[value];
    const cv = document.createElement("canvas");
    cv.width = cv.height = 128; 
    const g = cv.getContext("2d"); 
    
    let skin = 'wood';
    if(value === 4) skin = 'whitegreen';
    else if(value === 8) skin = 'whitered';
    else if(value === 16) skin = 'ice';
    else if(value === 32) skin = 'zebra';
    else if(value === 64) skin = 'lava';
    else if(value === 128) skin = 'neon';
    else if(value === 256) skin = 'galaxy';
    else if(value === 512) skin = 'rainbow';
    else if(value >= 1024) skin = 'gold';

    if (skin === 'wood') { 
        g.fillStyle = value >= 128 ? "#8B5A2B" : "#DEB887";
        roundRect(g, 4, 4, 120, 120, 22);
        g.fill(); 
    } 
    else if (skin === 'whitered' || skin === 'whitegreen') { 
        g.fillStyle = "white";
        roundRect(g, 4, 4, 120, 120, 22);
        g.fill();
        g.fillStyle = skin === 'whitered' ? "#D32F2F" : "#388E3C";
        g.save();
        g.clip(); 
        for (let i = -128; i < 256; i += 32) { 
            g.beginPath();
            g.moveTo(i, 0);
            g.lineTo(i + 20, 0);
            g.lineTo(i - 108, 128);
            g.lineTo(i - 128, 128);
            g.fill(); 
        }
        g.restore(); 
    } 
    else if (skin === 'zebra') { 
        g.fillStyle = "white";
        roundRect(g, 4, 4, 120, 120, 22);
        g.fill();
        g.fillStyle = "#111";
        g.save();
        g.clip(); 
        for (let i = 0; i < 128; i += 24) { 
            g.beginPath();
            g.moveTo(0, i);
            g.bezierCurveTo(40, i + 15, 80, i - 15, 128, i);
            g.lineTo(128, i + 10);
            g.bezierCurveTo(80, i - 5, 40, i + 25, 0, i + 10);
            g.fill(); 
        }
        g.restore(); 
    } 
    else if (skin === 'rainbow') { 
        let grad = g.createLinearGradient(0, 0, 128, 128);
        ['red', 'orange', 'yellow', 'green', 'cyan', 'blue', 'purple'].forEach(function(c, i) { grad.addColorStop(i / 6, c); });
        g.fillStyle = grad;
        roundRect(g, 4, 4, 120, 120, 22);
        g.fill(); 
    } 
    else if (skin === 'gold') { 
        let grad = g.createRadialGradient(64, 64, 0, 64, 64, 90);
        grad.addColorStop(0, "#FFF59D");
        grad.addColorStop(0.6, "#FBC02D");
        grad.addColorStop(1, "#F57F17");
        g.fillStyle = grad;
        roundRect(g, 4, 4, 120, 120, 22);
        g.fill(); 
    } 
    else if (skin === 'neon') { 
        g.fillStyle = "#111";
        roundRect(g, 4, 4, 120, 120, 22);
        g.fill();
        g.strokeStyle = "hsl(" + ((Math.log2(value) * 30) % 360) + ", 100%, 50%)";
        g.lineWidth = 6;
        g.stroke(); 
    } 
    else if (skin === 'galaxy') { 
        g.fillStyle = "#1A0B2E";
        roundRect(g, 4, 4, 120, 120, 22);
        g.fill();
        g.fillStyle = "white"; 
        for (let i = 0; i < 30; i++) { 
            g.beginPath();
            g.arc(Math.random() * 128, Math.random() * 128, Math.random() * 2, 0, 7);
            g.fill(); 
        } 
    } 
    else if (skin === 'ice') { 
        let grad = g.createLinearGradient(0, 0, 128, 128);
        grad.addColorStop(0, "#E0F7FA");
        grad.addColorStop(1, "#00BCD4");
        g.fillStyle = grad;
        roundRect(g, 4, 4, 120, 120, 22);
        g.fill(); 
    } 
    else if (skin === 'lava') { 
        let grad = g.createLinearGradient(0, 0, 128, 128);
        grad.addColorStop(0, "#FF5722");
        grad.addColorStop(1, "#FFC107");
        g.fillStyle = grad;
        roundRect(g, 4, 4, 120, 120, 22);
        g.fill(); 
    } 
    else { 
        g.fillStyle = "#111";
        roundRect(g, 4, 4, 120, 120, 22);
        g.fill(); 
    } 
    
    const badgeSkins = ['whitered', 'whitegreen', 'zebra', 'rainbow', 'galaxy', 'neon', 'ice', 'lava', 'gold']; 
    const hasBadge = badgeSkins.indexOf(skin) !== -1; 
    if (hasBadge) { 
        g.save();
        g.shadowColor = "rgba(0,0,0,0.35)";
        g.shadowBlur = 7;
        g.shadowOffsetY = 2;
        g.beginPath();
        g.arc(64, 66, 37, 0, Math.PI * 2);
        g.fillStyle = "rgba(255,255,255,0.96)";
        g.fill();
        g.restore();
        g.lineWidth = 3;
        g.strokeStyle = "rgba(0,0,0,0.12)";
        g.beginPath();
        g.arc(64, 66, 37, 0, Math.PI * 2);
        g.stroke(); 
    }
    g.font = hasBadge ? ("800 " + (value >= 1024 ? 30 : value >= 128 ? 36 : 44) + "px 'Baloo 2', sans-serif") : ("800 " + (value >= 1024 ? 42 : value >= 128 ? 50 : 60) + "px 'Baloo 2', sans-serif");
    g.textAlign = "center";
    g.textBaseline = "middle";
    g.fillStyle = hasBadge ? "#2F1B0D" : (skin === 'wood' ? (value >= 128 ? "#FFF" : "#000") : "#FFF");
    g.fillText(value, 64, hasBadge ? 66 : 68); 
    
    textureCache[value] = cv;
    return cv;
}

function drawCube(x, y, value, scaleMultiplier = 1) {
    const sx = x - camera.x, sy = y - camera.y;
    if(sx < -80 || sx > (W/CAMERA_ZOOM)+80 || sy < -80 || sy > (H/CAMERA_ZOOM)+80) return;

    // Δυναμικό μέγεθος
    const valScale = getScaleForValue(value);
    const size = 36 * valScale * scaleMultiplier; 
    
    const tex = getCubeTexture(value);

    ctx.save();
    ctx.translate(sx, sy);

    ctx.shadowColor = 'rgba(0,0,0,0.4)';
    ctx.shadowBlur = 8 * valScale;
    ctx.shadowOffsetY = 4 * valScale;

    ctx.drawImage(tex, -size/2, -size/2, size, size);
    ctx.restore();
}

function drawSnake(snake){
  const positions = snake.segmentPositions();
  if(!positions.length) return;
  
  if(snake.shieldT > 0) {
    ctx.save();
    ctx.shadowBlur = 50; ctx.shadowColor = 'rgba(255, 255, 255, 0.4)';
    ctx.fillStyle = 'rgba(255, 255, 255, 0.2)';
    for(let i=0; i<positions.length; i+=2) {
      const p = positions[i];
      const sx = p.x - camera.x; const sy = p.y - camera.y;
      
      const vScale = snake.segments[i] ? getScaleForValue(snake.segments[i].value) : 1;
      
      ctx.beginPath();
      ctx.arc(sx, sy, (22 * vScale) + Math.sin(floorTime * 4 + i * 2) * 4, 0, Math.PI * 2);
      ctx.fill();
    }
    ctx.fillStyle = 'rgba(255, 255, 255, 0.15)';
    for(let i=0; i<positions.length; i+=2) {
      const p = positions[i];
      const sx = p.x - camera.x; const sy = p.y - camera.y;
      const vScale = snake.segments[i] ? getScaleForValue(snake.segments[i].value) : 1;
      ctx.beginPath();
      ctx.arc(sx, sy, (28 * vScale) + Math.cos(floorTime * 3 + i) * 5, 0, Math.PI * 2);
      ctx.fill();
    }
    ctx.restore();
  }

  for(let i=positions.length-1; i>=1; i--){
    if (snake.segments[i]) drawCube(positions[i].x, positions[i].y, snake.segments[i].value, 1);
  }
  drawCube(positions[0].x, positions[0].y, snake.segments[0].value, 1.15);
  
  ctx.save(); ctx.font = "800 13px 'Baloo 2', sans-serif"; ctx.fillStyle = '#ffffff'; ctx.textAlign='center'; 
  ctx.shadowColor = 'rgba(0,0,0,0.8)'; ctx.shadowBlur = 4;
  const headScale = getScaleForValue(snake.segments[0].value);
  ctx.fillText(snake.isPlayer ? 'You' : snake.name, positions[0].x-camera.x, positions[0].y-camera.y-(24*headScale)); 
  ctx.restore();
}

function drawFloorItems() {
  floorItems.forEach(item => {
    item.angle += 0.02;
    const sx = item.x - camera.x; const sy = item.y - camera.y;
    ctx.save(); ctx.translate(sx, sy); 
    
    let color = '#ffcc00';
    let icon = '⚡';
    if (item.type === 'shield') { color = '#00d4ff'; icon = '🛡️'; }
    if (item.type === 'magnet') { color = '#4ecdc4'; icon = '🧲'; }
    
    // Απαλό glowing background
    ctx.beginPath();
    ctx.arc(0, 0, 18 + Math.sin(floorTime*5)*2, 0, Math.PI*2);
    ctx.fillStyle = color + '44';
    ctx.fill();
    ctx.lineWidth = 2;
    ctx.strokeStyle = color;
    ctx.stroke();

    ctx.rotate(item.angle);
    ctx.shadowColor = color;
    ctx.shadowBlur = 15;
    ctx.font = `22px 'Baloo 2', sans-serif`;
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillStyle = color;
    ctx.fillText(icon, 0, 0);
    ctx.restore();
  });
}

function drawParticles(dt){
  for(let i=particles.length-1;i>=0;i--){
    const pt = particles[i];
    pt.x += pt.vx; pt.y += pt.vy; pt.life -= dt*1.6;
    if(pt.life<=0){ particles.splice(i,1); continue; }
    ctx.save(); ctx.globalAlpha = clamp(pt.life,0,1); ctx.fillStyle = pt.color;
    ctx.beginPath(); ctx.arc(pt.x-camera.x, pt.y-camera.y, 3, 0, Math.PI*2); ctx.fill(); ctx.restore();
  }
}

function drawFloaters(dt){
  for(let i=floaters.length-1; i>=0; i--){
    const f = floaters[i];
    f.y -= dt * 35; f.life -= dt;
    if(f.life <= 0){ floaters.splice(i,1); continue; }
    ctx.save(); ctx.globalAlpha = Math.min(1, f.life * 2);
    ctx.font = "800 16px 'Baloo 2', sans-serif"; ctx.fillStyle = f.color;
    ctx.strokeStyle = '#000000cc'; ctx.lineWidth = 3; ctx.textAlign = 'center';
    ctx.strokeText(f.text, f.x - camera.x, f.y - camera.y);
    ctx.fillText(f.text, f.x - camera.x, f.y - camera.y);
    ctx.restore();
  }
}

let lastT = null;
let itemSpawnTimer = 0;

function frame(ts){
  if(!lastT) lastT = ts;
  const dt = Math.min((ts-lastT)/1000, 0.05);
  lastT = ts;

  if(running && floorItems.length < 8) {
    itemSpawnTimer -= dt;
    if(itemSpawnTimer <= 0) { spawnFloorItem(); itemSpawnTimer = rnd(4, 7); }
  }

  bots.forEach(b=>{ botAI(b,dt); b.update(dt); });
  bots.forEach(b=>{ eatCubes(b); eatFloorItems(b); });
  resolveCombat();
  floorTime += dt; 

  if(running){
    if(!player || !player.alive) return; // Ασφάλεια
    player.update(dt); eatCubes(player); eatFloorItems(player); 
    
    elapsedSinceLB += dt;
    if(elapsedSinceLB > 1){ elapsedSinceLB = 0; renderLeaderboard(); }
    document.getElementById('scoreVal').textContent = player.score;
    
    if(!isEndless) {
      timeLeft -= dt;
      const m = Math.max(0,Math.floor(timeLeft/60)), s = Math.max(0,Math.floor(timeLeft%60));
      document.getElementById('timerVal').textContent = `${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`;
      if(timeLeft<=0){ endGame(true); }
    }
  }

  if(screenShake > 0) screenShake -= dt;
  let cx = player ? player.head.x - (W/2) / CAMERA_ZOOM : 0;
  let cy = player ? player.head.y - (H/2) / CAMERA_ZOOM : 0;
  if(screenShake > 0) { cx += rnd(-10, 10) * screenShake; cy += rnd(-10, 10) * screenShake; }
  camera.x = cx; camera.y = cy;

  ctx.clearRect(0,0,W,H); ctx.save(); ctx.scale(CAMERA_ZOOM, CAMERA_ZOOM);
  drawFloor(); drawObstacles(); drawFloorItems();
  
  // Δυναμικό μέγεθος και στο rendering των κύβων (εδάφους)
  cubes.forEach(c=>drawCube(c.x,c.y,c.value, 0.8));
  
  bots.forEach(b=>{ if(b.alive) drawSnake(b); });
  if(player && player.alive) drawSnake(player);
  drawParticles(dt); drawFloaters(dt);
  ctx.restore(); 
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);

function startGame(mode){
  if(gameStartedOnce && (!player || !player.alive || (!isEndless && timeLeft <= 0))){
    initWorld(mode); 
    ['pwBoost', 'pwMagnet', 'pwShield'].forEach(id => {
       const el = document.getElementById(id);
       el.classList.remove('active-buff', 'cooldown');
       clearInterval(el._iv);
       el.querySelector('.cd').style.display = 'none';
    });
  } else {
    initWorld(mode);
  }
  joyCenter.style.opacity = '1';
  gameStartedOnce = true; renderLeaderboard();
  document.getElementById('startMsg').classList.add('hidden');
  document.getElementById('endMsg').classList.add('hidden');
  running = true;
}

function endGame(survived){
  running = false;
  const title = document.getElementById('endTitle');
  const body = document.getElementById('endBody');
  title.innerHTML = survived ? 'Επιβίωσες! 🏆' : 'Game Over';
  const all = [player, ...bots].filter(s=>s!==player);
  const rank = 1 + all.filter(s=>s.score>player.score).length;
  body.textContent = `Σκορ: ${player.score} · Θέση #${rank}`;
  document.getElementById('endMsg').classList.remove('hidden');
}

document.getElementById('btn3Min').addEventListener('click', () => startGame('3min'));
document.getElementById('btnEndless').addEventListener('click', () => startGame('endless'));
document.getElementById('restartBtn').addEventListener('click', () => {
    document.getElementById('endMsg').classList.add('hidden');
    document.getElementById('startMsg').classList.remove('hidden');
});

// Αρχική σχεδίαση για background
spawnObstacles();
for(let i=0;i<60;i++) spawnCube();
frame(0);

})();
