<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Snake Arena - Points Only</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #0a0a12;
    color: #fff;
    font-family: 'Segoe UI', system-ui, sans-serif;
    overflow: hidden;
    height: 100vh;
    display: flex;
    flex-direction: column;
  }
  #ui {
    position: absolute;
    top: 0; left: 0; right: 0;
    z-index: 20;
    pointer-events: none;
    padding: 12px 16px;
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
  }
  .panel {
    background: rgba(0,0,0,0.65);
    backdrop-filter: blur(8px);
    border-radius: 12px;
    padding: 10px 16px;
    pointer-events: auto;
    border: 1px solid rgba(255,255,255,0.12);
  }
  #scoreBox { font-size: 18px; font-weight: 600; }
  #scoreBox span { color: #ffd700; }
  #leaderboard {
    max-height: 220px;
    overflow-y: auto;
    font-size: 13px;
    min-width: 160px;
  }
  #leaderboard div { padding: 2px 0; display: flex; justify-content: space-between; gap: 12px; }
  #leaderboard .me { color: #4ade80; font-weight: 700; }
  #controls {
    position: absolute;
    bottom: 20px;
    left: 50%;
    transform: translateX(-50%);
    z-index: 20;
    display: flex;
    gap: 12px;
    pointer-events: auto;
  }
  button {
    background: linear-gradient(135deg, #6366f1, #8b5cf6);
    border: none;
    color: white;
    padding: 12px 22px;
    border-radius: 50px;
    font-size: 15px;
    font-weight: 600;
    cursor: pointer;
    box-shadow: 0 4px 15px rgba(99,102,241,0.4);
    transition: transform 0.15s, box-shadow 0.15s;
  }
  button:hover { transform: translateY(-2px); box-shadow: 0 6px 20px rgba(99,102,241,0.55); }
  button:active { transform: translateY(0); }
  button.secondary {
    background: linear-gradient(135deg, #334155, #475569);
  }
  #shopOverlay, #msgOverlay {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.75);
    z-index: 50;
    display: none;
    align-items: center;
    justify-content: center;
    backdrop-filter: blur(6px);
  }
  #shopOverlay.show, #msgOverlay.show { display: flex; }
  .modal {
    background: #1e1e2e;
    border-radius: 20px;
    padding: 28px;
    max-width: 720px;
    width: 92%;
    max-height: 85vh;
    overflow-y: auto;
    border: 1px solid rgba(255,255,255,0.1);
    box-shadow: 0 25px 50px rgba(0,0,0,0.5);
  }
  .modal h2 { margin-bottom: 8px; font-size: 24px; }
  .modal p.sub { color: #94a3b8; margin-bottom: 20px; font-size: 14px; }
  .shop-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
    gap: 14px;
    margin-bottom: 20px;
  }
  .shop-item {
    background: #2a2a3d;
    border-radius: 14px;
    padding: 12px;
    text-align: center;
    cursor: pointer;
    border: 2px solid transparent;
    transition: all 0.2s;
  }
  .shop-item:hover { border-color: #6366f1; transform: translateY(-3px); }
  .shop-item.owned { border-color: #22c55e; }
  .shop-item.selected { border-color: #fbbf24; box-shadow: 0 0 0 2px #fbbf24; }
  .shop-item .preview {
    width: 100%;
    height: 70px;
    border-radius: 8px;
    margin-bottom: 8px;
    background-size: cover;
  }
  .shop-item .name { font-size: 13px; font-weight: 600; margin-bottom: 4px; }
  .shop-item .price { font-size: 12px; color: #fbbf24; }
  .shop-item .owned-badge { font-size: 11px; color: #22c55e; }
  #closeShop, #closeMsg {
    margin-top: 10px;
    width: 100%;
  }
  #msgBox {
    text-align: center;
    font-size: 18px;
    line-height: 1.5;
  }
  #msgBox .missing { color: #f87171; font-weight: 700; font-size: 22px; }
  canvas { display: block; background: #111; }
  #boostBtn {
    position: absolute;
    bottom: 90px;
    right: 20px;
    width: 70px;
    height: 70px;
    border-radius: 50%;
    background: linear-gradient(135deg, #ef4444, #f97316);
    font-size: 13px;
    display: none;
    z-index: 20;
  }
</style>
</head>
<body>
  <div id="ui">
    <div class="panel" id="scoreBox">
      Points: <span id="points">0</span>
    </div>
    <div class="panel" id="leaderboard"></div>
  </div>

  <div id="controls">
    <button id="shopBtn">eShop</button>
    <button id="restartBtn" class="secondary">Restart</button>
  </div>

  <button id="boostBtn">BOOST</button>

  <div id="shopOverlay">
    <div class="modal">
      <h2>eShop</h2>
      <p class="sub">Everything costs <strong>50 Points</strong>. Your balance: <span id="shopBalance">0</span></p>

      <h3 style="margin:16px 0 10px; font-size:16px; color:#a5b4fc;">Floor Skins</h3>
      <div class="shop-grid" id="floorGrid"></div>

      <h3 style="margin:16px 0 10px; font-size:16px; color:#a5b4fc;">Helps / Power-ups</h3>
      <div class="shop-grid" id="helpGrid"></div>

      <button id="closeShop">Close</button>
    </div>
  </div>

  <div id="msgOverlay">
    <div class="modal" style="max-width:380px;">
      <div id="msgBox"></div>
      <button id="closeMsg">OK</button>
    </div>
  </div>

  <canvas id="game"></canvas>

<script>
// ===================== CONFIG =====================
const WORLD_SIZE = 4200;
const CELL = 18;
const MAX_PLAYERS = 30;          // player + 29 AI
const BASE_SPEED = 2.8;
const BOOST_SPEED = 5.2;
const START_LENGTH = 12;
const FOOD_COUNT = 420;
const HELP_COUNT = 18;
const POINTS_PER_FOOD = 1;
const HELP_COST = 50;
const SKIN_COST = 50;

// ===================== STATE =====================
let canvas, ctx;
let camX = 0, camY = 0;
let player = null;
let snakes = [];
let foods = [];
let helps = [];
let points = 0;
let ownedFloors = new Set([0]);
let selectedFloor = 0;
let ownedHelps = { speed: 0, shield: 0, magnet: 0 };
let running = false;
let keys = {};
let mouseAngle = 0;
let isBoosting = false;
let lastTime = 0;

// ===================== FLOOR DESIGNS (many nice ones) =====================
const FLOOR_DESIGNS = [
  // 0 - Default dark
  { name: "Midnight", colors: ["#0f172a", "#1e293b"], pattern: "solid" },
  // 1 - Classic green
  { name: "Emerald Grid", colors: ["#064e3b", "#065f46"], pattern: "grid" },
  // 2 - Ocean
  { name: "Deep Ocean", colors: ["#0c4a6e", "#0369a1"], pattern: "waves" },
  // 3 - Sunset
  { name: "Sunset Arena", colors: ["#7c2d12", "#9a3412", "#c2410c"], pattern: "gradient" },
  // 4 - Neon
  { name: "Neon Circuit", colors: ["#1e1b4b", "#312e81"], pattern: "circuit" },
  // 5 - Desert
  { name: "Golden Dunes", colors: ["#78350f", "#92400e"], pattern: "sand" },
  // 6 - Ice
  { name: "Frozen Lake", colors: ["#0e7490", "#155e75"], pattern: "ice" },
  // 7 - Lava
  { name: "Magma Floor", colors: ["#450a0a", "#7f1d1d", "#991b1b"], pattern: "lava" },
  // 8 - Forest
  { name: "Mystic Forest", colors: ["#14532d", "#166534"], pattern: "leaves" },
  // 9 - Purple Dream
  { name: "Purple Dream", colors: ["#4c1d95", "#5b21b6"], pattern: "stars" },
  // 10 - Cyber
  { name: "Cyber Grid", colors: ["#0f172a", "#1e3a5f"], pattern: "cyber" },
  // 11 - Candy
  { name: "Candy Land", colors: ["#831843", "#9d174d"], pattern: "candy" },
  // 12 - Galaxy
  { name: "Galaxy", colors: ["#0f0c29", "#302b63", "#24243e"], pattern: "galaxy" },
  // 13 - Marble
  { name: "Marble", colors: ["#1f2937", "#374151"], pattern: "marble" },
  // 14 - Retro
  { name: "Retro Pixel", colors: ["#1a1a2e", "#16213e"], pattern: "pixel" },
  // 15 - Toxic
  { name: "Toxic Waste", colors: ["#365314", "#3f6212"], pattern: "toxic" },
];

const HELP_ITEMS = [
  { id: "speed", name: "Speed Boost", desc: "+30% speed for 12s", icon: "⚡" },
  { id: "shield", name: "Shield", desc: "Ignore 1 collision", icon: "🛡️" },
  { id: "magnet", name: "Magnet", desc: "Attract food 8s", icon: "🧲" },
];

// ===================== INIT =====================
function init() {
  canvas = document.getElementById("game");
  ctx = canvas.getContext("2d");
  resize();
  window.addEventListener("resize", resize);

  document.getElementById("shopBtn").onclick = openShop;
  document.getElementById("closeShop").onclick = closeShop;
  document.getElementById("closeMsg").onclick = () => document.getElementById("msgOverlay").classList.remove("show");
  document.getElementById("restartBtn").onclick = restart;

  // Controls
  window.addEventListener("keydown", e => {
    keys[e.key.toLowerCase()] = true;
    if (e.key === " ") isBoosting = true;
  });
  window.addEventListener("keyup", e => {
    keys[e.key.toLowerCase()] = false;
    if (e.key === " ") isBoosting = false;
  });
  canvas.addEventListener("mousemove", e => {
    const rect = canvas.getBoundingClientRect();
    const mx = e.clientX - rect.left;
    const my = e.clientY - rect.top;
    const dx = mx - canvas.width / 2;
    const dy = my - canvas.height / 2;
    mouseAngle = Math.atan2(dy, dx);
  });
  canvas.addEventListener("mousedown", () => isBoosting = true);
  canvas.addEventListener("mouseup", () => isBoosting = false);
  canvas.addEventListener("touchstart", e => { e.preventDefault(); isBoosting = true; }, {passive:false});
  canvas.addEventListener("touchend", () => isBoosting = false);
  canvas.addEventListener("touchmove", e => {
    e.preventDefault();
    const t = e.touches[0];
    const rect = canvas.getBoundingClientRect();
    const mx = t.clientX - rect.left;
    const my = t.clientY - rect.top;
    mouseAngle = Math.atan2(my - canvas.height/2, mx - canvas.width/2);
  }, {passive:false});

  restart();
  requestAnimationFrame(loop);
}

function resize() {
  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;
}

function restart() {
  points = 0;
  updatePointsUI();
  snakes = [];
  foods = [];
  helps = [];

  // Player
  player = createSnake(0, true);
  snakes.push(player);

  // 29 AI snakes
  for (let i = 1; i < MAX_PLAYERS; i++) {
    snakes.push(createSnake(i, false));
  }

  // Food
  for (let i = 0; i < FOOD_COUNT; i++) spawnFood();
  for (let i = 0; i < HELP_COUNT; i++) spawnHelp();

  running = true;
  lastTime = performance.now();
}

function createSnake(id, isPlayer) {
  const angle = Math.random() * Math.PI * 2;
  const dist = 400 + Math.random() * 1200;
  const x = WORLD_SIZE/2 + Math.cos(angle) * dist;
  const y = WORLD_SIZE/2 + Math.sin(angle) * dist;
  const hue = (id * 37) % 360;
  return {
    id,
    isPlayer,
    x, y,
    angle: Math.random() * Math.PI * 2,
    targetAngle: 0,
    length: START_LENGTH + Math.floor(Math.random() * 8),
    body: [],
    speed: BASE_SPEED,
    color: `hsl(${hue}, 80%, 55%)`,
    colorDark: `hsl(${hue}, 80%, 35%)`,
    score: START_LENGTH,
    alive: true,
    boost: false,
    shield: false,
    magnetUntil: 0,
    speedUntil: 0,
    name: isPlayer ? "You" : `Snake #${id + 1}`
  };
}

function spawnFood() {
  foods.push({
    x: Math.random() * WORLD_SIZE,
    y: Math.random() * WORLD_SIZE,
    r: 3 + Math.random() * 4,
    color: `hsl(${Math.random()*360}, 90%, 60%)`
  });
}

function spawnHelp() {
  helps.push({
    x: Math.random() * WORLD_SIZE,
    y: Math.random() * WORLD_SIZE,
    type: HELP_ITEMS[Math.floor(Math.random()*HELP_ITEMS.length)].id,
    pulse: Math.random() * Math.PI * 2
  });
}

// ===================== GAME LOOP =====================
function loop(now) {
  const dt = Math.min((now - lastTime) / 16.67, 2.5);
  lastTime = now;

  if (running) {
    update(dt);
  }
  draw();
  requestAnimationFrame(loop);
}

function update(dt) {
  // Player control
  if (player && player.alive) {
    player.targetAngle = mouseAngle;
    // smooth turn
    let diff = player.targetAngle - player.angle;
    while (diff > Math.PI) diff -= Math.PI*2;
    while (diff < -Math.PI) diff += Math.PI*2;
    player.angle += diff * 0.12 * dt;

    player.boost = isBoosting && points > 0;
    if (player.boost) {
      // slight point cost while boosting
      if (Math.random() < 0.08) points = Math.max(0, points - 1);
    }
  }

  // Update all snakes
  for (const s of snakes) {
    if (!s.alive) continue;

    // AI simple brain
    if (!s.isPlayer) {
      // wander + avoid edges + chase nearest food sometimes
      if (Math.random() < 0.02) {
        s.targetAngle = Math.random() * Math.PI * 2;
      }
      // edge avoidance
      const margin = 180;
      if (s.x < margin) s.targetAngle = 0;
      if (s.x > WORLD_SIZE - margin) s.targetAngle = Math.PI;
      if (s.y < margin) s.targetAngle = Math.PI/2;
      if (s.y > WORLD_SIZE - margin) s.targetAngle = -Math.PI/2;

      // sometimes go for food
      if (Math.random() < 0.03 && foods.length) {
        const f = foods[Math.floor(Math.random()*foods.length)];
        s.targetAngle = Math.atan2(f.y - s.y, f.x - s.x);
      }

      let diff = s.targetAngle - s.angle;
      while (diff > Math.PI) diff -= Math.PI*2;
      while (diff < -Math.PI) diff += Math.PI*2;
      s.angle += diff * 0.07 * dt;
    }

    // speed
    let spd = BASE_SPEED;
    if (s.speedUntil > now) spd *= 1.35;
    if (s.boost || (s.isPlayer && isBoosting)) spd = BOOST_SPEED;
    s.x += Math.cos(s.angle) * spd * dt;
    s.y += Math.sin(s.angle) * spd * dt;

    // keep in world
    s.x = Math.max(20, Math.min(WORLD_SIZE-20, s.x));
    s.y = Math.max(20, Math.min(WORLD_SIZE-20, s.y));

    // body trail
    s.body.unshift({x: s.x, y: s.y});
    while (s.body.length > s.length) s.body.pop();
  }

  // Food collection
  for (const s of snakes) {
    if (!s.alive) continue;
    for (let i = foods.length-1; i >= 0; i--) {
      const f = foods[i];
      const d = Math.hypot(s.x - f.x, s.y - f.y);
      const attract = (s.magnetUntil > now) ? 80 : 0;
      if (d < 14 + attract) {
        foods.splice(i, 1);
        s.length += 1;
        s.score += POINTS_PER_FOOD;
        if (s.isPlayer) {
          points += POINTS_PER_FOOD;
          updatePointsUI();
        }
        spawnFood();
      }
    }
  }

  // Help collection (only player)
  if (player && player.alive) {
    for (let i = helps.length-1; i >= 0; i--) {
      const h = helps[i];
      const d = Math.hypot(player.x - h.x, player.y - h.y);
      if (d < 22) {
        if (points >= HELP_COST) {
          points -= HELP_COST;
          updatePointsUI();
          applyHelp(h.type);
          helps.splice(i, 1);
          spawnHelp();
        } else {
          // show missing message
          const missing = HELP_COST - points;
          showMessage(`Not enough points!<br><span class="missing">You are missing ${missing} points</span><br>to pick up this help.`);
          // push the help a bit away so it doesn't spam
          h.x += (Math.random()-0.5)*60;
          h.y += (Math.random()-0.5)*60;
        }
      }
    }
  }

  // Head-to-head collisions
  for (let i = 0; i < snakes.length; i++) {
    const a = snakes[i];
    if (!a.alive) continue;
    for (let j = i+1; j < snakes.length; j++) {
      const b = snakes[j];
      if (!b.alive) continue;
      const d = Math.hypot(a.x - b.x, a.y - b.y);
      if (d < 16) {
        // smaller number (id) loses? Wait user said: when my snake collides with another with SMALLER number on the head, take all points
        // "όταν συγκρούεται με κάποιο άλλο φιδάκι με μικρότερο αριθμό στο κεφάλι να παίρνει όλους τους πόντους"
        // So if opponent has smaller number (id) than me, I eat him.
        // Player is id=0, so player always has smallest id. That would mean player never eats anyone by number.
        // Probably the NUMBER on the head is the SCORE / length, not the id.
        // In many snake games the number is the length/score.
        // "μικρότερο αριθμό στο κεφάλι" = smaller number on the head → smaller score/length.
        // Yes, classic: bigger snake eats smaller.
        if (a.score > b.score) {
          eatSnake(a, b);
        } else if (b.score > a.score) {
          eatSnake(b, a);
        } else {
          // equal → both die or random
          if (Math.random() < 0.5) eatSnake(a, b);
          else eatSnake(b, a);
        }
      }
    }
  }

  // Body collisions (hitting body kills, unless shield)
  for (const s of snakes) {
    if (!s.alive) continue;
    for (const other of snakes) {
      if (!other.alive || other === s) continue;
      for (let k = 4; k < other.body.length; k += 2) {
        const p = other.body[k];
        if (Math.hypot(s.x - p.x, s.y - p.y) < 12) {
          if (s.shield) {
            s.shield = false;
          } else {
            // die and drop food
            killSnake(s);
          }
          break;
        }
      }
    }
  }

  // Camera follow player
  if (player && player.alive) {
    camX = player.x - canvas.width / 2;
    camY = player.y - canvas.height / 2;
  }

  updateLeaderboard();
}

function eatSnake(winner, loser) {
  // winner takes all points and length
  winner.length += loser.length;
  winner.score += loser.score;
  if (winner.isPlayer) {
    points += loser.score;
    updatePointsUI();
  }
  // drop some food from loser
  for (let i = 0; i < Math.min(loser.body.length, 25); i += 2) {
    const p = loser.body[i];
    foods.push({
      x: p.x + (Math.random()-0.5)*20,
      y: p.y + (Math.random()-0.5)*20,
      r: 4 + Math.random()*3,
      color: loser.color
    });
  }
  killSnake(loser);
}

function killSnake(s) {
  s.alive = false;
  s.body = [];
  // respawn after delay if AI
  if (!s.isPlayer) {
    setTimeout(() => {
      if (!running) return;
      const idx = snakes.indexOf(s);
      if (idx >= 0) {
        const fresh = createSnake(s.id, false);
        snakes[idx] = fresh;
      }
    }, 2500 + Math.random()*2000);
  } else {
    // player death
    running = false;
    showMessage(`You died!<br>Final Points: <strong>${points}</strong><br>Press Restart to play again.`);
  }
}

function applyHelp(type) {
  const now = performance.now();
  if (type === "speed") {
    player.speedUntil = now + 12000;
  } else if (type === "shield") {
    player.shield = true;
  } else if (type === "magnet") {
    player.magnetUntil = now + 8000;
  }
}

// ===================== DRAW =====================
function draw() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);

  // Floor
  drawFloor();

  // World border
  ctx.strokeStyle = "rgba(255,255,255,0.15)";
  ctx.lineWidth = 4;
  ctx.strokeRect(-camX, -camY, WORLD_SIZE, WORLD_SIZE);

  // Foods
  for (const f of foods) {
    const sx = f.x - camX;
    const sy = f.y - camY;
    if (sx < -20 || sy < -20 || sx > canvas.width+20 || sy > canvas.height+20) continue;
    ctx.beginPath();
    ctx.arc(sx, sy, f.r, 0, Math.PI*2);
    ctx.fillStyle = f.color;
    ctx.fill();
  }

  // Helps
  for (const h of helps) {
    const sx = h.x - camX;
    const sy = h.y - camY;
    if (sx < -30 || sy < -30 || sx > canvas.width+30 || sy > canvas.height+30) continue;
    h.pulse += 0.08;
    const scale = 1 + Math.sin(h.pulse) * 0.15;
    ctx.save();
    ctx.translate(sx, sy);
    ctx.scale(scale, scale);
    ctx.beginPath();
    ctx.arc(0, 0, 14, 0, Math.PI*2);
    ctx.fillStyle = "rgba(251, 191, 36, 0.25)";
    ctx.fill();
    ctx.strokeStyle = "#fbbf24";
    ctx.lineWidth = 2;
    ctx.stroke();
    ctx.fillStyle = "#fff";
    ctx.font = "16px serif";
    ctx.textAlign = "center";
    ctx.textBaseline = "middle";
    const icon = HELP_ITEMS.find(x => x.id === h.type)?.icon || "?";
    ctx.fillText(icon, 0, 1);
    ctx.restore();
  }

  // Snakes (draw from longest to shortest so bigger on top)
  const sorted = [...snakes].filter(s => s.alive).sort((a,b) => a.length - b.length);
  for (const s of sorted) {
    drawSnake(s);
  }
}

function drawFloor() {
  const design = FLOOR_DESIGNS[selectedFloor];
  const cols = design.colors;

  // base fill
  ctx.fillStyle = cols[0];
  ctx.fillRect(0, 0, canvas.width, canvas.height);

  // pattern overlay depending on type
  const offsetX = -camX % 80;
  const offsetY = -camY % 80;

  if (design.pattern === "grid" || design.pattern === "cyber" || design.pattern === "pixel") {
    ctx.strokeStyle = cols[1] || "rgba(255,255,255,0.06)";
    ctx.lineWidth = 1;
    for (let x = offsetX; x < canvas.width; x += 40) {
      ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, canvas.height); ctx.stroke();
    }
    for (let y = offsetY; y < canvas.height; y += 40) {
      ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(canvas.width, y); ctx.stroke();
    }
  } else if (design.pattern === "waves" || design.pattern === "ice") {
    ctx.fillStyle = cols[1] || cols[0];
    for (let y = offsetY - 40; y < canvas.height + 40; y += 55) {
      ctx.beginPath();
      for (let x = 0; x < canvas.width; x += 20) {
        const yy = y + Math.sin((x + camX) * 0.02) * 12;
        if (x === 0) ctx.moveTo(x, yy);
        else ctx.lineTo(x, yy);
      }
      ctx.lineTo(canvas.width, y + 40);
      ctx.lineTo(0, y + 40);
      ctx.closePath();
      ctx.globalAlpha = 0.25;
      ctx.fill();
      ctx.globalAlpha = 1;
    }
  } else if (design.pattern === "stars" || design.pattern === "galaxy") {
    ctx.fillStyle = "rgba(255,255,255,0.35)";
    for (let i = 0; i < 80; i++) {
      const sx = ((i * 137 + camX * 0.3) % (canvas.width + 40)) - 20;
      const sy = ((i * 89 + camY * 0.3) % (canvas.height + 40)) - 20;
      ctx.beginPath();
      ctx.arc(sx, sy, 0.8 + (i % 3) * 0.6, 0, Math.PI*2);
      ctx.fill();
    }
  } else if (design.pattern === "lava") {
    // glowing spots
    for (let i = 0; i < 12; i++) {
      const sx = ((i * 211 + camX * 0.2) % (canvas.width + 100)) - 50;
      const sy = ((i * 167 + camY * 0.2) % (canvas.height + 100)) - 50;
      const g = ctx.createRadialGradient(sx, sy, 0, sx, sy, 60);
      g.addColorStop(0, "rgba(249, 115, 22, 0.35)");
      g.addColorStop(1, "transparent");
      ctx.fillStyle = g;
      ctx.fillRect(sx-60, sy-60, 120, 120);
    }
  } else if (design.pattern === "circuit") {
    ctx.strokeStyle = "rgba(99, 102, 241, 0.25)";
    ctx.lineWidth = 1.5;
    for (let i = 0; i < 30; i++) {
      const sx = ((i * 97 + camX * 0.4) % (canvas.width + 60)) - 30;
      const sy = ((i * 53 + camY * 0.4) % (canvas.height + 60)) - 30;
      ctx.strokeRect(sx, sy, 30 + (i%4)*10, 18);
    }
  } else if (design.pattern === "marble") {
    ctx.globalAlpha = 0.15;
    for (let i = 0; i < 8; i++) {
      ctx.beginPath();
      ctx.ellipse(
        (i*160 + camX*0.1) % canvas.width,
        (i*90 + camY*0.1) % canvas.height,
        80, 40, i, 0, Math.PI*2
      );
      ctx.fillStyle = cols[1] || "#fff";
      ctx.fill();
    }
    ctx.globalAlpha = 1;
  }

  // subtle vignette
  const grd = ctx.createRadialGradient(canvas.width/2, canvas.height/2, canvas.height*0.3, canvas.width/2, canvas.height/2, canvas.height*0.9);
  grd.addColorStop(0, "transparent");
  grd.addColorStop(1, "rgba(0,0,0,0.45)");
  ctx.fillStyle = grd;
  ctx.fillRect(0, 0, canvas.width, canvas.height);
}

function drawSnake(s) {
  if (s.body.length < 2) return;

  // body
  ctx.lineJoin = "round";
  ctx.lineCap = "round";
  ctx.strokeStyle = s.color;
  ctx.lineWidth = 14;
  ctx.beginPath();
  ctx.moveTo(s.body[0].x - camX, s.body[0].y - camY);
  for (let i = 1; i < s.body.length; i++) {
    ctx.lineTo(s.body[i].x - camX, s.body[i].y - camY);
  }
  ctx.stroke();

  // darker outline
  ctx.strokeStyle = s.colorDark;
  ctx.lineWidth = 16;
  ctx.globalCompositeOperation = "destination-over";
  ctx.stroke();
  ctx.globalCompositeOperation = "source-over";

  // head
  const hx = s.x - camX;
  const hy = s.y - camY;
  ctx.beginPath();
  ctx.arc(hx, hy, 11, 0, Math.PI*2);
  ctx.fillStyle = s.color;
  ctx.fill();
  ctx.strokeStyle = "#fff";
  ctx.lineWidth = 2;
  ctx.stroke();

  // eyes
  const ex = Math.cos(s.angle);
  const ey = Math.sin(s.angle);
  ctx.fillStyle = "#111";
  ctx.beginPath();
  ctx.arc(hx + ex*5 - ey*4, hy + ey*5 + ex*4, 2.5, 0, Math.PI*2);
  ctx.arc(hx + ex*5 + ey*4, hy + ey*5 - ex*4, 2.5, 0, Math.PI*2);
  ctx.fill();

  // number on head (score)
  ctx.fillStyle = "#fff";
  ctx.font = "bold 11px sans-serif";
  ctx.textAlign = "center";
  ctx.textBaseline = "middle";
  ctx.fillText(Math.floor(s.score), hx, hy - 18);

  // name
  if (s.isPlayer || s.score > 25) {
    ctx.font = "12px sans-serif";
    ctx.fillStyle = s.isPlayer ? "#4ade80" : "rgba(255,255,255,0.7)";
    ctx.fillText(s.name, hx, hy - 32);
  }

  // shield indicator
  if (s.shield) {
    ctx.beginPath();
    ctx.arc(hx, hy, 16, 0, Math.PI*2);
    ctx.strokeStyle = "rgba(56, 189, 248, 0.7)";
    ctx.lineWidth = 3;
    ctx.stroke();
  }
}

// ===================== UI =====================
function updatePointsUI() {
  document.getElementById("points").textContent = points;
  document.getElementById("shopBalance").textContent = points;
}

function updateLeaderboard() {
  const list = snakes
    .filter(s => s.alive)
    .sort((a,b) => b.score - a.score)
    .slice(0, 10);
  let html = "";
  list.forEach((s, i) => {
    const cls = s.isPlayer ? "me" : "";
    html += `<div class="${cls}"><span>${i+1}. ${s.name}</span><span>${Math.floor(s.score)}</span></div>`;
  });
  document.getElementById("leaderboard").innerHTML = html;
}

function showMessage(html) {
  document.getElementById("msgBox").innerHTML = html;
  document.getElementById("msgOverlay").classList.add("show");
}

function openShop() {
  renderShop();
  document.getElementById("shopOverlay").classList.add("show");
}
function closeShop() {
  document.getElementById("shopOverlay").classList.remove("show");
}

function renderShop() {
  updatePointsUI();
  const floorGrid = document.getElementById("floorGrid");
  floorGrid.innerHTML = "";
  FLOOR_DESIGNS.forEach((d, i) => {
    const owned = ownedFloors.has(i);
    const selected = selectedFloor === i;
    const el = document.createElement("div");
    el.className = "shop-item" + (owned ? " owned" : "") + (selected ? " selected" : "");
    el.innerHTML = `
      <div class="preview" style="background: linear-gradient(135deg, ${d.colors.join(",")})"></div>
      <div class="name">${d.name}</div>
      ${owned ? '<div class="owned-badge">Owned</div>' : `<div class="price">50 Points</div>`}
    `;
    el.onclick = () => {
      if (owned) {
        selectedFloor = i;
        renderShop();
      } else {
        buyFloor(i);
      }
    };
    floorGrid.appendChild(el);
  });

  const helpGrid = document.getElementById("helpGrid");
  helpGrid.innerHTML = "";
  HELP_ITEMS.forEach(item => {
    const el = document.createElement("div");
    el.className = "shop-item";
    el.innerHTML = `
      <div class="preview" style="display:flex;align-items:center;justify-content:center;font-size:32px;background:#1e1b4b">${item.icon}</div>
      <div class="name">${item.name}</div>
      <div style="font-size:11px;color:#94a3b8;margin:4px 0">${item.desc}</div>
      <div class="price">50 Points</div>
    `;
    el.onclick = () => buyHelp(item.id);
    helpGrid.appendChild(el);
  });
}

function buyFloor(idx) {
  if (points < SKIN_COST) {
    showMessage(`Not enough points!<br><span class="missing">You are missing ${SKIN_COST - points} points</span>`);
    return;
  }
  points -= SKIN_COST;
  ownedFloors.add(idx);
  selectedFloor = idx;
  updatePointsUI();
  renderShop();
}

function buyHelp(type) {
  if (points < HELP_COST) {
    showMessage(`Not enough points!<br><span class="missing">You are missing ${HELP_COST - points} points</span>`);
    return;
  }
  if (!player || !player.alive) {
    showMessage("You must be alive to use helps.");
    return;
  }
  points -= HELP_COST;
  updatePointsUI();
  applyHelp(type);
  closeShop();
  showMessage(`Activated: <strong>${HELP_ITEMS.find(h=>h.id===type).name}</strong>!`);
}

// start
init();
</script>
