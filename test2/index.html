<!DOCTYPE html>
<html lang="el">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, user-scalable=no">
<title>DROP AZIRAM</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --line:#23263066;
    --ink:#eef0f6;
    --ink-dim:#8b8fa3;
    --gold:#ffd23f;
    --shield-color:#00d4ff;
    --speed-color:#ffcc00;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  
  html,body{
    margin:0; padding:0; overflow:hidden; 
    background:#1f2842; height:100%; width:100%;
    font-family:'Baloo 2',system-ui,sans-serif; color:var(--ink); 
    touch-action:none; overscroll-behavior:none;
  }
  
  #wrap{position:fixed;inset:0;}
  canvas{display:block;width:100%;height:100%;}

  .hud{position:fixed;inset:0;pointer-events:none;z-index:5;}
  .hud > *{pointer-events:auto;}

  .topbar{position:absolute;top:0;left:0;right:0;display:flex;justify-content:space-between;align-items:flex-start;padding:14px 14px 0;}
  
  .stat{display:flex;align-items:center;gap:6px;background:linear-gradient(180deg,#1c1f2a,#14161f);border:1px solid var(--line);border-radius:999px;padding:6px 14px 6px 8px;font-weight:700;font-size:15px;box-shadow:0 4px 10px #0006;}
  .stat .dot{width:20px;height:20px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:12px;}
  .stat.score .dot{background:radial-gradient(circle at 30% 30%,#ffe27a,var(--gold));}
  .stat.timer{font-family:'JetBrains Mono',monospace;font-size:16px;letter-spacing:1px;}
  
  .leaderboard{background:linear-gradient(180deg,#1a1c26f2,#101219f2);border:1px solid var(--line);border-radius:14px;padding:8px 10px;min-width:190px;box-shadow:0 8px 22px #0007;backdrop-filter:blur(4px);max-height: 140px; overflow-y: auto; pointer-events: auto;}
  .leaderboard::-webkit-scrollbar { width: 4px; }
  .leaderboard::-webkit-scrollbar-thumb { background: #ffffff33; border-radius: 4px; }
  .leaderboard .lb-title{font-size:11px;letter-spacing:.14em;color:var(--ink-dim);text-transform:uppercase;margin:0 2px 6px;font-weight:700;}
  .lb-row{display:flex;align-items:center;gap:8px;padding:3px 2px;font-size:13px;font-weight:600;border-radius:8px;}
  .lb-row .rank{width:16px;text-align:center;color:var(--ink-dim);font-size:12px;}
  .lb-row .name{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .lb-row .val{font-family:'JetBrains Mono',monospace;color:var(--ink-dim);}
  .lb-row.me{background:#ffd23f22;}
  .lb-row.me .name,.lb-row.me .val{color:var(--gold);}
  
  .powerbar{position:absolute; right:16px; top:45%; transform:translateY(-50%); display:flex; flex-direction:column; gap:14px;}
  .pw{width:54px;height:54px;border-radius:16px;border:1px solid var(--line);background:linear-gradient(180deg,#3b3f4acc,#2b2f38cc);display:flex;align-items:center;justify-content:center;font-size:24px;position:relative;box-shadow:0 6px 14px #0007; backdrop-filter:blur(4px); cursor:pointer;}
  .pw:active{transform:scale(0.95);}
  .pw.cooldown{opacity: 0.5; pointer-events: none; filter: grayscale(100%);}
  .pw.active-buff{outline:3px solid #4ade80; background:linear-gradient(180deg,#2b4a3acc,#1b3a28cc);}
  .pw .cd{position:absolute;bottom:-8px;left:50%;transform:translateX(-50%);background:var(--gold);color:#181818;font-family:'JetBrains Mono',monospace;font-size:10px;font-weight:700;padding:1px 6px;border-radius:8px;display:none;}
  .pw.cooldown .cd{display:block; background:#ff4d6d; color:#fff;}
  .pw.active-buff .cd{display:block; background:#4ade80; color:#000;}

  /* Μενού Επιλογής */
  .center-msg{position:absolute;top:30%;left:50%;transform:translate(-50%,-50%);text-align:center;background:linear-gradient(180deg,#1a1c26f2,#101219f2);border:1px solid var(--line);border-radius:20px;padding:28px 34px;min-width:280px;box-shadow:0 20px 50px #000a;}
  .center-msg h1{margin:0 0 6px;font-size:26px;font-weight:800;}
  .center-msg h1 span{color:var(--gold);}
  .center-msg p{margin:0;color:var(--ink-dim);font-size:14px;line-height:1.5;}
  .mode-btns{display:flex;justify-content:center;gap:12px;margin-top:12px;flex-wrap:wrap;}
  .btn{border:none;border-radius:999px;padding:10px 18px;font-family:'Baloo 2',sans-serif;font-weight:800;font-size:14px;cursor:pointer;background:linear-gradient(180deg,#ffe27a,var(--gold));color:#1a1200;box-shadow:0 6px 0 #b58a12, 0 10px 18px #0007;}
  .btn:active{transform:translateY(4px);box-shadow:0 2px 0 #b58a12;}
  .hidden{display:none !important;}

  .toast{position:absolute;top:120px;left:50%;transform:translateX(-50%);font-weight:800;font-size:15px;padding:6px 16px;border-radius:999px;opacity:0;background:#12141ce6;border:1px solid var(--line);transition:opacity .25s, transform .25s; z-index:20;}
  .toast.show{opacity:1;transform:translateX(-50%) translateY(6px);}

  /* Χειριστήριο Μόνο με ♾️ */
  .control-zone {
    position: absolute;
    bottom: 5%;
    left: 50%;
    transform: translateX(-50%);
    width: 140px;
    height: 140px;
    display: flex;
    justify-content: center;
    align-items: center;
    touch-action: none;
    z-index: 10;
    pointer-events: auto; 
    user-select: none;
  }
  .inf-bg {
    width: 100%;
    height: 100%;
    pointer-events: none;
    filter: drop-shadow(0 4px 8px rgba(0,0,0,0.8));
  }
  .inf-ctrl-msg {
    position: absolute;
    bottom: -32px;
    font-size: 10px;
    color: var(--ink-dim);
    letter-spacing: 0.1em;
    opacity: 0.5;
    pointer-events: none;
  }
</style>

<script>
(function(){
"use strict";

document.addEventListener('touchmove', function(e) {
  if (e.target.closest('#leaderboardPanel')) return; 
  if (e.target.tagName !== 'BUTTON') { e.preventDefault(); }
}, { passive: false });

const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
let W, H, DPR;
const CAMERA_ZOOM = 1.05;

function resize(){
  DPR = Math.min(window.devicePixelRatio || 1, 2);
  W = window.innerWidth; H = window.innerHeight;
  canvas.width = W*DPR; canvas.height = H*DPR;
  canvas.style.width = W+'px'; canvas.style.height = H+'px';
  ctx.setTransform(DPR,0,0,DPR,0,0);
}
window.addEventListener('resize', resize);
resize();

// Ήχος σύγκρουσης ισότιμων αξιών
let audioCtx = null;
function playClashSound() {
  if(!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  try {
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.connect(gain); gain.connect(audioCtx.destination);
    osc.type = 'square';
    osc.frequency.setValueAtTime(1000, audioCtx.currentTime);
    osc.frequency.exponentialRampToValueAtTime(100, audioCtx.currentTime + 0.15);
    gain.gain.setValueAtTime(0.5, audioCtx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.15);
    osc.start(); osc.stop(audioCtx.currentTime + 0.15);
    gain.gain.setValueAtTime(0.5, audioCtx.currentTime);
  } catch(e) {}
}

const ARENA = 3500; 
const SPACING = 24;          
const BASE_R = 14;           
const NAMES = ["Twentyfourhourpharma","averagestudent","rejectedbachelorcontes","Chris_P_Bacon","thegodfatherpart4","B.Juice","TheAfterLife","kojima_fan92","noodle.exe","xXHunterXx"];
const VALUES = [2,4,8,16,32,64,128,256,512,1024,2048,5096];

// Πιο γεμάτα, ζωντανά 3D χρώματα
const CUBE_PALETTE = [
  { top:'#ff6b6b', right:'#cc4444', bottom:'#992222' }, // 2
  { top:'#4dabf7', right:'#2d7dc9', bottom:'#1b5796' }, // 4
  { top:'#ffd43b', right:'#d9b126', bottom:'#a3811a' }, // 8
  { top:'#ff922b', right:'#d9731e', bottom:'#a35414' }, // 16
  { top:'#cc5de8', right:'#a838c8', bottom:'#7d1f96' }, // 32
  { top:'#20c997', right:'#179b74', bottom:'#0e634a' }, // 64
  { top:'#94d82d', right:'#75ad20', bottom:'#527a15' }, // 128
  { top:'#845ef7', right:'#6743cc', bottom:'#432c8a' }, // 256
  { top:'#f06595', right:'#c74d78', bottom:'#943554' }, // 512
  { top:'#38d9a9', right:'#28ad86', bottom:'#1e7e64' }, // 1024
  { top:'#f8f9fa', right:'#d0d4d8', bottom:'#9aa0a5' }, // 2048
  { top:'#ffda6b', right:'#d9b136', bottom:'#a8871f' }, // 5096
];

function shadeColor(hex, percent) {
  const num = parseInt(hex.slice(1), 16);
  let r = (num >> 16) + percent;
  let g = ((num >> 8) & 0x00FF) + percent;
  let b = (num & 0x0000FF) + percent;
  r = Math.max(0, Math.min(255, r));
  g = Math.max(0, Math.min(255, g));
  b = Math.max(0, Math.min(255, b));
  return '#' + (r << 16 | g << 8 | b).toString(16).padStart(6, '0');
}

function colorFor(v){
  const idx = Math.log2(v) - 1; 
  return CUBE_PALETTE[Math.max(0, Math.min(idx, CUBE_PALETTE.length-1))];
}

function rnd(a,b){ return a + Math.random()*(b-a); }
function dist2(ax,ay,bx,by){ const dx=ax-bx, dy=ay-by; return dx*dx+dy*dy; }
function clamp(v,a,b){ return Math.max(a,Math.min(b,v)); }

// Power-ups δαπέδου
let floorItems = [];
let itemSpawnTimer = 0;

class Snake{
  constructor(x,y,isPlayer,name){
    this.isPlayer = isPlayer;
    this.name = name;
    this.angle = rnd(0, Math.PI*2);
    this.targetAngle = this.angle;
    this.baseSpeed = 2.5; /* Σταθερή ταχύτητα */
    this.boostSpeed = 5.0;
    this.boostT = 0; 
    this.path = [{x,y}];
    this.segments = [{value: VALUES[Math.floor(rnd(0,2))], t:0}]; 
    this.alive = true;
    this.shieldT = 0;
    this.magnetT = 0;
    this.reactT = 0;
    this.boostCd = 0;
    this.magnetCd = 0;
    this.shieldCd = 0;
  }
  get head(){ return this.path[this.path.length-1]; }
  get headValue(){ return this.segments[0].value; }
  get score(){ return this.segments.reduce((s,seg)=>s+seg.value,0); }

  steerToward(px,py){
    const h = this.head;
    this.targetAngle = Math.atan2(py-h.y, px-h.x);
  }

  update(dt, world){
    let da = this.targetAngle - this.angle;
    while(da > Math.PI) da -= Math.PI*2;
    while(da < -Math.PI) da += Math.PI*2;
    
    const turnRate = 0.12 + (this.boostT > 0 ? 0.025 : 0);
    this.angle += clamp(da, -turnRate, turnRate);
    if (Math.abs(da) < 0.4) this.angle += da * 0.08;

    const spd = (this.boostT > 0) ? this.boostSpeed : this.baseSpeed;
    
    const h = this.head;
    let nx = h.x + Math.cos(this.angle)*spd;
    let ny = h.y + Math.sin(this.angle)*spd;
    
    for(let o of obstacles) {
      const dx = nx - o.x;
      const dy = ny - o.y;
      const hw = o.w/2 + BASE_R;
      const hh = o.h/2 + BASE_R;
      
      if(Math.abs(dx) < hw && Math.abs(dy) < hh) {
        const overlapX = hw - Math.abs(dx);
        const overlapY = hh - Math.abs(dy);
        if(overlapX < overlapY) nx += (dx > 0 ? overlapX : -overlapX);
        else ny += (dy > 0 ? overlapY : -overlapY);
      }
    }

    nx = clamp(nx, 20, ARENA-20);
    ny = clamp(ny, 20, ARENA-20);

    this.path.push({x:nx,y:ny});
    const maxLen = this.segments.length * SPACING + 60;
    while(this.path.length > 2 && this.pathLength() > maxLen){
      this.path.shift();
    }

    if(this.boostT>0) this.boostT -= dt;
    if(this.shieldT>0) this.shieldT -= dt;
    if(this.magnetT>0) this.magnetT -= dt;
    if(this.reactT>0) this.reactT -= dt;
    if(this.boostCd>0) this.boostCd -= dt;
    if(this.magnetCd>0) this.magnetCd -= dt;
    if(this.shieldCd>0) this.shieldCd -= dt;
  }

  pathLength(){
    let d=0;
    for(let i=1;i<this.path.length;i++){
      d += Math.hypot(this.path[i].x-this.path[i-1].x, this.path[i].y-this.path[i-1].y);
    }
    return d;
  }

  pointAtDistance(distBack){
    const p = this.path;
    let remaining = distBack;
    for(let i=p.length-1;i>0;i--){
      const a = p[i], b = p[i-1];
      const segLen = Math.hypot(a.x-b.x, a.y-b.y);
      if(segLen >= remaining){
        const t = segLen===0?0:remaining/segLen;
        return {x: a.x + (b.x-a.x)*t, y: a.y + (b.y-a.y)*t};
      }
      remaining -= segLen;
    }
    return {x:p[0].x, y:p[0].y};
  }

  segmentPositions(){
    const out = [];
    let d = 0;
    for(let i=0;i<this.segments.length;i++){
      out.push(this.pointAtDistance(d));
      d += SPACING;
    }
    return out;
  }

  grow(value){
    this.segments.push({value});
    this.optimizeSegments();
  }

  optimizeSegments(){
    let count = 0;
    this.segments.sort((a,b) => b.value - a.value);
    let merged = true;
    while(merged){
      merged = false;
      for(let i=0; i<this.segments.length-1; i++){
        if(this.segments[i].value === this.segments[i+1].value){
          let newVal = this.segments[i].value * 2;
          if (this.segments[i].value >= 5096) newVal = 5096;
          this.segments[i].value = newVal;
          this.segments.splice(i+1, 1); 
          merged = true; 
          count++;
          break; 
        }
      }
    }
    return count;
  }
}

let cubes = [];      
let obstacles = []; 
let particles = [];
let floaters = [];  
let player, bots = [];
let running = false;
let gameStartedOnce = false;
let timeLeft = 180;
let elapsedSinceLB = 0;
let camera = {x:0,y:0};
let screenShake = 0; 
let floorTime = 0;

// Μεταβλητές τρόπου παιχνιδιού
let gameMode = 'survive'; // 'timed' ή 'survive'

function isInsideObstacle(x, y, padding = 40) {
  for(let o of obstacles) {
    if (Math.abs(x - o.x) < (o.w/2 + padding) && Math.abs(y - o.y) < (o.h/2 + padding)) return true;
  }
  return false;
}

function spawnCube(){
  const rarity = Math.random();
  let v = 2;
  if(rarity > 0.94) v = 8; else if(rarity > 0.75) v = 4;
  let cx, cy;
  do { cx = rnd(30,ARENA-30); cy = rnd(30,ARENA-30); } while(isInsideObstacle(cx, cy, 20));
  cubes.push({x: cx, y: cy, value: v});
}

function spawnObstacles(){
  obstacles = [];
  const count = 12; 
  for(let i=0; i<count; i++) {
    let ox = rnd(300, ARENA-300);
    let oy = rnd(300, ARENA-300);
    if(dist2(ox, oy, ARENA/2, ARENA/2) < 400*400) continue; 
    obstacles.push({ x: ox, y: oy, w: rnd(150, 350), h: rnd(150, 350) });
  }
}

function spawnFloorItem() {
  let x, y;
  do { x = rnd(100, ARENA-100); y = rnd(100, ARENA-100); } while(isInsideObstacle(x, y, 40));
  const type = Math.random() > 0.5 ? 'speed' : 'shield';
  floorItems.push({ x, y, type, life: 8.0, angle: 0 });
}

function spawnText(x, y, text, color){ floaters.push({x, y, text, color, life: 1.2}); }

function makeBot(){
  let bx, by;
  do { bx = rnd(200,ARENA-200); by = rnd(200,ARENA-200); } while(isInsideObstacle(bx, by, 40));
  const s = new Snake(bx, by, false, NAMES[Math.floor(rnd(0,NAMES.length))] + (Math.random()>0.8? (Math.floor(rnd(1,9))):''));
  for(let i=0;i<Math.floor(rnd(1,4));i++) s.grow(VALUES[Math.floor(rnd(0,3))]);
  s.retargetT = 0;
  return s;
}

function initWorld(){
  floorItems = []; itemSpawnTimer = 0;
  spawnObstacles(); 
  cubes = []; particles = []; floaters = []; bots = [];
  for(let i=0;i<180;i++) spawnCube();
  player = new Snake(ARENA/2, ARENA/2, true, "You");
  for(let i=0;i<8;i++) bots.push(makeBot());
  if(gameMode === 'timed') timeLeft = 180;
  else timeLeft = 999;
}

// Χειριστήριο
const joyZone = document.getElementById('controlZone');
let joy = { active: false, pointerId: null };

function updateJoystick(e) {
  const rect = joyZone.getBoundingClientRect();
  const cx = rect.left + rect.width / 2;
  const cy = rect.top + rect.height / 2;
  
  let dx = e.clientX - cx;
  let dy = e.clientY - cy;
  
  const d = Math.hypot(dx, dy);
  const ang = Math.atan2(dy, dx);
  
  if (d > 5) { 
    player.targetAngle = ang; 
    // Δείχνουμε ότι κινείται
  }
}

joyZone.addEventListener('pointerdown', e => {
  if(!running && !document.getElementById('modeSelectMsg').classList.contains('hidden')) { return; }
  if(!running && document.getElementById('endMsg').classList.contains('hidden') === false){ startGame(); return; }
  
  joy.active = true;
  joy.pointerId = e.pointerId;
  joyZone.setPointerCapture(e.pointerId);
  updateJoystick(e);
  e.stopPropagation();
});

joyZone.addEventListener('pointermove', e => {
  if(joy.active && e.pointerId === joy.pointerId && player && player.alive){ updateJoystick(e); }
  e.stopPropagation();
});

function joyReset() { joy.active = false; joy.pointerId = null; }

joyZone.addEventListener('pointerup', e => { if(joy.active && e.pointerId === joy.pointerId){ joyReset(); }});
joyZone.addEventListener('pointercancel', () => joyReset());

// Ενεργοποίηση κουμπιών
function triggerPowerup(type, btnId, msg, color) {
  if(!player || !player.alive) return;
  if(player[type + 'Cd'] > 0) return;
  player[type + 'T'] = 5.0; 
  player[type + 'Cd'] = 20.0;
  toast(msg, color);
  screenShake = 0.15;
  const el = document.getElementById(btnId);
  updateCooldownVisual(el, player, type);
}

document.getElementById('pwBoost').addEventListener('pointerdown', (e) => { e.stopPropagation(); triggerPowerup('boost', 'pwBoost', 'Ταχύτητα!', '#ffd23f'); });
document.getElementById('pwMagnet').addEventListener('pointerdown', (e) => { e.stopPropagation(); triggerPowerup('magnet', 'pwMagnet', 'Μαγνήτης!', '#4ecdc4'); });
document.getElementById('pwShield').addEventListener('pointerdown', (e) => { e.stopPropagation(); triggerPowerup('shield', 'pwShield', 'Ασπίδα!', '#7b61ff'); });

function updateCooldownVisual(el, p, type) {
  const cdEl = el.querySelector('.cd');
  clearInterval(el._iv);
  el._iv = setInterval(()=>{
    const active = p[type + 'T'];
    const cd = p[type + 'Cd'];
    if(active > 0) { el.classList.add('active-buff'); el.classList.remove('cooldown'); cdEl.textContent = active.toFixed(1) + 's'; } 
    else if(cd > 0) { el.classList.remove('active-buff'); el.classList.add('cooldown'); cdEl.textContent = cd.toFixed(1) + 's'; } 
    else { el.classList.remove('active-buff', 'cooldown'); clearInterval(el._iv); }
  }, 100);
}

function toast(msg, color){
  const t = document.getElementById('toast');
  t.textContent = msg; t.style.color = color || 'var(--ink)'; t.classList.add('show');
  clearTimeout(toast._h);
  toast._h = setTimeout(()=>t.classList.remove('show'), 900);
}

function burst(x,y,color,n){ n = n||10; for(let i=0;i<n;i++){ const a=Math.random()*Math.PI*2, sp=rnd(0.6,3.0); particles.push({x,y,vx:Math.cos(a)*sp, vy:Math.sin(a)*sp, life:1, color}); } }

function eatCubes(snake){
  const headPos = snake.segmentPositions()[0];
  const magnetActive = snake.magnetT > 0;
  const pickR = magnetActive ? 140 : 28;
  for(let i=cubes.length-1;i>=0;i--){
    const c = cubes[i];
    const d2 = dist2(headPos.x, headPos.y, c.x, c.y);
    if(d2 < pickR*pickR){
      if(magnetActive && d2 > (28*28)){ c.x += (headPos.x-c.x)*0.18; c.y += (headPos.y-c.y)*0.18; continue; }
      cubes.splice(i,1); snake.grow(c.value); 
      if(snake.isPlayer){ burst(c.x,c.y, '#ffffff', 8); } spawnCube();
    }
  }
}

// Κατανάλωση αντικειμένων δαπέδου
function eatFloorItems(snake){
  const headPos = snake.segmentPositions()[0];
  for(let i=floorItems.length-1; i>=0; i--){
    const item = floorItems[i];
    if(dist2(headPos.x, headPos.y, item.x, item.y) < 30){
      if(item.type === 'speed'){ snake.boostT = 3.0; spawnText(item.x, item.y, '⚡SPEED', '#ffcc00'); }
      else if(item.type === 'shield'){ snake.shieldT = 5.0; spawnText(item.x, item.y, '🛡️SHIELD', '#00d4ff'); }
      floorItems.splice(i, 1);
    }
  }
}

function killSnake(snake){
  snake.alive = false;
  const positions = snake.segmentPositions();
  positions.forEach((p,i)=>{
    if(snake.segments[i]) {
      let dropX = p.x + rnd(-20,20), dropY = p.y + rnd(-20,20);
      if(!isInsideObstacle(dropX, dropY)) cubes.push({x: dropX, y: dropY, value: snake.segments[i].value});
    }
  });
  if(snake.isPlayer){ 
    if(gameMode === 'survive') endGame(false); 
    else { 
      // Σε λειτουργία χρόνου, ξαναγεννιέται μετά από λίγο
      setTimeout(() => {
        if(!running || gameMode !== 'timed') return;
        let bx, by; do { bx = rnd(200,ARENA-200); by = rnd(200,ARENA-200); } while(isInsideObstacle(bx, by, 40));
        player = new Snake(bx, by, true, "You");
        player.baseSpeed = 2.5; player.boostSpeed = 5.0;
      }, 2000);
    }
  } 
  else {
    const idx = bots.indexOf(snake);
    if(idx>=0) bots.splice(idx,1);
    if(bots.length < 7) bots.push(makeBot());
  }
}

function resolveCombat(){
  let all = [player, ...bots].filter(s=>s.alive);
  if(!running) all = bots.filter(s=>s.alive);
  for(const a of all){
    if(a.reactT>0) continue;
    const aPos = a.segmentPositions(); const aHead = aPos[0];
    for(const b of all){
      if(a===b || b.reactT>0) continue;
      const bPos = b.segmentPositions();
      for(let i=0;i<bPos.length;i++){
        const segPos = bPos[i];
        const hitR = BASE_R + Math.min(Math.log2(b.segments[i].value)*1.4, 16);
        if(dist2(aHead.x,aHead.y,segPos.x,segPos.y) < (hitR+BASE_R*0.6)*(hitR+BASE_R*0.6)){
          
          // ΝΕΟ: Αν οι αριθμοί είναι ίσοι, αλλάζουν κατεύθυνση και κάνουν ήχο
          if(b.segments[i].value === a.headValue){
             if(a !== player && b !== player) continue; // Μόνο για μάχες παίκτη
             
             const dx = aHead.x - segPos.x;
             const dy = aHead.y - segPos.y;
             if(dx !== 0 || dy !== 0){
               // Ώθηση μακριά
               const ang = Math.atan2(dy, dx);
               a.angle = ang + 0.2; a.targetAngle = ang + 0.2;
               const bAng = ang + Math.PI;
               b.angle = bAng + 0.2; b.targetAngle = bAng + 0.2;
               
               a.reactT = 0.2; b.reactT = 0.2; 
               // Ήχος σύγκρουσης
               playClashSound();
               burst(aHead.x, aHead.y, '#ffffff', 8);
             }
             break;
          }

          if(b.shieldT>0){ continue; }
          const aVal = a.headValue, bVal = b.segments[i].value;
          if(aVal > bVal){
            const severed = b.segments.splice(i);
            severed.forEach((seg, idx) => {
               const p = bPos[i + idx] || bPos[bPos.length-1];
               if(!isInsideObstacle(p.x, p.y)){ cubes.push({x: p.x + rnd(-10,10), y: p.y + rnd(-10,10), value: seg.value}); }
               burst(p.x, p.y, '#ffffff', 5);
            });
            a.reactT = 0.15; b.reactT = 0.15;
            if(a.isPlayer){ spawnText(aHead.x, aHead.y, "TAIL CUT!", "#ff4d6d"); screenShake = 0.3; }
            if(b.segments.length === 0) killSnake(b);
          } else if(aVal < bVal){
            if(a.shieldT>0){ continue; }
            if(i===0 || true){ killSnake(a); }
            a.reactT = 0.15; b.reactT = 0.15;
          }
          break;
        }
      }
      if(!a.alive) break;
    }
    if(!a.alive) continue;
  }
}

function botAI(bot, dt){
  bot.retargetT -= dt;
  if(bot.retargetT<=0){
    bot.retargetT = rnd(0.6,1.4);
    const hp = bot.head;
    let best=null, bestD=550*550;
    // Στόχευση αντικειμένων δαπέδου και κύβων
    for(const c of cubes){ const d2=dist2(hp.x,hp.y,c.x,c.y); if(d2<bestD){ bestD=d2; best=c; } }
    for(const it of floorItems){ const d2=dist2(hp.x,hp.y,it.x,it.y); if(d2<bestD){ bestD=d2; best={x:it.x,y:it.y}; } }
    
    if(best && Math.random()>0.15){ bot.targetAngle = Math.atan2(best.y-hp.y, best.x-hp.x); } 
    else { bot.targetAngle = bot.angle + rnd(-1.4,1.4); }
  }
}

function renderLeaderboard(){
  const all = [player, ...bots].filter(s=>s.alive);
  all.sort((a,b)=>b.score-a.score);
  const rows = document.getElementById('lbRows'); rows.innerHTML = '';
  all.forEach((s,i)=>{
    const div = document.createElement('div');
    div.className = 'lb-row' + (s.isPlayer?' me':'');
    div.innerHTML = `<span class="rank">${i+1}</span><span class="name">${s.isPlayer?'You':s.name}</span><span class="val">${s.score}</span>`;
    rows.appendChild(div);
  });
}

function drawFloor(){
  const sx = -camera.x; const sy = -camera.y;
  ctx.save();
  const grad = ctx.createLinearGradient(sx, sy, sx+ARENA, sy+ARENA);
  grad.addColorStop(0, '#2b3652'); grad.addColorStop(1, '#1e263d');
  ctx.fillStyle = grad; ctx.fillRect(sx, sy, ARENA, ARENA);
  ctx.fillStyle = '#ffffff1a'; const step = 55;
  for(let x=0; x<=ARENA; x+=step){ for(let y=0; y<=ARENA; y+=step){ ctx.beginPath(); ctx.arc(sx+x, sy+y, 2.5, 0, Math.PI*2); ctx.fill(); } }
  ctx.restore();
}

function drawObstacles() {
  obstacles.forEach(o => {
    const sx = o.x - camera.x; const sy = o.y - camera.y;
    if(sx < -o.w || sx > W/CAMERA_ZOOM + o.w || sy < -o.h || sy > H/CAMERA_ZOOM + o.h) return;
    ctx.save(); ctx.translate(sx, sy); const r = 20; 
    ctx.save(); ctx.translate(0, 15); ctx.fillStyle = '#00000066'; ctx.shadowBlur=20; ctx.shadowColor='#00000055'; roundRect(-o.w/2, -o.h/2, o.w, o.h, r); ctx.fill(); ctx.restore();
    ctx.fillStyle = '#555866'; roundRect(-o.w/2, -o.h/2, o.w, o.h, r); ctx.fill();
    ctx.strokeStyle = '#6a6e7c'; ctx.lineWidth = 2; roundRect(-o.w/2, -o.h/2, o.w, o.h, r); ctx.stroke();
    ctx.restore();
  });
}

function drawFloorItems() {
  floorItems.forEach(item => {
    item.angle += 0.03;
    const sx = item.x - camera.x; const sy = item.y - camera.y;
    ctx.save(); ctx.translate(sx, sy); ctx.rotate(item.angle);
    
    // Λάμψη
    ctx.shadowColor = item.type === 'speed' ? 'var(--speed-color)' : 'var(--shield-color)';
    ctx.shadowBlur = 25;
    ctx.font = `800 22px 'Baloo 2', sans-serif`;
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillStyle = item.type === 'speed' ? 'var(--speed-color)' : 'var(--shield-color)';
    ctx.fillText(item.type === 'speed' ? '⚡' : '🛡️', 0, 0);
    ctx.restore();
  });
}

// Πλήρως 3D σχεδίαση κύβων με γεμάτα χρώματα
function drawCube3D(x, y, value, scale = 1) {
  const c = colorFor(value);
  const sx = x - camera.x, sy = y - camera.y;
  if(sx < -60 || sx > (W/CAMERA_ZOOM)+60 || sy < -60 || sy > (H/CAMERA_ZOOM)+60) return;

  const s = 16 * scale;
  const d = 8 * scale;
  const rr = 1.5 * scale;
  
  ctx.save();
  ctx.translate(sx, sy);

  // Σκιά
  ctx.save(); ctx.translate(2, d + 4);
  ctx.fillStyle = 'rgba(0,0,0,0.40)';
  ctx.beginPath(); ctx.moveTo(-s, s); ctx.lineTo(s, s); ctx.lineTo(s+d, s+d); ctx.lineTo(-s+d, s+d); ctx.closePath();
  ctx.fill(); ctx.restore();

  // Κάτω Όψη
  ctx.fillStyle = c.bottom;
  ctx.beginPath(); ctx.moveTo(-s, s); ctx.lineTo(s, s); ctx.lineTo(s+d, s+d); ctx.lineTo(-s+d, s+d); ctx.closePath();
  ctx.fill();

  // Δεξιά Όψη
  ctx.fillStyle = c.right;
  ctx.beginPath(); ctx.moveTo(s, -s); ctx.lineTo(s+d, -s+d); ctx.lineTo(s+d, s+d); ctx.lineTo(s, s); ctx.closePath();
  ctx.fill();

  // Πάνω Όψη (Γεμάτη με έντονο χρώμα)
  ctx.fillStyle = c.top;
  ctx.beginPath(); ctx.moveTo(-s, -s); ctx.lineTo(s, -s); ctx.lineTo(s+d, -s+d); ctx.lineTo(-s+d, -s+d); ctx.closePath();
  ctx.fill();

  // Λάμψη άκρων (Για να δείχνει πιο γεμάτο)
  ctx.strokeStyle = 'rgba(255,255,255,0.20)';
  ctx.lineWidth = 2;
  ctx.beginPath(); ctx.moveTo(-s+2, -s+2); ctx.lineTo(s-2, -s+2); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(-s+2, -s+2); ctx.lineTo(-s+2+d*0.4, -s+2+d*0.4); ctx.stroke();

  // Αριθμός
  ctx.save();
  ctx.font = `800 ${Math.max(10, 13*scale)}px 'Baloo 2', system-ui, sans-serif`;
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.fillStyle = '#ffffff';
  ctx.shadowColor = 'rgba(0,0,0,0.6)'; ctx.shadowBlur = 6; ctx.shadowOffsetY = 1;
  ctx.fillText(String(value), d*0.4, -d*0.2);
  ctx.restore();
  ctx.restore();
}

function roundRect(x,y,w,h,r){ ctx.beginPath(); ctx.moveTo(x+r,y); ctx.arcTo(x+w,y,x+w,y+h,r); ctx.arcTo(x+w,y+h,x,y+h,r); ctx.arcTo(x,y+h,x,y,r); ctx.arcTo(x,y,x+w,y,r); ctx.closePath(); }

// Σχεδίαση φιδιού με ασπίδα σε όλο το μήκος
function drawSnake(snake){
  const positions = snake.segmentPositions();
  if(!positions.length) return;
  
  // Ασπίδα σε όλο το μήκος
  if(snake.shieldT > 0) {
    ctx.save();
    // Υπέροχο εφέ λάμψης
    ctx.shadowColor = '#00d4ff';
    ctx.shadowBlur = 30;
    ctx.strokeStyle = 'rgba(0, 212, 255, 0.65)';
    ctx.lineWidth = 12;
    ctx.lineCap = 'round';
    ctx.lineJoin = 'round';
    ctx.beginPath();
    ctx.moveTo(positions[0].x - camera.x, positions[0].y - camera.y);
    for(let i=1; i<positions.length; i++) {
      ctx.lineTo(positions[i].x - camera.x, positions[i].y - camera.y);
    }
    ctx.stroke();
    
    // Εσωτερική λεπτή γραμμή
    ctx.shadowBlur = 10;
    ctx.strokeStyle = 'rgba(255, 255, 255, 0.4)';
    ctx.lineWidth = 3;
    ctx.beginPath();
    ctx.moveTo(positions[0].x - camera.x, positions[0].y - camera.y);
    for(let i=1; i<positions.length; i++) {
      ctx.lineTo(positions[i].x - camera.x, positions[i].y - camera.y);
    }
    ctx.stroke();
    ctx.restore();
  }

  // Σχεδίαση κύβων (από πίσω προς τα μπροστά)
  for(let i=positions.length-1; i>=1; i--){
    drawCube3D(positions[i].x, positions[i].y, snake.segments[i].value, 1);
  }
  drawCube3D(positions[0].x, positions[0].y, snake.segments[0].value, 1.2);
  
  // Όνομα
  ctx.save(); ctx.font = "700 12px sans-serif"; ctx.fillStyle = '#ffffff'; ctx.textAlign='center'; 
  ctx.shadowColor = 'rgba(0,0,0,0.8)'; ctx.shadowBlur = 4;
  ctx.fillText(snake.isPlayer ? 'You' : snake.name, positions[0].x-camera.x, positions[0].y-camera.y-26); 
  ctx.restore();
}

function drawParticles(dt){
  for(let i=particles.length-1;i>=0;i--){
    const pt = particles[i];
    pt.x += pt.vx; pt.y += pt.vy; pt.life -= dt*1.6;
    if(pt.life<=0){ particles.splice(i,1); continue; }
    ctx.save(); ctx.globalAlpha = clamp(pt.life,0,1); ctx.fillStyle = pt.color;
    ctx.beginPath(); ctx.arc(pt.x-camera.x, pt.y-camera.y, 2, 0, Math.PI*2); ctx.fill(); ctx.restore();
  }
}

function drawFloaters(dt){
  for(let i=floaters.length-1; i>=0; i--){
    const f = floaters[i];
    f.y -= dt * 35; f.life -= dt;
    if(f.life <= 0){ floaters.splice(i,1); continue; }
    ctx.save(); ctx.globalAlpha = Math.min(1, f.life * 2);
    ctx.font = "800 16px 'Baloo 2', sans-serif"; ctx.fillStyle = f.color;
    ctx.strokeStyle = '#000000cc'; ctx.lineWidth = 3; ctx.textAlign = 'center';
    ctx.strokeText(f.text, f.x - camera.x, f.y - camera.y);
    ctx.fillText(f.text, f.x - camera.x, f.y - camera.y);
    ctx.restore();
  }
}

let lastT = null;
function frame(ts){
  if(!lastT) lastT = ts;
  const dt = Math.min((ts-lastT)/1000, 0.05);
  lastT = ts;

  // Δημιουργία αντικειμένων δαπέδου
  if(running && floorItems.length < 6) {
    itemSpawnTimer -= dt;
    if(itemSpawnTimer <= 0) { spawnFloorItem(); itemSpawnTimer = rnd(4, 8); }
  }

  bots.forEach(b=>{ botAI(b,dt); b.update(dt); });
  bots.forEach(b=>{ eatCubes(b); eatFloorItems(b); });
  resolveCombat();
  floorTime += dt; 

  if(running && player.alive){
    player.update(dt); eatCubes(player); eatFloorItems(player);
    
    timeLeft -= dt; elapsedSinceLB += dt;
    if(elapsedSinceLB > 1){ elapsedSinceLB = 0; renderLeaderboard(); }
    document.getElementById('scoreVal').textContent = player.score;
    
    if(gameMode === 'timed') {
      const m = Math.max(0,Math.floor(timeLeft/60)), s = Math.max(0,Math.floor(timeLeft%60));
      document.getElementById('timerVal').textContent = `${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`;
      if(timeLeft<=0){ endGame(true); }
    } else {
      document.getElementById('timerVal').textContent = '∞';
    }
  }

  if(screenShake > 0) screenShake -= dt;
  let cx = player.head.x - (W/2) / CAMERA_ZOOM;
  let cy = player.head.y - (H/2) / CAMERA_ZOOM;
  if(screenShake > 0) { cx += rnd(-10, 10) * screenShake; cy += rnd(-10, 10) * screenShake; }
  camera.x = cx; camera.y = cy;

  ctx.clearRect(0,0,W,H); ctx.save(); ctx.scale(CAMERA_ZOOM, CAMERA_ZOOM);
  drawFloor(); drawObstacles(); drawFloorItems();
  cubes.forEach(c=>drawCube3D(c.x,c.y,c.value,0.85));
  bots.forEach(b=>{ if(b.alive) drawSnake(b); });
  if(player.alive) drawSnake(player);
  drawParticles(dt); drawFloaters(dt);
  ctx.restore(); 
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);

function startGame(){
  if(!document.getElementById('modeSelectMsg').classList.contains('hidden')) return;
  
  if(gameStartedOnce && (!player.alive || timeLeft <= 0 || gameMode === 'timed')){ initWorld(); 
    ['pwBoost', 'pwMagnet', 'pwShield'].forEach(id => { const el = document.getElementById(id); el.classList.remove('active-buff', 'cooldown'); clearInterval(el._iv); el.querySelector('.cd').style.display = 'none'; });
  }
  gameStartedOnce = true; renderLeaderboard();
  document.getElementById('modeSelectMsg').classList.add('hidden');
  document.getElementById('endMsg').classList.add('hidden');
  running = true;
}

function endGame(survived){
  running = false;
  const title = document.getElementById('endTitle');
  const body = document.getElementById('endBody');
  if(gameMode === 'timed') {
    const all = [player, ...bots].filter(s=>s.alive);
    all.sort((a,b)=>b.score-a.score);
    const rank = 1 + all.filter(s=>s.score>player.score).length;
    title.innerHTML = '⏱️ Τέλος Χρόνου! 🏆';
    body.textContent = `Σκορ: ${player.score} · Θέση #${rank} στο δωμάτιο`;
  } else {
    title.innerHTML = survived ? 'Επιβίωσες! 🏆' : 'Game Over 💀';
    const all = [player, ...bots].filter(s=>s!==player);
    const rank = 1 + all.filter(s=>s.score>player.score).length;
    body.textContent = `Σκορ: ${player.score} · Θέση #${rank} στο δωμάτιο`;
  }
  document.getElementById('endMsg').classList.remove('hidden');
}

document.getElementById('restartBtn').addEventListener('click', () => {
  document.getElementById('endMsg').classList.add('hidden');
  document.getElementById('modeSelectMsg').classList.remove('hidden');
  running = false;
});

// Επιλογή Μοντέλου
document.getElementById('modeTimeBtn').addEventListener('click', () => {
  gameMode = 'timed';
  document.getElementById('modeSelectMsg').classList.add('hidden');
  initWorld(); startGame();
});
document.getElementById('modeSurviveBtn').addEventListener('click', () => {
  gameMode = 'survive';
  document.getElementById('modeSelectMsg').classList.add('hidden');
  initWorld(); startGame();
});

})();
</script>
