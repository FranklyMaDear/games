<!DOCTYPE html>
<html lang="el">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, user-scalable=no">
<title>Snake Drop 2048</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg-0:#0a0b10;
    --bg-1:#12141c;
    --line:#23263066;
    --ink:#eef0f6;
    --ink-dim:#8b8fa3;
    --gold:#ffd23f;
    --danger:#ff4d6d;
    --good:#3ddc84;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;overflow:hidden;background:var(--bg-0);height:100%;width:100%;
    font-family:'Baloo 2',system-ui,sans-serif; color:var(--ink); touch-action:none;}
  #wrap{position:fixed;inset:0;}
  canvas{display:block;width:100%;height:100%;}

  .hud{position:fixed;inset:0;pointer-events:none;z-index:5;}
  .hud > *{pointer-events:auto;}

  .topbar{position:absolute;top:0;left:0;right:0;display:flex;justify-content:space-between;
    align-items:flex-start;padding:14px 14px 0;}
  .stat{display:flex;align-items:center;gap:6px;background:linear-gradient(180deg,#1c1f2a,#14161f);
    border:1px solid var(--line);border-radius:999px;padding:6px 14px 6px 8px;font-weight:700;
    font-size:15px;box-shadow:0 4px 10px #0006;}
  .stat .dot{width:20px;height:20px;border-radius:50%;display:flex;align-items:center;justify-content:center;
    font-size:12px;}
  .stat.score .dot{background:radial-gradient(circle at 30% 30%,#ffe27a,var(--gold));}
  .stat.timer{font-family:'JetBrains Mono',monospace;font-size:16px;letter-spacing:1px;}
  .stat.timer .dot{background:transparent;}

  .leaderboard{background:linear-gradient(180deg,#1a1c26f2,#101219f2);border:1px solid var(--line);
    border-radius:14px;padding:8px 10px;min-width:190px;box-shadow:0 8px 22px #0007;backdrop-filter:blur(4px);}
  .leaderboard .lb-title{font-size:11px;letter-spacing:.14em;color:var(--ink-dim);text-transform:uppercase;
    margin:0 2px 6px;font-weight:700;}
  .lb-row{display:flex;align-items:center;gap:8px;padding:3px 2px;font-size:13px;font-weight:600;
    border-radius:8px;}
  .lb-row .rank{width:16px;text-align:center;color:var(--ink-dim);font-size:12px;}
  .lb-row .name{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .lb-row .val{font-family:'JetBrains Mono',monospace;color:var(--ink-dim);}
  .lb-row.me{background:#ffd23f22;}
  .lb-row.me .name,.lb-row.me .val{color:var(--gold);}
  .lb-row.top1 .rank{color:#ffd23f;}
  .lb-row.top2 .rank{color:#c9ccd8;}
  .lb-row.top3 .rank{color:#cd8b52;}

  .powerbar{position:absolute;bottom:22px;left:0;right:0;display:flex;justify-content:center;gap:14px;}
  .pw{width:54px;height:54px;border-radius:16px;border:1px solid var(--line);
    background:linear-gradient(180deg,#1c1f2a,#12141c);display:flex;align-items:center;justify-content:center;
    font-size:24px;position:relative;box-shadow:0 6px 14px #0007;}
  .pw.active{outline:2px solid var(--gold);}
  .pw .cd{position:absolute;bottom:-8px;left:50%;transform:translateX(-50%);
    background:var(--gold);color:#181818;font-family:'JetBrains Mono',monospace;font-size:10px;font-weight:700;
    padding:1px 6px;border-radius:8px;display:none;}
  .pw.active .cd{display:block;}

  .center-msg{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);text-align:center;
    background:linear-gradient(180deg,#1a1c26f2,#101219f2);border:1px solid var(--line);border-radius:20px;
    padding:28px 34px;min-width:260px;box-shadow:0 20px 50px #000a;}
  .center-msg h1{margin:0 0 6px;font-size:26px;font-weight:800;}
  .center-msg h1 span{color:var(--gold);}
  .center-msg p{margin:0 0 18px;color:var(--ink-dim);font-size:14px;line-height:1.5;}
  .btn{border:none;border-radius:999px;padding:12px 26px;font-family:'Baloo 2',sans-serif;
    font-weight:800;font-size:16px;cursor:pointer;background:linear-gradient(180deg,#ffe27a,var(--gold));
    color:#1a1200;box-shadow:0 6px 0 #b58a12, 0 10px 18px #0007;}
  .btn:active{transform:translateY(4px);box-shadow:0 2px 0 #b58a12;}
  .hidden{display:none !important;}

  .hint{position:absolute;bottom:100px;left:0;right:0;text-align:center;color:var(--ink-dim);
    font-size:12px;letter-spacing:.02em;pointer-events:none;}

  .toast{position:absolute;top:120px;left:50%;transform:translateX(-50%);
    font-weight:800;font-size:15px;padding:6px 16px;border-radius:999px;opacity:0;
    background:#12141ce6;border:1px solid var(--line);transition:opacity .25s, transform .25s;}
  .toast.show{opacity:1;transform:translateX(-50%) translateY(6px);}
</style>
</head>
<body>
<div id="wrap">
  <canvas id="game"></canvas>
  <div class="hud">
    <div class="topbar">
      <div style="display:flex;flex-direction:column;gap:8px;">
        <div class="stat score"><div class="dot">◆</div><span id="scoreVal">0</span></div>
        <div class="stat timer"><span id="timerVal">03:00</span></div>
      </div>
      <div class="leaderboard">
        <div class="lb-title">Κατάταξη δωματίου</div>
        <div id="lbRows"></div>
      </div>
    </div>

    <div class="hint" id="hint">Σύρε ή μετακίνησε το ποντίκι για κατεύθυνση · κράτα πατημένο για ταχύτητα</div>

    <div class="powerbar">
      <div class="pw" id="pwBoost" title="Ταχύτητα">⚡<span class="cd" id="cdBoost"></span></div>
      <div class="pw" id="pwMagnet" title="Μαγνήτης">🧲<span class="cd" id="cdMagnet"></span></div>
      <div class="pw" id="pwShield" title="Ασπίδα">🛡️<span class="cd" id="cdShield"></span></div>
    </div>

    <div class="toast" id="toast"></div>

    <div class="center-msg" id="startMsg">
      <h1>Snake <span>Drop</span> 2048</h1>
      <p>Μάζεψε κύβους, συγχώνευσε ίδιους αριθμούς, κατάστρεψε αντιπάλους με μεγαλύτερο κεφάλι.
      Επιβίωσε 3 λεπτά και σκαρφάλωσε στην κορυφή της κατάταξης.</p>
      <button class="btn" id="startBtn">Παίξε</button>
    </div>

    <div class="center-msg hidden" id="endMsg">
      <h1 id="endTitle">Game Over</h1>
      <p id="endBody">Το σκορ σου: 0</p>
      <button class="btn" id="restartBtn">Ξανά</button>
    </div>
  </div>
</div>

<script>
(function(){
"use strict";

// ---------- setup ----------
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
let W, H, DPR;
function resize(){
  DPR = Math.min(window.devicePixelRatio || 1, 2);
  W = window.innerWidth; H = window.innerHeight;
  canvas.width = W*DPR; canvas.height = H*DPR;
  canvas.style.width = W+'px'; canvas.style.height = H+'px';
  ctx.setTransform(DPR,0,0,DPR,0,0);
}
window.addEventListener('resize', resize);
resize();

const ARENA = 2600;          // arena is a square [0..ARENA]
const SPACING = 22;          // distance between snake segments
const BASE_R = 15;           // base segment radius
const NAMES = ["Twentyfourhourpharma","averagestudent","rejectedbachelorcontes","Chris_P_Bacon",
                "thegodfatherpart4","B.Juice","TheAfterLife","kojima_fan92","noodle.exe","xXHunterXx"];
const VALUES = [2,4,8,16,32,64,128,256,512,1024,2048];

function colorFor(v){
  const idx = Math.log2(v) - 1; // 2->0
  const hues = [48, 358, 172, 265, 28, 152, 322, 205, 330, 46, 0];
  const h = hues[Math.max(0, Math.min(hues.length-1, Math.round(idx)))];
  if(v >= 2048) return {fill:'#fff7d6', stroke:'#ffd23f', text:'#3a2a00', glow:true};
  const light = 56 - Math.min(idx,8)*1.6;
  return {fill:`hsl(${h} 78% ${light}%)`, stroke:`hsl(${h} 70% ${Math.max(light-22,14)}%)`, text:'#12131a', glow:false};
}

function rnd(a,b){ return a + Math.random()*(b-a); }
function dist2(ax,ay,bx,by){ const dx=ax-bx, dy=ay-by; return dx*dx+dy*dy; }
function clamp(v,a,b){ return Math.max(a,Math.min(b,v)); }

// ---------- entities ----------
class Snake{
  constructor(x,y,isPlayer,name){
    this.isPlayer = isPlayer;
    this.name = name;
    this.angle = rnd(0, Math.PI*2);
    this.targetAngle = this.angle;
    this.speed = 2.3;
    this.baseSpeed = 2.3;
    this.boostSpeed = 4.2;
    this.boosting = false;
    this.path = [{x,y}];
    this.segments = [{value: VALUES[Math.floor(rnd(0,2))], t:0}]; // t = distance along path from head
    this.alive = true;
    this.shieldT = 0;
    this.magnetT = 0;
    this.reactT = 0; // small cooldown to avoid double-destroy per frame
  }
  get head(){ return this.path[this.path.length-1]; }
  get headValue(){ return this.segments[0].value; }
  get score(){ return this.segments.reduce((s,seg)=>s+seg.value,0); }

  steerToward(px,py){
    const h = this.head;
    this.targetAngle = Math.atan2(py-h.y, px-h.x);
  }

  update(dt, world){
    // turn smoothly toward target angle
    let da = this.targetAngle - this.angle;
    while(da > Math.PI) da -= Math.PI*2;
    while(da < -Math.PI) da += Math.PI*2;
    const turnRate = 0.09;
    this.angle += clamp(da, -turnRate, turnRate);

    const spd = (this.boosting && this.segments.length>1) ? this.boostSpeed : this.baseSpeed;
    const h = this.head;
    let nx = h.x + Math.cos(this.angle)*spd;
    let ny = h.y + Math.sin(this.angle)*spd;
    nx = clamp(nx, 20, ARENA-20);
    ny = clamp(ny, 20, ARENA-20);

    this.path.push({x:nx,y:ny});
    // trim path to only what's needed
    const maxLen = this.segments.length * SPACING + 60;
    while(this.path.length > 2 && this.pathLength() > maxLen){
      this.path.shift();
    }

    // boost drains a segment slowly if it's a real boost & long enough
    if(this.boosting && this.segments.length > 1){
      this._boostAccum = (this._boostAccum||0) + spd;
      if(this._boostAccum > 140){
        this._boostAccum = 0;
        this.segments.pop();
      }
    }

    if(this.shieldT>0) this.shieldT -= dt;
    if(this.magnetT>0) this.magnetT -= dt;
    if(this.reactT>0) this.reactT -= dt;
  }

  pathLength(){
    let d=0;
    for(let i=1;i<this.path.length;i++){
      d += Math.hypot(this.path[i].x-this.path[i-1].x, this.path[i].y-this.path[i-1].y);
    }
    return d;
  }

  // returns {x,y} for a point `dist` behind the head along the path
  pointAtDistance(distBack){
    const p = this.path;
    let remaining = distBack;
    for(let i=p.length-1;i>0;i--){
      const a = p[i], b = p[i-1];
      const segLen = Math.hypot(a.x-b.x, a.y-b.y);
      if(segLen >= remaining){
        const t = segLen===0?0:remaining/segLen;
        return {x: a.x + (b.x-a.x)*t, y: a.y + (b.y-a.y)*t};
      }
      remaining -= segLen;
    }
    return {x:p[0].x, y:p[0].y};
  }

  segmentPositions(){
    const out = [];
    let d = 0;
    for(let i=0;i<this.segments.length;i++){
      out.push(this.pointAtDistance(d));
      d += SPACING;
    }
    return out;
  }

  grow(value){
    this.segments.push({value});
  }

  mergeAdjacent(){
    let merged = true;
    let anyMerge = false;
    while(merged){
      merged = false;
      for(let i=0;i<this.segments.length-1;i++){
        if(this.segments[i].value === this.segments[i+1].value){
          this.segments[i].value *= 2;
          this.segments.splice(i+1,1);
          merged = true; anyMerge = true;
          break;
        }
      }
    }
    return anyMerge;
  }
}

// ---------- world ----------
let cubes = [];      // {x,y,value}
let powerups = [];   // {x,y,type}
let particles = [];  // {x,y,vx,vy,life,color}
let player, bots = [];
let running = false;
let timeLeft = 180;
let elapsedSinceLB = 0;
let camera = {x:0,y:0};
let pointer = {x:0,y:0,active:false};

function spawnCube(){
  const rarity = Math.random();
  let v = 2;
  if(rarity > 0.94) v = 8; else if(rarity > 0.75) v = 4;
  cubes.push({x:rnd(30,ARENA-30), y:rnd(30,ARENA-30), value:v, wob:Math.random()*Math.PI*2});
}
function spawnPowerup(){
  const types = ['boost','magnet','shield'];
  powerups.push({x:rnd(40,ARENA-40), y:rnd(40,ARENA-40), type: types[Math.floor(rnd(0,3))]});
}

function makeBot(){
  const s = new Snake(rnd(200,ARENA-200), rnd(200,ARENA-200), false,
    NAMES[Math.floor(rnd(0,NAMES.length))] + (Math.random()>0.8? (Math.floor(rnd(1,9))):''));
  for(let i=0;i<Math.floor(rnd(1,4));i++) s.grow(VALUES[Math.floor(rnd(0,3))]);
  s.retargetT = 0;
  return s;
}

function initWorld(){
  cubes = []; powerups = []; particles = []; bots = [];
  for(let i=0;i<160;i++) spawnCube();
  for(let i=0;i<5;i++) spawnPowerup();
  player = new Snake(ARENA/2, ARENA/2, true, "You");
  for(let i=0;i<7;i++) bots.push(makeBot());
  timeLeft = 180;
}

// ---------- input ----------
function updatePointerFromClient(clientX, clientY){
  pointer.x = clientX; pointer.y = clientY; pointer.active = true;
}
canvas.addEventListener('pointerdown', e=>{ updatePointerFromClient(e.clientX,e.clientY); player.boosting = true; });
canvas.addEventListener('pointermove', e=>{ if(pointer.active || e.buttons) updatePointerFromClient(e.clientX,e.clientY); else {pointer.x=e.clientX; pointer.y=e.clientY;} });
window.addEventListener('pointerup', ()=>{ pointer.active=false; player.boosting=false; });

const keys = {};
window.addEventListener('keydown', e=>{
  keys[e.key]=true;
  if(e.key===' ') player.boosting = true;
});
window.addEventListener('keyup', e=>{
  keys[e.key]=false;
  if(e.key===' ') player.boosting = false;
});

function handleKeyboardSteer(){
  let dx=0, dy=0;
  if(keys['ArrowUp']||keys['w']) dy -= 1;
  if(keys['ArrowDown']||keys['s']) dy += 1;
  if(keys['ArrowLeft']||keys['a']) dx -= 1;
  if(keys['ArrowRight']||keys['d']) dx += 1;
  if(dx!==0 || dy!==0){
    player.targetAngle = Math.atan2(dy,dx);
    return true;
  }
  return false;
}

// ---------- game logic ----------
function toast(msg, color){
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.style.color = color || 'var(--ink)';
  t.classList.add('show');
  clearTimeout(toast._h);
  toast._h = setTimeout(()=>t.classList.remove('show'), 900);
}

function burst(x,y,color,n){
  n = n||10;
  for(let i=0;i<n;i++){
    const a = Math.random()*Math.PI*2, sp = rnd(0.6,2.6);
    particles.push({x,y,vx:Math.cos(a)*sp, vy:Math.sin(a)*sp, life:1, color});
  }
}

function eatCubes(snake){
  const headPos = snake.segmentPositions()[0];
  const magnetActive = snake.magnetT > 0;
  const pickR = magnetActive ? 130 : 26;
  for(let i=cubes.length-1;i>=0;i--){
    const c = cubes[i];
    const d2 = dist2(headPos.x, headPos.y, c.x, c.y);
    if(d2 < pickR*pickR){
      if(magnetActive && d2 > (26*26)){
        // pull toward head instead of instant pickup
        c.x += (headPos.x-c.x)*0.18;
        c.y += (headPos.y-c.y)*0.18;
        continue;
      }
      cubes.splice(i,1);
      snake.grow(c.value);
      const merged = snake.mergeAdjacent();
      if(snake.isPlayer){
        burst(c.x,c.y, colorFor(c.value).stroke, 8);
        if(merged) toast('Συγχώνευση! ×2', '#3ddc84');
      }
      spawnCube();
    }
  }
}

function eatPowerups(snake){
  if(!snake.isPlayer) return;
  const headPos = snake.segmentPositions()[0];
  for(let i=powerups.length-1;i>=0;i--){
    const p = powerups[i];
    if(dist2(headPos.x,headPos.y,p.x,p.y) < 30*30){
      powerups.splice(i,1);
      if(p.type==='boost'){ snake.baseSpeed = 3.3; setTimeout(()=>snake.baseSpeed=2.3, 6000); flashPw('pwBoost',6000); toast('Ταχύτητα!','#ffd23f'); }
      if(p.type==='magnet'){ snake.magnetT = 8; flashPw('pwMagnet',8000); toast('Μαγνήτης!','#4ecdc4'); }
      if(p.type==='shield'){ snake.shieldT = 6; flashPw('pwShield',6000); toast('Ασπίδα!','#7b61ff'); }
      burst(p.x,p.y,'#fff',12);
      spawnPowerup();
    }
  }
}

function flashPw(id, ms){
  const el = document.getElementById(id);
  const cd = el.querySelector('.cd');
  el.classList.add('active');
  const end = Date.now()+ms;
  clearInterval(el._iv);
  el._iv = setInterval(()=>{
    const left = Math.max(0, end-Date.now());
    cd.textContent = (left/1000).toFixed(1)+'s';
    if(left<=0){ clearInterval(el._iv); el.classList.remove('active'); }
  }, 100);
}

function destroySegment(snake, idx, x, y){
  const val = snake.segments[idx].value;
  snake.segments.splice(idx,1);
  cubes.push({x, y, value: val>=8? val/2 : 2}); // loot drop (roughly halved)
  burst(x,y, colorFor(val).stroke, 14);
  if(snake.segments.length===0){
    killSnake(snake);
  }
}

function killSnake(snake){
  snake.alive = false;
  // drop remaining as cubes
  const positions = snake.segmentPositions();
  positions.forEach((p,i)=>{
    if(snake.segments[i]) cubes.push({x:p.x+rnd(-20,20), y:p.y+rnd(-20,20), value: snake.segments[i].value});
  });
  if(snake.isPlayer){
    endGame(false);
  } else {
    const idx = bots.indexOf(snake);
    if(idx>=0) bots.splice(idx,1);
    if(bots.length < 6) bots.push(makeBot());
  }
}

function resolveCombat(){
  const all = [player, ...bots].filter(s=>s.alive);
  for(const a of all){
    if(a.reactT>0) continue;
    const aPos = a.segmentPositions();
    const aHead = aPos[0];
    for(const b of all){
      if(a===b || b.reactT>0) continue;
      const bPos = b.segmentPositions();
      // check a's head vs each of b's segments (skip b's own head-to-head handled once)
      for(let i=0;i<bPos.length;i++){
        const segPos = bPos[i];
        const hitR = BASE_R + Math.min(Math.log2(b.segments[i].value)*1.4, 16);
        if(dist2(aHead.x,aHead.y,segPos.x,segPos.y) < (hitR+BASE_R*0.6)*(hitR+BASE_R*0.6)){
          if(b.shieldT>0){ continue; }
          const aVal = a.headValue, bVal = b.segments[i].value;
          if(aVal > bVal){
            destroySegment(b, i, segPos.x, segPos.y);
            if(i===0 || b.segments.length===0){ /* head or wipeout handled in destroySegment */ }
            a.reactT = 0.15; b.reactT = 0.15;
            if(a.isPlayer){ toast('+'+bVal+' Κατάστρεψες!', '#ff4d6d'); }
          } else if(aVal < bVal){
            if(a.shieldT>0){ continue; }
            if(i===0){
              killSnake(a);
            } else {
              destroySegment(a, 0, aHead.x, aHead.y);
            }
            a.reactT = 0.15; b.reactT = 0.15;
          }
          break;
        }
      }
      if(!a.alive) break;
    }
    if(!a.alive) continue;
  }
}

function botAI(bot, dt){
  bot.retargetT -= dt;
  if(bot.retargetT<=0){
    bot.retargetT = rnd(0.6,1.4);
    const hp = bot.head;
    // find nearest cube within radius, else wander
    let best=null, bestD=520*520;
    for(const c of cubes){
      const d2 = dist2(hp.x,hp.y,c.x,c.y);
      if(d2<bestD){ bestD=d2; best=c; }
    }
    if(best && Math.random()>0.15){
      bot.targetAngle = Math.atan2(best.y-hp.y, best.x-hp.x);
    } else {
      bot.targetAngle = bot.angle + rnd(-1.4,1.4);
    }
    bot.boosting = Math.random() > 0.85;
  }
  // avoid walls
  const margin = 160;
  const hp = bot.head;
  if(hp.x<margin || hp.x>ARENA-margin || hp.y<margin || hp.y>ARENA-margin){
    bot.targetAngle = Math.atan2(ARENA/2-hp.y, ARENA/2-hp.x);
  }
}

// ---------- leaderboard ----------
function renderLeaderboard(){
  const all = [player, ...bots].filter(s=>s.alive);
  all.sort((a,b)=>b.score-a.score);
  const top = all.slice(0,8);
  const rows = document.getElementById('lbRows');
  rows.innerHTML = '';
  top.forEach((s,i)=>{
    const div = document.createElement('div');
    div.className = 'lb-row' + (s.isPlayer?' me':'') + (i===0?' top1':i===1?' top2':i===2?' top3':'');
    div.innerHTML = `<span class="rank">${i+1}</span><span class="name">${s.isPlayer?'You':s.name}</span><span class="val">${s.score}</span>`;
    rows.appendChild(div);
  });
}

// ---------- render ----------
function drawGrid(){
  ctx.save();
  ctx.strokeStyle = '#ffffff08';
  ctx.lineWidth = 1;
  const step = 80;
  const startX = -((camera.x) % step);
  const startY = -((camera.y) % step);
  for(let x=startX; x<W; x+=step){ ctx.beginPath(); ctx.moveTo(x,0); ctx.lineTo(x,H); ctx.stroke(); }
  for(let y=startY; y<H; y+=step){ ctx.beginPath(); ctx.moveTo(0,y); ctx.lineTo(W,y); ctx.stroke(); }
  ctx.restore();
}

function drawWalls(){
  ctx.save();
  ctx.strokeStyle = '#ff4d6d55';
  ctx.lineWidth = 6;
  ctx.strokeRect(-camera.x, -camera.y, ARENA, ARENA);
  ctx.restore();
}

function drawCube(x,y,value,scale){
  scale = scale||1;
  const c = colorFor(value);
  const sx = x-camera.x, sy = y-camera.y;
  if(sx< -60||sx>W+60||sy<-60||sy>H+60) return;
  const r = 15*scale;
  ctx.save();
  ctx.translate(sx,sy);
  if(c.glow){
    ctx.shadowColor = '#ffd23f';
    ctx.shadowBlur = 18;
  }
  ctx.fillStyle = c.fill;
  ctx.strokeStyle = c.stroke;
  ctx.lineWidth = 2.5;
  roundRect(-r,-r,r*2,r*2,6);
  ctx.fill(); ctx.stroke();
  ctx.fillStyle = c.text;
  ctx.font = `800 ${13*scale}px 'Baloo 2', sans-serif`;
  ctx.textAlign = 'center'; ctx.textBaseline='middle';
  ctx.fillText(value, 0, 1);
  ctx.restore();
}

function roundRect(x,y,w,h,r){
  ctx.beginPath();
  ctx.moveTo(x+r,y);
  ctx.arcTo(x+w,y,x+w,y+h,r);
  ctx.arcTo(x+w,y+h,x,y+h,r);
  ctx.arcTo(x,y+h,x,y,r);
  ctx.arcTo(x,y,x+w,y,r);
  ctx.closePath();
}

function drawSnake(snake){
  const positions = snake.segmentPositions();
  // body first (back to front)
  for(let i=positions.length-1; i>=1; i--){
    const p = positions[i];
    drawCube(p.x, p.y, snake.segments[i].value, 1);
  }
  // shield aura
  if(snake.shieldT>0){
    const hp = positions[0];
    ctx.save();
    ctx.strokeStyle = '#7b61ffcc';
    ctx.lineWidth = 3;
    ctx.beginPath();
    ctx.arc(hp.x-camera.x, hp.y-camera.y, 26, 0, Math.PI*2);
    ctx.stroke();
    ctx.restore();
  }
  // head
  const hp = positions[0];
  drawCube(hp.x, hp.y, snake.segments[0].value, 1.15);
  // name tag
  if(!snake.isPlayer){
    ctx.save();
    ctx.font = "700 11px 'Baloo 2', sans-serif";
    ctx.fillStyle = '#ffffffaa';
    ctx.textAlign='center';
    ctx.fillText(snake.name, hp.x-camera.x, hp.y-camera.y-28);
    ctx.restore();
  }
}

function drawPowerup(p){
  const sx=p.x-camera.x, sy=p.y-camera.y;
  if(sx<-40||sx>W+40||sy<-40||sy>H+40) return;
  const icon = p.type==='boost'?'⚡':p.type==='magnet'?'🧲':'🛡️';
  ctx.save();
  ctx.translate(sx,sy);
  ctx.font='22px sans-serif';
  ctx.textAlign='center'; ctx.textBaseline='middle';
  ctx.fillText(icon,0,2);
  ctx.restore();
}

function drawParticles(dt){
  for(let i=particles.length-1;i>=0;i--){
    const pt = particles[i];
    pt.x += pt.vx; pt.y += pt.vy; pt.life -= dt*1.6;
    if(pt.life<=0){ particles.splice(i,1); continue; }
    ctx.save();
    ctx.globalAlpha = clamp(pt.life,0,1);
    ctx.fillStyle = pt.color;
    ctx.beginPath();
    ctx.arc(pt.x-camera.x, pt.y-camera.y, 3, 0, Math.PI*2);
    ctx.fill();
    ctx.restore();
  }
}

// ---------- loop ----------
let lastT = null;
function frame(ts){
  if(!lastT) lastT = ts;
  const dt = Math.min((ts-lastT)/1000, 0.05);
  lastT = ts;

  if(running){
    if(!handleKeyboardSteer() && pointer.active){
      const wx = pointer.x + camera.x, wy = pointer.y + camera.y;
      player.steerToward(wx,wy);
    }
    player.update(dt);
    bots.forEach(b=>{ botAI(b,dt); b.update(dt); });

    eatCubes(player); eatPowerups(player);
    bots.forEach(b=>eatCubes(b));

    resolveCombat();

    camera.x = player.head.x - W/2;
    camera.y = player.head.y - H/2;

    timeLeft -= dt;
    elapsedSinceLB += dt;
    if(elapsedSinceLB > 1){ elapsedSinceLB = 0; renderLeaderboard(); }
    document.getElementById('scoreVal').textContent = player.score;
    const m = Math.max(0,Math.floor(timeLeft/60)), s = Math.max(0,Math.floor(timeLeft%60));
    document.getElementById('timerVal').textContent = `${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`;

    if(timeLeft<=0){ endGame(true); }
  }

  // ---- draw ----
  ctx.clearRect(0,0,W,H);
  ctx.fillStyle = '#0a0b10';
  ctx.fillRect(0,0,W,H);
  drawGrid();
  drawWalls();
  cubes.forEach(c=>drawCube(c.x,c.y,c.value,0.85));
  powerups.forEach(drawPowerup);
  bots.forEach(b=>{ if(b.alive) drawSnake(b); });
  if(player.alive) drawSnake(player);
  drawParticles(dt);

  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);

// ---------- start / end ----------
function startGame(){
  initWorld();
  renderLeaderboard();
  document.getElementById('startMsg').classList.add('hidden');
  document.getElementById('endMsg').classList.add('hidden');
  running = true;
  setTimeout(()=>{ document.getElementById('hint').style.opacity='0'; }, 4000);
}
function endGame(survived){
  running = false;
  const title = document.getElementById('endTitle');
  const body = document.getElementById('endBody');
  title.innerHTML = survived ? 'Επιβίωσες! 🏆' : 'Game Over';
  const all = [player, ...bots].filter(s=>s!==player);
  const rank = 1 + all.filter(s=>s.score>player.score).length;
  body.textContent = `Σκορ: ${player.score} · Θέση #${rank} στο δωμάτιο`;
  document.getElementById('endMsg').classList.remove('hidden');
}
document.getElementById('startBtn').addEventListener('click', startGame);
document.getElementById('restartBtn').addEventListener('click', startGame);

// initial idle world for background behind start screen
initWorld();
renderLeaderboard();

})();
</script>
