<!DOCTYPE html>
<html lang="el">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, user-scalable=no">
<title>DROP AZIRAM</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg-0:#1a1c29;
    --line:#23263066;
    --ink:#eef0f6;
    --ink-dim:#8b8fa3;
    --gold:#ffd23f;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  
  html,body{
    margin:0; padding:0; overflow:hidden; 
    background:var(--bg-0); height:100%; width:100%;
    font-family:'Baloo 2',system-ui,sans-serif; color:var(--ink); 
    touch-action:none; overscroll-behavior:none;
  }
  
  #wrap{position:fixed;inset:0;}
  canvas{display:block;width:100%;height:100%;}

  .hud{position:fixed;inset:0;pointer-events:none;z-index:5;}
  .hud > *{pointer-events:auto;}

  .topbar{position:absolute;top:0;left:0;right:0;display:flex;justify-content:space-between;
    align-items:flex-start;padding:14px 14px 0;}
  
  .stat{display:flex;align-items:center;gap:6px;background:linear-gradient(180deg,#1c1f2a,#14161f);
    border:1px solid var(--line);border-radius:999px;padding:6px 14px 6px 8px;font-weight:700;
    font-size:15px;box-shadow:0 4px 10px #0006;}
  .stat .dot{width:20px;height:20px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:12px;}
  .stat.score .dot{background:radial-gradient(circle at 30% 30%,#ffe27a,var(--gold));}
  .stat.timer{font-family:'JetBrains Mono',monospace;font-size:16px;letter-spacing:1px;}
  
  .leaderboard{
    background:linear-gradient(180deg,#1a1c26f2,#101219f2);border:1px solid var(--line);
    border-radius:14px;padding:8px 10px;min-width:190px;
    box-shadow:0 8px 22px #0007;backdrop-filter:blur(4px);
    max-height: 120px; 
    overflow-y: auto; 
    pointer-events: auto;
  }
  .leaderboard::-webkit-scrollbar { width: 4px; }
  .leaderboard::-webkit-scrollbar-thumb { background: #ffffff33; border-radius: 4px; }
  
  .leaderboard .lb-title{font-size:11px;letter-spacing:.14em;color:var(--ink-dim);text-transform:uppercase;
    margin:0 2px 6px;font-weight:700;}
  .lb-row{display:flex;align-items:center;gap:8px;padding:3px 2px;font-size:13px;font-weight:600;
    border-radius:8px;}
  .lb-row .rank{width:16px;text-align:center;color:var(--ink-dim);font-size:12px;}
  .lb-row .name{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .lb-row .val{font-family:'JetBrains Mono',monospace;color:var(--ink-dim);}
  .lb-row.me{background:#ffd23f22;}
  .lb-row.me .name,.lb-row.me .val{color:var(--gold);}
  
  .powerbar{position:absolute; right:16px; top:40%; transform:translateY(-50%); display:flex; flex-direction:column; gap:14px;}
  .pw{width:54px;height:54px;border-radius:16px;border:1px solid var(--line);
    background:linear-gradient(180deg,#1c1f2acc,#12141ccc);display:flex;align-items:center;justify-content:center;
    font-size:24px;position:relative;box-shadow:0 6px 14px #0007; backdrop-filter:blur(4px);}
  .pw.active{outline:2px solid var(--gold);}
  .pw .cd{position:absolute;bottom:-8px;left:50%;transform:translateX(-50%);
    background:var(--gold);color:#181818;font-family:'JetBrains Mono',monospace;font-size:10px;font-weight:700;
    padding:1px 6px;border-radius:8px;display:none;}
  .pw.active .cd{display:block;}

  .center-msg{position:absolute;top:30%;left:50%;transform:translate(-50%,-50%);text-align:center;
    background:linear-gradient(180deg,#1a1c26f2,#101219f2);border:1px solid var(--line);border-radius:20px;
    padding:28px 34px;min-width:280px;box-shadow:0 20px 50px #000a;}
  .center-msg h1{margin:0 0 6px;font-size:26px;font-weight:800;}
  .center-msg h1 span{color:var(--gold);}
  .center-msg p{margin:0;color:var(--ink-dim);font-size:14px;line-height:1.5;}
  
  .btn{border:none;border-radius:999px;padding:12px 26px;font-family:'Baloo 2',sans-serif;
    font-weight:800;font-size:16px;cursor:pointer;background:linear-gradient(180deg,#ffe27a,var(--gold));
    color:#1a1200;box-shadow:0 6px 0 #b58a12, 0 10px 18px #0007;margin-top:18px;}
  .hidden{display:none !important;}

  .toast{position:absolute;top:120px;left:50%;transform:translateX(-50%);
    font-weight:800;font-size:15px;padding:6px 16px;border-radius:999px;opacity:0;
    background:#12141ce6;border:1px solid var(--line);transition:opacity .25s, transform .25s;}
  .toast.show{opacity:1;transform:translateX(-50%) translateY(6px);}

  .control-zone {
    position: absolute;
    bottom: 0;
    left: 0;
    width: 100%;
    height: 35%;
    display: flex;
    justify-content: center;
    align-items: center;
    touch-action: none;
    z-index: 10;
    pointer-events: auto; 
  }
  .inf-bg {
    width: 160px;
    height: 70px;
    opacity: 0.8;
    filter: drop-shadow(0 4px 8px rgba(0,0,0,0.6));
    pointer-events: none;
  }
  .inf-knob {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    width: 60px;
    height: 60px;
    pointer-events: none;
    transition: transform 0.05s linear;
  }
  .hand-svg {
    width: 100%;
    height: 100%;
    filter: drop-shadow(0 6px 6px rgba(0,0,0,0.5));
  }
  .animating {
    animation: swipeAnim 2s infinite ease-in-out;
  }
  @keyframes swipeAnim {
    0%, 100% { transform: translate(calc(-50% - 35px), -50%); }
    50% { transform: translate(calc(-50% + 35px), -50%); }
  }
</style>
</head>
<body>
<div id="wrap">
  <canvas id="game"></canvas>
  <div class="hud">
    <div class="topbar">
      <div style="display:flex;flex-direction:column;gap:8px;">
        <div class="stat score"><div class="dot">◆</div><span id="scoreVal">0</span></div>
        <div class="stat timer"><span id="timerVal">03:00</span></div>
      </div>
      <div class="leaderboard" id="leaderboardPanel">
        <div class="lb-title">Κατάταξη δωματίου</div>
        <div id="lbRows"></div>
      </div>
    </div>

    <div class="powerbar">
      <div class="pw" id="pwBoost" title="Ταχύτητα">⚡<span class="cd" id="cdBoost"></span></div>
      <div class="pw" id="pwMagnet" title="Μαγνήτης">🧲<span class="cd" id="cdMagnet"></span></div>
      <div class="pw" id="pwShield" title="Ασπίδα">🛡️<span class="cd" id="cdShield"></span></div>
    </div>

    <div class="toast" id="toast"></div>

    <div class="center-msg" id="startMsg">
      <h1>DROP <span>AZIRAM</span></h1>
      <p>Οι αντίπαλοι ήδη κινούνται! <br>Χρησιμοποίησε το τηλεχειριστήριο κάτω για να ξεκινήσεις.</p>
    </div>

    <div class="center-msg hidden" id="endMsg">
      <h1 id="endTitle">Game Over</h1>
      <p id="endBody">Το σκορ σου: 0</p>
      <button class="btn" id="restartBtn">Ξανά</button>
    </div>

    <div class="control-zone" id="controlZone">
      <svg class="inf-bg" viewBox="0 0 120 50">
        <path d="M 30 25 C 10 5, 10 45, 30 25 C 50 5, 70 45, 90 25 C 110 5, 110 45, 90 25 C 70 5, 50 45, 30 25" 
              fill="none" stroke="#7a8c79" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
        <path d="M 30 25 C 10 5, 10 45, 30 25 C 50 5, 70 45, 90 25 C 110 5, 110 45, 90 25 C 70 5, 50 45, 30 25" 
              fill="none" stroke="#e8ffe6" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
      <div class="inf-knob animating" id="joyKnob">
        <svg class="hand-svg" viewBox="0 0 24 24" fill="#52c574" stroke="#dff881" stroke-width="1.2">
          <path d="M10.5 12.5V5a2 2 0 0 1 4 0v6l2-1.5a1.5 1.5 0 0 1 2.2.6l1.8 3.5a6 6 0 0 1-1 7.4c-1.5 1.5-3.5 2.5-6 2.5c-3.5 0-6.5-2.5-7-6l-1-4a2 2 0 0 1 3-2.5z"/>
        </svg>
      </div>
    </div>

  </div>
</div>

<script>
(function(){
"use strict";

document.addEventListener('touchmove', function(e) {
  if (e.target.closest('#leaderboardPanel')) return; 
  if (e.target.tagName !== 'BUTTON') { e.preventDefault(); }
}, { passive: false });

const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
let W, H, DPR;
function resize(){
  DPR = Math.min(window.devicePixelRatio || 1, 2);
  W = window.innerWidth; H = window.innerHeight;
  canvas.width = W*DPR; canvas.height = H*DPR;
  canvas.style.width = W+'px'; canvas.style.height = H+'px';
  ctx.setTransform(DPR,0,0,DPR,0,0);
}
window.addEventListener('resize', resize);
resize();

const ARENA = 2600;          
const SPACING = 24;          
const BASE_R = 14;           
const NAMES = ["Twentyfourhourpharma","averagestudent","rejectedbachelorcontes","Chris_P_Bacon",
                "thegodfatherpart4","B.Juice","TheAfterLife","kojima_fan92","noodle.exe","xXHunterXx"];
const VALUES = [2,4,8,16,32,64,128,256,512,1024,2048,5096];

const CUBE_PALETTE = [
  { face:'#e66e6e', side:'#c24a4a' }, // 2 
  { face:'#5994f2', side:'#336dc9' }, // 4 
  { face:'#f0d05d', side:'#c9a72e' }, // 8 
  { face:'#e89851', side:'#c7732a' }, // 16 
  { face:'#d97ce8', side:'#ad4ebf' }, // 32 
  { face:'#62c7a3', side:'#3a9c79' }, // 64 
  { face:'#a3c762', side:'#7a9e38' }, // 128 
  { face:'#937be6', side:'#6a4cc7' }, // 256 
  { face:'#e67b93', side:'#c7526c' }, // 512 
  { face:'#6bd6cf', side:'#41aba5' }, // 1024 
  { face:'#e6e6e6', side:'#b3b3b3' }, // 2048 
  { face:'#ffda6b', side:'#d9b136' }, // 5096 
];

function colorFor(v){
  const idx = Math.log2(v) - 1; 
  if(v >= 5096) return CUBE_PALETTE[11];
  return CUBE_PALETTE[Math.max(0, idx) % CUBE_PALETTE.length];
}

function rnd(a,b){ return a + Math.random()*(b-a); }
function dist2(ax,ay,bx,by){ const dx=ax-bx, dy=ay-by; return dx*dx+dy*dy; }
function clamp(v,a,b){ return Math.max(a,Math.min(b,v)); }

class Snake{
  constructor(x,y,isPlayer,name){
    this.isPlayer = isPlayer;
    this.name = name;
    this.angle = rnd(0, Math.PI*2);
    this.targetAngle = this.angle;
    this.speed = 1.3;
    this.baseSpeed = 1.3;
    this.boostSpeed = 2.4;
    this.boosting = false;
    this.path = [{x,y}];
    this.segments = [{value: VALUES[Math.floor(rnd(0,2))], t:0}]; 
    this.alive = true;
    this.shieldT = 0;
    this.magnetT = 0;
    this.reactT = 0; 
  }
  get head(){ return this.path[this.path.length-1]; }
  get headValue(){ return this.segments[0].value; }
  get score(){ return this.segments.reduce((s,seg)=>s+seg.value,0); }

  steerToward(px,py){
    const h = this.head;
    this.targetAngle = Math.atan2(py-h.y, px-h.x);
  }

  update(dt, world){
    let da = this.targetAngle - this.angle;
    while(da > Math.PI) da -= Math.PI*2;
    while(da < -Math.PI) da += Math.PI*2;
    const turnRate = 0.07;
    this.angle += clamp(da, -turnRate, turnRate);

    const spd = (this.boosting && this.segments.length>1) ? this.boostSpeed : this.baseSpeed;
    const h = this.head;
    let nx = h.x + Math.cos(this.angle)*spd;
    let ny = h.y + Math.sin(this.angle)*spd;
    nx = clamp(nx, 20, ARENA-20);
    ny = clamp(ny, 20, ARENA-20);

    this.path.push({x:nx,y:ny});
    const maxLen = this.segments.length * SPACING + 60;
    while(this.path.length > 2 && this.pathLength() > maxLen){
      this.path.shift();
    }

    // Boost Penalty: Drop tails visibly on the floor
    if(this.boosting && this.segments.length > 1){
      this._boostAccum = (this._boostAccum||0) + spd;
      if(this._boostAccum > 140){ 
        this._boostAccum = 0;
        const dropped = this.segments.pop();
        const positions = this.segmentPositions();
        const tailPos = positions[positions.length - 1] || this.head;
        cubes.push({x: tailPos.x, y: tailPos.y, value: dropped.value});
      }
    }

    if(this.shieldT>0) this.shieldT -= dt;
    if(this.magnetT>0) this.magnetT -= dt;
    if(this.reactT>0) this.reactT -= dt;
  }

  pathLength(){
    let d=0;
    for(let i=1;i<this.path.length;i++){
      d += Math.hypot(this.path[i].x-this.path[i-1].x, this.path[i].y-this.path[i-1].y);
    }
    return d;
  }

  pointAtDistance(distBack){
    const p = this.path;
    let remaining = distBack;
    for(let i=p.length-1;i>0;i--){
      const a = p[i], b = p[i-1];
      const segLen = Math.hypot(a.x-b.x, a.y-b.y);
      if(segLen >= remaining){
        const t = segLen===0?0:remaining/segLen;
        return {x: a.x + (b.x-a.x)*t, y: a.y + (b.y-a.y)*t};
      }
      remaining -= segLen;
    }
    return {x:p[0].x, y:p[0].y};
  }

  segmentPositions(){
    const out = [];
    let d = 0;
    for(let i=0;i<this.segments.length;i++){
      out.push(this.pointAtDistance(d));
      d += SPACING;
    }
    return out;
  }

  grow(value){
    this.segments.push({value});
  }

  mergeAdjacent(){
    let merged = true;
    let count = 0;
    while(merged){
      merged = false;
      for(let i=0;i<this.segments.length-1;i++){
        if(this.segments[i].value === this.segments[i+1].value){
          let newVal = this.segments[i].value * 2;
          if (this.segments[i].value === 2048) newVal = 5096;
          
          this.segments[i].value = newVal;
          this.segments.splice(i+1,1);
          merged = true; 
          count++;
          break;
        }
      }
    }
    return count;
  }
}

let cubes = [];      
let powerups = []; 
let panels = [];  
let particles = [];
let floaters = [];  
let player, bots = [];
let running = false;
let gameStartedOnce = false;
let timeLeft = 180;
let elapsedSinceLB = 0;
let camera = {x:0,y:0};
let screenShake = 0; // Visual juiciness

function spawnCube(){
  const rarity = Math.random();
  let v = 2;
  if(rarity > 0.94) v = 8; else if(rarity > 0.75) v = 4;
  cubes.push({x:rnd(30,ARENA-30), y:rnd(30,ARENA-30), value:v});
}
function spawnPowerup(){
  const types = ['boost','magnet','shield'];
  powerups.push({x:rnd(40,ARENA-40), y:rnd(40,ARENA-40), type: types[Math.floor(rnd(0,3))]});
}
function spawnPanel(){
  panels.push({
    x: rnd(100, ARENA-100), y: rnd(100, ARENA-100),
    type: Math.random() > 0.5 ? 'x2' : '/2', cooldown: 0
  });
}
function spawnText(x, y, text, color){
  floaters.push({x, y, text, color, life: 1.2});
}

function makeBot(){
  const s = new Snake(rnd(200,ARENA-200), rnd(200,ARENA-200), false,
    NAMES[Math.floor(rnd(0,NAMES.length))] + (Math.random()>0.8? (Math.floor(rnd(1,9))):''));
  for(let i=0;i<Math.floor(rnd(1,4));i++) s.grow(VALUES[Math.floor(rnd(0,3))]);
  s.retargetT = 0;
  return s;
}

function initWorld(){
  cubes = []; powerups = []; panels = []; particles = []; floaters = []; bots = [];
  for(let i=0;i<160;i++) spawnCube();
  for(let i=0;i<5;i++) spawnPowerup();
  for(let i=0;i<4;i++) spawnPanel();
  player = new Snake(ARENA/2, ARENA/2, true, "You");
  for(let i=0;i<7;i++) bots.push(makeBot());
  timeLeft = 180;
}

// ---------- Logic Τηλεχειριστηρίου ----------
const joyZone = document.getElementById('controlZone');
const joyKnob = document.getElementById('joyKnob');
let joy = { active: false, pointerId: null };

function updateJoystick(e) {
  const rect = joyZone.getBoundingClientRect();
  const cx = rect.left + rect.width / 2;
  const cy = rect.top + rect.height / 2;
  
  let dx = e.clientX - cx;
  let dy = e.clientY - cy;
  
  const d = Math.hypot(dx, dy);
  const ang = Math.atan2(dy, dx);
  
  const maxR = Math.abs(Math.cos(ang)) * 30 + 35; 
  const r = Math.min(d, maxR);
  
  const kx = Math.cos(ang) * r;
  const ky = Math.sin(ang) * r;
  
  joyKnob.style.transform = `translate(calc(-50% + ${kx}px), calc(-50% + ${ky}px))`;
  
  if (d > 5) { player.targetAngle = ang; }
  player.boosting = (d > maxR * 0.85);
}

joyZone.addEventListener('pointerdown', e => {
  if(!running && document.getElementById('startMsg').classList.contains('hidden') === false){ startGame(); }
  joyKnob.classList.remove('animating'); 
  joy.active = true;
  joy.pointerId = e.pointerId;
  joyZone.setPointerCapture(e.pointerId);
  updateJoystick(e);
  e.stopPropagation();
});

joyZone.addEventListener('pointermove', e => {
  if(joy.active && e.pointerId === joy.pointerId){ updateJoystick(e); }
  e.stopPropagation();
});

function joyReset() {
  joy.active = false;
  joy.pointerId = null;
  joyKnob.style.transform = 'translate(-50%, -50%)';
  player.boosting = false;
}

joyZone.addEventListener('pointerup', e => { if(joy.active && e.pointerId === joy.pointerId){ joyReset(); }});
joyZone.addEventListener('pointercancel', () => joyReset());

const keys = {};
window.addEventListener('keydown', e => {
  keys[e.key] = true;
  if(!running && document.getElementById('startMsg').classList.contains('hidden') === false){
    joyKnob.classList.remove('animating'); startGame();
  }
  if(e.key === ' ') player.boosting = true;
});
window.addEventListener('keyup', e => {
  keys[e.key] = false;
  if(e.key === ' ') player.boosting = false;
});

function handleKeyboardSteer(){
  let dx=0, dy=0;
  if(keys['ArrowUp']||keys['w']) dy -= 1;
  if(keys['ArrowDown']||keys['s']) dy += 1;
  if(keys['ArrowLeft']||keys['a']) dx -= 1;
  if(keys['ArrowRight']||keys['d']) dx += 1;
  if(dx!==0 || dy!==0){ player.targetAngle = Math.atan2(dy,dx); return true; }
  return false;
}

function toast(msg, color){
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.style.color = color || 'var(--ink)';
  t.classList.add('show');
  clearTimeout(toast._h);
  toast._h = setTimeout(()=>t.classList.remove('show'), 900);
}

function burst(x,y,color,n){
  n = n||10;
  for(let i=0;i<n;i++){
    const a = Math.random()*Math.PI*2, sp = rnd(0.6,3.0);
    particles.push({x,y,vx:Math.cos(a)*sp, vy:Math.sin(a)*sp, life:1, color});
  }
}

function eatCubes(snake){
  const headPos = snake.segmentPositions()[0];
  const magnetActive = snake.magnetT > 0;
  const pickR = magnetActive ? 130 : 26;
  for(let i=cubes.length-1;i>=0;i--){
    const c = cubes[i];
    const d2 = dist2(headPos.x, headPos.y, c.x, c.y);
    if(d2 < pickR*pickR){
      if(magnetActive && d2 > (26*26)){
        c.x += (headPos.x-c.x)*0.18; c.y += (headPos.y-c.y)*0.18; continue;
      }
      cubes.splice(i,1);
      snake.grow(c.value);
      const merges = snake.mergeAdjacent();
      if(snake.isPlayer){
        burst(c.x,c.y, '#ffffff', 8);
        if(merges > 1) { // Combo Text & Shake!
          spawnText(snake.head.x, snake.head.y, "COMBO!", "#ffd23f");
          screenShake = 0.2;
        } else if(merges === 1) {
          toast('Συγχώνευση! ×2', '#3ddc84');
        }
      }
      spawnCube();
    }
  }
}

function eatPowerups(snake){
  if(!snake.isPlayer) return;
  const headPos = snake.segmentPositions()[0];
  for(let i=powerups.length-1;i>=0;i--){
    const p = powerups[i];
    if(dist2(headPos.x,headPos.y,p.x,p.y) < 30*30){
      powerups.splice(i,1);
      if(p.type==='boost'){ snake.baseSpeed = 2.0; setTimeout(()=>snake.baseSpeed=1.3, 6000); flashPw('pwBoost',6000); toast('Ταχύτητα!','#ffd23f'); }
      if(p.type==='magnet'){ snake.magnetT = 5; flashPw('pwMagnet',5000); toast('Μαγνήτης!','#4ecdc4'); } 
      if(p.type==='shield'){ snake.shieldT = 6; flashPw('pwShield',6000); toast('Ασπίδα!','#7b61ff'); }
      burst(p.x,p.y,'#fff',12); screenShake = 0.1;
      spawnPowerup();
    }
  }
}

function checkPanels(dt){
  const all = [player, ...bots].filter(s=>s.alive);
  panels.forEach(p => {
    if(p.cooldown > 0) { p.cooldown -= dt; return; }
    for(const s of all){
      const hp = s.head;
      if(Math.abs(hp.x - p.x) < 45 && Math.abs(hp.y - p.y) < 45){
        p.cooldown = 12; // 12 seconds cooldown
        if(p.type === 'x2'){
          s.segments[0].value = Math.min(5096, s.segments[0].value * 2);
          if(s.isPlayer) { spawnText(hp.x, hp.y, "x2 BOOST!", "#3ddc84"); screenShake = 0.25; }
        } else {
          s.segments[0].value = Math.max(2, Math.floor(s.segments[0].value / 2));
          if(s.isPlayer) { spawnText(hp.x, hp.y, "÷2 OUCH!", "#ff4d6d"); screenShake = 0.25; }
        }
        p.x = rnd(100, ARENA-100);
        p.y = rnd(100, ARENA-100);
        p.type = Math.random() > 0.6 ? 'x2' : '/2';
        break;
      }
    }
  });
}

function flashPw(id, ms){
  const el = document.getElementById(id);
  const cd = el.querySelector('.cd');
  el.classList.add('active');
  const end = Date.now()+ms;
  clearInterval(el._iv);
  el._iv = setInterval(()=>{
    const left = Math.max(0, end-Date.now());
    cd.textContent = (left/1000).toFixed(1)+'s';
    if(left<=0){ clearInterval(el._iv); el.classList.remove('active'); }
  }, 100);
}

function killSnake(snake){
  snake.alive = false;
  const positions = snake.segmentPositions();
  positions.forEach((p,i)=>{
    if(snake.segments[i]) cubes.push({x:p.x+rnd(-20,20), y:p.y+rnd(-20,20), value: snake.segments[i].value});
  });
  if(snake.isPlayer){ endGame(false); } 
  else {
    const idx = bots.indexOf(snake);
    if(idx>=0) bots.splice(idx,1);
    if(bots.length < 6) bots.push(makeBot());
  }
}

// Tail Stealing Logic
function resolveCombat(){
  let all = [player, ...bots].filter(s=>s.alive);
  if(!running) all = bots.filter(s=>s.alive);

  for(const a of all){
    if(a.reactT>0) continue;
    const aPos = a.segmentPositions();
    const aHead = aPos[0];
    for(const b of all){
      if(a===b || b.reactT>0) continue;
      const bPos = b.segmentPositions();
      for(let i=0;i<bPos.length;i++){
        const segPos = bPos[i];
        const hitR = BASE_R + Math.min(Math.log2(b.segments[i].value)*1.4, 16);
        if(dist2(aHead.x,aHead.y,segPos.x,segPos.y) < (hitR+BASE_R*0.6)*(hitR+BASE_R*0.6)){
          if(b.shieldT>0){ continue; }
          const aVal = a.headValue, bVal = b.segments[i].value;
          
          if(aVal > bVal){
            // TAIL STEAL: Κόβει από το i και πίσω
            const severed = b.segments.splice(i);
            severed.forEach((seg, idx) => {
               const p = bPos[i + idx] || bPos[bPos.length-1];
               cubes.push({x: p.x + rnd(-15,15), y: p.y + rnd(-15,15), value: seg.value});
               burst(p.x, p.y, '#ffffff', 5);
            });
            a.reactT = 0.15; b.reactT = 0.15;
            if(a.isPlayer){ 
               spawnText(aHead.x, aHead.y, "TAIL CUT!", "#ff4d6d"); 
               screenShake = 0.3; 
            }
            if(b.segments.length === 0) killSnake(b);
          } else if(aVal < bVal){
            if(a.shieldT>0){ continue; }
            if(i===0){ killSnake(a); } 
            else { 
               // Έκοψε ο αντίπαλος τη δική σου!
               const severed = a.segments.splice(0); 
               killSnake(a);
            }
            a.reactT = 0.15; b.reactT = 0.15;
          }
          break;
        }
      }
      if(!a.alive) break;
    }
    if(!a.alive) continue;
  }
}

function botAI(bot, dt){
  bot.retargetT -= dt;
  if(bot.retargetT<=0){
    bot.retargetT = rnd(0.6,1.4);
    const hp = bot.head;
    let best=null, bestD=520*520;
    
    // Αποφυγή /2 πλακιδίων, στόχευση x2
    for(const p of panels){
       if(p.cooldown > 0) continue;
       const d2 = dist2(hp.x, hp.y, p.x, p.y);
       if(d2 < bestD) {
          if(p.type === 'x2') { best = p; bestD = d2; }
          else if (p.type === '/2' && d2 < 200*200) {
             bot.targetAngle = Math.atan2(hp.y - p.y, hp.x - p.x); // Run away
             bot.retargetT = 0.5;
             return;
          }
       }
    }

    if(!best) {
      for(const c of cubes){
        const d2 = dist2(hp.x,hp.y,c.x,c.y);
        if(d2<bestD){ bestD=d2; best=c; }
      }
    }

    if(best && Math.random()>0.15){
      bot.targetAngle = Math.atan2(best.y-hp.y, best.x-hp.x);
    } else {
      bot.targetAngle = bot.angle + rnd(-1.4,1.4);
    }
    bot.boosting = Math.random() > 0.85;
  }
  const margin = 160;
  const hp = bot.head;
  if(hp.x<margin || hp.x>ARENA-margin || hp.y<margin || hp.y>ARENA-margin){
    bot.targetAngle = Math.atan2(ARENA/2-hp.y, ARENA/2-hp.x);
  }
}

function renderLeaderboard(){
  const all = [player, ...bots].filter(s=>s.alive);
  all.sort((a,b)=>b.score-a.score);
  const rows = document.getElementById('lbRows');
  rows.innerHTML = '';
  all.forEach((s,i)=>{
    const div = document.createElement('div');
    div.className = 'lb-row' + (s.isPlayer?' me':'');
    div.innerHTML = `<span class="rank">${i+1}</span><span class="name">${s.isPlayer?'You':s.name}</span><span class="val">${s.score}</span>`;
    rows.appendChild(div);
  });
}

function drawFloor(){
  const sx = -camera.x;
  const sy = -camera.y;

  ctx.save();
  const grad = ctx.createLinearGradient(sx, sy, sx+ARENA, sy+ARENA);
  grad.addColorStop(0, '#ff4d4d');
  grad.addColorStop(0.2, '#ffaa4d');
  grad.addColorStop(0.4, '#ffd23f');
  grad.addColorStop(0.6, '#3ddc84');
  grad.addColorStop(0.8, '#4d94ff');
  grad.addColorStop(1, '#9d4dff');
  ctx.fillStyle = grad;
  ctx.fillRect(sx, sy, ARENA, ARENA);

  ctx.fillStyle = '#ffffff33';
  const step = 50;
  for(let x=0; x<=ARENA; x+=step){
    for(let y=0; y<=ARENA; y+=step){
      ctx.beginPath();
      ctx.arc(sx+x, sy+y, 2, 0, Math.PI*2);
      ctx.fill();
    }
  }

  ctx.strokeStyle = '#ffffff88';
  ctx.lineWidth = 6;
  ctx.strokeRect(sx, sy, ARENA, ARENA);
  ctx.restore();
}

function drawPanels(){
  panels.forEach(p => {
    if(p.cooldown > 0) return;
    const sx = p.x - camera.x, sy = p.y - camera.y;
    if(sx < -100 || sx > W+100 || sy < -100 || sy > H+100) return;
    
    ctx.save();
    ctx.translate(sx, sy);
    ctx.shadowColor = p.type === 'x2' ? '#3ddc84' : '#ff4d6d';
    ctx.shadowBlur = 15;
    ctx.fillStyle = p.type === 'x2' ? '#3ddc8444' : '#ff4d6d44';
    ctx.strokeStyle = p.type === 'x2' ? '#3ddc84' : '#ff4d6d';
    ctx.lineWidth = 4;
    
    roundRect(-35, -35, 70, 70, 14);
    ctx.fill(); ctx.stroke();

    ctx.shadowBlur = 0;
    ctx.fillStyle = '#fff';
    ctx.font = "800 24px 'Baloo 2', sans-serif";
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText(p.type, 0, 0);
    ctx.restore();
  });
}

function drawCube(x,y,value,scale){
  scale = scale||1;
  const c = colorFor(value);
  const sx = x-camera.x, sy = y-camera.y;
  if(sx< -60||sx>W+60||sy<-60||sy>H+60) return;
  const r = 16*scale;
  
  ctx.save();
  ctx.translate(sx,sy);

  ctx.save();
  ctx.translate(0, r*0.4);
  ctx.fillStyle = '#00000044';
  roundRect(-r, -r, r*2, r*2, 4*scale);
  ctx.fill();
  ctx.restore();

  ctx.fillStyle = c.side;
  roundRect(-r, -r + r*0.2, r*2, r*2, 4*scale);
  ctx.fill();

  ctx.fillStyle = c.face;
  roundRect(-r, -r, r*2, r*2, 4*scale);
  ctx.fill();

  ctx.font = `600 ${14*scale}px sans-serif`;
  ctx.textAlign = 'center'; ctx.textBaseline='middle';
  ctx.fillStyle = '#ffffff';
  ctx.fillText(value, 0, 0);

  ctx.restore();
}

function roundRect(x,y,w,h,r){
  ctx.beginPath(); ctx.moveTo(x+r,y); ctx.arcTo(x+w,y,x+w,y+h,r);
  ctx.arcTo(x+w,y+h,x,y+h,r); ctx.arcTo(x,y+h,x,y,r); ctx.arcTo(x,y,x+w,y,r); ctx.closePath();
}

function drawSnake(snake){
  const positions = snake.segmentPositions();
  for(let i=positions.length-1; i>=1; i--){
    drawCube(positions[i].x, positions[i].y, snake.segments[i].value, 1);
  }
  if(snake.shieldT>0){
    const hp = positions[0];
    ctx.save(); ctx.strokeStyle = '#7b61ffcc'; ctx.lineWidth = 3; ctx.beginPath();
    ctx.arc(hp.x-camera.x, hp.y-camera.y, 26, 0, Math.PI*2); ctx.stroke(); ctx.restore();
  }
  const hp = positions[0];
  drawCube(hp.x, hp.y, snake.segments[0].value, 1.15);
  
  ctx.save(); 
  ctx.font = "600 12px sans-serif"; 
  ctx.fillStyle = '#ffffff';
  ctx.textAlign='center'; 
  ctx.fillText(snake.isPlayer ? 'You' : snake.name, hp.x-camera.x, hp.y-camera.y-26); 
  ctx.restore();
}

function drawPowerup(p){
  const sx=p.x-camera.x, sy=p.y-camera.y;
  if(sx<-40||sx>W+40||sy<-40||sy>H+40) return;
  const icon = p.type==='boost'?'⚡':p.type==='magnet'?'🧲':'🛡️';
  ctx.save(); ctx.translate(sx,sy); ctx.font='22px sans-serif';
  ctx.textAlign='center'; ctx.textBaseline='middle'; ctx.fillText(icon,0,2); ctx.restore();
}

function drawParticles(dt){
  for(let i=particles.length-1;i>=0;i--){
    const pt = particles[i];
    pt.x += pt.vx; pt.y += pt.vy; pt.life -= dt*1.6;
    if(pt.life<=0){ particles.splice(i,1); continue; }
    ctx.save(); ctx.globalAlpha = clamp(pt.life,0,1); ctx.fillStyle = pt.color;
    ctx.beginPath(); ctx.arc(pt.x-camera.x, pt.y-camera.y, 3, 0, Math.PI*2); ctx.fill(); ctx.restore();
  }
}

function drawFloaters(dt){
  for(let i=floaters.length-1; i>=0; i--){
    const f = floaters[i];
    f.y -= dt * 35;
    f.life -= dt;
    if(f.life <= 0){ floaters.splice(i,1); continue; }
    ctx.save();
    ctx.globalAlpha = Math.min(1, f.life * 2);
    ctx.font = "800 24px 'Baloo 2', sans-serif";
    ctx.fillStyle = f.color;
    ctx.strokeStyle = '#000000cc';
    ctx.lineWidth = 4;
    ctx.textAlign = 'center';
    ctx.strokeText(f.text, f.x - camera.x, f.y - camera.y);
    ctx.fillText(f.text, f.x - camera.x, f.y - camera.y);
    ctx.restore();
  }
}

let lastT = null;
function frame(ts){
  if(!lastT) lastT = ts;
  const dt = Math.min((ts-lastT)/1000, 0.05);
  lastT = ts;

  bots.forEach(b=>{ botAI(b,dt); b.update(dt); });
  bots.forEach(b=>eatCubes(b));
  checkPanels(dt);
  resolveCombat();

  if(running){
    handleKeyboardSteer(); 
    player.update(dt);
    eatCubes(player); eatPowerups(player);
    
    timeLeft -= dt;
    elapsedSinceLB += dt;
    if(elapsedSinceLB > 1){ elapsedSinceLB = 0; renderLeaderboard(); }
    document.getElementById('scoreVal').textContent = player.score;
    const m = Math.max(0,Math.floor(timeLeft/60)), s = Math.max(0,Math.floor(timeLeft%60));
    document.getElementById('timerVal').textContent = `${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`;

    if(timeLeft<=0){ endGame(true); }
  }

  if(screenShake > 0) screenShake -= dt;
  let cx = player.head.x - W/2;
  let cy = player.head.y - H/2;
  
  if(screenShake > 0) {
     cx += rnd(-15, 15) * screenShake;
     cy += rnd(-15, 15) * screenShake;
  }
  camera.x = cx; camera.y = cy;

  ctx.clearRect(0,0,W,H);
  drawFloor(); 
  drawPanels();
  cubes.forEach(c=>drawCube(c.x,c.y,c.value,0.85));
  powerups.forEach(drawPowerup);
  bots.forEach(b=>{ if(b.alive) drawSnake(b); });
  if(player.alive) drawSnake(player);
  drawParticles(dt);
  drawFloaters(dt);

  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);

function startGame(){
  if(gameStartedOnce && (!player.alive || timeLeft <= 0)){
    initWorld(); 
  }
  gameStartedOnce = true;
  renderLeaderboard();
  document.getElementById('startMsg').classList.add('hidden');
  document.getElementById('endMsg').classList.add('hidden');
  joyKnob.classList.remove('animating');
  running = true;
}

function endGame(survived){
  running = false;
  const title = document.getElementById('endTitle');
  const body = document.getElementById('endBody');
  title.innerHTML = survived ? 'Επιβίωσες! 🏆' : 'Game Over';
  const all = [player, ...bots].filter(s=>s!==player);
  const rank = 1 + all.filter(s=>s.score>player.score).length;
  body.textContent = `Σκορ: ${player.score} · Θέση #${rank} στο δωμάτιο`;
  document.getElementById('endMsg').classList.remove('hidden');
}

document.getElementById('restartBtn').addEventListener('click', startGame);

initWorld();
renderLeaderboard();

})();
</script>
