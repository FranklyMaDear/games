<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Dot Knot</title>
<style>
:root{color-scheme:dark;--bg:#04101c;--bar:#1f6fd0;--bar2:#0f4a96;--tx:#fff;--mut:#9fb4cc;--gold:#ffc83a;--ok:#2fc23a;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0;background:var(--bg);color:var(--tx);font-family:"Trebuchet MS",system-ui,sans-serif;overflow:hidden;user-select:none}
.scr{display:none;height:100%;flex-direction:column;align-items:center;padding:12px;max-width:520px;margin:0 auto}
.scr.on{display:flex}
button{font:inherit;color:inherit;border:0;cursor:pointer}
.btn{background:var(--ok);border-radius:16px;padding:14px 28px;font-weight:800;font-size:22px;box-shadow:0 5px 0 #17751f}
.btn:active{transform:translateY(3px);box-shadow:0 2px 0 #17751f}
.btn.y{background:linear-gradient(#ffe94d,#ffb300);color:#4a2c00;box-shadow:0 5px 0 #a86b00}
.btn.b{background:var(--bar);box-shadow:0 5px 0 var(--bar2)}
.coin{display:inline-flex;align-items:center;gap:6px;background:var(--bar2);border-radius:20px;padding:4px 12px 4px 4px;font-weight:800}
.coin i{width:24px;height:24px;border-radius:50%;background:radial-gradient(#fff3a0,var(--gold));display:inline-block;border:2px solid #e09a00}
#home{justify-content:space-between;text-align:center;max-width:none}
#home>*{max-width:480px}
.logo{font-size:54px;font-weight:900;letter-spacing:4px;text-shadow:0 4px 0 #0005}
.logo b:nth-child(1){color:#ff9a1f}.logo b:nth-child(2){color:#2fe04a}.logo b:nth-child(3){color:#a35cff}
#scene{font-size:84px;transition:filter .5s;filter:grayscale(1)}
.ribbon{background:#2f7f2a;border:3px solid #43a53c;border-radius:12px;padding:8px 40px;font-size:22px;font-weight:800;min-width:260px}
.pbar{height:12px;background:#1d521a;border-radius:8px;margin-top:6px;overflow:hidden}.pbar div{height:100%;background:#7be06a;width:0}
.top{display:flex;width:100%;align-items:center;justify-content:space-between;background:var(--bar);border:3px solid var(--bar2);border-radius:18px;padding:8px 10px;gap:8px}
.ib{background:#2a82ea;border-radius:10px;width:44px;height:44px;font-size:22px;font-weight:900;box-shadow:0 3px 0 var(--bar2)}
#stages h2{margin:10px 0 14px;font-size:30px}
#grid{position:relative;width:100%}
.lv{aspect-ratio:1;border-radius:50%;background:#587fa6;border:4px solid #b8c8d8;font-size:22px;font-weight:900;position:relative}
.lv.cur{background:#1d8a10;border-color:#5ede2e}
.lv.lock{opacity:.8}.lv.lock::after{content:"🔒";position:absolute;right:-4px;bottom:-6px;font-size:16px}
.lv.done::after{content:"✔";position:absolute;right:-6px;bottom:-8px;font-size:26px;color:#2fd24a}
#stages{max-width:none;overflow-y:auto;justify-content:flex-start}#stages>*{flex-shrink:0}#stages>*{max-width:480px}
#game{justify-content:flex-start}
#mid{text-align:center;font-weight:800}#mid small{display:block;font-size:20px;color:#fff}
#hint{color:var(--mut);margin:14px 0 6px;min-height:24px;font-size:18px}
#cv{touch-action:none;display:block;margin:auto 0}
.tools{display:flex;gap:14px;margin-top:auto;padding:10px 14px;background:var(--bar);border:3px solid var(--bar2);border-radius:20px;width:100%;justify-content:space-around}
.tool{background:#2a82ea;border-radius:14px;padding:8px 6px;min-width:70px;font-size:12px;font-weight:800;box-shadow:0 3px 0 var(--bar2)}.tool span{display:block;font-size:26px}
.ov{position:fixed;inset:0;background:#000c;display:none;flex-direction:column;align-items:center;justify-content:center;gap:14px;text-align:center;z-index:5;padding:16px}
.ov.on{display:flex}
.title{font-size:46px;font-weight:900;color:#ffd21f;text-shadow:0 4px 0 #b36b00,0 0 20px #ff9a1f88;margin:0}
.rib{background:#a24cf0;padding:6px 36px;border-radius:10px;font-weight:900;font-size:24px}
#wheelw{position:relative;width:260px;height:130px;overflow:hidden}
#wheel{position:absolute;left:0;top:0;width:260px;height:260px;border-radius:50%;border:8px solid #2a82ea;background:conic-gradient(from -90deg at 50% 50%,#e22 0 36deg,#f80 36deg 72deg,#5c2 72deg 108deg,#f80 108deg 144deg,#e22 144deg 180deg,transparent 180deg)}
#wheel b{position:absolute;font-size:16px;font-weight:900;text-shadow:0 1px 2px #0009;transition:scale .1s}
#ptr{position:absolute;left:50%;top:130px;width:0;height:0;transform-origin:0 0}
#ptr::before{content:"";position:absolute;left:-6px;top:-110px;border:6px solid transparent;border-bottom:110px solid #fff;border-top:0;border-left-width:7px;border-right-width:7px}
#hub{position:absolute;left:105px;top:105px;width:50px;height:50px;border-radius:50%;background:#2ad1f2;border:5px solid #2a82ea}
#toast{position:fixed;left:50%;bottom:110px;transform:translateX(-50%);background:#000d;padding:10px 18px;border-radius:20px;opacity:0;transition:opacity .3s;pointer-events:none;z-index:9}
#toast.on{opacity:1}
.sm{font-size:15px;color:var(--mut)}
@keyframes pop{from{transform:scale(0);opacity:0}to{transform:scale(1);opacity:1}}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 #5ede2e99}50%{box-shadow:0 0 0 14px #5ede2e00}}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px)}}
@keyframes bg{0%,100%{background-position:0 50%}50%{background-position:100% 50%}}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-7px)}75%{transform:translateX(7px)}}
@keyframes glow{0%,100%{filter:brightness(1)}50%{filter:brightness(1.25)}}
.lv{animation:pop .45s backwards}
.lv.cur{animation:pop .45s backwards,pulse 1.4s infinite .6s}
.lv.shake{animation:shake .3s}
.lv.e:not(.cur){border-color:#7be07b}.lv.m:not(.cur){border-color:#ffb347}.lv.h:not(.cur){border-color:#ff6b6b}
.lg{display:flex;gap:14px;font-size:13px;margin-bottom:12px}.lg i{font-style:normal}
.logo b{display:inline-block;animation:bob 1.6s ease-in-out infinite}.logo b:nth-child(2){animation-delay:.2s}.logo b:nth-child(3){animation-delay:.4s}
#scene{animation:bob 3s ease-in-out infinite}
#playBtn{animation:glow 1.4s infinite}
.ov.on .title{animation:pop .6s}
#mid em{font-style:normal;font-size:12px;opacity:.85;margin-left:6px}
#fx{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:8}
body[data-s=home],body[data-s=stages],body[data-s=daily]{background:linear-gradient(160deg,#ff7ac6,#a35cff 45%,#3f8cff);background-size:200% 200%;animation:bg 10s ease infinite}
#bgf{position:fixed;inset:0;overflow:hidden;pointer-events:none;z-index:0;transition:opacity .4s}
#bgf span{position:absolute;bottom:-60px;opacity:.55;animation:rise linear infinite}
@keyframes rise{to{transform:translateY(-115vh) rotate(360deg)}}
body[data-s=game] #bgf{opacity:0}.scr{position:relative;z-index:1}
#home .sm{color:#fff;opacity:.9}
.ribbon{background:linear-gradient(#ff8ad4,#e0409c);border-color:#ffd1ee;text-shadow:0 2px 0 #8a1f64}.pbar{background:#8a1f64}.pbar div{background:#ffe14d}
.logo b:nth-child(n){display:inline-flex;width:76px;height:76px;border-radius:50%;align-items:center;justify-content:center;color:#fff;margin:0 4px;font-size:46px;box-shadow:inset 0 -8px 12px #0004,inset 0 6px 8px #fff8,0 6px 14px #0004}
.logo b:nth-child(1){background:radial-gradient(circle at 35% 30%,#ffd08a,#ff9a1f 60%,#c46500)}.logo b:nth-child(2){background:radial-gradient(circle at 35% 30%,#a8ffb4,#2fe04a 60%,#12902a)}.logo b:nth-child(3){background:radial-gradient(circle at 35% 30%,#dcb8ff,#a35cff 60%,#6a22c4)}
.gl{position:relative;overflow:hidden;background:linear-gradient(#8bff8f,#27c935 48%,#0e9a20 52%,#33e046)!important;border:4px solid #ffc43a;box-shadow:0 6px 0 #a86b00,0 0 22px #ffe14d99,inset 0 3px 6px #fff9!important;text-shadow:0 2px 0 #0a6a14;border-radius:22px}
.gl::before{content:"";position:absolute;top:0;left:-70%;width:35%;height:100%;background:linear-gradient(100deg,transparent,#fffc,transparent);transform:skewX(-20deg);animation:sweep 2.4s infinite}
.gl::after{content:"⚡";position:absolute;top:50%;left:-10%;font-size:34px;transform:translateY(-50%);animation:bolt 2.4s infinite;opacity:0}
@keyframes sweep{0%{left:-70%}60%,100%{left:130%}}
@keyframes bolt{0%{left:-10%;opacity:0}10%{opacity:1}30%{opacity:0}35%{opacity:1}45%{left:105%;opacity:0}100%{left:105%;opacity:0}}
.lv{position:absolute;width:58px;height:58px;margin:-29px 0 0 -29px}
.lv.x:not(.cur){border-color:#d27cff}.lv.boss{background:linear-gradient(#ffe14d,#ff9a1f);width:66px;height:66px;margin:-33px 0 0 -33px}
.lv.cur{width:68px;height:68px;margin:-34px 0 0 -34px}
#daily{justify-content:flex-start;overflow-y:auto;max-width:none}#daily>*{flex-shrink:0;width:100%;max-width:480px}
.dh{text-align:center}.dh h2{font-size:38px;margin:6px 0 0;text-shadow:0 4px 0 #0005}
#dch{display:flex;gap:8px;background:#0003;border-radius:16px;padding:10px;margin:10px 0}
.chest{flex:1;text-align:center;background:#0004;border-radius:12px;padding:6px 0;font-size:38px;cursor:pointer}.chest u{display:block;font-size:12px;text-decoration:none;background:#7a3fc2;border-radius:6px;margin:2px 6px 0;font-weight:800}.chest.rdy{animation:bob .8s infinite;box-shadow:0 0 14px #ffd21f}
#dmon{text-align:center;font-weight:900;font-size:22px;margin:4px 0}
#dcal{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;background:#e3f3ff;border-radius:18px;padding:10px;color:#12306e}
.dw{text-align:center;font-weight:900;font-size:11px;background:#1d56b8;color:#fff;border-radius:8px;padding:4px 0}
.dc{background:#a8bbd0;border-radius:8px;text-align:center;padding:2px 0 3px;font-size:16px}.dc em{display:block;text-align:left;font-size:10px;font-style:normal;padding-left:4px}.dc b{display:block;font-size:12px}
.dc.today{background:#24b83a;color:#fff;outline:3px solid #ff9a1f;animation:pulse 1.4s infinite}.dc.got{background:#a35cff;color:#fff}.dc.miss{opacity:.5}
button:disabled{opacity:.45;filter:grayscale(.6)}
</style></head><body>

<section id="home" class="scr on">
 <div style="width:100%;display:flex;justify-content:space-between;align-items:center"><span class="coin"><i></i><span class="cn">110</span></span><button class="btn b" style="font-size:15px;padding:8px 14px" onclick="freeCoins()">🎬 +100</button><button class="btn b snd" style="font-size:15px;padding:8px 14px" onclick="toggleSnd()">🔊</button></div>
 <div><div class="logo"><b>D</b><b>O</b><b>T</b></div><div style="font-size:40px;font-weight:900;letter-spacing:3px">KNOT</div></div>
 <div id="scene">🍭🍬🍩</div>
 <div class="ribbon">Candy Land<div class="pbar"><div id="pb"></div></div><span id="pp" class="sm" style="color:#d6f5cf">0%</span></div>
 <button class="btn gl" id="playBtn" style="font-size:30px;padding:16px 44px" onclick="start(nextLv())">Level 1</button>
 <div style="display:flex;gap:10px"><button class="btn y" style="font-size:18px;padding:12px 16px" onclick="openDaily()">🎁 Daily Reward <b id="dbadge" style="background:#f22;color:#fff;border-radius:50%;padding:0 7px">1</b></button><button class="btn b" style="font-size:18px;padding:12px 16px" onclick="show('stages');buildGrid()">🪜 All levels</button></div>
 <div class="sm">Connect the same-color dots. Lines must never cross!</div>
</section>

<section id="stages" class="scr">
 <div class="top" style="background:none;border:0"><button class="ib" onclick="show('home');refreshHome()">←</button><span class="coin"><i></i><span class="cn">110</span></span></div>
 <h2>Stage 1</h2><div class="lg"><i>🟢 Easy</i><i>🟠 Medium</i><i>🔴 Hard</i><i>🟣 Expert</i></div><div id="grid"></div>
</section>

<section id="daily" class="scr">
 <div class="top" style="background:none;border:0"><button class="ib" onclick="show('home');refreshHome()">←</button><span class="coin"><i></i><span class="cn">110</span></span></div>
 <div class="dh"><h2>Daily Reward</h2><div>A little reward, every day</div></div>
 <div id="dch"></div><div id="dmon"></div><div id="dcal"></div>
 <div style="display:flex;flex-direction:column;gap:12px;align-items:center;margin:14px 0"><button class="btn" id="c1" onclick="claim(2)">🎬 CLAIM 2X</button><button class="btn b" id="c2" onclick="claim(1)">CLAIM</button></div>
</section>

<section id="game" class="scr">
 <div class="top">
  <button class="ib" onclick="pause()">❚❚</button><button class="ib" onclick="start(cur)">↻</button>
  <div id="mid">LEVEL <span id="ln">1</span><em id="dif"></em><small>⏱ <span id="tm">0:00</span></small></div>
  <span class="coin"><i></i><span class="cn">110</span></span>
 </div>
 <div id="hint">Connect the same color dots…</div>
 <canvas id="cv"></canvas>
 <div class="tools">
  <button class="tool" onclick="freeCoins()"><span>🎬</span>FREE +100</button>
  <button class="tool" onclick="useHint()"><span>💡</span>100</button>
  <button class="tool" onclick="useSkip()"><span>⏩</span>200</button>
  <button class="tool" onclick="show('stages');buildGrid()"><span>🏪</span>LEVELS</button>
 </div>
</section>

<div id="pause" class="ov"><h1 class="title">PAUSED</h1><button class="btn" onclick="resume()">Resume</button><button class="btn b" onclick="resume();show('home');refreshHome()">Home</button><button class="btn b snd" onclick="toggleSnd()">🔊</button><button class="btn b" id="rst" style="font-size:15px;padding:8px 14px" onclick="resetAll()">🗑 Reset progress</button></div>

<div id="win" class="ov">
 <h1 class="title">COMPLETE</h1><div class="rib" id="wl">LEVEL 1</div>
 <div class="coin" style="font-size:22px">⏱ <span id="wt">0:06</span></div>
 <div id="wheelw"><div id="wheel"></div><div id="ptr"></div><div id="hub"></div></div>
 <button class="btn y" id="rwBtn" onclick="doReward()">🎬 X2 REWARD +10</button>
 <button class="btn" onclick="doNext()">NEXT 🪙 +5</button>
 <button class="btn b" style="font-size:16px;padding:8px 18px" onclick="show('home');refreshHome();closeWin()">🏠 Home</button>
</div>

<div id="ad" class="ov"><div style="font-size:60px">🎬</div><div style="font-size:22px;font-weight:800">Ad (simulated)</div><div id="adc" style="font-size:48px;font-weight:900">3</div></div>
<div id="toast"></div>

<script>
const PAL=['#1e9bff','#a35cff','#19e619','#ff2a2a','#ffee00','#ff9a1f','#19e6e6','#ff5cc8'];
const TOTAL=100;
let S={coins:110,max:0};
try{Object.assign(S,JSON.parse(localStorage.getItem('dk')||'{}'))}catch(e){}
function save(){try{localStorage.setItem('dk',JSON.stringify(S))}catch(e){}}
const $=id=>document.getElementById(id);
function show(id){document.querySelectorAll('.scr').forEach(s=>s.classList.toggle('on',s.id===id));document.body.dataset.s=id}
function coins(){document.querySelectorAll('.cn').forEach(e=>e.textContent=S.coins)}
function toast(t){const e=$('toast');e.textContent=t;e.classList.add('on');setTimeout(()=>e.classList.remove('on'),1600)}
const fmt=s=>Math.floor(s/60)+':'+String(s%60).padStart(2,'0');

/* ---------- Levels ---------- */
function fixed(rows,cols,list){return{rows,cols,sols:list.map(p=>p.map(([r,c])=>r*cols+c))}}
const FIX={
1:fixed(3,5,[[[0,0],[0,1],[0,2],[0,3],[0,4]],[[1,0],[1,1],[1,2],[1,3],[1,4]],[[2,0],[2,1],[2,2],[2,3],[2,4]]]),
2:fixed(4,5,[[[0,0],[1,0],[2,0],[3,0],[3,1],[3,2],[3,3]],[[0,1],[0,2],[0,3],[0,4],[1,4],[2,4],[3,4]],[[1,2],[1,1],[2,1]],[[1,3],[2,3],[2,2]]]),
3:fixed(3,5,[[[0,0],[1,0],[2,0]],[[0,4],[1,4],[1,3],[1,2]],[[0,3],[0,2],[0,1],[1,1],[2,1],[2,2],[2,3],[2,4]]])};
function rng(s){return()=>{s=(s*1664525+1013904223)>>>0;return s/4294967296}}
function gen(L){
 const R=rng(L*7919+13),n=Math.min(5+Math.floor((L-4)/6),8),k=Math.min(3+Math.floor((L-4)/3),8,n+2);
 const rows=n,cols=n<7?n:n-1;
 for(let a=0;a<400;a++){
  const occ=new Set(),sols=[];
  for(let i=0;i<k;i++){
   for(let t=0;t<40;t++){
    const s=Math.floor(R()*rows*cols);if(occ.has(s))continue;
    const tgt=3+Math.floor(R()*(n+L/5)),p=[s],ps=new Set([s]);
    while(p.length<tgt){
     const c=p[p.length-1],r=Math.floor(c/cols),q=c%cols,o=[];
     [[r-1,q],[r+1,q],[r,q-1],[r,q+1]].forEach(([y,x])=>{if(y>=0&&x>=0&&y<rows&&x<cols){const z=y*cols+x;if(!occ.has(z)&&!ps.has(z))o.push(z)}});
     if(!o.length)break;const z=o[Math.floor(R()*o.length)];p.push(z);ps.add(z)}
    if(p.length>=3){p.forEach(z=>occ.add(z));sols.push(p);break}
   }
  }
  if(sols.length>=k)return{rows,cols,sols};
 }
 return{rows,cols,sols:[[0,1,2],[cols,cols+1,cols+2]]};
}
const cache={};
function getLevel(L){return FIX[L]||(cache[L]||(cache[L]=gen(L)))}
const nextLv=()=>Math.min(S.max+1,TOTAL);

/* ---------- Home / stages ---------- */
function refreshHome(){
 coins();$('dbadge').style.display=canClaim()?'inline-block':'none';const pr=S.max/TOTAL;
 $('pb').style.width=pr*100+'%';$('pp').textContent=Math.round(pr*100)+'%';
 $('scene').style.filter='grayscale('+(1-pr)+')';
 $('playBtn').textContent='Level '+nextLv();
}
function buildGrid(){
 const g=$('grid');g.innerHTML='';coins();
 for(let L=1;L<=TOTAL;L++){
  const b=document.createElement('button');b.className='lv';b.textContent=L;
  if(L<=S.max)b.classList.add('done');else if(L===S.max+1)b.classList.add('cur');else b.classList.add('lock');
  b.style.animationDelay=L*25+'ms';b.classList.add(L<=10?'e':L<=20?'m':'h');b.onclick=()=>{if(L<=S.max+1)start(L);else{SFX.cut();b.classList.remove('shake');void b.offsetWidth;b.classList.add('shake');toast('Locked 🔒')}};
  g.appendChild(b);
 }
}

/* ---------- Game ---------- */
let cur=1,lv,rows,cols,paths,dotAt,drawing=-1,won=false,secs=0,timer=null,paused=false,cell=0;
const cv=$('cv'),ctx=cv.getContext('2d');
function start(L){
 closeWin();SFX.next();cur=L;lv=getLevel(L);rows=lv.rows;cols=lv.cols;
 paths=lv.sols.map(()=>[]);dotAt=new Map();
 lv.sols.forEach((s,i)=>{dotAt.set(s[0],i);dotAt.set(s[s.length-1],i)});
 won=false;drawing=-1;secs=0;paused=false;$('ln').textContent=L;$('dif').textContent=DF(L)[0];$('dif').style.color=DF(L)[1];$('tm').textContent='0:00';
 show('game');coins();resize();
 clearInterval(timer);timer=setInterval(()=>{if(!won&&!paused){secs++;$('tm').textContent=fmt(secs)}},1000);
}
function resize(){
 const w=Math.min(innerWidth-24,480,(innerHeight-330)*cols/rows);
 cell=w/cols;const d=devicePixelRatio||1;
 cv.style.width=w+'px';cv.style.height=cell*rows+'px';
 cv.width=w*d;cv.height=cell*rows*d;ctx.setTransform(d,0,0,d,0,0);draw();
}
addEventListener('resize',()=>{if($('game').classList.contains('on'))resize()});
const done=i=>{const p=paths[i];return p.length>1&&dotAt.get(p[0])===i&&dotAt.get(p[p.length-1])===i&&p[0]!==p[p.length-1]};
function draw(){
 const W=cell*cols,H=cell*rows;ctx.clearRect(0,0,W,H);
 ctx.strokeStyle='#ffffff30';ctx.lineWidth=1;
 for(let r=0;r<=rows;r++){ctx.beginPath();ctx.moveTo(0,r*cell);ctx.lineTo(W,r*cell);ctx.stroke()}
 for(let c=0;c<=cols;c++){ctx.beginPath();ctx.moveTo(c*cell,0);ctx.lineTo(c*cell,H);ctx.stroke()}
 paths.forEach((p,i)=>{
  if(!p.length)return;const col=PAL[i%8];
  ctx.fillStyle=col+'33';p.forEach(z=>ctx.fillRect((z%cols)*cell,Math.floor(z/cols)*cell,cell,cell));
  ctx.shadowColor=col;ctx.shadowBlur=done(i)?20:0;ctx.strokeStyle=col;ctx.lineWidth=cell*.3;ctx.lineCap='round';ctx.lineJoin='round';ctx.beginPath();
  p.forEach((z,j)=>{const x=(z%cols+.5)*cell,y=(Math.floor(z/cols)+.5)*cell;j?ctx.lineTo(x,y):ctx.moveTo(x,y)});ctx.stroke();ctx.shadowBlur=0;
 });
 dotAt.forEach((i,z)=>{ctx.fillStyle=PAL[i%8];ctx.beginPath();ctx.arc((z%cols+.5)*cell,(Math.floor(z/cols)+.5)*cell,cell*.33,0,7);ctx.fill()});
}
const owner=z=>paths.findIndex(p=>p.includes(z));
const adj=(a,b)=>Math.abs(Math.floor(a/cols)-Math.floor(b/cols))+Math.abs(a%cols-b%cols)===1;
function cellAt(e){
 const r=cv.getBoundingClientRect(),x=Math.floor((e.clientX-r.left)/cell),y=Math.floor((e.clientY-r.top)/cell);
 return(x<0||y<0||x>=cols||y>=rows)?-1:y*cols+x;
}
cv.addEventListener('pointerdown',e=>{
 if(won||paused)return;const z=cellAt(e);if(z<0)return;cv.setPointerCapture(e.pointerId);
 const d=dotAt.get(z);
 SFX.init();if(d!==undefined){paths[d]=[z];drawing=d;SFX.pop();spark(z,d)}
 else{const o=owner(z);if(o>=0){paths[o].length=paths[o].indexOf(z)+1;drawing=o}}
 draw();
});
cv.addEventListener('pointermove',e=>{
 if(drawing<0||won)return;const z=cellAt(e);if(z<0)return;
 const p=paths[drawing],last=p[p.length-1];if(z===last||!adj(last,z))return;
 const idx=p.indexOf(z);if(idx>=0){p.length=idx+1;draw();return}
 if(done(drawing))return;
 const d=dotAt.get(z);if(d!==undefined&&d!==drawing)return;
 const o=owner(z);if(o>=0&&o!==drawing){const q=paths[o];q.length=q.indexOf(z);SFX.cut();spark(z,o)}
 p.push(z);SFX.move(p.length);spark(z,drawing);if(done(drawing)){SFX.connect();burstCell(z,drawing);try{navigator.vibrate(20)}catch(e){}}draw();checkWin();
});
const end=()=>{drawing=-1;checkWin()};
cv.addEventListener('pointerup',end);cv.addEventListener('pointercancel',end);
function checkWin(){
 if(won||!paths.every((_,i)=>done(i)))return;
 won=true;drawing=-1;draw();SFX.win();celebrate();setTimeout(openWin,1300);
}
function useHint(){
 if(won)return;const i=paths.findIndex((_,k)=>!done(k));if(i<0)return;
 if(S.coins<100)return toast('You need 100 coins — watch an ad 🎬');
 S.coins-=100;save();coins();
 const sol=lv.sols[i];paths.forEach((p,j)=>{if(j!==i&&p.some(z=>sol.includes(z)))paths[j]=[]});
 paths[i]=sol.slice();draw();checkWin();
}
function useSkip(){
 if(won)return;if(S.coins<200)return toast('You need 200 coins — watch an ad 🎬');
 S.coins-=200;save();coins();paths=lv.sols.map(s=>s.slice());draw();checkWin();
}

 const o=$('ad'),c=$('adc');let n=3;c.textContent=n;o.classList.add('on');

/* wheel */
let raf=0,mult=5,frozen=false,t0=0;
const SEG=[2,3,5,3,2];
function buildWheel(){
 const w=$('wheel');w.innerHTML='';
 SEG.forEach((m,i)=>{const b=document.createElement('b');b.textContent='x'+m;
  const an=(-162+i*36)*Math.PI/180;b.style.left=(122+84*Math.cos(an))+'px';b.style.top=(122+84*Math.sin(an))+'px';b.style.transform='translate(-50%,-50%) rotate('+(-72+i*36)+'deg)';w.appendChild(b)});
}
function wheelLoop(t){
 if(!frozen){
  const a=Math.sin((t-t0)/550)*88;$('ptr').style.transform='rotate('+a+'deg)';
  const seg=Math.min(4,Math.floor((a+90)/36));mult=SEG[seg];
  document.querySelectorAll('#wheel b').forEach((b,i)=>b.style.scale=i===seg?1.35:1);
  if(seg!==window._ls){window._ls=seg;SFX.tick()}
  $('rwBtn').textContent='🎬 X'+mult+' REWARD +'+5*mult;
 }
 raf=requestAnimationFrame(wheelLoop);
}
function openWin(){
 $('wl').textContent='LEVEL '+cur;if(!S.best)S.best={};const bt=S.best[cur];if(!bt||secs<bt)S.best[cur]=secs;$('wt').textContent=fmt(secs)+(!bt||secs<bt?' 🏆 NEW BEST':' (best '+fmt(bt)+')');save();toast('Progress saved 💾');
 buildWheel();frozen=false;t0=performance.now();celebrate(1);$('win').classList.add('on');
 cancelAnimationFrame(raf);raf=requestAnimationFrame(wheelLoop);
 if(cur>S.max){S.max=cur;save()}
}
function closeWin(){$('win').classList.remove('on');cancelAnimationFrame(raf)}
function goNext(){closeWin();if(cur<TOTAL)start(cur+1);else{show('home');refreshHome();toast('Stage complete! 🎉')}}
function doNext(){S.coins+=5;save();coins();SFX.coin();goNext()}
function doReward(){
 frozen=true;const m=mult;
 showAd(()=>{S.coins+=5*m;save();coins();SFX.coin();toast('+'+5*m+' coins 🪙');goNext()});
}

/* ---------- Sound ---------- */
const SFX=(()=>{let a=null,on=true;
 function init(){try{if(!a)a=new(window.AudioContext||window.webkitAudioContext)();if(a.state==='suspended')a.resume()}catch(e){}}
 function t(f,d,ty,v,w,sl){if(!a||!on)return;const o=a.createOscillator(),g=a.createGain(),s=a.currentTime+(w||0);o.type=ty||'sine';o.frequency.setValueAtTime(f,s);if(sl)o.frequency.exponentialRampToValueAtTime(sl,s+d);g.gain.setValueAtTime(v||.15,s);g.gain.exponentialRampToValueAtTime(.001,s+d);o.connect(g);g.connect(a.destination);o.start(s);o.stop(s+d+.02)}
 function noise(d,v,w){if(!a||!on)return;const n=a.sampleRate*d,b=a.createBuffer(1,n,a.sampleRate),x=b.getChannelData(0);for(let i=0;i<n;i++)x[i]=(Math.random()*2-1)*(Math.random()<.15?1:.2);const s=a.createBufferSource(),f=a.createBiquadFilter(),g=a.createGain(),st=a.currentTime+(w||0);f.type='highpass';f.frequency.value=1800;s.buffer=b;g.gain.setValueAtTime(.001,st);g.gain.linearRampToValueAtTime(v,st+.2);g.gain.exponentialRampToValueAtTime(.001,st+d);s.connect(f);f.connect(g);g.connect(a.destination);s.start(st)}
 const TH=[{ty:'sine',vt:'triangle',sc:[523,587,659,784,880],con:[784,988,1175,1568],win:[523,659,784,1047,784,1047,1319]},{ty:'square',vt:'square',sc:[440,523,587,659,784],con:[659,784,988,1319],win:[392,523,659,784,1047,1319,1568]},{ty:'triangle',vt:'sine',sc:[659,784,880,988,1175],con:[880,1109,1319,1760],win:[659,880,1109,880,1319,1109,1760]},{ty:'sawtooth',vt:'sawtooth',sc:[330,392,440,523,587],con:[523,659,784,1047],win:[330,392,494,659,784,988,1319]},{ty:'sine',vt:'sine',sc:[784,880,1047,1175,1319],con:[1047,1319,1568,2093],win:[784,988,1175,1568,1175,1568,2093]}];let th=0;
 return{init,next(){th=(th+1+Math.floor(Math.random()*4))%5},toggle(){on=!on;return on},
  pop(){t(TH[th].sc[0],.12,'triangle',.18,0,TH[th].sc[2])},
  move(n){const T=TH[th];t(T.sc[n%5]*(1+Math.floor(n/5)%2),.1,T.ty,.12)},
  cut(){t(260,.16,'square',.07,0,110)},
  click(){t(600,.05,'square',.05)},
  tick(){t(1000,.03,'square',.05)},
  connect(){const T=TH[th];T.con.forEach((f,i)=>t(f,.25,T.vt,.16,i*.07))},
  coin(){t(988,.08,'square',.09);t(1319,.25,'square',.09,.08)},
  win(){const T=TH[th];T.win.forEach((f,i)=>t(f,.25,T.vt,.2,i*.11));const e=T.win[T.win.length-1];[e,e*1.25,e*1.5].forEach(f=>t(f,.9,'sine',.12,.8));noise(1.8,.14,.4)}
 }})();
function toggleSnd(){const o=SFX.toggle();document.querySelectorAll('.snd').forEach(b=>b.textContent=o?'🔊':'🔇')}
addEventListener('pointerdown',()=>SFX.init());
document.addEventListener('click',e=>{if(e.target.closest('button')&&!e.target.closest('.lv'))SFX.click()});

/* ---------- Particles ---------- */
const fx=document.createElement('canvas');fx.id='fx';document.body.appendChild(fx);
const fc=fx.getContext('2d');let P=[],fr=0;
function fxSize(){fx.width=innerWidth;fx.height=innerHeight}fxSize();addEventListener('resize',fxSize);
function addP(o){P.push(Object.assign({x:0,y:0,vx:0,vy:0,g:.12,life:50,s:3,c:'#fff',r:0,vr:0,sq:0},o));if(!fr)fr=requestAnimationFrame(fxLoop)}
function fxLoop(){fc.clearRect(0,0,fx.width,fx.height);P=P.filter(p=>p.life>0);
 P.forEach(p=>{p.x+=p.vx;p.y+=p.vy;p.vy+=p.g;p.life--;p.r+=p.vr;fc.globalAlpha=Math.min(1,p.life/25);fc.fillStyle=p.c;
  if(p.sq){fc.save();fc.translate(p.x,p.y);fc.rotate(p.r);fc.fillRect(-p.s,-p.s/2,p.s*2,p.s);fc.restore()}else{fc.beginPath();fc.arc(p.x,p.y,p.s,0,7);fc.fill()}});
 fc.globalAlpha=1;fr=P.length?requestAnimationFrame(fxLoop):0;if(!P.length)fc.clearRect(0,0,fx.width,fx.height)}
function burst(x,y,c,n){for(let i=0;i<n;i++){const a=Math.random()*6.28,sp=2+Math.random()*5;addP({x,y,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp,life:40+Math.random()*30,s:2+Math.random()*3,c})}}
function cellXY(z){const r=cv.getBoundingClientRect();return[r.left+(z%cols+.5)*cell,r.top+(Math.floor(z/cols)+.5)*cell]}
function spark(z,i){const[x,y]=cellXY(z),c=PAL[i%8];for(let k=0;k<3;k++)addP({x,y,vx:(Math.random()-.5)*3,vy:(Math.random()-.5)*3,g:.02,life:25,s:2+Math.random()*2,c})}
function burstCell(z,i){const[x,y]=cellXY(z);burst(x,y,PAL[i%8],30);burst(x,y,'#fff',10)}
function celebrate(big){
 for(let i=0;i<(big?120:90);i++)addP({x:Math.random()*innerWidth,y:-20-Math.random()*100,vx:(Math.random()-.5)*4,vy:2+Math.random()*4,g:.05,life:170+Math.random()*60,s:5+Math.random()*4,c:PAL[i%8],sq:1,vr:(Math.random()-.5)*.3});
 for(let k=0;k<(big?4:6);k++)setTimeout(()=>burst(innerWidth*(.15+Math.random()*.7),innerHeight*(.15+Math.random()*.4),PAL[Math.floor(Math.random()*8)],55),k*250);
}

/* ---------- v3: levels ladder, daily, effects ---------- */
function DF(L){return L<=10?['EASY','#7be07b']:L<=30?['MEDIUM','#ffb347']:L<=60?['HARD','#ff6b6b']:['EXPERT 💀','#d27cff']}
function gen(L){
 const R=rng(L*7919+13),n=L<=10?5:L<=20?6:L<=30?7:L<=50?8:9,k=Math.min(3+Math.floor((L-4)/4),8,n+1);
 for(let a=0;a<900;a++){
  const occ=new Set(),sols=[];
  for(let i=0;i<k;i++){
   for(let t=0;t<40;t++){
    const s=Math.floor(R()*n*n);if(occ.has(s))continue;
    const tgt=L>30?Math.max(4,Math.floor(n*n/k*(.9+R()*.8)*(1-a/1200))):3+Math.floor(R()*(n+L/5));
    const p=[s],ps=new Set(p);
    while(p.length<tgt){const c=p[p.length-1],r=Math.floor(c/n),q=c%n,o=[];
     [[r-1,q],[r+1,q],[r,q-1],[r,q+1]].forEach(([y,x])=>{if(y>=0&&x>=0&&y<n&&x<n){const z=y*n+x;if(!occ.has(z)&&!ps.has(z))o.push(z)}});
     if(!o.length)break;const z=o[Math.floor(R()*o.length)];p.push(z);ps.add(z)}
    if(p.length>=(L>30?4:3)){p.forEach(z=>occ.add(z));sols.push(p);break}
   }
  }
  if(sols.length>=Math.max(3,k-(a>500?1:0)))return{rows:n,cols:n,sols};
 }
 return{rows:5,cols:5,sols:[[0,1,2],[5,6,7],[10,11,12]]};
}
function buildGrid(){
 const g=$('grid');g.innerHTML='';coins();
 const W=g.clientWidth||320,U=84,st=['V','V','H+','H+','V','D+','D+','V','H-','H-','V','D-','D-'],pts=[];let x=0,y=0;
 for(let L=1;L<=TOTAL;L++){pts.push([x,y]);const s=st[(L-1)%13],d=s[1]==='+'?1:-1;if(s[0]==='V')y++;else if(s[0]==='H')x+=d;else{x+=d;y++}}
 const H=(y+1)*U+40;g.style.height=H+'px';
 const px=p=>[W*(.1+.2*p[0]),H-40-p[1]*U];
 g.innerHTML='<svg width="'+W+'" height="'+H+'" style="position:absolute;left:0;top:0"><polyline fill="none" stroke="#fff8" stroke-width="6" stroke-dasharray="2 12" stroke-linecap="round" points="'+pts.map(p=>px(p).join(',')).join(' ')+'"/></svg>';
 pts.forEach((p,i)=>{const L=i+1,[a,c]=px(p),b=document.createElement('button');
  b.className='lv '+(L<=10?'e':L<=30?'m':L<=60?'h':'x')+(L%10===0?' boss':'');b.textContent=L;
  b.style.left=a+'px';b.style.top=c+'px';b.style.animationDelay=Math.min(L*20,900)+'ms';
  b.classList.add(L<=S.max?'done':L===S.max+1?'cur':'lock');
  b.onclick=()=>{if(L<=S.max+1)start(L);else{SFX.cut();b.classList.remove('shake');void b.offsetWidth;b.classList.add('shake');toast('Locked 🔒')}};
  g.appendChild(b)});
 const cl=g.querySelector('.cur')||g.querySelector('.lv:last-child');setTimeout(()=>cl&&cl.scrollIntoView({block:'center'}),60);
}
/* daily reward */
const DR=[100,200,125,100,100,125,100,125,100,125,150,100,125,100,150,175,125,125,125,175,200,150,125,150,200,225,175,150,175,250,250],CH=[[7,300],[14,600],[21,1000],[28,2000]];
const ym=()=>{const d=new Date();return d.getFullYear()+'-'+(d.getMonth()+1)};
function dstate(){if(!S.daily||S.daily.m!==ym())S.daily={m:ym(),got:[],ch:[]};return S.daily}
function canClaim(){return !dstate().got.includes(new Date().getDate())}
function openDaily(){show('daily');renderDaily()}
function renderDaily(){
 coins();const d=dstate(),now=new Date(),td=now.getDate(),first=new Date(now.getFullYear(),now.getMonth(),1).getDay(),dim=new Date(now.getFullYear(),now.getMonth()+1,0).getDate();
 $('dmon').textContent=now.toLocaleString('en',{month:'long'}).toUpperCase()+' '+now.getFullYear();
 let h=['SUN','MON','TUE','WED','THU','FRI','SAT'].map(w=>'<div class="dw">'+w+'</div>').join('');
 for(let i=0;i<first;i++)h+='<i></i>';
 for(let k=1;k<=dim;k++){const got=d.got.includes(k);h+='<div class="dc '+(got?'got':k===td?'today':k<td?'miss':'')+'"><em>'+k+'</em>'+(got?'✔':'🪙')+'<b>'+DR[k-1]+'</b></div>'}
 $('dcal').innerHTML=h;
 $('dch').innerHTML=CH.map(([n,v])=>{const ok=d.got.length>=n,tk=d.ch.includes(n);return '<div class="chest '+(ok&&!tk?'rdy':'')+'" onclick="openChest('+n+','+v+')"><span>'+(tk?'📭':'🎁')+'</span><u>'+n+' Days</u></div>'}).join('');
 $('c1').disabled=$('c2').disabled=!canClaim();
}
function openChest(n,v){const d=dstate();if(d.ch.includes(n))return toast('Already opened');if(d.got.length<n)return toast('Claim '+n+' days to open ('+d.got.length+'/'+n+')');d.ch.push(n);S.coins+=v;save();SFX.win();celebrate();toast('Chest: +'+v+' coins 🪙');renderDaily()}
function claim(x){if(!canClaim())return;const td=new Date().getDate(),v=DR[td-1]*x;
 const go=()=>{dstate().got.push(td);S.coins+=v;save();SFX.coin();celebrate();toast('+'+v+' coins 🪙');renderDaily()};x>1?showAd(go):go()}
/* reset + sound pref */
let rs=0;function resetAll(){if(!rs){rs=1;$('rst').textContent='Tap again to confirm';setTimeout(()=>{rs=0;$('rst').textContent='🗑 Reset progress'},3000);return}try{localStorage.removeItem('dk')}catch(e){}location.reload()}

/* effects: emoji particles, different each win */
function fxLoop(){fc.clearRect(0,0,fx.width,fx.height);P=P.filter(p=>p.life>0);
 P.forEach(p=>{p.x+=p.vx;p.y+=p.vy;p.vy+=p.g;p.life--;p.r+=p.vr;fc.globalAlpha=Math.min(1,p.life/25);fc.fillStyle=p.c;
  if(p.e){fc.save();fc.translate(p.x,p.y);fc.rotate(p.r);fc.font=p.s*3+'px serif';fc.textAlign='center';fc.fillText(p.e,0,0);fc.restore()}
  else if(p.sq){fc.save();fc.translate(p.x,p.y);fc.rotate(p.r);fc.fillRect(-p.s,-p.s/2,p.s*2,p.s);fc.restore()}else{fc.beginPath();fc.arc(p.x,p.y,p.s,0,7);fc.fill()}});
 fc.globalAlpha=1;fr=P.length?requestAnimationFrame(fxLoop):0;if(!P.length)fc.clearRect(0,0,fx.width,fx.height)}
let fxi=Math.floor(Math.random()*5);
const EM=[0,['🍬','🍭','🍩','🧁','🍪'],['⭐','🌟','✨','💫'],['💖','💗','💝'],['🎈','🎉','🎁']];

(function(){const E=['🍬','🍭','🍩','🍪','⭐','🍫','🧁','✨','🌟','🍡'],d=document.createElement('div');d.id='bgf';
